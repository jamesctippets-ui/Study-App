hardware and includes its own full guest operating system, managed by a hypervisor. A container virtualizes at the OS level, packaging an application with its dependencies but sharing the host's kernel \u2014 no separate guest OS per instance.", "detail": "That shared kernel is why containers start in seconds (or less) and have a much smaller footprint than a VM, but it also means containers on the same host are less isolated from each other than separate VMs would be."}, {"id": "f38", "cat": "security", "front": "Multifactor authentication (MFA) factor categories", "back": "MFA combines at least two of: something you know (a password or PIN), something you have (a hardware token or authenticator app), something you are (a biometric like a fingerprint), and sometimes somewhere you are (location) or something you do (behavioral).", "detail": "Two passwords, or a password plus a security question, are both still just \"something you know\" twice \u2014 that's not true multifactor, even though it feels like an extra step."}, {"id": "f39", "cat": "security", "front": "Public Key Infrastructure (PKI) basics", "back": "PKI issues and manages digital certificates that bind a public key to an identity, signed by a trusted Certificate Authority (CA). TLS uses this to let a client verify a server's identity and negotiate encrypted communication.", "detail": "A certificate that has expired, or was issued by a CA the client doesn't trust, will fail validation even if the underlying network path and server are perfectly healthy \u2014 a common troubleshooting trap that looks like a network outage but isn't."}, {"id": "f40", "cat": "opsSupport", "front": "Patch management and maintenance windows", "back": "Patch management is the process of testing, approving, and applying software/OS updates on a controlled schedule rather than ad hoc. A maintenance window is a pre-approved, communicated time slot during which changes (including patching) are allowed to cause disruption.", "detail": "Testing a patch in staging before production, and scheduling the rollout in an approved window, are both change management applied specifically to patching."}, {"id": "f41", "cat": "opsSupport", "front": "Capacity planning", "back": "Using historical usage trends and baselines to forecast future resource needs (storage, compute, bandwidth) and provision ahead of demand, rather than reacting after a resource is already exhausted.", "detail": "Good capacity planning depends on having a solid baseline first \u2014 without knowing normal growth trends, it's just guessing."}, {"id": "f42", "cat": "deployment", "front": "Hot, warm, and cold DR sites", "back": "A hot site is fully equipped and kept in near real-time sync with production, ready for near-instant failover (fastest, most expensive). A warm site has infrastructure in place but needs some setup/data sync before use. A cold site has only basic facilities (power, space) and needs full buildout and data restoration before use (slowest, cheapest).", "detail": "Site choice is really an RTO/cost trade-off: a lower RTO requirement pushes toward a hot site, while a looser RTO can tolerate the savings of a cold site."}, {"id": "f43", "cat": "archDesign", "front": "Common RAID levels", "back": "RAID 0 stripes data across disks for performance with no redundancy (one disk failure loses everything). RAID 1 mirrors data for redundancy with no capacity gain. RAID 5 stripes data plus distributed parity, tolerating one disk failure. RAID 10 combines mirroring and striping for both redundancy and performance, at the cost of half the raw capacity.", "detail": "RAID 0 is sometimes mistaken for a resilience feature because it \"spreads\" data across disks \u2014 it actually has zero fault tolerance and is only about speed."}], "questions": [{"id": "q1", "cat": "archDesign", "type": "mc", "question": "A university, a research lab, and a hospital network in the same region want to jointly fund and share a cloud environment built specifically around their shared compliance needs, without opening it to the general public. Which deployment model is this?", "options": ["Community cloud", "Public cloud", "Hybrid cloud", "Private cloud, shared under a joint support contract"], "correct": 0, "explanation": "Community cloud is shared by several organizations with common requirements or compliance needs, distinct from a public cloud (open to anyone) or a private cloud (dedicated to one organization, even under a shared contract). Hybrid specifically means a mix of private and public environments connected together, which isn't what's described here."}, {"id": "q2", "cat": "archDesign", "type": "mc", "question": "An application automatically adds server instances at 9 AM on weekdays and removes them at 6 PM, based on a fixed calendar schedule rather than real-time load. Which best describes this behavior?", "options": ["Vertical scaling", "Scheduled scaling, a form of scalability but not elasticity", "Elasticity, since it happens without manual intervention", "Fault tolerance"], "correct": 1, "explanation": "This is automatic, but it's reacting to a fixed schedule, not real-time demand \u2014 elasticity specifically means scaling dynamically in response to actual, current load. It's also adding whole instances (horizontal), not resizing an existing one (vertical), and has nothing to do with tolerating failures."}, {"id": "q3", "cat": "archDesign", "type": "mc", "question": "A database server is running out of headroom under load, and the team's fix is to increase its allocated vCPUs and RAM. Which approach does this represent, and what is its main limitation?", "options": ["Horizontal scaling \u2014 it's limited by the load balancer's connection limit", "Vertical scaling \u2014 it's limited by the maximum size of a single instance and typically requires a restart", "Elasticity \u2014 it's limited by the auto-scaling group's minimum instance count", "Fault tolerance \u2014 it's limited by the number of availability zones in the region"], "correct": 1, "explanation": "Resizing a single existing instance is vertical scaling (scaling up), which is capped by the largest instance size available and usually needs a reboot to apply. Horizontal scaling would mean adding more instances rather than resizing one, which isn't what happened here."}, {"id": "q4", "cat": "archDesign", "type": "mc", "question": "A business states its recovery point objective (RPO) for a critical system as 15 minutes. What does this actually commit the organization to?", "options": ["Notifying customers of an outage within 15 minutes", "Backing up or replicating that system's data at least every 15 minutes", "Restoring the system within 15 minutes of an outage being declared", "Completing a full system failover within 15 minutes"], "correct": 1, "explanation": "RPO is about acceptable data loss, measured in time \u2014 a 15-minute RPO means the data backup/replication cadence must be frequent enough that no more than 15 minutes of data could ever be lost. Committing to a restoration or failover time window is what RTO covers instead."}, {"id": "q5", "cat": "archDesign", "type": "mc", "question": "A media company needs to store several petabytes of archived video files that are rarely modified once uploaded, accessed by a web application via simple HTTP requests rather than a mounted filesystem. Which storage type fits best?", "options": ["Block storage", "A relational database", "File storage", "Object storage"], "correct": 3, "explanation": "Object storage is built for exactly this: massive scale, HTTP-based access, metadata-rich, rarely-modified files. Block storage is meant for low-latency random I/O like a database's own disk, and file storage implies a mounted, hierarchical filesystem \u2014 neither matches 'accessed via HTTP requests, not a mounted drive.'"}, {"id": "q6", "cat": "archDesign", "type": "mc", "question": "A stateful web application keeps each logged-in user's session data cached only on the specific backend server that first handled their login. Which load balancing approach is required to keep that application working correctly across multiple servers?", "options": ["Weighted round robin based on server capacity", "Round robin", "Source/IP affinity (sticky sessions)", "Least connections"], "correct": 2, "explanation": "Since session data lives only on one specific server, that same client must keep being routed back to it \u2014 which is exactly what source/IP affinity provides. Round robin, least connections, and weighted round robin all distribute requests based on load or order, with no guarantee a given client lands back on the same server twice."}, {"id": "q40", "cat": "archDesign", "type": "mc", "question": "A company wants a CDN (content delivery network) primarily to improve which aspect of serving static website content to a global audience?", "options": ["Encryption of data at rest", "Latency, by caching content at edge locations closer to each user", "Identity and access management for the origin server", "The RPO of the origin server's backups"], "correct": 1, "explanation": "A CDN's core purpose is caching content at edge locations near end users, cutting the round-trip distance and thus latency. It doesn't handle at-rest encryption, IAM, or backup objectives \u2014 those are separate concerns entirely."}, {"id": "q14", "cat": "security", "type": "mc", "question": "A user's password is stolen and used to log into a system successfully. Security logs show the attacker's every action was later traced and reviewed in detail. Which part of AAA specifically enabled that after-the-fact review?", "options": ["Authentication", "Authorization", "Non-repudiation", "Accounting"], "correct": 3, "explanation": "Accounting is the logging of what was actually done, which is what allowed the after-the-fact review. Authentication (verifying identity) actually succeeded here despite being a stolen credential, and authorization determines what actions are permitted \u2014 neither one is about producing a reviewable log."}, {"id": "q15", "cat": "security", "type": "mc", "question": "A company wants access decisions that factor in the requesting user's department, the sensitivity tag on the specific resource, and the time of day \u2014 evaluated dynamically for each request rather than through a fixed set of assigned roles. Which access control model fits?", "options": ["Discretionary access control granted permanently at account creation", "RBAC (role-based access control)", "ABAC (attribute-based access control)", "Mandatory access control based on system-assigned classification labels"], "correct": 2, "explanation": "ABAC evaluates multiple attributes \u2014 department, resource tags, time of day \u2014 dynamically at request time. RBAC instead grants a fixed set of permissions tied to an assigned role, which doesn't flex per-request based on multiple contextual attributes."}, {"id": "q16", "cat": "security", "type": "mc", "question": "A database is fully encrypted on disk, but a recent incident involved an attacker intercepting query results as they traveled from the database server to a reporting application over an internal network. What security gap does this specifically point to?", "options": ["Missing encryption at rest", "Missing role-based access control on the reporting application", "Missing multifactor authentication on the database", "Missing encryption in transit"], "correct": 3, "explanation": "Encryption at rest protects data sitting on disk, which was already in place \u2014 it does nothing for data moving across the network afterward. The interception happened in transit, so that's the specific gap, not MFA or RBAC, which govern who can log in and what they can do, not how data is protected while moving."}, {"id": "q17", "cat": "security", "type": "mc", "question": "A security appliance sits inline with network traffic and is configured to automatically drop packets that match a known attack signature, without waiting for a human to respond. Which type of system is this?", "options": ["A vulnerability scanner", "An IPS (Intrusion Prevention System)", "A SIEM (Security Information and Event Management) platform", "An IDS (Intrusion Detection System)"], "correct": 1, "explanation": "Actively blocking traffic inline is the defining feature of an IPS. An IDS would only alert without blocking, a vulnerability scanner looks for weaknesses rather than live traffic, and a SIEM aggregates and correlates security events rather than acting on individual packets itself."}, {"id": "q18", "cat": "security", "type": "mc", "question": "A network engineer configures a set of packet filtering rules that evaluate every single packet independently against a static rule list, with no awareness of whether a packet belongs to a connection already allowed. What kind of filtering is this, and what does it require that a connection-aware alternative would not?", "options": ["Stateless filtering \u2014 it requires explicit rules for both directions of every allowed connection", "Stateful filtering \u2014 it requires explicit rules for both directions of every allowed connection", "Stateless filtering \u2014 it automatically permits return traffic for any connection it already approved", "An IPS \u2014 it requires a signature database to be kept current"], "correct": 0, "explanation": "No memory of prior traffic is exactly what makes it stateless, and because it can't recognize 'this is a reply to something I already let through,' both the outbound request and the inbound reply need their own explicit rule. A stateful filter is what automatically permits that return traffic without a second rule."}, {"id": "q19", "cat": "security", "type": "mc", "question": "A company stores customer credit card numbers by substituting each one with a randomly generated, unrelated value, keeping the real numbers in a separate secure vault. Even with unlimited computing power, the substitute values cannot be mathematically reversed to reveal the originals. Which technique is this?", "options": ["Symmetric encryption", "Tokenization", "Asymmetric encryption", "Hashing with a fixed salt"], "correct": 1, "explanation": "The key detail is 'no mathematical relationship' and 'cannot be reversed even with unlimited computing power' \u2014 that rules out encryption entirely (which is always reversible given the right key) and describes tokenization instead, where the substitute has no computable link back to the original at all."}, {"id": "q41", "cat": "security", "type": "mc", "question": "An organization adopts a Zero Trust approach after a VPN credential is stolen and used to connect to the internal network. Which outcome would Zero Trust have most directly prevented?", "options": ["The attacker being detected by an IDS", "The attacker reaching sensitive internal resources on the strength of network access alone, without further verification", "The need for any authentication at all once inside the network perimeter", "The VPN credential being stolen in the first place"], "correct": 1, "explanation": "Zero Trust's core principle is never granting trust based on network location alone \u2014 so reaching the internal network wouldn't be enough on its own to reach sensitive resources, since every subsequent request is independently verified. It doesn't prevent credential theft itself, and it actually requires MORE verification once inside, not less."}, {"id": "q27", "cat": "deployment", "type": "mc", "question": "A team maintains two complete, identical production environments. New releases go to the currently-idle one, get fully verified, and then all live traffic is switched over to it at once \u2014 with the old environment kept running briefly in case an instant rollback is needed. Which deployment strategy is this?", "options": ["Blue-green deployment", "Rolling deployment", "Canary deployment", "In-place deployment"], "correct": 0, "explanation": "Maintaining two full, identical environments and switching all traffic over at once is the defining trait of blue-green. Canary would gradually shift a small slice of traffic instead of switching all at once, and rolling/in-place deployments update the existing environment directly rather than maintaining a full duplicate."}, {"id": "q28", "cat": "deployment", "type": "mc", "question": "A company runs a full backup every Sunday and a differential backup every other day of the week. If a failure happens on Thursday, which backups are needed to fully restore the data, and in what order?", "options": ["Sunday's full backup, then every differential from Monday through Wednesday, in sequence", "Sunday's full backup, then Thursday's differential backup", "Only Wednesday's differential backup", "Sunday's full backup, then Wednesday's differential backup"], "correct": 3, "explanation": "A differential backup captures everything changed since the last FULL backup, so the most recent differential (Wednesday's) already contains all of Monday through Wednesday's changes on its own \u2014 only the full plus that single latest differential are needed. Needing to replay every differential in sequence is the restore pattern for incremental backups, not differential."}, {"id": "q29", "cat": "deployment", "type": "mc", "question": "A company is moving a workload from an on-premises physical server directly into a cloud provider's virtual machine service, largely unchanged. What type of migration is this?", "options": ["V2C (virtual-to-cloud)", "V2V (virtual-to-virtual)", "P2V only, with no cloud component", "P2C (physical-to-cloud)"], "correct": 3, "explanation": "Starting from a physical server and ending in the cloud makes this P2C. V2V would apply if the source were already a VM being moved to a different hypervisor, and V2C would apply if the source were already virtualized on-premises before the cloud move \u2014 neither matches a physical starting point."}, {"id": "q30", "cat": "deployment", "type": "mc", "question": "A storage administrator allocates 500 GB volumes to twenty different servers on a storage array that only physically has 3 TB of actual capacity, on the assumption that most volumes won't use their full allocation at once. Which approach is this, and what is its main risk?", "options": ["Thin provisioning \u2014 the array reserves the full 500 GB physically before any data is written", "Thin provisioning \u2014 if enough volumes fill up simultaneously, the physical storage can run out even though each volume shows free space", "Thin provisioning \u2014 it makes each individual volume slower than a thick-provisioned one", "Thick provisioning \u2014 it wastes capacity that could otherwise be used elsewhere"], "correct": 1, "explanation": "Allocating more logical capacity than physically exists, on the assumption it won't all be used, is thin provisioning \u2014 and its central risk is exactly that: if enough volumes actually use more of their allocation than expected, the underlying physical storage runs out mid-write. Thick provisioning would reserve the full 500 GB per volume up front, which this scenario explicitly isn't doing."}, {"id": "q31", "cat": "deployment", "type": "mc", "question": "A team defines their entire network, VM, and storage configuration in version-controlled template files, and deploys new environments by running those templates rather than clicking through a console. What does this most directly guarantee that manual configuration does not?", "options": ["That the deployed environment will never need to be patched", "That the environment is protected against a full regional outage", "That the same template produces the same, auditable result every time it's deployed", "That the environment will automatically scale based on demand"], "correct": 2, "explanation": "Infrastructure as Code's core guarantee is repeatable, auditable deployments \u2014 the same input produces the same result, and the exact configuration is always readable from the template. It says nothing about patching, autoscaling, or regional redundancy, which are separate concerns configured independently."}, {"id": "q42", "cat": "deployment", "type": "mc", "question": "A team's pipeline automatically builds and tests every code change, and any change that passes all automated tests is released to production immediately with no manual approval step. Which practice does this describe?", "options": ["Continuous integration only, with no release automation", "Continuous delivery", "A canary release", "Continuous deployment"], "correct": 3, "explanation": "The detail that removes any ambiguity is 'no manual approval step' \u2014 continuous delivery would still keep a human gate before the actual release, while continuous deployment removes that gate entirely so a passing change ships automatically. Continuous integration alone only covers the build/test merge step, not releasing to production."}, {"id": "q43", "cat": "opsSupport", "type": "mc", "question": "An operations team scripts a workflow that provisions a new VM, installs required software on it, registers it with a load balancer, and then runs a health check \u2014 all as one coordinated sequence triggered by a single request. Which best describes what's happening here, beyond just automation of each individual step?", "options": ["Showback", "Accounting", "Baselining", "Orchestration"], "correct": 3, "explanation": "Coordinating multiple already-automated steps into a single end-to-end workflow is specifically orchestration \u2014 automation alone would only cover one of those steps in isolation, without sequencing them together as a whole."}, {"id": "q44", "cat": "opsSupport", "type": "mc", "question": "Finance wants each department to see a detailed monthly breakdown of exactly how much cloud spend their team is responsible for, purely for budget visibility \u2014 with no actual transfer of funds between department budgets. Which practice fits?", "options": ["A full resource lock on shared accounts", "A CMDB entry per department", "Chargeback", "Showback"], "correct": 3, "explanation": "Reporting cost for visibility without moving actual budget between departments is showback. Chargeback would go further and actually bill each department's budget for their share \u2014 which this scenario explicitly rules out."}, {"id": "q45", "cat": "opsSupport", "type": "mc", "question": "A monitoring team wants to know the normal, expected CPU utilization range for a server under typical daily load, observed over several weeks, before deciding what utilization level should trigger an alert. What are they establishing first?", "options": ["A CMDB record", "An SLA", "A threshold", "A baseline"], "correct": 3, "explanation": "Observing normal behavior over time to understand the expected range is establishing a baseline. A threshold is the specific trigger value set afterward, usually informed by that baseline \u2014 setting a threshold without one first tends to produce either constant false alarms or missed real problems."}, {"id": "q46", "cat": "opsSupport", "type": "mc", "question": "A provider's SLA guarantees 99.9% uptime for a service. Roughly how much downtime per year does that commitment actually allow?", "options": ["Zero \u2014 99.9% means no downtime is permitted", "About 36 hours", "About 8.75 hours", "About 5 minutes"], "correct": 2, "explanation": "99.9% uptime ('three nines') allows roughly 8.75 hours of downtime per year. 'Five nines' (99.999%) is the tier that only allows about 5 minutes a year \u2014 a commonly confused pair on the exam, since both are often just referred to loosely as 'high uptime.'"}, {"id": "q50", "cat": "troubleshooting", "type": "mc", "question": "Following the standard troubleshooting methodology, an administrator has identified the problem and formed a theory that a specific firewall rule is blocking traffic. What is the correct next step, before touching any configuration?", "options": ["Document the incident as resolved", "Implement a fix by removing the suspected rule immediately", "Escalate to a change advisory board without further investigation", "Test the theory to confirm the firewall rule is actually the cause"], "correct": 3, "explanation": "The methodology calls for testing the theory before acting on it \u2014 jumping straight to removing a firewall rule based on an unconfirmed theory risks a wasted change (or a new security gap) if the actual cause turns out to be something else entirely."}, {"id": "q51", "cat": "troubleshooting", "type": "mc", "question": "A tenant on a shared virtualization host reports their VM has become sluggish, even though their own workload and configuration haven't changed. Investigation shows another tenant on the same physical host is running an unusually CPU-intensive job. What is this scenario an example of?", "options": ["An orphaned resource", "The \"noisy neighbor\" problem", "A licensing failure", "A DNS resolution failure"], "correct": 1, "explanation": "One tenant's heavy usage degrading another tenant's performance on shared hardware is the textbook noisy neighbor problem. It has nothing to do with licensing, name resolution, or leftover unused resources \u2014 the affected tenant's own environment is unchanged."}, {"id": "q52", "cat": "troubleshooting", "type": "mc", "question": "A service is completely unreachable by its hostname, but connecting directly to its known IP address works perfectly. What does this strongly suggest the root cause is?", "options": ["A DNS resolution issue", "A firewall blocking all traffic to the service", "The service itself has crashed", "Insufficient bandwidth to the service"], "correct": 0, "explanation": "If the raw IP address works but the hostname doesn't, the network path and the service itself are both clearly fine \u2014 the only thing standing between the two is name resolution, pointing squarely at DNS rather than a firewall, an outage, or a bandwidth problem."}, {"id": "q7", "cat": "archDesign", "type": "tf", "question": "A hybrid cloud deployment simply means an organization uses two different public cloud providers for two unrelated projects.", "answer": false, "explanation": "That describes multi-cloud. Hybrid specifically means private and public environments connected and coordinated together, often for workload portability between them \u2014 not just using multiple unrelated clouds side by side."}, {"id": "tf1", "cat": "archDesign", "type": "tf", "question": "A system can be highly available and still experience a brief interruption during a failover event.", "answer": true, "explanation": "High availability minimizes downtime through redundancy, but a short interruption during failover is often still possible. A system with zero interruption at all, even during a failure, is described as fault tolerant instead."}, {"id": "tf2", "cat": "archDesign", "type": "tf", "question": "Object storage is generally the best choice for a high-transaction relational database requiring low-latency random reads and writes.", "answer": false, "explanation": "Block storage is built for that kind of low-latency, random-access workload. Object storage trades that per-operation latency for massive scale and simplicity, and is a poor fit for a live transactional database."}, {"id": "tf3", "cat": "security", "type": "tf", "question": "An IDS (Intrusion Detection System) can automatically block malicious traffic it identifies, the same way an IPS does.", "answer": false, "explanation": "An IDS only detects and alerts \u2014 it doesn't sit inline or block anything. Only an IPS actively blocks traffic it identifies as malicious."}, {"id": "tf4", "cat": "security", "type": "tf", "question": "Encrypting a database at rest also protects the data while it is being queried and transmitted to a client application.", "answer": false, "explanation": "At-rest encryption only protects stored data on disk. Data moving to a client over the network needs its own, separate in-transit encryption (like TLS) to be protected during that trip."}, {"id": "tf5", "cat": "security", "type": "tf", "question": "A stateless packet filter automatically permits return traffic for a connection it has already approved, without a separate rule.", "answer": false, "explanation": "That's exactly what a stateful firewall does. A stateless filter evaluates every packet independently with no memory of prior traffic, so both directions of a connection need their own explicit rule."}, {"id": "tf6", "cat": "security", "type": "tf", "question": "Tokenized data can be mathematically reversed back to its original value by anyone with sufficient computing power, the same as encrypted data with enough time.", "answer": false, "explanation": "This is the key difference from encryption: a token has no mathematical relationship to the original value at all, so no amount of computing power can reverse it \u2014 only looking it up in the separate, secured vault reveals the original."}, {"id": "tf7", "cat": "deployment", "type": "tf", "question": "Restoring from an incremental backup chain only requires the most recent incremental backup, the same way a differential backup restore only needs the latest differential.", "answer": false, "explanation": "An incremental restore needs the original full backup PLUS every incremental backup taken since, applied in order \u2014 unlike a differential restore, which only ever needs the full plus the single latest differential, since each differential already contains everything since the last full."}, {"id": "tf8", "cat": "deployment", "type": "tf", "question": "A canary deployment exposes a new release to all users simultaneously, the same way a blue-green deployment switches all traffic at once.", "answer": false, "explanation": "Canary deployments do the opposite \u2014 they gradually increase the new release's exposure, starting with a small subset of traffic, specifically to limit the impact of a bad release. Switching everyone over at once is the blue-green pattern."}, {"id": "tf9", "cat": "opsSupport", "type": "tf", "question": "Orchestration can exist without any underlying task automation, purely as a manual coordination process.", "answer": false, "explanation": "Orchestration specifically means coordinating multiple already-automated tasks into a workflow. Without automated tasks to coordinate in the first place, there's nothing for orchestration to sequence."}, {"id": "tf10", "cat": "opsSupport", "type": "tf", "question": "Chargeback involves actually transferring budget between departments based on their cloud usage, while showback only reports usage for visibility.", "answer": true, "explanation": "That's the correct distinction \u2014 chargeback moves real budget between departments based on their share of usage, while showback stops at reporting for awareness and accountability, without an actual internal transfer of funds."}, {"id": "tf11", "cat": "troubleshooting", "type": "tf", "question": "Increasing available bandwidth on a connection will generally resolve a high-latency problem.", "answer": false, "explanation": "Latency and bandwidth are independent characteristics. Latency is about the delay before data starts moving; bandwidth is about how much can move once it's flowing. More bandwidth does nothing to shorten that initial delay."}, {"id": "tf12", "cat": "troubleshooting", "type": "tf", "question": "Applying a quick workaround to restore service during an incident means root cause analysis is no longer necessary.", "answer": false, "explanation": "A workaround restores service without necessarily fixing the underlying issue. Root cause analysis is still needed afterward, or the same incident is likely to recur."}, {"id": "msq1", "cat": "archDesign", "type": "ms", "question": "Which two of the following are examples of horizontal scaling, as opposed to vertical scaling? (Choose two.)", "options": ["Adding more replica nodes to a database cluster", "Upgrading a VM to a larger instance size with more vCPUs", "Adding three more web server instances behind a load balancer", "Increasing a single VM's allocated RAM from 8 GB to 32 GB"], "correct": [0, 2], "explanation": "Adding more instances or nodes running in parallel is horizontal scaling (scaling out). Increasing the resources of a single existing VM \u2014 RAM or vCPUs \u2014 is vertical scaling (scaling up), which the last two options both describe."}, {"id": "msq2", "cat": "archDesign", "type": "ms", "question": "Which two statements correctly distinguish high availability from fault tolerance? (Choose two.)", "options": ["High availability minimizes downtime but may still allow a brief failover interruption", "Fault tolerance and high availability are two names for the exact same thing", "High availability is only relevant to on-premises systems, not cloud-hosted ones", "Fault tolerance keeps a system running through a failure with no interruption at all"], "correct": [0, 3], "explanation": "High availability reduces downtime through redundancy but can still involve a short interruption during failover; fault tolerance goes further, with no interruption at all, typically at higher cost. They're related but distinct concepts, and both apply equally to cloud and on-premises systems."}, {"id": "msq3", "cat": "security", "type": "ms", "question": "Which two of the following are true about Zero Trust? (Choose two.)", "options": ["It verifies every request independently, regardless of network location", "A compromised network perimeter alone is not enough to reach protected resources", "It removes the need for authentication once a device is inside the network", "It only applies to external users, not internal employees"], "correct": [0, 1], "explanation": "Zero Trust verifies every request independently and specifically denies the assumption that being inside the network perimeter implies trust. It doesn't remove authentication for anyone \u2014 internal or external \u2014 since no request is trusted by default."}, {"id": "msq4", "cat": "security", "type": "ms", "question": "Which two of the following correctly describe encryption at rest versus in transit? (Choose two.)", "options": ["Encryption in transit protects data moving across a network", "Encryption at rest protects data stored on disk", "Encryption at rest also automatically protects data once it leaves the server over the network", "Encryption in transit removes the need to ever encrypt data at rest"], "correct": [0, 1], "explanation": "At-rest and in-transit encryption protect data in two different states \u2014 stored, and moving across a network \u2014 and neither one substitutes for the other. Data encrypted only at rest is unprotected the moment it starts moving, and vice versa."}, {"id": "msq5", "cat": "deployment", "type": "ms", "question": "Which two of the following are true about Infrastructure as Code (IaC)? (Choose two.)", "options": ["It allows the same environment configuration to be deployed repeatably", "It replaces the need for any testing before deployment", "It can be version-controlled like application source code", "It guarantees an application will never need further code changes"], "correct": [0, 2], "explanation": "IaC's real strengths are repeatable, consistent deployments and version-controlled configuration, just like application code. It has no bearing on whether the application itself needs future changes, and it doesn't replace testing \u2014 the infrastructure it defines still needs to be validated."}, {"id": "msq6", "cat": "deployment", "type": "ms", "question": "Which two of the following are valid reasons a team might choose a rolling deployment over an in-place deployment? (Choose two.)", "options": ["The service needs to remain available throughout the update", "It requires maintaining two complete duplicate production environments", "Only a few instances are updated at a time, limiting exposure to a bad release", "It is the fastest possible way to update every instance simultaneously"], "correct": [0, 2], "explanation": "Rolling deployments keep the service available by updating a few instances at a time, which also limits how many instances are affected if something goes wrong. Maintaining two full duplicate environments describes blue-green, not rolling, and updating every instance simultaneously is closer to in-place, not the gradual rolling approach."}, {"id": "msq7", "cat": "opsSupport", "type": "ms", "question": "Which two of the following are true about a Service Level Agreement (SLA)? (Choose two.)", "options": ["It typically defines measurable commitments like uptime percentage and response time", "SLAs apply only to cloud providers and never to internal IT teams", "A 99.9% uptime commitment allows for zero downtime whatsoever", "It typically specifies penalties or credits if commitments are not met"], "correct": [0, 3], "explanation": "SLAs define measurable commitments (like uptime or response time) and the consequences of missing them. 99.9% uptime still allows roughly 8.75 hours of downtime per year, not zero, and internal IT teams commonly use internal SLAs with their own business units too."}, {"id": "msq8", "cat": "opsSupport", "type": "ms", "question": "Which two of the following correctly describe automation versus orchestration? (Choose two.)", "options": ["Automation and orchestration are interchangeable terms for the same concept", "Orchestration coordinates multiple automated tasks into a larger workflow", "Automation handles a single, well-defined task without human intervention", "Orchestration can be built entirely without any underlying automated tasks"], "correct": [1, 2], "explanation": "Automation is scoped to one task; orchestration coordinates several automated tasks together as a workflow, which means it depends on automated tasks existing underneath it \u2014 it can't be built purely on its own with nothing automated to coordinate."}, {"id": "msq9", "cat": "troubleshooting", "type": "ms", "question": "Which two of the following are steps in the standard troubleshooting methodology, in the correct relative order? (Choose two.)", "options": ["Document findings, before identifying the problem", "Establish a theory of probable cause, before testing that theory", "Test the theory, before implementing a plan of action", "Implement a solution, before establishing any theory of the cause"], "correct": [1, 2], "explanation": "The methodology flows: identify the problem, establish a theory, test the theory, then implement a plan of action, verify, and document. Testing must come before implementing a fix, and documentation is the final step, not the first \u2014 the other two options both reverse the correct order."}, {"id": "msq10", "cat": "troubleshooting", "type": "ms", "question": "A service was recently migrated to a new IP address and its DNS record updated. Some users still reach the old server while others reach the new one. Which two factors most plausibly explain this? (Choose two.)", "options": ["A low TTL was not set before the migration, so cached records at various resolvers have not expired yet", "Some users are being served a cached answer from a resolver that has not yet refreshed the record", "The service itself is completely down for everyone", "The new IP address has no route to the internet at all"], "correct": [0, 1], "explanation": "Split behavior right after a DNS change is the classic signature of caching: resolvers that already cached the old record under a long TTL won't re-query until it expires, while others pick up the new record right away. A completely down service or an unreachable new IP would fail for everyone, not just some users."}, {"id": "q53", "cat": "troubleshooting", "type": "mc", "question": "Several VMs on the same virtualization host show consistently high \"CPU ready\" time in monitoring, even though each VM's own CPU utilization looks moderate. What does this metric specifically indicate?", "options": ["The host's physical CPUs are oversubscribed, so VMs are waiting in queue for CPU time to actually be scheduled", "The VMs' guest operating systems have a memory leak", "The host's storage array is the bottleneck, not the CPU", "The VMs' NICs are misconfigured for the wrong VLAN"], "correct": 0, "explanation": "CPU ready time measures how long a vCPU is ready to run but waiting for the physical scheduler to actually give it time \u2014 high ready time across multiple VMs on one host is the signature of CPU oversubscription/contention, not a guest memory leak, a storage bottleneck, or a VLAN misconfiguration, none of which this metric reflects."}, {"id": "q54", "cat": "troubleshooting", "type": "mc", "question": "After a hypervisor host's clock drifts several minutes out of sync, users suddenly can't authenticate to a Kerberos-based service, and TLS certificate validation begins failing intermittently across VMs on that host, even though no configuration changed. What is the most likely root cause?", "options": ["Time synchronization (NTP) drift on the host", "A DNS resolution failure", "An expired software license", "Insufficient bandwidth between the VMs and the authentication server"], "correct": 0, "explanation": "Kerberos authentication and TLS certificate validation both depend on closely synchronized clocks \u2014 even a few minutes of drift can cause tickets and certificates to be rejected as expired or not-yet-valid. Nothing here points to DNS, licensing, or bandwidth, none of which would produce this specific pattern of authentication and certificate failures tied to a clock issue."}, {"id": "q55", "cat": "troubleshooting", "type": "mc", "question": "New VMs being provisioned in a subnet intermittently fail to come online, with logs showing they never received an IP address. Existing VMs on the same subnet are unaffected. What is the most likely cause?", "options": ["The DHCP scope for that subnet has run out of available addresses", "A DNS record for the new VMs is missing", "The load balancer's health check is misconfigured", "The new VMs' storage volumes are thin-provisioned"], "correct": 0, "explanation": "New instances failing to obtain an address while already-running instances (which already hold a lease) are unaffected is the classic sign of a DHCP scope with no addresses left to hand out. It isn't a naming issue at all since the VM never gets an IP to register in the first place, and it has nothing to do with load balancer health checks or how storage is provisioned."}, {"id": "tf13", "cat": "troubleshooting", "type": "tf", "question": "In a high-availability cluster, a \"split-brain\" condition occurs when a network partition causes multiple nodes to each believe they are the only active primary, potentially leading both to accept writes independently.", "answer": true, "explanation": "That's the standard definition of split-brain \u2014 a communication failure between cluster nodes causes more than one node to assume the primary role at once, risking data divergence or corruption if both accept writes. It's why HA clustering typically includes a quorum or fencing mechanism specifically to prevent it."}, {"id": "msq11", "cat": "troubleshooting", "type": "ms", "question": "A VM feels sluggish even though its own guest-level CPU and memory metrics look normal. Which two actions would help determine whether the real cause is contention with other tenants on the shared host? (Choose two.)", "options": ["Check hypervisor-level metrics like CPU ready time or memory ballooning for that host", "Check whether other VMs on the same physical host are running unusually heavy workloads", "Increase the affected VM's own allocated vCPU count without checking anything else", "Assume the guest operating system needs to be reinstalled"], "correct": [0, 1], "explanation": "Guest-level metrics can look fine while the real bottleneck is contention for the shared host's physical resources \u2014 hypervisor-level metrics (CPU ready, ballooning) and checking neighboring VMs' activity are exactly how a noisy-neighbor/contention issue gets confirmed. Adding more vCPUs to a VM that isn't even using its current allocation, or reinstalling its OS, diagnoses nothing and doesn't address host-level contention."}, {"id": "q56", "cat": "opsSupport", "type": "mc", "question": "Before rolling a critical security patch out to production servers, an operations team first applies it to a staging environment that mirrors production, verifies nothing breaks, and only then schedules the production rollout during an approved maintenance window. What practice does this reflect?", "options": ["Following a formal change management process", "Chargeback", "Orphaned resource cleanup", "Thin provisioning"], "correct": 0, "explanation": "Testing a change in a representative environment first and deploying it to production only through an approved, scheduled window is the core of change management, reducing the risk of an untested change causing an outage. It has nothing to do with cost allocation (chargeback), unused resources, or how storage is provisioned."}, {"id": "q57", "cat": "opsSupport", "type": "mc", "question": "By tracking storage utilization baselines over the past year, a team notices consumption has grown steadily by about 10% per quarter and uses that trend to request additional capacity before the array actually fills up. What practice does this describe?", "options": ["Capacity planning based on trend analysis", "Chargeback", "Root cause analysis", "A rolling deployment"], "correct": 0, "explanation": "Using historical trend data to forecast future resource needs and provision ahead of time is capacity planning. It's distinct from chargeback (a billing practice), root cause analysis (which investigates incidents after the fact), and rolling deployment (a release strategy) \u2014 none of which involve forecasting future demand."}, {"id": "tf14", "cat": "opsSupport", "type": "tf", "question": "A runbook documents a specific, repeatable set of steps for handling a known type of incident, so responders don't have to reinvent the response each time it happens.", "answer": true, "explanation": "That's the purpose of a runbook \u2014 a pre-written, tested procedure for a known scenario, such as restarting a specific failed service or failing over a specific database, which speeds up and standardizes incident response compared to improvising a response from scratch every time."}, {"id": "msq12", "cat": "opsSupport", "type": "ms", "question": "Which two of the following are true about a formal change management process? (Choose two.)", "options": ["Even an emergency change made outside the normal approval flow should still be documented afterward", "Planned changes are typically reviewed and approved before being implemented in production", "Once a change is approved, it never needs to be tested in a non-production environment first", "Change management applies only to hardware changes, never to software or configuration changes"], "correct": [0, 1], "explanation": "A sound change management process still requires documenting emergency changes after the fact, even when they bypass the usual advance approval, and routine changes are normally reviewed and approved before hitting production. Skipping non-production testing after approval, or limiting the process to hardware only, both defeat the purpose of change management."}, {"id": "q58", "cat": "archDesign", "type": "mc", "question": "A development team deploys their application code to a provider's platform, which automatically handles the underlying operating system patching, runtime, and scaling \u2014 the team never manages a virtual machine directly. Which cloud service model is this?", "options": ["PaaS (Platform as a Service)", "IaaS (Infrastructure as a Service)", "SaaS (Software as a Service)", "DRaaS (Disaster Recovery as a Service)"], "correct": 0, "explanation": "PaaS provides a managed runtime/platform where developers deploy code without managing the underlying OS or VM, which is the defining trait here. IaaS would still require the team to manage the VM/OS itself, SaaS delivers a complete end-user application rather than a platform to build on, and DRaaS is specifically about disaster recovery, not general application hosting."}, {"id": "q59", "cat": "archDesign", "type": "mc", "question": "Compared to a traditional virtual machine, what is the main architectural difference that lets a container start in milliseconds and run with a much smaller footprint?", "options": ["A container shares the host operating system's kernel instead of including its own full guest OS", "A container always runs on dedicated physical hardware with no virtualization layer at all", "A container replicates the hypervisor for each instance", "A container requires a full guest OS but no application dependencies"], "correct": 0, "explanation": "Containers package an application and its dependencies but share the host's kernel, avoiding the overhead of booting a full guest OS \u2014 that's why they start so much faster and use less memory/disk than a VM, which bundles a complete separate operating system per instance. The other options misdescribe both containers and how virtualization/hypervisors actually work."}, {"id": "q60", "cat": "security", "type": "mc", "question": "After a user's password is compromised, an administrator requires that logins also present a time-based one-time code generated by an app on the user's registered phone. Which authentication factor category does this add?", "options": ["Something you have", "Something you know", "Something you are", "Somewhere you are"], "correct": 0, "explanation": "A one-time code generated by a registered device the user physically possesses is a \"something you have\" factor. A password is \"something you know,\" a biometric is \"something you are,\" and location-based checks are \"somewhere you are\" \u2014 combining factors from different categories, rather than just two passwords, is what makes MFA effective against a stolen password alone."}]}};

function DBox({ x, y, w, h, label, sub }) {
  return (
    <g>
      <rect x={x} y={y} width={w} height={h} rx="7" fill={COLOR.surfaceRaised} stroke={COLOR.border} strokeWidth="1.3" />
      <text x={x + w / 2} y={y + h / 2 + (sub ? -3 : 4)} textAnchor="middle" fill={COLOR.text} fontSize="10.5" fontWeight="600">{label}</text>
      {sub && <text x={x + w / 2} y={y + h / 2 + 11} textAnchor="middle" fill={COLOR.muted} fontSize="8.5">{sub}</text>}
    </g>
  );
}

function DLine({ x1, y1, x2, y2 }) {
  return <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={COLOR.border} strokeWidth="1.3" />;
}

function DCaption({ x, y, text }) {
  return <text x={x} y={y} textAnchor="middle" fill={COLOR.muted} fontSize="9">{text}</text>;
}

function DiagramServiceModels() {
  const cols = ['On-prem', 'IaaS', 'PaaS', 'SaaS'];
  const rows = ['Applications', 'Runtime & OS', 'Virtualization', 'Physical infra'];
  const grid = [[1, 1, 1, 0], [1, 1, 0, 0], [1, 0, 0, 0], [1, 0, 0, 0]];
  const colW = 62, rowH = 42, labelW = 84, top = 28;
  const width = labelW + cols.length * colW + 6;
  const height = top + rows.length * rowH + 34;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: 'auto' }}>
      {cols.map((c, ci) => (
        <text key={c} x={labelW + ci * colW + colW / 2} y={16} textAnchor="middle" fill={COLOR.text} fontSize="10.5" fontWeight="600">{c}</text>
      ))}
      {rows.map((r, ri) => (
        <React.Fragment key={r}>
          <text x={2} y={top + ri * rowH + rowH / 2 + 4} fill={COLOR.muted} fontSize="9">{r}</text>
          {cols.map((c, ci) => {
            const managed = grid[ri][ci];
            return (
              <rect
                key={c}
                x={labelW + ci * colW}
                y={top + ri * rowH}
                width={colW - 6}
                height={rowH - 6}
                rx="6"
                fill={managed ? 'rgba(201,123,148,0.16)' : 'rgba(211,164,101,0.13)'}
                stroke={managed ? COLOR.teal : COLOR.gold}
                strokeWidth="1.2"
              />
            );
          })}
        </React.Fragment>
      ))}
      <rect x={labelW} y={height - 20} width="10" height="10" fill="rgba(201,123,148,0.16)" stroke={COLOR.teal} strokeWidth="1" />
      <text x={labelW + 15} y={height - 11} fill={COLOR.muted} fontSize="8.5">You manage</text>
      <rect x={labelW + 90} y={height - 20} width="10" height="10" fill="rgba(211,164,101,0.13)" stroke={COLOR.gold} strokeWidth="1" />
      <text x={labelW + 105} y={height - 11} fill={COLOR.muted} fontSize="8.5">Microsoft manages</text>
    </svg>
  );
}

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Finds the flashcard that best explains a key term: an exact front match,
// then the term appearing as a whole word in a card's front (catches
// comparison cards like "CapEx vs. OpEx" for the term "CapEx"), then the
// same check against the card's back/detail text.
function findTermCard(term, vocabPool) {
  const lower = term.toLowerCase();
  let hit = vocabPool.find((v) => v.front.toLowerCase() === lower);
  if (hit) return hit;
  const wordRe = new RegExp('\\b' + escapeRegExp(lower) + '\\b', 'i');
  hit = vocabPool.find((v) => wordRe.test(v.front));
  if (hit) return hit;
  hit = vocabPool.find((v) => wordRe.test(v.back));
  if (hit) return hit;
  return vocabPool.find((v) => v.detail && wordRe.test(v.detail)) || null;
}

function highlightTerms(text, terms, vocabPool, onTermClick) {
  if (!terms || !terms.length) return text;
  const sorted = [...terms].sort((a, b) => b.length - a.length);
  const escaped = sorted.map(escapeRegExp);
  const re = new RegExp('(' + escaped.join('|') + ')', 'g');
  const parts = text.split(re);
  return parts.map((part, i) => {
    const isTerm = sorted.some((t) => t === part);
    if (!isTerm) return <React.Fragment key={i}>{part}</React.Fragment>;
    const card = vocabPool ? findTermCard(part, vocabPool) : null;
    if (!card || !onTermClick) {
      return <span key={i} style={{ color: COLOR.gold, fontWeight: 700 }}>{part}</span>;
    }
    return (
      <button
        key={i}
        className="btn-flat"
        onClick={() => onTermClick(card)}
        style={{
          color: COLOR.gold, fontWeight: 700, background: 'transparent', padding: 0,
          borderBottom: `1px dotted ${COLOR.gold}`, cursor: 'pointer', font: 'inherit',
        }}
      >
        {part}
      </button>
    );
  });
}


/* ---------------- helpers ---------------- */

function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestion(q) {
  if (q.type === 'mc') {
    const order = shuffleArray(q.options.map((_, i) => i));
    return { ...q, options: order.map((i) => q.options[i]), correct: order.indexOf(q.correct) };
  }
  if (q.type === 'ms') {
    const order = shuffleArray(q.options.map((_, i) => i));
    const correct = q.correct.map((i) => order.indexOf(i)).sort((a, b) => a - b);
    return { ...q, options: order.map((i) => q.options[i]), correct };
  }
  return q;
}

function pickRotated(pool, count, seenMap) {
  const withRecency = pool.map((q) => ({ q, last: (seenMap && seenMap[q.id]) || 0 }));
  const shuffled = shuffleArray(withRecency);
  shuffled.sort((a, b) => a.last - b.last);
  const picked = shuffled.slice(0, count).map((x) => x.q);
  return shuffleArray(picked);
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function emptyTrackMap() {

function normalizeResults(raw) {
  if (!raw) return emptyTrackMap();
  const isPerTrackShape = TRACKS.some((t) => raw[t.key]);
  if (isPerTrackShape) {
    const map = emptyTrackMap();
    TRACKS.forEach((t) => { map[t.key] = raw[t.key] || {}; });
    return map;
  }
  // legacy flat shape from before multi-track support existed — treat it as ITIL progress
  const map = emptyTrackMap();
  map.itil = raw;
  return map;
}

function normalizeSeenLog(raw) {

}

function todayString() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function daysBetween(a, b) {
  const [ay, am, ad] = a.split('-').map(Number);
  const [by, bm, bd] = b.split('-').map(Number);
  const da = new Date(ay, am - 1, ad);
  const db = new Date(by, bm - 1, bd);
  return Math.round((db - da) / 86400000);
}

function emptyStats() {
  return {
    streak: { current: 0, longest: 0, lastActiveDate: null },
    counts: { quizzesCompleted: 0, examsPassed: 0, matchRoundsCompleted: 0, perfectQuizzes: 0 },
    unlocked: [],
  };
}

function normalizeStats(raw) {
  const base = emptyStats();
  if (!raw || typeof raw !== 'object') return base;
  return {
    streak: { ...base.streak, ...(raw.streak || {}) },
    counts: { ...base.counts, ...(raw.counts || {}) },
    unlocked: Array.isArray(raw.unlocked) ? raw.unlocked : [],
  };
}

// Advances the streak at most once per calendar day. Consecutive days
// increment it; a gap of more than one day resets it to 1 rather than 0,
// since today itself is still a day of activity.
function advanceStreak(streak) {
  const today = todayString();
  if (streak.lastActiveDate === today) return streak;
  const gap = streak.lastActiveDate ? daysBetween(streak.lastActiveDate, today) : null;
  const nextCurrent = gap === 1 ? streak.current + 1 : 1;
  return { current: nextCurrent, longest: Math.max(streak.longest, nextCurrent), lastActiveDate: today };
}

// Aggregates stats across every track (not just the active one) — achievements
// are account-wide, matching the app's single-profile, no-login model.
function buildAchievementContext(results, stats) {
  let totalCorrect = 0;
  const trackMasteries = [];
  let anyCourseComplete = false;
  Object.keys(DATA).forEach((key) => {
    const mod = DATA[key];
    const trackResults = results[key] || {};
    const items = [...mod.flashcards.map((f) => f.id), ...mod.questions.map((q) => q.id)];
    const correctHere = items.filter((id) => trackResults[id] === 'correct').length;
    totalCorrect += correctHere;
    trackMasteries.push(items.length ? (correctHere / items.length) * 100 : 0);
    if (mod.lessons && mod.lessons.length) {
      const allStrong = mod.lessons.every((lesson) => {
        const ids = [...lesson.vocabIds, ...lesson.quizIds];
        const correct = ids.filter((id) => trackResults[id] === 'correct').length;
        return ids.length > 0 && correct / ids.length >= 0.7;
      });
      if (allStrong) anyCourseComplete = true;
    }
  });
  return {
    totalCorrect,
    maxTrackMastery: trackMasteries.length ? Math.max(...trackMasteries) : 0,
    minTrackMastery: trackMasteries.length ? Math.min(...trackMasteries) : 0,
    anyCourseComplete,
    longestStreak: stats.streak.longest,
    quizzesCompleted: stats.counts.quizzesCompleted,
    examsPassed: stats.counts.examsPassed,
    perfectQuizzes: stats.counts.perfectQuizzes,
    matchRoundsCompleted: stats.counts.matchRoundsCompleted,
  };
}

function evaluateAchievements(results, stats) {
  const ctx = buildAchievementContext(results, stats);
  return ACHIEVEMENTS.map((a) => ({ ...a, unlocked: a.check(ctx), progress: a.target(ctx) }));
}

function MatchGame({ flashcards, roundSize, onContinue, onRoundComplete }) {
  const ROUND_SIZE = roundSize || 6;

  const buildRound = useCallback(() => {
    const picked = shuffleArray(flashcards).slice(0, Math.min(ROUND_SIZE, flashcards.length));
    return { picked, termOrder: shuffleArray(picked), defOrder: shuffleArray(picked) };
  }, [flashcards]);

  const [round, setRound] = useState(buildRound);
  const [selected, setSelected] = useState(null);
  const [matched, setMatched] = useState([]);
  const [wrongPair, setWrongPair] = useState(null);
  const [mistakes, setMistakes] = useState(0);

  useEffect(() => {
    setRound(buildRound());
    setSelected(null);
    setMatched([]);
    setWrongPair(null);
    setMistakes(0);
    // eslint-disable-next-line
  }, [flashcards]);

  if (flashcards.length < 2) {
    return (
      <div style={{ textAlign: 'center', color: COLOR.muted, fontSize: '13px', padding: '30px 10px' }}>
        Not enough cards in this category for a matching round — try "All" or a different category.
      </div>
    );
  }

  const newRound = () => {
    setRound(buildRound());
    setSelected(null);
    setMatched([]);
    setWrongPair(null);
    setMistakes(0);
  };

  const isDone = matched.length === round.picked.length;

  useEffect(() => {
    if (isDone && onRoundComplete) onRoundComplete();
    // eslint-disable-next-line
  }, [isDone]);

  const tap = (type, id) => {
    if (matched.includes(id) || wrongPair) return;
    if (!selected) { setSelected({ type, id }); return; }
    if (selected.type === type) { setSelected({ type, id }); return; }
    const termId = type === 'term' ? id : selected.id;
    const defId = type === 'def' ? id : selected.id;
    if (termId === defId) {
      setMatched((m) => [...m, termId]);
      setSelected(null);
    } else {
      setWrongPair({ termId, defId });
      setMistakes((m) => m + 1);
      setTimeout(() => { setWrongPair(null); setSelected(null); }, 500);
    }
  };

  if (isDone) {
    return (
      <div style={{ textAlign: 'center', padding: '40px 10px' }}>
        <div style={{ fontSize: '15px', fontWeight: 600, marginBottom: '6px' }}>Round complete!</div>
        <div style={{ fontSize: '13px', color: COLOR.muted, marginBottom: '20px' }}>
          {round.picked.length} pairs matched · {mistakes} mistake{mistakes === 1 ? '' : 's'}
        </div>
        <div className="flex gap-2" style={{ justifyContent: 'center' }}>
          <button
            onClick={newRound}
            style={{ background: COLOR.surfaceRaised, border: `1px solid ${COLOR.border}`, color: COLOR.text, borderRadius: '10px', padding: '10px 20px', fontSize: '13px', fontWeight: 600 }}
          >
            New round
          </button>
          {onContinue && (
            <button
              onClick={onContinue}
              style={{ background: COLOR.teal, color: '#2B1620', borderRadius: '10px', padding: '10px 20px', fontSize: '13px', fontWeight: 600 }}
            >
              Continue reading →
            </button>
          )}
        </div>
      </div>
    );
  }

  const termState = (id) => {
    if (matched.includes(id)) return 'matched';
    if (wrongPair && wrongPair.termId === id) return 'wrong';
    if (selected && selected.type === 'term' && selected.id === id) return 'selected';
    return 'idle';
  };
  const defState = (id) => {
    if (matched.includes(id)) return 'matched';
    if (wrongPair && wrongPair.defId === id) return 'wrong';
    if (selected && selected.type === 'def' && selected.id === id) return 'selected';
    return 'idle';
  };

  const stateStyle = (state) => {
    if (state === 'matched') return { background: 'rgba(201,123,148,0.12)', border: `1px solid ${COLOR.teal}`, color: COLOR.muted, opacity: 0.55 };
    if (state === 'wrong') return { background: 'rgba(181,87,74,0.16)', border: `1px solid ${COLOR.red}`, color: COLOR.text };
    if (state === 'selected') return { background: 'rgba(211,164,101,0.14)', border: `1px solid ${COLOR.gold}`, color: COLOR.text };
    return { background: COLOR.surface, border: `1px solid ${COLOR.border}`, color: COLOR.text };
  };

  return (
    <div>
      <div className="flex justify-between items-center mb-3">
        <span style={{ fontSize: '11px', color: COLOR.muted }}>
          {matched.length} / {round.picked.length} matched{mistakes > 0 ? ` · ${mistakes} mistake${mistakes === 1 ? '' : 's'}` : ''}
        </span>
        <button onClick={newRound} className="btn-flat" style={{ fontSize: '11px', color: COLOR.teal, fontWeight: 600, padding: '4px 8px' }}>
          New round
        </button>
      </div>

      <div className="flex flex-wrap gap-2 mb-4">
        {round.termOrder.map((card) => {
          const state = termState(card.id);
          return (
            <button
              key={card.id}
              onClick={() => tap('term', card.id)}
              disabled={state === 'matched'}
              style={{
                ...stateStyle(state),
                borderRadius: '10px', padding: '8px 12px', fontSize: '12.5px', fontWeight: 600,
                lineHeight: 1.3, textAlign: 'center', maxWidth: '150px',
                transition: 'background 0.15s, border-color 0.15s',
              }}
            >
              {card.front}
            </button>
          );
        })}
      </div>

      <div className="flex flex-col gap-2">
        {round.defOrder.map((card) => {
          const state = defState(card.id);
          return (
            <button
              key={card.id}
              onClick={() => tap('def', card.id)}
              disabled={state === 'matched'}
              style={{
                ...stateStyle(state),
                borderRadius: '10px', padding: '10px 12px', fontSize: '12.5px', lineHeight: 1.4, textAlign: 'left',
                transition: 'background 0.15s, border-color 0.15s',
              }}
            >
              {card.back}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ReadingCheckGate({ question, onPassed }) {
  const [q] = useState(() => prepareQuestion(question));
  const [selected, setSelected] = useState(null);
  const [msPending, setMsPending] = useState([]);
  const [wasCorrect, setWasCorrect] = useState(null);
  const [attempts, setAttempts] = useState(0);

  const evalCorrect = (answer) => {
    if (q.type === 'mc') return answer === q.correct;
    if (q.type === 'tf') return (answer === 0) === q.answer;
    if (q.type === 'ms') {
      const picked = [...answer].sort();
      const correct = [...q.correct].sort();
      return picked.length === correct.length && picked.every((v, i) => v === correct[i]);
    }
    return false;
  };

  const onChoose = (idx) => {
    if (selected !== null) return;
    setSelected(idx);
    setWasCorrect(evalCorrect(idx));
  };
  const onToggleMs = (idx) => {
    if (selected !== null) return;
    setMsPending((prev) => (prev.includes(idx) ? prev.filter((i) => i !== idx) : [...prev, idx]));
  };
  const onSubmitMs = () => {
    if (selected !== null || msPending.length === 0) return;
    setSelected(msPending);
    setWasCorrect(evalCorrect(msPending));
  };
  const onNext = () => {
    if (wasCorrect) { onPassed(); return; }
    setAttempts((a) => a + 1);
    setSelected(null);
    setMsPending([]);
    setWasCorrect(null);
  };

  return (
    <div>
      <div style={{ fontSize: '11px', color: COLOR.gold, fontWeight: 600, marginBottom: '8px' }}>Quick check</div>
      <QuestionView
        q={q}
        selected={selected}
        onChoose={onChoose}
        onNext={onNext}
        index={0}
        total={1}
        hideMeta
        msPending={msPending}
        onToggleMs={onToggleMs}
        onSubmitMs={onSubmitMs}
        nextLabel={selected === null ? null : wasCorrect ? 'Continue reading →' : 'Try again'}
      />
      {attempts > 0 && selected === null && (
        <div style={{ fontSize: '11px', color: COLOR.muted, marginTop: '6px', textAlign: 'center' }}>
          Not quite — give it another shot.
        </div>
      )}
    </div>
  );
}

  const [readingPage, setReadingPage] = useState(0);
  const [unlockedPages, setUnlockedPages] = useState(1);
  const vocabItems = lesson.vocabIds.map((id) => flashcardsData.find((f) => f.id === id)).filter(Boolean);
  const DiagramComp = lesson.diagram ? LESSON_DIAGRAMS[lesson.diagram] : null;
  const MockupComp = lesson.portalMockup ? PORTAL_MOCKUPS[lesson.portalMockup] : null;

  const paragraphs = lesson.reading.split('\n\n');
  const readingPages = [];
  for (let i = 0; i < paragraphs.length; i += 2) readingPages.push(paragraphs.slice(i, i + 2));
  const isLastReadingPage = readingPage === readingPages.length - 1;
  const needsGate = !isLastReadingPage && readingPage === unlockedPages - 1;

  const gateQuestions = (questionsData || [])
    .filter((q) => lesson.quizIds.includes(q.id) && (q.type === 'mc' || q.type === 'tf'));
  const gateVocabPool = useMemo(() => {
    return vocabItems.length >= 2 ? shuffleArray(vocabItems).slice(0, 3) : [];
    // eslint-disable-next-line
  }, [lesson.id, readingPage]);
  const useMatchGateHere = readingPage % 2 === 1 || gateQuestions.length === 0;
  const gateQuestion = !useMatchGateHere && gateQuestions.length
    ? gateQuestions[readingPage % gateQuestions.length]
    : null;
  const advancePastGate = () => { setUnlockedPages((n) => n + 1); setReadingPage((p) => p + 1); };

  return (
    <div>
      <button onClick={onBack} className="btn-flat" style={{ fontSize: '12px', color: COLOR.teal, background: 'transparent', marginBottom: '12px', padding: 0 }}>

          <DiagramComp />

        <div className="flex justify-between items-center" style={{ marginBottom: '8px' }}>
          <div style={{ fontSize: '13px', fontWeight: 600, color: COLOR.gold }}>
            Reading{readingPages.length > 1 ? ` · page ${readingPage + 1} of ${readingPages.length}` : ''}
          </div>
          {speechSupported && (
            <SpeakButton
              id={'read-' + lesson.id + '-' + readingPage}
              text={readingPages[readingPage].join(' ')}
              speakingId={speakingId}
              onSpeak={onSpeak}
            />
          )}
        </div>
        <div style={{ fontSize: '11px', color: COLOR.muted, marginBottom: '8px' }}>Tap a highlighted term for its definition.</div>
        {readingPages[readingPage].map((p, i) => (
          <p key={i} style={{ fontSize: '14px', lineHeight: 1.65, color: COLOR.text, marginBottom: '10px' }}>
            {highlightTerms(p, lesson.keyTerms, flashcardsData, setActiveTerm)}
          </p>
        ))}

        {readingPage > 0 && (
          <button
            onClick={() => setReadingPage((p) => p - 1)}
            className="btn-flat"
            style={{ fontSize: '12px', color: COLOR.muted, padding: '4px 0', marginBottom: '10px' }}
          >
            ‹ Previous page
          </button>
        )}

        {!isLastReadingPage && readingPage < unlockedPages - 1 && (
          <button
            onClick={() => setReadingPage((p) => p + 1)}
            style={{ width: '100%', padding: '12px', borderRadius: '12px', background: COLOR.surfaceRaised, border: `1px solid ${COLOR.border}`, color: COLOR.text, fontSize: '13px', fontWeight: 600 }}

            Next page →
          </button>
        )}

        {needsGate && (
          <div style={{ boxShadow: SHADOW.card, background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: '14px', padding: '16px' }}>
            <div style={{ fontSize: '12px', color: COLOR.muted, marginBottom: '10px', textAlign: 'center' }}>

            </div>

              gateVocabPool.length >= 2 ? (
                <MatchGame flashcards={gateVocabPool} roundSize={3} onContinue={advancePastGate} />
              ) : (
                <button
                  onClick={advancePastGate}
                  style={{ width: '100%', padding: '12px', borderRadius: '12px', background: COLOR.teal, color: '#2B1620', fontSize: '14px', fontWeight: 600 }}
                >
                  Continue reading →
                </button>
              )
            ) : gateQuestion ? (
              <ReadingCheckGate question={gateQuestion} onPassed={advancePastGate} />
            ) : (
              <button
                onClick={advancePastGate}
                style={{ width: '100%', padding: '12px', borderRadius: '12px', background: COLOR.teal, color: '#2B1620', fontSize: '14px', fontWeight: 600 }}
              >
                Continue reading →
              </button>
            )}
          </div>
        )}
      </div>

      {activeTerm && (
        <div style={{ boxShadow: SHADOW.card, background: COLOR.surfaceRaised, border: `1px solid ${COLOR.teal}`, borderRadius: '12px', padding: '12px 14px', marginBottom: '16px' }}>
          <div className="flex justify-between items-start" style={{ marginBottom: '4px' }}>
            <div className="itil-display" style={{ fontSize: '14px', fontWeight: 600, color: COLOR.teal }}>{activeTerm.front}</div>

            <p style={{ fontSize: '14px', lineHeight: 1.65, color: COLOR.text }}>{lesson.scenario}</p>
