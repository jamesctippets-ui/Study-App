e deployment) into one incident reflecting a likely multi-stage attack, which a single scheduled rule looking at one data source alone would not catch."}, {"id": "f43", "cat": "securityPostureOps", "front": "Sentinel incidents vs. workbooks vs. hunting queries", "back": "An incident is a case created from one or more triggered alerts, grouping related evidence for investigation. A workbook is an interactive visualization/report built from the underlying data. A hunting query is a proactive, manually run KQL search for threats that have not yet triggered any analytics rule or incident.", "detail": "Hunting is explicitly proactive \u2014 you run a hunting query looking for evidence of compromise before any confirmed incident exists, as opposed to investigating an incident that already exists because a rule fired."}, {"id": "f44", "cat": "securityPostureOps", "front": "Sentinel playbooks (SOAR)", "back": "A playbook is a Logic App triggered automatically from an analytics rule or incident (or run manually) to orchestrate an automated response, like disabling a user account, isolating a VM, or posting a notification to a Teams channel.", "detail": "Playbooks are what turn Sentinel from a detection tool into a SOAR (Security Orchestration, Automation, and Response) platform \u2014 detection without a playbook still requires a human to take the remediation action manually."}, {"id": "f45", "cat": "securityPostureOps", "front": "Log Analytics workspace and KQL", "back": "A Log Analytics workspace is the storage and query backend that both Azure Monitor and Microsoft Sentinel are built on. Kusto Query Language (KQL) is the query language used to search, filter, and analyze the log data stored there.", "detail": "Sentinel does not have its own separate log store \u2014 it is deployed onto (and queries) a Log Analytics workspace, which is why enabling Sentinel on a workspace that already collects other Azure Monitor logs makes that data available to Sentinel too."}, {"id": "f46", "cat": "securityPostureOps", "front": "Azure Monitor alerts and action groups", "back": "An Azure Monitor alert rule evaluates a signal (metric, log query, or activity log event) against a condition and fires when met. An action group defines what happens when an alert fires \u2014 email, SMS, webhook, Azure Function, Logic App, and more \u2014 decoupled from the alert rule so the same action group can be reused across many rules.", "detail": "Separating the alert condition from the action group means updating who gets notified (e.g., a new on-call engineer) only requires editing the action group once, not every alert rule that references it."}, {"id": "f47", "cat": "securityPostureOps", "front": "Connecting hybrid and multicloud resources to Defender for Cloud", "back": "Defender for Cloud can extend coverage beyond Azure using Azure Arc (for on-premises/other-cloud servers) and native multicloud connectors for AWS and GCP, bringing their workloads under the same recommendations, secure score, and Defender plans.", "detail": "Without Arc onboarding first, an on-premises or AWS/GCP VM has no Azure resource identity for Defender for Cloud to evaluate at all \u2014 the connector/Arc step is what makes it visible to Defender for Cloud in the first place."}], "questions": [{"id": "q1", "cat": "identityAccessGovernance", "type": "mc", "question": "A group of on-call engineers needs standing eligibility to take on the Global Administrator role only when needed, requiring MFA and approval, for a maximum of 4 hours at a time. Which feature should be configured?", "options": ["A permanent Azure RBAC Owner role assignment at the root management group", "A dynamic security group combined with a Conditional Access policy requiring MFA", "A Microsoft Entra Privileged Identity Management (PIM) eligible assignment", "A custom RBAC role scoped to the tenant root"], "correct": 2, "explanation": "PIM eligible assignments are exactly for time-bound, just-in-time role elevation with MFA/approval/justification and a maximum activation duration. A standing RBAC assignment grants permanent access instead, and a dynamic group with Conditional Access manages membership and sign-in conditions, not time-boxed privileged role activation."}, {"id": "q2", "cat": "identityAccessGovernance", "type": "mc", "question": "An organization wants to block sign-ins to a finance application from a specific country and require a compliant device for sign-ins from personal devices, but only for members of the Finance group. Which feature configures this?", "options": ["A Conditional Access policy scoped to the Finance group with location and device compliance conditions", "An Azure RBAC deny assignment on the finance application", "A PIM eligible assignment for the Finance group", "A network security group rule restricting the app's subnet by country"], "correct": 0, "explanation": "Conditional Access policies combine conditions (group membership, sign-in location) with grant controls (requiring device compliance) scoped to a specific application. NSGs filter network traffic by IP/port with no identity or app sign-in awareness, and PIM governs privileged role activation, not general application access."}, {"id": "q3", "cat": "identityAccessGovernance", "type": "mc", "question": "An Azure Function needs to read secrets from Key Vault, and the security team wants no credentials stored anywhere in code or application settings. What should be configured?", "options": ["A shared access signature scoped to the Key Vault", "A service principal with a client secret stored in application settings", "An access policy granting the Contributor role on the Key Vault resource", "A managed identity assigned to the Function, granted access via RBAC or a vault access policy"], "correct": 3, "explanation": "A managed identity lets the Function authenticate to Key Vault using Azure-managed credentials that are never stored anywhere accessible to a developer. Storing a client secret in app settings is exactly the credential-storage risk a managed identity avoids, and Key Vault has no concept of a SAS token for secret access."}, {"id": "q4", "cat": "identityAccessGovernance", "type": "mc", "question": "An administrator who holds the Global Administrator role in Microsoft Entra ID reports being unable to modify Azure RBAC role assignments on a subscription. What is the most likely reason, and what fixes it?", "options": ["PIM must first be used to activate an eligible assignment, if one exists for that admin", "The admin must explicitly elevate access to manage Azure resources, since Entra ID directory roles do not grant Azure RBAC permissions by default", "Global Administrator is a deprecated role with no remaining capabilities", "Azure RBAC assignments can only ever be changed by the subscription's original creator"], "correct": 1, "explanation": "Entra ID directory roles and Azure RBAC roles are separate authorization systems \u2014 holding Global Administrator does not itself grant RBAC rights on Azure resources. The fix is the explicit \"Access management for Azure resources\" elevation setting in Entra ID properties, not a PIM activation for a role that may not even exist for this admin."}, {"id": "q5", "cat": "identityAccessGovernance", "type": "mc", "question": "Guest users from a partner organization need to request access to a bundle of resources \u2014 a group, a SharePoint site, and an app \u2014 through one approval workflow, with access automatically expiring after 90 days. Which feature fits best?", "options": ["A Conditional Access policy scoped to external users", "An access review scheduled quarterly", "A dynamic group scoped to the partner's email domain", "An access package in entitlement management"], "correct": 3, "explanation": "Access packages in entitlement management bundle multiple resources into a single request-and-approval workflow with a defined expiration. Access reviews check whether existing access should continue rather than granting new bundled access, and Conditional Access controls sign-in conditions, not what a user can request."}, {"id": "q6", "cat": "identityAccessGovernance", "type": "mc", "question": "A user account is disabled in Microsoft Entra ID, but the user still holds an active access token for a CAE-enabled application issued 20 minutes earlier. What happens under Continuous Access Evaluation?", "options": ["The token remains valid until its original expiration time, since CAE only applies to new sign-in attempts", "The application must be manually restarted before it will recognize the disabled account", "The application receives a near-real-time signal and revokes the token, blocking further use almost immediately", "The token is automatically converted into a refresh token with an extended lifetime"], "correct": 2, "explanation": "Continuous Access Evaluation is designed exactly for this case \u2014 a critical event like disabling an account is pushed to CAE-enabled services in near real time, so the existing token is revoked well before its original expiration rather than continuing to work until it naturally expires."}, {"id": "q7", "cat": "identityAccessGovernance", "type": "mc", "question": "A partner organization's users need to sign in to a shared application using their own organization's Microsoft Entra credentials, with specific rules about which of the partner's MFA and device compliance claims should be trusted. Which feature configures this?", "options": ["A dynamic security group scoped to the partner's domain", "Cross-tenant access settings, configured for inbound B2B collaboration with the partner tenant", "Workload identity federation with the partner's identity provider", "A PIM eligible assignment scoped to the partner's users"], "correct": 1, "explanation": "Cross-tenant access settings are exactly where an organization defines how much it trusts another Entra tenant's own MFA and device claims for inbound B2B collaboration. Workload identity federation is for non-human workloads exchanging tokens with an external IdP, not human partner sign-ins, and PIM/dynamic groups do not configure inter-tenant trust."}, {"id": "q8", "cat": "dataNetworkSecurity", "type": "mc", "question": "A security team needs a firewall that can inspect inside TLS-encrypted web traffic and provide intrusion detection and prevention signatures, in addition to standard FQDN and network filtering. Which option meets this?", "options": ["Azure Firewall Premium", "Azure Firewall Standard with a static public IP", "A Web Application Firewall on Application Gateway in detection mode", "Network security group rules referencing FQDN tags"], "correct": 0, "explanation": "TLS inspection and IDPS are Premium-tier-only Azure Firewall capabilities; Standard offers neither. A WAF operates at the HTTP layer for web apps specifically, and NSGs cannot inspect TLS content or provide IDPS signatures at all."}, {"id": "q9", "cat": "dataNetworkSecurity", "type": "mc", "question": "Administrators need to RDP into VMs from the Azure portal without any VM having a public IP address or inbound RDP opened on the VNet. Which service should be deployed?", "options": ["A VPN gateway with point-to-site configuration for every administrator", "Just-in-time VM access alone, keeping the VMs on their existing public IPs", "Azure Bastion, deployed into a dedicated AzureBastionSubnet", "An NSG rule allowing RDP only from the corporate office IP range"], "correct": 2, "explanation": "Azure Bastion is built specifically to provide portal-based RDP/SSH over TLS without the target VM needing a public IP at all. JIT access still assumes a port on a potentially public IP is opened temporarily, and an NSG rule restricting RDP by source IP still requires RDP to be reachable on some IP, which Bastion avoids entirely."}, {"id": "q10", "cat": "dataNetworkSecurity", "type": "mc", "question": "An organization wants traffic to its Azure SQL Database to travel entirely over the Microsoft backbone with a private IP in their VNet, and wants to fully disable the database's public endpoint. What should they configure?", "options": ["A service endpoint for Microsoft.Sql on the application subnet", "A private endpoint for the SQL Database, then disable public network access", "An NSG rule blocking all inbound traffic except from the app subnet", "A virtual network gateway with force tunneling enabled"], "correct": 1, "explanation": "Only a private endpoint gives the database an actual private IP in the VNet, which is the prerequisite for safely disabling its public endpoint entirely. A service endpoint keeps the database's public endpoint in place and only extends VNet identity to it, so public access could still be reachable."}, {"id": "q11", "cat": "dataNetworkSecurity", "type": "mc", "question": "A website published through Azure Front Door needs to detect and block common web exploits like SQL injection before they reach the backend. Which control should be applied?", "options": ["A Web Application Firewall policy in prevention mode attached to the Front Door profile", "A network security group on the backend App Service's subnet", "Azure Firewall Premium deployed in front of Front Door", "DDoS Protection Standard on the Front Door profile"], "correct": 0, "explanation": "WAF policies specifically inspect HTTP(S) requests for OWASP-category exploits like SQL injection, and prevention mode actively blocks matches. DDoS Protection defends against volumetric/protocol attacks rather than HTTP-layer exploits, and NSGs filter by IP/port with no awareness of HTTP request content."}, {"id": "q12", "cat": "dataNetworkSecurity", "type": "mc", "question": "A company connects to Azure over an ExpressRoute circuit and assumes the traffic is automatically encrypted because it never touches the public internet. What is the accurate statement a security review should correct this with?", "options": ["ExpressRoute traffic is always encrypted using IPsec by default", "ExpressRoute cannot carry traffic to Azure PaaS services at all", "ExpressRoute is only usable for encrypted traffic when paired with Azure Bastion", "ExpressRoute is private but not encrypted by default; IPsec VPN over ExpressRoute or MACsec must be added for encryption in transit"], "correct": 3, "explanation": "\"Private\" and \"encrypted\" are different properties \u2014 ExpressRoute provides the former but not the latter unless IPsec VPN over ExpressRoute or MACsec is explicitly added. ExpressRoute can also reach Azure PaaS services via Microsoft peering, so that claim is separately wrong too."}, {"id": "q13", "cat": "dataNetworkSecurity", "type": "mc", "question": "A hub-and-spoke design places Azure Firewall in the hub VNet, and the team wants all outbound internet traffic from every spoke to be inspected by that firewall. Peering between the hub and each spoke is already configured. What else is required?", "options": ["Nothing further \u2014 VNet peering automatically routes all spoke traffic through the hub", "User-defined routes (UDRs) in each spoke directing 0.0.0.0/0 traffic to the firewall's private IP", "A site-to-site VPN connection between each spoke and the hub", "Enabling DDoS Protection Standard on each spoke VNet"], "correct": 1, "explanation": "VNet peering only enables connectivity between VNets \u2014 it does not force traffic through a specific path. A user-defined route sending default (0.0.0.0/0) traffic to the firewall's internal IP is what actually forces spoke traffic through the hub for inspection."}, {"id": "q14", "cat": "dataNetworkSecurity", "type": "mc", "question": "A team wants an NSG rule to target VMs by their application role rather than their individual IP addresses, and wants the rule to stay valid automatically as VMs are added or removed from that role. What should be used?", "options": ["A service tag for the Azure region", "A list of the VMs' current private IP addresses, updated manually as needed", "An application security group (ASG) containing the relevant VMs' NICs", "A user-defined route referencing each VM's resource ID"], "correct": 2, "explanation": "An ASG lets an NSG rule reference a named group of VM NICs by application role, and membership automatically stays current as VMs are added or removed \u2014 no rule update needed when VM IPs change. A static IP list requires manual maintenance, which defeats the stated goal."}, {"id": "q15", "cat": "dataNetworkSecurity", "type": "mc", "question": "A compliance requirement states that sensitive columns in an Azure SQL Database must remain encrypted even from database administrators and the database engine itself, decrypting only inside a trusted client application. Which feature meets this?", "options": ["Transparent Data Encryption (TDE)", "Dynamic Data Masking", "Azure Disk Encryption on the underlying storage", "Always Encrypted"], "correct": 3, "explanation": "Always Encrypted keeps data encrypted in memory and in query plans, decrypting only on a trusted client driver \u2014 the database engine (and therefore a DBA) never sees the plaintext. TDE only protects data at rest on disk, and Dynamic Data Masking merely obscures displayed values without changing how the data is stored or processed."}, {"id": "q16", "cat": "dataNetworkSecurity", "type": "mc", "question": "A storage account currently allows access only through its account access keys, which are shared among several applications and grant unrestricted full control. What is the recommended remediation?", "options": ["Rotate the access keys weekly instead of changing the authorization model", "Migrate applications to Microsoft Entra ID authorization with scoped Azure RBAC roles like Storage Blob Data Reader", "Generate a single long-lived SAS token and distribute it to all applications instead", "Disable the storage account firewall so key-based requests are more reliable"], "correct": 1, "explanation": "Current Microsoft guidance is to move away from account keys toward Microsoft Entra ID authorization, enabling scoped, auditable, per-identity RBAC roles instead of one all-or-nothing shared secret. Frequent key rotation reduces the exposure window but keeps the same all-or-nothing risk, and a long-lived shared SAS token has a similar unscoped-sharing problem."}, {"id": "q17", "cat": "dataNetworkSecurity", "type": "mc", "question": "A Key Vault currently uses the legacy vault access policy model, and the security team wants to move to fine-grained, auditable Azure RBAC role assignments instead. What is true about making this change?", "options": ["Both access models can be enabled and enforced simultaneously for the same vault", "RBAC role assignments for Key Vault can only be applied at the subscription level, not the vault itself", "Switching to RBAC has no effect on existing access policies, which continue to apply alongside the new roles", "Switching the vault to the Azure RBAC permission model replaces the access policy model for authorization decisions on that vault"], "correct": 3, "explanation": "A Key Vault uses one authorization model at a time \u2014 switching to the RBAC permission model means role assignments now govern access, replacing rather than layering onto the vault's existing access policies. RBAC role assignments for Key Vault can also be scoped down to the vault or individual objects, not just the subscription."}, {"id": "q18", "cat": "aiComputeSecurity", "type": "mc", "question": "Several App Service instances and a set of Azure Functions need to share the same identity and RBAC role assignments, and that identity must persist even if any one of those resources is deleted and redeployed. What should be created?", "options": ["A user-assigned managed identity, attached to each resource", "A system-assigned managed identity on each resource individually", "A single service principal with a client secret shared across all app settings", "A Key Vault access policy shared across the resource group"], "correct": 0, "explanation": "A user-assigned managed identity exists as its own resource independent of any single App Service or Function, so it can be attached to many resources and survives any one of them being deleted and redeployed. A system-assigned identity is tied to one resource's lifecycle and cannot be shared this way."}, {"id": "q19", "cat": "aiComputeSecurity", "type": "mc", "question": "An AKS administrator wants to prevent any pod from being scheduled with privileged container settings across the entire cluster, regardless of which namespace deploys it. Which control should be applied?", "options": ["A Kubernetes network policy restricting pod-to-pod traffic", "An NSG applied to the AKS subnet", "The Azure Policy add-on for AKS, enforcing a policy that disallows privileged containers", "A managed identity assigned to the AKS node pool"], "correct": 2, "explanation": "Azure Policy's AKS add-on can enforce cluster-wide admission control over what pod configurations, like privileged containers, are allowed to be scheduled at all. A network policy only governs traffic between pods that are already running, not what configurations are permitted in the first place."}, {"id": "q20", "cat": "aiComputeSecurity", "type": "mc", "question": "A VM's disks already benefit from server-side encryption with platform-managed keys by default. A new requirement demands that the VM's temporary disk and in-memory caches also be encrypted, without configuring BitLocker or DM-Crypt inside the guest OS. Which feature should be enabled?", "options": ["Encryption at host", "Azure Disk Encryption (ADE)", "Transparent Data Encryption (TDE)", "Always Encrypted"], "correct": 0, "explanation": "Encryption at host specifically extends encryption to temporary disks and caches at the host level, which default server-side encryption of managed disks does not cover. Azure Disk Encryption instead uses guest-OS-level BitLocker/DM-Crypt, which this requirement explicitly avoids, and TDE/Always Encrypted are SQL-specific features unrelated to VM disk or cache encryption."}, {"id": "q21", "cat": "aiComputeSecurity", "type": "mc", "question": "An App Service application must not only serve traffic over HTTPS, but also verify the certificate presented by the calling client before accepting a request. Which setting accomplishes the second requirement?", "options": ["Enabling \"HTTPS Only\" in the TLS/SSL settings", "Binding a wildcard certificate to a custom domain", "Requiring client certificates (mutual TLS)", "Enabling a managed identity on the App Service"], "correct": 2, "explanation": "Verifying the calling client's own certificate is mutual TLS (client certificate authentication) \u2014 \"HTTPS Only\" only forces the connection to use TLS, without validating who the client is. A managed identity is about the app authenticating outbound to other services, not validating inbound callers."}, {"id": "q22", "cat": "aiComputeSecurity", "type": "mc", "question": "A team deploys an agent in Microsoft Foundry that only needs to read from one specific document index and call a single downstream pricing API. What approach best follows least-privilege practice for this agent?", "options": ["Grant the agent's own identity permissions scoped only to that document index and that one pricing API", "Grant the agent the same broad permissions as the development team building it, to avoid future permission requests", "Have the agent authenticate using the developer's personal credentials for simplicity", "Grant the agent Owner-equivalent access at the subscription level so it can self-provision what it needs"], "correct": 0, "explanation": "Least privilege for an agent identity means scoping its permissions to exactly the data source and API it needs, nothing more \u2014 broad or borrowed developer-level access turns a single prompt injection or jailbreak against that one agent into a much larger compromise than the agent's actual task requires."}, {"id": "q23", "cat": "aiComputeSecurity", "type": "mc", "question": "A security team wants an agent registered under Microsoft Entra Agent ID to be blocked from authenticating unless it is calling from an approved application and a trusted network location. Which feature should be applied to the agent identity?", "options": ["Azure Policy assigned at the resource group scope", "A network security group rule on the agent's hosting subnet", "A Conditional Access policy scoped to that agent identity", "A Defender for Cloud regulatory compliance standard"], "correct": 2, "explanation": "Conditional Access can be scoped to agent identities under Entra Agent ID the same way it targets user identities, evaluating conditions like calling application and network location before granting authentication. An NSG rule or Azure Policy governs network traffic or resource configuration, not identity-level sign-in conditions."}, {"id": "q24", "cat": "aiComputeSecurity", "type": "mc", "question": "Microsoft Defender XDR flags an agent identity as potentially compromised. Before remediating, the security team wants to know every data source, API, and downstream agent that identity could have reached. What capability provides this?", "options": ["Secure Score for the subscription", "Blast radius analysis for the agent identity", "A Sentinel workbook showing VM performance metrics", "The regulatory compliance dashboard"], "correct": 1, "explanation": "Blast radius analysis is built specifically to map out everything a flagged agent identity could reach, so containment and cleanup can be scoped accurately. Secure Score and the compliance dashboard reflect general posture and standards conformance, not a specific identity's reachable scope, and a VM performance workbook is unrelated."}, {"id": "q25", "cat": "aiComputeSecurity", "type": "mc", "question": "An organization deploys Azure API Management as an AI Gateway in front of several Microsoft Foundry agents. What does this most directly provide?", "options": ["A central point to enforce authentication, rate limiting, and logging for all traffic reaching the Foundry agents", "Automatic encryption of the agents' training data at rest", "A replacement for Conditional Access on the agents' identities", "Guaranteed elimination of prompt injection attempts against the agents"], "correct": 0, "explanation": "An AI Gateway built on Azure API Management centralizes cross-cutting controls \u2014 authentication, quotas/rate limiting, and logging \u2014 in front of the Foundry agents, so those policies do not have to be reimplemented per agent. It does not itself encrypt training data, replace Conditional Access, or guarantee prompt injection is fully eliminated."}, {"id": "q26", "cat": "aiComputeSecurity", "type": "mc", "question": "A Foundry agent is found to occasionally follow malicious instructions hidden inside the content of a document it retrieves and summarizes. Which control is designed to reduce this kind of risk?", "options": ["Increasing the agent's token quota in the AI Gateway", "Assigning the agent a system-assigned managed identity instead of a user-assigned one", "Configuring agent guardrails in Foundry to filter and constrain inputs, outputs, and permitted actions", "Disabling logging for the agent to reduce its attack surface"], "correct": 2, "explanation": "Guardrails configured in Foundry are the control meant to constrain what an agent will act on or output, including reducing the impact of instructions smuggled inside retrieved content (prompt injection). Token quotas and identity type do not address that risk, and disabling logging would actually remove visibility needed to detect it."}, {"id": "q27", "cat": "aiComputeSecurity", "type": "mc", "question": "A SharePoint site was shared broadly with 'Everyone' years ago and largely forgotten. After Microsoft 365 Copilot is enabled, employees start finding sensitive content from that site surfaced in Copilot answers they were technically permitted to see, but should not have easily found. What is the most direct root cause?", "options": ["Copilot has its own separate permission model that ignores SharePoint sharing settings", "Copilot requires a Defender for Cloud plan to respect existing permissions", "Copilot creates new permission grants for any content it summarizes", "The underlying overpermissive SharePoint sharing existed before Copilot and is now easier to discover through it"], "correct": 3, "explanation": "Copilot does not introduce a new permission model \u2014 it inherits and surfaces whatever access already exists. The oversharing risk comes from pre-existing overpermissive sharing that a human might never have stumbled onto manually, which Copilot can now surface far more readily. Remediating the underlying SharePoint permissions is the actual fix."}, {"id": "q28", "cat": "aiComputeSecurity", "type": "mc", "question": "An organization wants to prevent Microsoft 365 Copilot from using content labeled as highly confidential when generating a response, even for a user who otherwise has permission to view that content. Which control fits this requirement?", "options": ["A Conditional Access policy requiring MFA before using Copilot", "A Microsoft Purview DLP policy scoped to Microsoft 365 Copilot", "A network security group applied to the Copilot service endpoint", "Azure Firewall Premium with TLS inspection enabled"], "correct": 1, "explanation": "Purview DLP policies can be applied directly to Microsoft 365 Copilot to block it from using or surfacing content matching a sensitive label or information type, even for a user who is otherwise permitted to see the underlying file. Conditional Access, NSGs, and Azure Firewall govern sign-in conditions or network traffic, not what content an AI feature is allowed to draw from."}, {"id": "q29", "cat": "aiComputeSecurity", "type": "mc", "question": "A line-of-business maker builds a custom agent in Copilot Studio and wants prompts and responses evaluated against the organization's security and compliance policies while the agent is running, not just at publish time. What should an admin enable?", "options": ["A PIM eligible assignment for the maker", "A Defender for Cloud regulatory compliance standard", "Real-time protection for the Copilot Studio agent", "A service endpoint on the agent's hosting subnet"], "correct": 2, "explanation": "Real-time protection in Copilot Studio evaluates prompts and responses against configured policies as the agent actually runs, which is the ongoing runtime check this scenario asks for. PIM, the compliance dashboard, and a service endpoint address different concerns \u2014 privileged role activation, standards conformance, and network reachability \u2014 not runtime prompt/response evaluation."}, {"id": "q30", "cat": "aiComputeSecurity", "type": "mc", "question": "An AI agent grounds its answers using a vector index built from a set of confidential internal documents. A security review focuses only on who can chat with the agent, and concludes access is well controlled. What gap does this review most likely miss?", "options": ["Whether the underlying grounding data store itself has its own appropriately scoped access controls", "Whether the agent's token quota in the AI Gateway is set too high", "Whether the agent has a system-assigned or user-assigned managed identity", "Whether the chat interface uses TLS 1.2 or TLS 1.3"], "correct": 0, "explanation": "Restricting who can chat with the agent says nothing about who can directly access the grounding data store (like the vector index) itself \u2014 that store is a full sensitive-data asset in its own right and needs its own access controls, independent of the chat interface's access policy."}, {"id": "q31", "cat": "aiComputeSecurity", "type": "mc", "question": "Two different teams are asked why they gave their AI agent its own Entra Agent ID identity instead of just reusing an existing shared service principal that already had broad API access. What is the strongest justification?", "options": ["Entra Agent ID identities are cheaper to license than service principals", "A shared service principal automatically restricts itself to least-privilege access over time", "A dedicated agent identity allows actions to be attributed, scoped, and governed to that specific agent rather than blended with everything else the shared principal does", "Service principals cannot be used by any automated workload, only agents can"], "correct": 2, "explanation": "The value of a dedicated agent identity is attribution and scoping \u2014 its actions, permissions, and lifecycle can be governed and audited on their own, rather than mixed in with whatever else a broadly-scoped shared service principal is also doing. Service principals are still valid for other automated workloads; that isn't unique to agents, and neither licensing cost nor automatic self-restriction are real properties of either."}, {"id": "q32", "cat": "securityPostureOps", "type": "mc", "question": "A subscription's Secure Score is currently 45%, and leadership wants to know what raising it actually represents. What is the most accurate description?", "options": ["A guarantee that the environment is compliant with PCI DSS", "The proportion of Defender for Cloud's recommended security controls, weighted by impact, that have actually been implemented", "The percentage of resources that have a Microsoft Defender plan enabled", "A measure of how many security alerts have been resolved in the last 30 days"], "correct": 1, "explanation": "Secure Score reflects how many weighted security recommendations have been remediated, as a general best-practice prioritization measure. It is not a certification against any specific named regulatory standard \u2014 that mapping is what the separate regulatory compliance dashboard provides."}, {"id": "q33", "cat": "securityPostureOps", "type": "mc", "question": "A company wants Defender for Cloud to scan its Azure SQL databases for outdated permissions and misconfigurations, and also alert on anomalous access patterns that could indicate an active attack. Which single Defender plan provides both capabilities?", "options": ["Defender for Storage", "Defender for Resource Manager", "Defender for Key Vault", "Defender for SQL"], "correct": 3, "explanation": "Defender for SQL bundles both vulnerability assessment (misconfiguration/permission scanning) and advanced threat protection (anomalous access alerting) under one plan. Defender for Storage, Key Vault, and Resource Manager each protect a different resource type and would not surface SQL database findings."}, {"id": "q34", "cat": "securityPostureOps", "type": "mc", "question": "A VM's RDP port is normally closed by Defender for Cloud, and only opens for a specific source IP and time window after an administrator submits and is granted a request through the portal. What is this feature called?", "options": ["Just-in-time (JIT) VM access", "Adaptive application controls", "Azure Bastion", "The regulatory compliance dashboard"], "correct": 0, "explanation": "This is exactly JIT VM access \u2014 a port is locked down by default and opened temporarily, scoped to a specific requester, source, and duration. Adaptive application controls govern which applications are allowed to run, not network port exposure, and Bastion avoids exposing the port at all rather than opening it temporarily."}, {"id": "q35", "cat": "securityPostureOps", "type": "mc", "question": "Defender for Cloud has learned the normal set of applications that run on a group of production VMs and now alerts whenever a process outside that learned allowlist attempts to execute. Which feature is this?", "options": ["Just-in-time VM access", "Adaptive application controls", "Microsoft Sentinel Fusion", "Dynamic Data Masking"], "correct": 1, "explanation": "Adaptive application controls use machine learning to build and enforce an allowlist of known-safe applications per VM group. JIT access controls management port exposure rather than application execution, and Fusion/Dynamic Data Masking are unrelated Sentinel and SQL features respectively."}, {"id": "q36", "cat": "securityPostureOps", "type": "mc", "question": "An auditor asks whether the organization's Azure environment currently meets the specific technical controls required by ISO 27001, not just Microsoft's general best-practice recommendations. Which Defender for Cloud feature answers that question?", "options": ["Secure Score", "Adaptive application controls", "The regulatory compliance dashboard, mapped to the ISO 27001 standard", "Just-in-time VM access"], "correct": 2, "explanation": "The regulatory compliance dashboard specifically maps environment configuration against named standards like ISO 27001, showing pass/fail per control. Secure Score reflects general best practice rather than conformance to any one named regulatory standard."}, {"id": "q37", "cat": "securityPostureOps", "type": "mc", "question": "An organization runs workloads on both Azure and AWS and wants both environments' security posture to appear in the same Defender for Cloud recommendations and secure score. What must be configured first for the AWS resources?", "options": ["Onboard the AWS account using Defender for Cloud's native multicloud connector", "Deploy Azure Bastion into the AWS VPC", "Enable Azure Firewall Premium for the AWS account", "Create an Azure Policy initiative targeting the AWS region"], "correct": 0, "explanation": "Defender for Cloud's native multicloud connectors are the mechanism for onboarding AWS (and GCP) accounts so their resources appear alongside Azure resources in recommendations and secure score. Azure Bastion and Azure Firewall are Azure networking services with no role in cross-cloud onboarding, and Azure Policy alone does not extend Defender for Cloud visibility into another cloud provider."}, {"id": "q38", "cat": "securityPostureOps", "type": "mc", "question": "A SOC wants an automated response that immediately disables a user's account in Microsoft Entra ID the moment a specific Sentinel analytics rule fires, without a human taking manual action. What should they build?", "options": ["A Sentinel hunting query scheduled to run every 5 minutes", "A Log Analytics saved search", "An Azure Monitor action group emailing the SOC team", "A Sentinel playbook (Logic App) triggered automatically from the analytics rule"], "correct": 3, "explanation": "A playbook triggered from the analytics rule is exactly Sentinel's SOAR capability \u2014 it can automatically take an action like disabling an account, with no human step in between. An action group can only notify people (email, SMS, webhook) rather than directly executing an identity-management action on its own."}, {"id": "q39", "cat": "securityPostureOps", "type": "mc", "question": "A Sentinel analyst notices two unrelated low-severity alerts \u2014 an unusual sign-in location and, separately, an unusual resource deployment \u2014 that individually would not warrant escalation, but together strongly suggest a multi-stage attack. Which Sentinel capability is designed to surface that kind of combined pattern automatically?", "options": ["A scheduled analytics rule querying a single data source", "Fusion correlation", "A basic hunting bookmark", "A Log Analytics workspace retention policy"], "correct": 1, "explanation": "Fusion is built specifically to use machine learning to correlate multiple lower-fidelity signals across different sources into one higher-confidence incident. A single scheduled rule against one data source would not naturally connect two unrelated low-severity signals from different sources the way Fusion does."}, {"id": "q40", "cat": "securityPostureOps", "type": "mc", "question": "An analyst wants to proactively search historical log data in Sentinel for signs of a specific attacker technique, even though no analytics rule has fired and no incident currently exists. What is this activity called?", "options": ["Incident triage", "Playbook execution", "Threat hunting", "Workbook rendering"], "correct": 2, "explanation": "Proactively searching for evidence of compromise before any rule has triggered an incident is threat hunting. Incident triage responds to an incident that already exists, and workbooks/playbooks are visualization and automation tools, not the proactive search activity itself."}, {"id": "q41", "cat": "securityPostureOps", "type": "mc", "question": "A company enables Microsoft Sentinel on a Log Analytics workspace that already collects Azure Activity Log and VM performance data from Azure Monitor. What happens to that existing data with respect to Sentinel?", "options": ["Nothing \u2014 Sentinel requires its own separate, dedicated workspace and cannot read existing Azure Monitor data", "The existing data must be manually exported and re-imported into Sentinel", "Sentinel creates a duplicate copy of the data in a new storage account for its own use", "That existing data becomes available to Sentinel's analytics rules and hunting queries, since Sentinel is built directly on the Log Analytics workspace"], "correct": 3, "explanation": "Sentinel does not maintain a separate log store \u2014 it operates directly on a Log Analytics workspace, so data already being collected there is immediately queryable by Sentinel's analytics rules and hunting queries once Sentinel is enabled on that workspace."}, {"id": "q42", "cat": "securityPostureOps", "type": "mc", "question": "A team defines an Azure Monitor alert rule for high CPU usage on a set of VMs, and wants any future change to on-call notification recipients to require editing only one place, not every alert rule that references it. What should hold the list of notification recipients?", "options": ["An action group, referenced by the alert rule", "A Sentinel playbook", "A separate alert rule condition for each recipient", "A Log Analytics saved search"], "correct": 0, "explanation": "Action groups decouple the \"who/how to notify\" step from the alert condition itself, so updating notification recipients in one action group automatically applies to every alert rule referencing it. Embedding recipients directly per alert rule would instead require updating each rule individually."}, {"id": "tf1", "cat": "identityAccessGovernance", "type": "tf", "question": "Microsoft Entra Privileged Identity Management can manage just-in-time activation for both Azure RBAC roles and Microsoft Entra directory roles.", "answer": true, "explanation": "PIM covers both role types \u2014 Azure resource RBAC roles and Entra ID directory roles like Global Administrator \u2014 under the same eligible/active assignment model."}, {"id": "tf2", "cat": "identityAccessGovernance", "type": "tf", "question": "Holding the Global Administrator role in Microsoft Entra ID automatically grants Owner permissions on every Azure subscription in the tenant.", "answer": false, "explanation": "Entra ID directory roles and Azure RBAC roles are separate authorization systems. A Global Administrator must explicitly elevate access to gain Azure RBAC permissions across subscriptions \u2014 it is not automatic."}, {"id": "tf3", "cat": "identityAccessGovernance", "type": "tf", "question": "A user-assigned managed identity can be attached to multiple Azure resources and persists even if one of those resources is deleted.", "answer": true, "explanation": "Unlike a system-assigned identity, a user-assigned managed identity is its own standalone resource, shareable across multiple resources and independent of any one resource's lifecycle."}, {"id": "tf4", "cat": "identityAccessGovernance", "type": "tf", "question": "Continuous Access Evaluation only takes effect the next time a user's token naturally expires, with no ability to revoke access sooner.", "answer": false, "explanation": "That is the opposite of CAE's purpose \u2014 it pushes critical event signals (like an account being disabled) to CAE-enabled services in near real time, revoking a token well before its natural expiration rather than waiting for it."}, {"id": "tf5", "cat": "dataNetworkSecurity", "type": "tf", "question": "An ExpressRoute circuit encrypts all traffic by default because it does not traverse the public internet.", "answer": false, "explanation": "ExpressRoute is private but not encrypted by default; achieving encryption requires adding IPsec VPN over ExpressRoute or MACsec."}, {"id": "tf6", "cat": "dataNetworkSecurity", "type": "tf", "question": "Azure Firewall Standard can filter traffic using FQDN rules and threat intelligence, but cannot perform TLS inspection or intrusion detection and prevention (IDPS).", "answer": true, "explanation": "TLS inspection and IDPS are Premium-tier-only capabilities. Standard is limited to L3-L7 filtering, FQDN filtering, and threat intelligence-based filtering."}, {"id": "tf7", "cat": "dataNetworkSecurity", "type": "tf", "question": "Dynamic Data Masking changes how sensitive data is physically stored in an Azure SQL database, encrypting it at the byte level.", "answer": false, "explanation": "Dynamic Data Masking only obscures values shown in query results to non-privileged users \u2014 the underlying stored data is unchanged and unencrypted by this feature specifically."}, {"id": "tf8", "cat": "dataNetworkSecurity", "type": "tf", "question": "Switching an Azure Key Vault to the Azure RBAC permission model replaces its existing vault access policies for authorization decisions.", "answer": true, "explanation": "A vault uses one authorization model at a time. Switching to the RBAC permission model means role assignments now govern access, replacing rather than supplementing the legacy access policies."}, {"id": "tf9", "cat": "aiComputeSecurity", "type": "tf", "question": "Server-side encryption (SSE) of Azure managed disks with platform-managed keys is enabled by default, without requiring any guest OS configuration.", "answer": true, "explanation": "SSE is on by default for all managed disks using platform-managed keys, applied transparently outside the guest OS \u2014 Azure Disk Encryption is a separate, optional layer for guest-OS-level encryption on top of this."}, {"id": "tf10", "cat": "aiComputeSecurity", "type": "tf", "question": "Microsoft Entra Agent ID lets an AI agent's actions be authenticated, authorized, and audited under its own identity, separate from the human user or developer who created it.", "answer": true, "explanation": "That is the core purpose of Entra Agent ID \u2014 giving an agent its own individually identifiable, governed identity rather than blending its actions into a human user's or a generic shared service principal's identity."}, {"id": "tf11", "cat": "aiComputeSecurity", "type": "tf", "question": "Deploying an AI Gateway with Azure API Management in front of Microsoft Foundry agents removes the need to apply Conditional Access to those agents' identities.", "answer": false, "explanation": "An AI Gateway centralizes traffic-level controls like authentication enforcement, rate limiting, and logging \u2014 it does not replace identity-level Conditional Access policies applied to the agent identities themselves; the two are complementary layers, not substitutes."}, {"id": "tf12", "cat": "aiComputeSecurity", "type": "tf", "question": "Microsoft Purview DLP policies can be applied to Microsoft 365 Copilot to block it from using sensitive labeled content in a response, even for a user who has permission to view the underlying file.", "answer": true, "explanation": "Purview DLP for Microsoft 365 Copilot can restrict AI-generated exposure of sensitive content independently of the user's underlying file permissions, closing a gap that content access permissions alone do not cover."}, {"id": "tf13", "cat": "aiComputeSecurity", "type": "tf", "question": "Blast radius analysis for a compromised agent identity in Defender XDR is limited to showing only the single resource the agent's role assignment directly names.", "answer": false, "explanation": "Blast radius analysis is meant to map everything the agent identity could actually reach or had recently accessed \u2014 including downstream APIs, data sources, and other agents it can invoke \u2014 not just the one resource literally named in its role assignment."}, {"id": "tf14", "cat": "securityPostureOps", "type": "tf", "question": "Microsoft Defender for Cloud Secure Score certifies that an environment is compliant with a specific regulatory standard such as PCI DSS.", "answer": false, "explanation": "Secure Score reflects adherence to general best-practice recommendations, weighted by impact \u2014 it is not a certification against any named regulatory standard. That mapping is what the regulatory compliance dashboard provides instead."}, {"id": "tf15", "cat": "securityPostureOps", "type": "tf", "question": "Just-in-time VM access reduces exposure of management ports like RDP and SSH by keeping them closed until a specific, approved, time-limited request opens them.", "answer": true, "explanation": "That is exactly how JIT VM access works \u2014 ports stay locked down by default and open temporarily only for an approved requester, source IP, and time window."}, {"id": "tf16", "cat": "securityPostureOps", "type": "tf", "question": "Microsoft Sentinel maintains its own independent data store, separate from any Log Analytics workspace.", "answer": false, "explanation": "Sentinel is built directly on top of a Log Analytics workspace and has no separate store of its own \u2014 enabling Sentinel on a workspace makes its existing log data immediately available to Sentinel's analytics rules and hunting queries."}, {"id": "tf17", "cat": "securityPostureOps", "type": "tf", "question": "A Sentinel playbook can be triggered automatically by an analytics rule to take an automated remediation action without human intervention.", "answer": true, "explanation": "Playbooks are Logic Apps that can be set to trigger automatically from an analytics rule or incident, enabling automated response (SOAR) without requiring a person to manually act."}, {"id": "tf18", "cat": "securityPostureOps", "type": "tf", "question": "Onboarding an AWS account to Defender for Cloud's native multicloud connector allows AWS resources to appear in the same recommendations and secure score as Azure resources.", "answer": true, "explanation": "Defender for Cloud's native multicloud connectors extend the same recommendations, secure score, and applicable Defender plans to onboarded AWS (and GCP) resources alongside Azure ones."}, {"id": "msq1", "cat": "identityAccessGovernance", "type": "ms", "question": "Which two of the following are true about Microsoft Entra Conditional Access? (Choose two.)", "options": ["It can block network traffic to a specific port on a VM", "It can require a compliant or hybrid-joined device before granting access", "It replaces the need for Azure RBAC role assignments entirely", "It evaluates conditions like user, group, location, and device platform to decide whether to apply grant or session controls"], "correct": [1, 3], "explanation": "Conditional Access evaluates sign-in conditions (user, group, location, device platform, risk) and can require a compliant or hybrid-joined device as a grant control. It has nothing to do with network port-level traffic filtering, which is an NSG/firewall function, and it does not replace Azure RBAC, which governs a separate set of resource-permission decisions."}, {"id": "msq2", "cat": "identityAccessGovernance", "type": "ms", "question": "Which two of the following are true about cross-tenant access settings and workload identity federation? (Choose two.)", "options": ["Cross-tenant access settings control how much a tenant trusts another tenant's MFA and device claims for B2B collaboration", "Workload identity federation requires storing a long-lived client secret for the external workload", "Workload identity federation lets an external identity provider's token be exchanged for an Entra ID token without a stored secret", "Cross-tenant access settings apply only to workload identities, never to human B2B users"], "correct": [0, 2], "explanation": "Cross-tenant access settings govern the trust extended to another tenant's users and their MFA/device claims for B2B collaboration, while workload identity federation is specifically the credential-free way for an external workload's token to be exchanged for an Entra ID token. It does not require a stored secret \u2014 that is the point of federation \u2014 and cross-tenant access settings are about human B2B trust, not workload identities."}, {"id": "msq3", "cat": "dataNetworkSecurity", "type": "ms", "question": "Which two of the following are true about Azure Bastion? (Choose two.)", "options": ["It provides RDP/SSH connectivity through the Azure portal without requiring a public IP on the target VM", "It requires each target VM to have a public IP address for Bastion to connect to it", "It is deployed into a dedicated subnet named AzureBastionSubnet", "It performs TLS inspection of encrypted web traffic"], "correct": [0, 2], "explanation": "Bastion's core value is portal-based RDP/SSH without the target VM needing a public IP at all, and it requires its own dedicated AzureBastionSubnet in the VNet. It does not require target VMs to have public IPs, and TLS inspection of web traffic is an Azure Firewall Premium capability, unrelated to Bastion."}, {"id": "msq4", "cat": "dataNetworkSecurity", "type": "ms", "question": "Which two of the following correctly describe DDoS Protection Standard versus Basic? (Choose two.)", "options": ["Basic must be manually enabled per virtual network before it provides any protection", "Basic and Standard provide identical attack analytics and metrics", "Standard adds tuned, resource-specific mitigation policies at the virtual network level", "Standard provides cost protection and access to a rapid response team during an attack"], "correct": [2, 3], "explanation": "Standard's distinguishing features are tuned mitigation policies applied at the VNet level, plus cost protection and rapid response support during an active attack. Basic is automatically enabled at no cost for every resource with no manual step, and it does not provide the detailed attack analytics and metrics that Standard does."}, {"id": "msq5", "cat": "dataNetworkSecurity", "type": "ms", "question": "Which two of the following are true about Always Encrypted in Azure SQL? (Choose two.)", "options": ["Sensitive data remains encrypted in memory and in query plans on the database engine", "Decryption happens only on a trusted client application, not the database engine itself", "It changes only how data is displayed in query results, without altering how it is stored", "It is the same feature as Transparent Data Encryption, applied at the column level"], "correct": [0, 1], "explanation": "Always Encrypted keeps data encrypted through memory and query processing, decrypting only at a trusted client \u2014 the database engine never sees plaintext. That is different from Dynamic Data Masking (which only changes displayed output) and from TDE (which encrypts the whole database at rest, not specific columns end-to-end)."}, {"id": "msq6", "cat": "aiComputeSecurity", "type": "ms", "question": "Which two of the following are true about securing an AKS cluster? (Choose two.)", "options": ["Kubernetes network policies control which Azure RBAC roles a user is assigned", "The Azure Policy add-on for AKS can enforce cluster-wide rules like disallowing privileged containers", "Kubernetes network policies restrict pod-to-pod traffic within the cluster", "Network policies and Azure Policy for AKS are mutually exclusive and cannot be used together"], "correct": [1, 2], "explanation": "Azure Policy's AKS add-on enforces what configurations are allowed to be deployed (like disallowing privileged containers), while Kubernetes network policies separately restrict pod-to-pod traffic \u2014 these operate at different layers and are commonly used together, not exclusively. Network policies have nothing to do with assigning Azure RBAC roles."}, {"id": "msq7", "cat": "aiComputeSecurity", "type": "ms", "question": "Which two of the following are true about Microsoft Entra Agent ID? (Choose two.)", "options": ["It gives an AI agent its own individually identifiable, policy-controlled identity", "Agent identity blueprints let permissions and Conditional Access apply consistently across many agents created from the same template", "It requires disabling Conditional Access for any identity it governs", "It can only be used for agents that never call any downstream API"], "correct": [0, 1], "explanation": "Entra Agent ID's purpose is exactly to give agents their own governed identity, with blueprints letting policy be applied consistently at scale across many agents from one template. It does not disable Conditional Access \u2014 the opposite, Conditional Access can be applied to agent identities \u2014 and it is not restricted to agents with no downstream API calls."}, {"id": "msq8", "cat": "aiComputeSecurity", "type": "ms", "question": "Which two of the following are true about securing Microsoft Copilot deployments? (Choose two.)", "options": ["Copilot inherits and respects a user's existing Microsoft 365 permissions rather than introducing a new permission model", "Enabling Copilot automatically tightens any overly broad SharePoint or OneDrive sharing it encounters", "Microsoft Purview DLP can restrict Copilot from using content that matches a sensitive information type or label", "Copilot Studio admin controls have no effect on which connectors or data sources a maker-built agent can use"], "correct": [0, 2], "explanation": "Copilot surfaces content strictly within a user's existing permissions and does not create a new permission model of its own, and Purview DLP can separately restrict what sensitive content Copilot is allowed to use in a response. Copilot does not automatically fix overly broad sharing it encounters \u2014 that oversharing risk is a separate remediation task \u2014 and Copilot Studio admin controls do directly govern which connectors and data sources a maker can use."}, {"id": "msq9", "cat": "securityPostureOps", "type": "ms", "question": "Which two of the following are true about Microsoft Defender for Cloud plans? (Choose two.)", "options": ["Each Defender plan (Servers, Storage, SQL, Containers, etc.) is enabled independently per resource type", "Enabling Defender for Storage automatically enables Defender for SQL on the same subscription", "Defender for Cloud can only be enabled at the management group level, never per subscription", "Defender plans add workload-specific threat detection beyond what the free tier's posture management provides"], "correct": [0, 3], "explanation": "Defender plans are enabled per resource type independently, and each adds workload-specific threat detection on top of the free tier's baseline recommendations and secure score. Enabling one plan does not automatically enable a different plan, and plans can be enabled at the subscription level, not only at a management group."}, {"id": "msq10", "cat": "securityPostureOps", "type": "ms", "question": "Which two of the following are true about Microsoft Sentinel Fusion? (Choose two.)", "options": ["It requires a human analyst to manually link the related alerts together", "It uses machine learning to correlate multiple lower-fidelity signals into one higher-confidence incident", "It only works with a single data source at a time", "It can surface a likely multi-stage attack pattern that individual scheduled rules on separate data sources might not catch on their own"], "correct": [1, 3], "explanation": "Fusion automatically correlates signals across multiple data sources using machine learning, without requiring manual linking, and its purpose is precisely to catch multi-stage patterns spanning sources that individual scheduled rules would otherwise treat as unrelated. It explicitly works across multiple data sources, not just one."}]}, "cloudplus": {"categories": [{"key": "archDesign", "label": "Cloud Architecture & Design", "marks": 23}, {"key": "security", "label": "Security", "marks": 20}, {"key": "deployment", "label": "Deployment", "marks": 17}, {"key": "opsSupport", "label": "Operations & Support", "marks": 22}, {"key": "troubleshooting", "label": "Troubleshooting", "marks": 18}], "flashcards": [{"id": "f1", "cat": "archDesign", "front": "Public vs. private vs. hybrid vs. community cloud", "back": "Public: shared infrastructure owned by a third-party provider. Private: dedicated to one organization, on-premises or hosted. Hybrid: a mix of both, often connected for workload portability. Community: shared by several organizations with common requirements, like agencies in the same industry.", "detail": "Exam trap: \"hybrid\" specifically implies connected, coordinated environments \u2014 just using two unrelated clouds for different things is closer to multi-cloud, not hybrid."}, {"id": "f2", "cat": "archDesign", "front": "Scalability vs. elasticity", "back": "Scalability is the general capacity to handle more (or less) load by adding or removing resources, which can be planned and manual. Elasticity is scaling that happens automatically and dynamically in response to real-time demand.", "detail": "Every elastic system is scalable, but not every scalable system is elastic \u2014 a system that only scales through a change request ticket is scalable, not elastic."}, {"id": "f3", "cat": "archDesign", "front": "Vertical scaling vs. horizontal scaling", "back": "Vertical scaling (\"scaling up\") adds resources \u2014 CPU, RAM \u2014 to an existing instance. Horizontal scaling (\"scaling out\") adds more instances running in parallel.", "detail": "Vertical scaling usually requires a restart and has a hardware ceiling. Horizontal scaling avoids both, but requires the workload to be designed to run across multiple instances (e.g., stateless, load-balanced)."}, {"id": "f4", "cat": "archDesign", "front": "High availability vs. fault tolerance vs. disaster recovery", "back": "High availability minimizes downtime through redundancy, but a brief failover interruption may still occur. Fault tolerance keeps the system running through a failure with no interruption at all, usually at higher cost. Disaster recovery is the plan and process for restoring service after a major outage that HA/fault tolerance didn't prevent.", "detail": "HA and fault tolerance are about avoiding downtime; DR assumes downtime already happened and is about getting back up."}, {"id": "f5", "cat": "archDesign", "front": "RTO vs. RPO", "back": "RTO (Recovery Time Objective) is the maximum acceptable time to restore service after an outage. RPO (Recovery Point Objective) is the maximum acceptable amount of data loss, measured as time since the last good backup.", "detail": "A 4-hour RPO means backups need to run at least every 4 hours. RTO and RPO are set by business requirements first, then the backup/DR architecture is built to meet them \u2014 not the other way around."}, {"id": "f6", "cat": "archDesign", "front": "Block vs. file vs. object storage", "back": "Block storage presents raw, low-latency volumes ideal for databases and VM disks. File storage presents a shared, hierarchical filesystem accessed over a protocol like NFS or SMB. Object storage holds data as flat, metadata-rich objects, built for massive scale rather than low-latency random access.", "detail": "A relational database wants block storage. A shared team drive wants file storage. Millions of backup archives or media files want object storage."}, {"id": "f7", "cat": "archDesign", "front": "Load balancing algorithms", "back": "Round robin cycles requests evenly across servers in order. Least connections sends new requests to whichever server currently has the fewest active connections. Weighted (round robin or least connections) accounts for servers with different capacities. Source/IP-affinity keeps a given client pinned to the same backend server.", "detail": "Source affinity matters for stateful apps that keep session data on one server \u2014 losing that pinning mid-session can log a user out or break their session."}, {"id": "f8", "cat": "security", "front": "Authentication vs. authorization vs. accounting (AAA)", "back": "Authentication verifies who you are. Authorization determines what you're allowed to do once verified. Accounting logs what was actually done, for audit purposes.", "detail": "A stolen-but-valid password is an authentication success with an authorization failure waiting to happen \u2014 the identity checks out, but it isn't really that person acting."}, {"id": "f9", "cat": "security", "front": "RBAC vs. ABAC", "back": "Role-based access control (RBAC) grants permissions based on a user's assigned role (e.g., \"Backup Operator\"). Attribute-based access control (ABAC) evaluates a combination of attributes at request time \u2014 user department, resource tag, time of day, location \u2014 to make a more granular decision.", "detail": "RBAC is simpler to administer at scale; ABAC is more flexible but harder to audit because the effective rule set is computed dynamically rather than assigned directly."}, {"id": "f10", "cat": "security", "front": "Encryption at rest vs. in transit vs. in use", "back": "At rest protects stored data (on disk). In transit protects data moving across a network (e.g., TLS). In use protects data while it's actively being processed in memory, which is the hardest of the three to achieve and typically needs specialized hardware (e.g., a trusted execution environment).", "detail": "A common exam trap: encrypting a database at rest does nothing to protect a query result being sent to a client over an unencrypted connection \u2014 that needs in-transit encryption too."}, {"id": "f11", "cat": "security", "front": "Zero Trust", "back": "A security model that never grants trust based on network location alone. Every request is independently verified \u2014 identity, device posture, and context \u2014 regardless of whether it originates inside or outside the traditional network perimeter.", "detail": "Zero Trust means a compromised perimeter (e.g., a stolen VPN credential) still isn't enough on its own to reach sensitive resources, because every subsequent request is re-checked."}, {"id": "f12", "cat": "security", "front": "IDS vs. IPS", "back": "An Intrusion Detection System (IDS) monitors traffic and alerts on suspicious activity, but doesn't block it. An Intrusion Prevention System (IPS) sits inline and can actively block or drop traffic it identifies as malicious.", "detail": "IPS's ability to block traffic is also its biggest risk: a false positive can actively break legitimate traffic, which a passive IDS never would."}, {"id": "f13", "cat": "security", "front": "Stateful vs. stateless packet filtering", "back": "A stateful firewall tracks the state of active connections and automatically allows return traffic for a connection it already approved. A stateless filter (like a basic ACL) evaluates every packet independently against its rule set, with no memory of prior traffic.", "detail": "Stateless filtering needs explicit rules for both inbound and outbound halves of a connection, since it has no concept of \"this reply belongs to a request I already allowed.\""}, {"id": "f14", "cat": "security", "front": "Tokenization vs. encryption", "back": "Tokenization replaces sensitive data with a non-sensitive substitute (a token) that has no mathematical relationship to the original value, with the real data stored separately in a vault. Encryption transforms data using a reversible mathematical algorithm and a key.", "detail": "Because a token can't be mathematically reversed back to the original value even if you had unlimited computing power, tokenization is often preferred for things like stored payment card numbers."}, {"id": "f15", "cat": "deployment", "front": "Blue-green vs. canary deployment", "back": "Blue-green runs two full, identical production environments; traffic is switched entirely from one to the other once the new version is verified. Canary releases the new version to a small subset of users/traffic first, gradually increasing exposure as confidence grows.", "detail": "Blue-green gives an instant, all-or-nothing rollback (just switch traffic back). Canary limits the blast radius of a bad release but takes longer to fully roll out."}, {"id": "f16", "cat": "deployment", "front": "Rolling vs. in-place deployment", "back": "A rolling deployment updates instances gradually, a few at a time, so the service stays available throughout. An in-place deployment updates a server directly, typically taking that instance offline (or degraded) during the update.", "detail": "Rolling deployments need a load balancer removing an instance from rotation before updating it, then adding it back \u2014 skip that step and you're serving errors from a mid-update instance."}, {"id": "f17", "cat": "deployment", "front": "Full vs. incremental vs. differential backup", "back": "A full backup copies everything. An incremental backup copies only what changed since the last backup of any kind (fastest to create, slowest to restore \u2014 needs the full plus every incremental since). A differential backup copies everything changed since the last full backup (restore needs only the full plus the latest differential).", "detail": "Incremental backups are smaller and faster individually, but a restore has to replay every incremental in sequence \u2014 if one link in that chain is corrupt, the restore fails past that point."}, {"id": "f18", "cat": "deployment", "front": "P2V, V2V, and V2C migrations", "back": "P2V converts a physical server into a virtual machine. V2V moves a VM from one hypervisor/platform to another. V2C (or P2C) moves a physical or virtual workload into the cloud.", "detail": "A 'lift and shift' cloud migration is usually a V2C or P2C migration \u2014 moving the workload largely as-is, versus refactoring it to use cloud-native PaaS services instead."}, {"id": "f19", "cat": "deployment", "front": "Thick vs. thin provisioning", "back": "Thick provisioning allocates the full requested storage capacity immediately, whether or not it's used. Thin provisioning allocates storage on demand as data is actually written, letting you over-commit total capacity across multiple volumes.", "detail": "Thin provisioning's risk: if many thin-provisioned volumes are all filled close to their allocated limit at once, the underlying physical storage can run out even though each individual volume still shows free space."}, {"id": "f20", "cat": "deployment", "front": "Infrastructure as Code (IaC)", "back": "Defining infrastructure \u2014 networks, VMs, storage \u2014 as declarative configuration files that can be version-controlled and used to deploy the same environment repeatably, instead of manual configuration.", "detail": "IaC's real value in a cert-exam sense: it makes environments idempotent and auditable \u2014 you can always tell exactly what was deployed by reading the file, and redeploying it produces the same result."}, {"id": "f21", "cat": "deployment", "front": "Continuous integration vs. continuous delivery vs. continuous deployment", "back": "Continuous integration merges code changes and runs automated tests frequently. Continuous delivery goes further, keeping code always in a releasable state after passing tests, but a human still approves the actual release. Continuous deployment removes that manual gate \u2014 every change that passes automated tests ships to production automatically.", "detail": "The one-word difference between 'delivery' and 'deployment' is the whole distinction: delivery is release-ready, deployment is already released."}, {"id": "f22", "cat": "opsSupport", "front": "Automation vs. orchestration", "back": "Automation handles a single, well-defined task without human intervention (e.g., auto-restarting a failed service). Orchestration coordinates multiple automated tasks together into a larger workflow (e.g., provisioning a VM, then configuring it, then registering it with a load balancer, in sequence).", "detail": "Orchestration is built ON TOP OF automation \u2014 you can't orchestrate a workflow out of steps that aren't individually automated first."}, {"id": "f23", "cat": "opsSupport", "front": "Chargeback vs. showback", "back": "Chargeback actually bills internal departments for their share of cloud costs, moving real budget between them. Showback reports each department's usage and cost for visibility and accountability, without an actual internal transfer of funds.", "detail": "Showback is often adopted first, as a lower-friction way to build cost awareness before an organization is ready for the accounting complexity of real chargeback."}, {"id": "f24", "cat": "opsSupport", "front": "SNMP vs. syslog", "back": "SNMP (Simple Network Management Protocol) is used to monitor and manage network devices, polling or receiving traps about their status and metrics. Syslog is a standard for forwarding log messages from a device or application to a centralized logging server.", "detail": "SNMP is generally for structured, device-health metrics (interface status, CPU load); syslog is for free-form event and log messages \u2014 the two are often run side by side, not as alternatives to each other."}, {"id": "f25", "cat": "opsSupport", "front": "Baseline vs. threshold", "back": "A baseline is the normal, expected range of a metric under typical conditions, established by observing it over time. A threshold is a specific value that, when crossed, triggers an alert or action.", "detail": "Thresholds set without first establishing a baseline tend to be either too sensitive (constant false alarms) or too loose (real problems go unnoticed) \u2014 baselining comes first."}, {"id": "f26", "cat": "opsSupport", "front": "SLA components", "back": "A Service Level Agreement typically defines measurable commitments like uptime percentage, response time to incidents, and resolution time \u2014 along with the penalties or credits owed if those commitments aren't met.", "detail": "\"Five nines\" (99.999% uptime) allows only about 5 minutes of downtime a year \u2014 a useful number to recognize on the exam when a scenario states an uptime percentage and asks how much downtime it allows."}, {"id": "f27", "cat": "opsSupport", "front": "Configuration management database (CMDB)", "back": "A centralized repository that tracks an organization's IT assets (configuration items) and the relationships between them \u2014 which servers depend on which services, who owns what, and so on.", "detail": "A CMDB is what lets a change or incident process answer \"what else does this affect?\" instead of relying on institutional memory."}, {"id": "f28", "cat": "opsSupport", "front": "Kubernetes: pod, node, and cluster", "back": "A pod is the smallest deployable unit \u2014 one or more tightly-coupled containers that share networking and storage. A node is a physical or virtual machine that runs pods. A cluster is the full set of nodes managed together, coordinated by a control plane.", "detail": "Scaling in Kubernetes usually means adding more pod replicas (horizontal), not making one pod bigger \u2014 matching the general cloud preference for horizontal over vertical scaling."}, {"id": "f29", "cat": "troubleshooting", "front": "The standard troubleshooting methodology", "back": "1) Identify the problem. 2) Establish a theory of probable cause. 3) Test the theory. 4) Establish a plan of action and implement the solution. 5) Verify full system functionality. 6) Document findings and outcomes.", "detail": "A common exam trap: jumping straight to \"implement a solution\" without first testing the theory \u2014 a plausible-sounding cause that turns out to be wrong wastes a maintenance window and can make things worse."}, {"id": "f30", "cat": "troubleshooting", "front": "\"Noisy neighbor\" problem", "back": "In a multi-tenant environment, one tenant's heavy resource usage (CPU, disk I/O, network) degrades performance for other tenants sharing the same underlying physical hardware.", "detail": "The typical fix is resource governance \u2014 CPU/IO limits, quality-of-service policies, or moving the noisy workload to dedicated hardware \u2014 rather than something the affected tenant can usually fix from their own side."}, {"id": "f31", "cat": "troubleshooting", "front": "Orphaned resources", "back": "Cloud resources \u2014 disks, snapshots, public IPs, load balancers \u2014 left behind after the workload that created them was deleted, but never cleaned up themselves. They keep incurring cost with no one using them.", "detail": "A classic root cause of 'why is our bill higher than expected' when the deployed workload footprint hasn't obviously grown."}, {"id": "f32", "cat": "troubleshooting", "front": "DNS-related connectivity failure", "back": "A failure where the network path and destination service are both healthy, but a hostname simply won't resolve to the correct IP address \u2014 often due to a misconfigured or stale DNS record, or a caching resolver serving an outdated answer.", "detail": "A good diagnostic instinct: if a service is unreachable by name but reachable by its raw IP address, the problem is DNS, not the network path or the service itself."}, {"id": "f33", "cat": "troubleshooting", "front": "Latency vs. bandwidth problems", "back": "Latency is the delay before data begins to transfer (how long a single round trip takes). Bandwidth is the total volume of data that can transfer per unit of time once it's flowing. A connection can have plenty of bandwidth and still feel slow due to high latency.", "detail": "A common trap: adding more bandwidth to a connection does nothing to fix a latency problem \u2014 they're independent characteristics with different causes and different fixes."}, {"id": "f34", "cat": "troubleshooting", "front": "Licensing-related service failure", "back": "A failure where infrastructure and configuration are otherwise correct, but a service stops working (or refuses to scale further) because a software license has expired or a licensed capacity limit (e.g., number of cores or seats) has been reached.", "detail": "Easy to overlook because nothing about the infrastructure itself changed \u2014 the exam likes scenarios where a service 'just stopped working' with no recent configuration change, pointing at licensing or a certificate expiration instead."}, {"id": "f35", "cat": "troubleshooting", "front": "Root cause analysis vs. a workaround", "back": "A workaround restores service quickly without necessarily fixing the underlying issue (e.g., restarting a hung service). Root cause analysis identifies and addresses the actual reason the problem happened, to prevent recurrence.", "detail": "Applying a workaround isn't a mistake under time pressure \u2014 the mistake is stopping there and never following up with root cause analysis, so the same incident quietly repeats."}, {"id": "f36", "cat": "archDesign", "front": "IaaS vs. PaaS vs. SaaS", "back": "IaaS (Infrastructure as a Service) provides raw compute, storage, and networking \u2014 the customer manages the OS upward. PaaS (Platform as a Service) adds a managed runtime/OS layer so the customer just deploys code. SaaS (Software as a Service) delivers a complete, ready-to-use application, with the provider managing everything underneath.", "detail": "The customer's management responsibility shrinks as you move IaaS -> PaaS -> SaaS: with IaaS you patch the OS yourself, with SaaS you manage nothing but your own data and user accounts."}, {"id": "f37", "cat": "archDesign", "front": "Containers vs. virtual machines", "back": "A virtual machine virtualizes
