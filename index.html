and healthy day to day.", "diagram": null, "vocabIds": ["f37", "f38", "f39", "f40", "f41", "f42", "f43", "f44", "f45", "f46", "f47", "f48"], "quizIds": ["q27", "q28", "q33", "q29", "q31", "msq17"], "reading": "Managing an Azure environment day to day means keeping an eye on cost, compliance, and health. Azure Policy enforces configuration rules, like requiring a specific region, and can even block a deployment outright if it doesn't comply. Resource locks add a separate layer of protection on individual resources, preventing accidental deletion or changes regardless of a user's normal permissions.\n\nFor cost, the Pricing calculator estimates what planned resources will cost, while the Total Cost of Ownership calculator compares an entire on-premises setup against running it in Azure. Tags make it possible to break spending down by department or project in Cost Management. Azure Advisor rounds this out with free, personalized recommendations across cost, security, reliability, and performance.\n\nFor health, Azure Monitor tracks your own resources \u2014 metrics, logs, and alerts \u2014 while Azure Service Health specifically reports on the health of the Azure platform itself, like a regional outage that isn't your fault at all.\n\nYou can manage all of this through the Azure portal, Cloud Shell (a browser-based command line with nothing to install), or Azure CLI/PowerShell installed locally for scripting \u2014 four ways to reach the same resources. Defining that configuration as Infrastructure as Code, using an ARM template, makes deployments repeatable and version-controlled instead of a one-off set of manual clicks. Two more services round out day-to-day governance: Microsoft Purview discovers and classifies sensitive data across your environment (including non-Azure sources), and Azure Arc extends familiar tools like Policy and RBAC to servers running outside Azure entirely.", "fundamentalsLabel": "New to ongoing cloud operations? See the everyday analogy", "fundamentals": "This is the operational side of running any environment, cloud or not. Tags are like labeling supply closets by department so accounting knows who to bill. Azure Advisor is like a building inspector who walks through and flags things worth fixing, even though nothing's actively broken yet. And the Service Health versus Monitor distinction is the same as knowing whether the power went out because of your building's own wiring, or because the whole city grid went down \u2014 one you can fix yourself, the other you just have to wait out.", "keyTerms": ["Azure Policy", "Resource locks", "Pricing calculator", "Total Cost of Ownership calculator", "Tags", "Cost Management", "Azure Advisor", "Azure Monitor", "Azure Service Health"], "commonTraps": ["A Delete lock blocks deletion only \u2014 a Read-only lock is the one that also blocks modification.", "Azure Service Health means Azure itself is having a problem. Azure Monitor means your own resources are.", "Azure Advisor is free \u2014 it's not a paid add-on."], "scenario": "A finance team notices unexpected spend in one department's subscription. Because every resource there was tagged with a CostCenter value at creation, Cost Management can break the bill down by tag and pinpoint exactly which team is responsible \u2014 while Azure Advisor separately flags a handful of unused disks in that same subscription quietly adding to the bill."}]}, "az104": {"categories": [{"key": "identityGov", "label": "Identity & Governance", "marks": 24}, {"key": "storage", "label": "Storage", "marks": 19}, {"key": "compute", "label": "Compute", "marks": 24}, {"key": "networking", "label": "Networking", "marks": 19}, {"key": "monitoring", "label": "Monitor & Maintain", "marks": 14}], "flashcards": [{"id": "f1", "cat": "identityGov", "front": "Entra ID users and groups", "back": "Creating and managing users, security groups, and Microsoft 365 groups. Dynamic group membership rules automatically add or remove members based on user or device attributes.", "detail": "A dynamic group for every user whose department is \"Sales\" updates itself automatically as people move in and out."}, {"id": "f2", "cat": "identityGov", "front": "Group-based licensing", "back": "Assigning a license to a group instead of individual users, so every current and future member automatically receives (or loses) that license.", "detail": "This is why new employees added to an \"All Staff\" group can get licensed automatically without a manual step."}, {"id": "f3", "cat": "identityGov", "front": "External users (B2B)", "back": "Inviting people from outside your organization as guests, who authenticate with their own existing identity rather than a new account you create for them.", "detail": "External collaboration settings control who can invite guests and what guests can see once invited."}, {"id": "f4", "cat": "identityGov", "front": "Self-service password reset (SSPR)", "back": "Lets users reset their own forgotten password without contacting the help desk, after registering authentication methods like a phone number or authenticator app.", "detail": "This is the direct answer whenever a scenario is about reducing help desk password-reset tickets."}, {"id": "f5", "cat": "identityGov", "front": "RBAC scope and inheritance", "back": "A role is assigned to a security principal at a scope \u2014 management group, subscription, resource group, or resource. Assignments are additive, and the most permissive applicable assignment wins.", "detail": "If someone has Reader at the subscription and Contributor at one resource group, they have Contributor there and Reader everywhere else in that subscription."}, {"id": "f6", "cat": "identityGov", "front": "Owner vs. Contributor vs. Reader vs. User Access Administrator", "back": "Owner: full access, plus can assign roles to others. Contributor: full access to manage resources, but cannot assign roles. Reader: view-only. User Access Administrator: manage others' access without managing the resources themselves.", "detail": "The Owner-vs-Contributor distinction (can they grant access to others?) is one of the most commonly tested RBAC facts."}, {"id": "f7", "cat": "identityGov", "front": "Policy vs. initiative", "back": "A policy is a single rule, like requiring a specific region. An initiative groups multiple related policies together so they can be assigned as one bundle, useful for compliance standards.", "detail": "Think of an initiative as a policy 'playlist' \u2014 several individual rules assigned together."}, {"id": "f8", "cat": "identityGov", "front": "Governance recap at admin depth", "back": "As an administrator you directly create and move resources between resource groups, and troubleshoot conflicts between inherited policy and RBAC assignments from higher scopes.", "detail": "AZ-104 expects you to reason about real conflicts, not just define the terms the way AZ-900 does."}, {"id": "f9", "cat": "identityGov", "front": "Cost Management and budgets", "back": "Set spending budgets with alert thresholds, and use Cost Analysis to break down spend by resource, tag, or service over time.", "detail": "A budget alert doesn't stop spending by itself \u2014 it just notifies; stopping spend requires a separate automated action."}, {"id": "f10", "cat": "storage", "front": "Storage account types and performance tiers", "back": "General-purpose v2 is the standard account type for most scenarios. Performance tiers are Standard (HDD-backed, cost-effective) and Premium (SSD-backed, for high-throughput, low-latency needs like disks).", "detail": "Premium is the answer whenever a scenario stresses low latency or high transaction rates."}, {"id": "f11", "cat": "storage", "front": "Access keys vs. Shared Access Signature (SAS)", "back": "Access keys grant full, unrestricted access to the entire storage account. A SAS grants limited, time-boxed, scoped access to specific resources or operations, without exposing the account key.", "detail": "Whenever a scenario wants to share limited, temporary access with a third party, the answer is SAS, not an access key."}, {"id": "f12", "cat": "storage", "front": "Storage firewalls and network rules", "back": "Restrict a storage account to specific virtual networks or IP address ranges, or allow trusted Microsoft services to bypass the firewall.", "detail": "This is a network-level control, separate from identity-based access like RBAC or a SAS token."}, {"id": "f13", "cat": "storage", "front": "Blob lifecycle management", "back": "Rules that automatically transition blobs between access tiers, like Hot to Cool to Archive, or delete them after a set number of days, based on last-modified or last-accessed time.", "detail": "This is the automation answer whenever a scenario wants aging data to move to cheaper storage without manual intervention."}, {"id": "f14", "cat": "storage", "front": "Blob versioning vs. soft delete vs. snapshots", "back": "Versioning automatically keeps prior versions when a blob is overwritten. Soft delete lets you recover a deleted blob within a retention window. A snapshot is a manual, read-only copy taken at a specific point in time.", "detail": "Recovering an accidentally overwritten blob's prior content specifically calls for versioning, not soft delete."}, {"id": "f15", "cat": "storage", "front": "Azure Files vs. Blob storage", "back": "Azure Files provides SMB or NFS file shares that can be mounted like a network drive. Blob storage holds unstructured object data accessed through REST or an SDK, not mounted as a drive.", "detail": "If a scenario needs multiple VMs to mount and share the same drive, that's Azure Files, not Blob storage."}, {"id": "f16", "cat": "storage", "front": "Redundancy at admin depth: RA-GRS", "back": "GRS replicates to a secondary region, but that data isn't readable during normal operation. RA-GRS (and RA-GZRS) additionally allow read access to the secondary region even before a failover.", "detail": "If a scenario needs to actually read from the secondary region during normal operation, plain GRS isn't enough \u2014 it needs the read-access variant."}, {"id": "f17", "cat": "storage", "front": "Static website hosting", "back": "A storage account can serve static website content, like HTML/CSS/JS, directly from Blob storage using a special $web container, without a separate web server.", "detail": "This is the low-cost, serverless answer for hosting a purely static site."}, {"id": "f18", "cat": "storage", "front": "Migration and transfer tools recap", "back": "AzCopy, Azure Storage Explorer, and Azure Migrate/Data Box, first introduced at the AZ-900 level, remain the core tools an administrator configures and runs for moving data into storage accounts.", "detail": "AZ-104 expects you to actually configure and troubleshoot these tools, not just recognize their names."}, {"id": "f19", "cat": "compute", "front": "VM sizing and series", "back": "VM size determines CPU, memory, and disk throughput. Series (like B, D, F) are optimized for different workloads: B for burstable/low-cost, D for general purpose, F for compute-optimized.", "detail": "A burstable B-series VM is cheap but throttles sustained high CPU use \u2014 the wrong choice for a constantly busy server."}, {"id": "f20", "cat": "compute", "front": "Managed disks and disk types", "back": "Managed disks are Azure-managed storage for a VM's OS or data, offered as Standard HDD, Standard SSD, Premium SSD, and Ultra Disk, from lowest to highest performance.", "detail": "Ultra Disk allows configuring throughput and IOPS independently of disk size, for the most demanding workloads."}, {"id": "f21", "cat": "compute", "front": "Availability sets vs. zones vs. Scale Sets", "back": "Availability set: distributes VMs across fault and update domains within one datacenter. Availability zone: spreads VMs across physically separate datacenters in a region. Scale Set: automatically adds or removes VM instances based on demand.", "detail": "Only availability zones protect against a whole-datacenter failure \u2014 availability sets only spread risk within one."}, {"id": "f22", "cat": "compute", "front": "VM extensions and Custom Script Extension", "back": "Small agents installed on a VM to perform post-deployment configuration tasks, like the Custom Script Extension automatically running a script right after provisioning.", "detail": "This is the answer whenever a scenario wants configuration to happen automatically without manually logging into the VM."}, {"id": "f23", "cat": "compute", "front": "App Service plans and scaling", "back": "An App Service plan defines the compute tier and region for one or more web apps. Scaling up changes the plan's tier or size; scaling out adds more instances of the same tier.", "detail": "Scale up = bigger box. Scale out = more boxes. Both are configured on the App Service plan, not the individual app."}, {"id": "f24", "cat": "compute", "front": "Deployment slots", "back": "Separate, swappable environments, like staging, for an App Service app, letting you validate a new version before swapping it into production with minimal downtime.", "detail": "A swap exchanges the URLs/configuration between slots almost instantly, rather than redeploying code."}, {"id": "f25", "cat": "compute", "front": "Container Instances vs. Container Apps vs. AKS", "back": "Container Instances run a single container quickly with no orchestration. Container Apps add serverless scaling and microservices features without managing a cluster. AKS gives full Kubernetes control.", "detail": "As of the 2026 exam update, Container Apps sits alongside Container Instances as tested content, not just AKS."}, {"id": "f26", "cat": "compute", "front": "ARM templates vs. Bicep", "back": "ARM templates are Azure's native JSON Infrastructure as Code format. Bicep is a newer, more concise language that compiles down to ARM JSON \u2014 functionally equivalent, but easier to read and write.", "detail": "The 2026 exam update put more emphasis on Bicep over raw ARM JSON, reflecting real-world administrator practice."}, {"id": "f27", "cat": "compute", "front": "Resizing and moving VMs", "back": "Resizing a running VM to a size unavailable on its current hardware cluster typically requires deallocating (stopping) the VM first, then resizing.", "detail": "This trips people up because 'stopped' in the portal isn't the same as 'deallocated' \u2014 only deallocated VMs release their hardware allocation."}, {"id": "f28", "cat": "networking", "front": "VNets and subnets at admin depth", "back": "As an administrator you create and size VNets and subnets, considering IP address space (CIDR) and the fact that Azure reserves 5 addresses in every subnet regardless of its size.", "detail": "That reserved-address detail is a specific number the exam likes to test directly."}, {"id": "f29", "cat": "networking", "front": "Network Security Groups (NSGs)", "back": "Filter inbound and outbound traffic to subnets or network interfaces using security rules with a priority, source, destination, port, and protocol. Lower priority number wins and is evaluated first.", "detail": "A lower-numbered rule that allows traffic can still be overridden by an even-lower-numbered rule that denies it."}, {"id": "f30", "cat": "networking", "front": "VNet peering", "back": "Connects two VNets directly, even across regions, with traffic staying on the Microsoft backbone. Peering is not transitive \u2014 peered VNets don't automatically reach each other's other peers.", "detail": "If A is peered to B, and B is peered to C, A and C still cannot talk to each other without their own direct peering."}, {"id": "f31", "cat": "networking", "front": "Load Balancer vs. Application Gateway", "back": "Azure Load Balancer works at layer 4 (TCP/UDP), distributing traffic by IP and port only. Application Gateway works at layer 7 (HTTP/HTTPS), and can route by URL path and terminate SSL centrally.", "detail": "If a scenario needs to route by URL path, like /images vs /api, that's Application Gateway, not Load Balancer."}, {"id": "f32", "cat": "networking", "front": "Public vs. internal Load Balancer", "back": "A public Load Balancer distributes internet traffic to backend resources. An internal (private) Load Balancer only distributes traffic within a VNet, never from the public internet.", "detail": "An internal Load Balancer is the answer when a scenario needs load balancing purely between internal tiers, like web servers talking to app servers."}, {"id": "f33", "cat": "networking", "front": "Azure DNS and private DNS zones", "back": "Azure DNS hosts public DNS zones, resolvable from the internet. Private DNS zones provide name resolution within one or more VNets, without exposing those records publicly.", "detail": "Private DNS zones are the answer whenever internal name resolution shouldn't be visible outside the VNet."}, {"id": "f34", "cat": "networking", "front": "Network Watcher", "back": "A suite of tools for monitoring and diagnosing network issues in Azure, including packet capture, IP flow verify (is a rule blocking traffic?), and connection troubleshoot.", "detail": "IP flow verify specifically tells you whether an NSG rule is allowing or denying a particular flow of traffic."}, {"id": "f35", "cat": "networking", "front": "Azure Bastion", "back": "Provides secure RDP or SSH access to VMs directly through the Azure portal, without exposing the VM's public IP or needing a separate VPN connection.", "detail": "This is the answer whenever a scenario wants secure remote access to a VM without giving that VM a public IP."}, {"id": "f36", "cat": "networking", "front": "VPN Gateway vs. ExpressRoute, admin depth", "back": "VPN Gateway is encrypted and travels over the public internet. ExpressRoute is private but not encrypted by default. Administrators configure gateway SKUs and connection types, like site-to-site or point-to-site.", "detail": "Point-to-site connects an individual device to a VNet; site-to-site connects two whole networks together."}, {"id": "f37", "cat": "monitoring", "front": "Azure Monitor metrics vs. logs", "back": "Metrics are lightweight numerical time-series data, like CPU percentage. Logs are detailed, queryable event and record data stored in a Log Analytics workspace.", "detail": "Metrics answer 'how much' over time. Logs answer 'exactly what happened' with detail you can query."}, {"id": "f38", "cat": "monitoring", "front": "Alerts and action groups", "back": "An alert rule triggers when a metric or log condition is met. An action group defines what happens next, like sending an email, an SMS, or running an Azure Function.", "detail": "The alert rule is the trigger condition; the action group is the response \u2014 they're configured separately and linked together."}, {"id": "f39", "cat": "monitoring", "front": "Recovery Services vault and backup policies", "back": "A Recovery Services vault stores backup data and manages backup policies, which define how often backups run and how long they're retained.", "detail": "One vault can hold backup policies for multiple resource types, like VMs and file shares."}, {"id": "f40", "cat": "monitoring", "front": "Azure Site Recovery", "back": "Replicates VMs to a secondary region for disaster recovery, enabling a failover of an entire workload if the primary region becomes unavailable.", "detail": "Backup restores a point-in-time copy. Site Recovery fails over a running workload to keep it operating elsewhere."}, {"id": "f41", "cat": "monitoring", "front": "Log Analytics workspace and KQL", "back": "A Log Analytics workspace collects log data from multiple resources. Kusto Query Language (KQL) is used to query that data for troubleshooting and reporting.", "detail": "KQL is the specific query language name the exam expects you to recognize, even without writing complex queries yourself."}, {"id": "f42", "cat": "monitoring", "front": "Backup vs. Site Recovery, when to use each", "back": "Backup protects against data loss, restoring a VM or file to a point in time. Site Recovery protects against a broader outage, failing over a whole workload to a secondary region.", "detail": "A corrupted disk calls for Backup. A whole region going dark calls for Site Recovery."}, {"id": "f43", "cat": "identityGov", "front": "Resource locks (CanNotDelete vs. ReadOnly)", "back": "A CanNotDelete lock blocks deletion while still allowing reads and configuration changes. A ReadOnly lock blocks both deletion and any modification, treating authorized users like they only have Reader access.", "detail": "Locks apply regardless of RBAC role \u2014 even an Owner cannot delete a CanNotDelete-locked resource until the lock is removed."}, {"id": "f44", "cat": "identityGov", "front": "Microsoft Entra roles vs. Azure RBAC roles", "back": "Microsoft Entra roles (like Global Administrator) control the identity plane \u2014 users, groups, licenses, tenant settings. Azure RBAC roles (like Owner) control the resource plane \u2014 VMs, storage, networking. A Global Administrator has no Azure resource access by default.", "detail": "The 'elevate access' setting in Microsoft Entra ID properties is what grants a Global Administrator the Azure RBAC User Access Administrator role at the root scope, if tenant-wide resource access is needed."}, {"id": "f45", "cat": "storage", "front": "Storage data-plane RBAC roles", "back": "Roles like Storage Blob Data Contributor, Reader, and Owner grant a user or managed identity direct access to blob data via Microsoft Entra ID authentication, without ever using an account key or a SAS token.", "detail": "This is distinct from the control-plane Contributor role, which manages the storage account itself but does not automatically grant data access once key-based access is restricted."}, {"id": "f46", "cat": "storage", "front": "Immutable blob storage (WORM policies)", "back": "Time-based retention and legal hold policies make blobs write-once-read-many: they cannot be modified or deleted by anyone, including the storage account Owner, until the retention period expires or the legal hold is removed.", "detail": "This is the compliance answer whenever a scenario needs to prove data was never altered, not just backed up."}, {"id": "f47", "cat": "compute", "front": "Premium SSD v2", "back": "A managed disk tier that, like Ultra Disk, lets you configure capacity, IOPS, and throughput independently \u2014 but with broader region/VM availability and typically lower cost than Ultra Disk.", "detail": "Standard SSD and the original Premium SSD scale performance only as a side effect of the size tier chosen; v2 and Ultra Disk break that link."}, {"id": "f48", "cat": "compute", "front": "Azure Spot Virtual Machines", "back": "VMs that run on Azure's unused capacity at a steep discount, but can be evicted with little warning when that capacity is needed elsewhere.", "detail": "The right fit for interruptible workloads like batch processing or dev/test \u2014 never for anything requiring guaranteed uptime."}, {"id": "f49", "cat": "networking", "front": "Application Security Groups (ASGs)", "back": "Group VM network interfaces by application role, like \"WebTier,\" so an NSG rule can reference the group as a source or destination instead of hardcoded IP addresses that change over time.", "detail": "This is the answer whenever a scenario wants an NSG rule to keep working automatically as VMs in a role are added or removed."}, {"id": "f50", "cat": "monitoring", "front": "Azure Monitor Agent (AMA)", "back": "The current, supported agent for collecting metrics and logs from VMs into Azure Monitor, configured through data collection rules. It replaced the legacy Log Analytics agent (MMA/OMS), retired in August 2024.", "detail": "Any scenario describing a new deployment should use AMA \u2014 the old agent should be recognized as outdated, not chosen."}, {"id": "f51", "cat": "monitoring", "front": "Azure Update Manager", "back": "A unified service for assessing OS patch compliance and scheduling recurring update installation windows across Windows and Linux VMs, including on-premises and multi-cloud machines connected via Arc.", "detail": "This replaced the older, separate Update Management solution built on Log Analytics and Automation."}], "questions": [{"id": "q1", "cat": "identityGov", "type": "mc", "question": "An administrator wants a group's membership to automatically include every user whose department attribute is 'Sales,' without manually adding people.", "options": ["A dynamic group with a membership rule based on the department attribute", "A security group with manual membership", "A Microsoft 365 group with no rules", "A resource group scoped to Sales"], "correct": 0, "explanation": "Dynamic groups automatically add or remove members based on rules matching attributes like department."}, {"id": "q2", "cat": "identityGov", "type": "mc", "question": "A company wants new employees to automatically receive a Microsoft 365 E3 license the moment they're added to the 'All Employees' group.", "options": ["A dynamic group with no license attached", "Group-based licensing", "Self-service password reset", "An RBAC role assignment"], "correct": 1, "explanation": "Group-based licensing assigns a license to a group so every member automatically receives it."}, {"id": "q3", "cat": "identityGov", "type": "mc", "question": "A contractor from a partner company needs temporary access to one SharePoint site, without your organization creating them a full internal account.", "options": ["Create them a standard internal user account", "Invite them as a B2B external/guest user", "Assign them the Owner role at the subscription", "Add them to a dynamic group"], "correct": 1, "explanation": "External/guest users authenticate with their own existing identity rather than needing a new internal account."}, {"id": "q4", "cat": "identityGov", "type": "mc", "question": "A user forgot their password at 2am and needs to get back into their account without contacting the help desk.", "options": ["A dynamic group", "Self-service password reset (SSPR)", "Conditional Access", "An RBAC role assignment"], "correct": 1, "explanation": "SSPR lets users reset their own password using pre-registered authentication methods, no help desk required."}, {"id": "q5", "cat": "identityGov", "type": "mc", "question": "A user is assigned Contributor at the subscription level and Owner at one specific resource group within it. What's their effective permission in that resource group?", "options": ["Contributor", "Access is denied due to a role conflict", "Reader", "Owner"], "correct": 3, "explanation": "RBAC assignments are additive across scopes, and the more permissive assignment applies \u2014 Owner at that resource group wins there."}, {"id": "q6", "cat": "identityGov", "type": "mc", "question": "Which built-in role lets someone manage who has access to resources, without letting them manage the resources themselves?", "options": ["Owner", "Contributor", "User Access Administrator", "Reader"], "correct": 2, "explanation": "User Access Administrator is specifically scoped to managing access, not the resources themselves."}, {"id": "q7", "cat": "identityGov", "type": "mc", "question": "A company wants to enforce a tagging standard requiring both a CostCenter tag and an Environment tag, assigned together as a single bundle.", "options": ["An RBAC custom role", "A single Azure Policy definition", "An Azure Policy initiative", "A management group with no policies"], "correct": 2, "explanation": "An initiative groups multiple related policy definitions so they can be assigned together as one bundle."}, {"id": "q8", "cat": "identityGov", "type": "mc", "question": "An administrator assigns Reader at a management group and Contributor at a specific subscription beneath it. What's the effective access in that subscription?", "options": ["Owner", "Contributor", "Reader", "No access"], "correct": 1, "explanation": "The more specific, more permissive assignment at the subscription level applies there, on top of the inherited Reader."}, {"id": "q9", "cat": "storage", "type": "mc", "question": "A company needs to grant a third-party app 24-hour, read-only access to a single blob container, without sharing the storage account key.", "options": ["A Conditional Access policy", "The storage account access key", "A Shared Access Signature (SAS)", "A Read-only resource lock"], "correct": 2, "explanation": "A SAS grants limited, time-boxed, scoped access without exposing the account's full access key."}, {"id": "q10", "cat": "storage", "type": "mc", "question": "A storage account should automatically move blobs to Cool tier after 30 days of no access, then delete them after 365 days.", "options": ["A SAS token", "A lifecycle management policy", "A resource lock", "Blob versioning"], "correct": 1, "explanation": "Lifecycle management policies automate tier transitions and deletion based on rules like age or last access."}, {"id": "q11", "cat": "storage", "type": "mc", "question": "A team accidentally overwrote a blob and needs to recover its previous content, without having taken a manual backup beforehand.", "options": ["Blob versioning, if it was enabled", "Static website hosting", "A storage account access key", "A resource lock"], "correct": 0, "explanation": "Versioning automatically retains prior versions of a blob on overwrite, letting you recover earlier content."}, {"id": "q12", "cat": "storage", "type": "mc", "question": "Which storage redundancy option allows an application to directly read from the secondary region during normal operation, not just after a failover?", "options": ["LRS", "ZRS", "Plain GRS", "RA-GRS (Read-Access Geo-Redundant Storage)"], "correct": 3, "explanation": "Plain GRS replicates to a secondary region but doesn't allow reads there until failover \u2014 RA-GRS specifically adds read access to the secondary."}, {"id": "q13", "cat": "storage", "type": "mc", "question": "A team wants to mount a shared drive from Azure that multiple VMs can read and write to simultaneously over SMB.", "options": ["Queue storage", "Table storage", "Azure Files", "Blob storage"], "correct": 2, "explanation": "Azure Files provides SMB/NFS file shares that can be mounted like a network drive across multiple machines."}, {"id": "q14", "cat": "storage", "type": "mc", "question": "A storage account should reject all traffic except from two specific corporate office IP ranges and one specific VNet.", "options": ["A resource lock", "Blob lifecycle management", "A SAS token alone", "A storage account firewall / network rule configuration"], "correct": 3, "explanation": "Storage account firewall and network rules restrict access to specific networks or IP ranges at the network level."}, {"id": "q15", "cat": "compute", "type": "mc", "question": "An administrator wants to change a running VM's managed disk from Standard HDD to Premium SSD to improve performance. What has to happen first?", "options": ["The VM must be deallocated before the disk tier can be changed", "Nothing \u2014 the tier can be changed while the VM keeps running", "The disk must be deleted and recreated from a snapshot", "The VM must be moved to a different region"], "correct": 0, "explanation": "Changing a managed disk's performance tier requires the VM to be stopped (deallocated) first \u2014 it isn't a live, no-downtime operation. Deleting and recreating the disk, or moving regions, are unnecessary and far more disruptive than the actual requirement."}, {"id": "q16", "cat": "compute", "type": "mc", "question": "A company wants a group of identical VMs that automatically add or remove instances based on CPU load.", "options": ["An availability set", "Azure Virtual Desktop", "A single large VM", "A VM Scale Set"], "correct": 3, "explanation": "VM Scale Sets automatically adjust instance count based on demand or a schedule."}, {"id": "q17", "cat": "compute", "type": "mc", "question": "An administrator needs to run a one-time configuration script on a VM immediately after it's provisioned, without manually logging in.", "options": ["A managed disk", "The Custom Script Extension", "An App Service plan", "An availability set"], "correct": 1, "explanation": "VM extensions like the Custom Script Extension run configuration tasks automatically right after deployment."}, {"id": "q18", "cat": "compute", "type": "mc", "question": "A team wants to test a new version of a web app in production-like conditions before it goes live, then switch traffic to it with minimal downtime.", "options": ["Deployment slots", "A VM Scale Set", "A new App Service plan for every version", "A resource lock"], "correct": 0, "explanation": "Deployment slots provide a separate environment to validate a new version before swapping it into production."}, {"id": "q19", "cat": "compute", "type": "mc", "question": "Which compute option requires the least management overhead for running a single container with no orchestration needs?", "options": ["Azure Kubernetes Service (AKS)", "Azure Container Instances", "A virtual machine running Docker manually", "A VM Scale Set"], "correct": 1, "explanation": "Container Instances run a single container quickly with no cluster or orchestration to manage."}, {"id": "q20", "cat": "compute", "type": "mc", "question": "A company wants microservices-style container scaling with built-in HTTP-based autoscaling, without managing a Kubernetes cluster directly.", "options": ["Azure Container Apps", "An App Service plan alone", "Azure Container Instances", "Azure Kubernetes Service (AKS)"], "correct": 0, "explanation": "Container Apps adds serverless scaling and microservices features on top of containers, without exposing the underlying cluster."}, {"id": "q21", "cat": "compute", "type": "mc", "question": "An administrator wants to redeploy the exact same infrastructure to three environments, using a more concise, readable syntax than raw ARM JSON.", "options": ["Bicep", "The Azure portal, repeated manually", "A PowerShell script with no template", "A resource lock"], "correct": 0, "explanation": "Bicep compiles down to ARM JSON but is written in a more concise, readable syntax."}, {"id": "q22", "cat": "compute", "type": "mc", "question": "An administrator tries to resize a running VM to a size unavailable on its current hardware cluster. What's the most likely required step?", "options": ["Move the VM to a different subscription", "Deallocate (stop) the VM first, then resize", "Nothing, resizing always works while running", "Delete and recreate the VM from scratch"], "correct": 1, "explanation": "A VM may need to be deallocated before resizing if the target size isn't available on its current hardware cluster."}, {"id": "q23", "cat": "compute", "type": "mc", "question": "Which disk tier offers the highest, most consistent IOPS and throughput, configurable independently of the disk's size?", "options": ["Standard SSD", "Standard HDD", "Ultra Disk", "Cool tier storage"], "correct": 2, "explanation": "Ultra Disk allows configuring performance (IOPS and throughput) independently of the disk size, for the most demanding workloads."}, {"id": "q24", "cat": "networking", "type": "mc", "question": "Two NSG rules apply to the same NIC: one at priority 100 allowing inbound port 443, another at priority 200 denying all inbound traffic. What happens to inbound HTTPS traffic?", "options": ["Both rules apply, and the NIC merges them into a partial allow", "It's denied, since a Deny rule always overrides an Allow rule regardless of priority", "It's allowed, since the lower priority number is processed first", "It's denied, since the highest priority number processed last always wins"], "correct": 2, "explanation": "Lower priority numbers are evaluated first and win \u2014 priority 100 (allow) is processed before priority 200 (deny), so the traffic is allowed. Deny doesn't have some inherent precedence over Allow, and NSG rules aren't merged or blended \u2014 whichever rule is evaluated first, by priority number, decides the outcome outright."}, {"id": "q25", "cat": "networking", "type": "mc", "question": "Two VNets are peered, and one of those VNets is also peered to a third VNet. Can the first and third VNets communicate directly?", "options": ["Only if they're in the same region", "No, VNet peering is not transitive", "Only if a VPN Gateway is also configured", "Yes, peering always extends transitively"], "correct": 1, "explanation": "Peering is not transitive \u2014 the first and third VNets would need their own direct peering to communicate."}, {"id": "q26", "cat": "networking", "type": "mc", "question": "A company needs to distribute HTTPS traffic based on URL path (/images to one backend, /api to another) and terminate SSL centrally.", "options": ["VNet peering", "Azure Load Balancer", "Network Watcher", "Application Gateway"], "correct": 3, "explanation": "Application Gateway operates at layer 7 and can route by URL path while terminating SSL centrally \u2014 Load Balancer cannot."}, {"id": "q27", "cat": "networking", "type": "mc", "question": "A company needs to load-balance raw TCP traffic to backend VMs based on IP and port only, with no awareness of HTTP content.", "options": ["Azure Load Balancer", "Azure DNS", "Application Gateway", "Azure Bastion"], "correct": 0, "explanation": "Load Balancer works at layer 4, distributing TCP/UDP traffic by IP and port with no content awareness."}, {"id": "q28", "cat": "networking", "type": "mc", "question": "An application inside a VNet needs to resolve a custom domain name to an internal resource, without that name being resolvable from the public internet.", "options": ["Azure public DNS", "A public Load Balancer", "Azure Bastion", "An Azure private DNS zone"], "correct": 3, "explanation": "Private DNS zones provide name resolution within a VNet without exposing those records publicly."}, {"id": "q29", "cat": "networking", "type": "mc", "question": "An administrator needs to securely RDP into a VM from the portal without exposing a public IP on that VM or setting up a VPN.", "options": ["A public Load Balancer", "VPN Gateway", "ExpressRoute", "Azure Bastion"], "correct": 3, "explanation": "Azure Bastion provides secure RDP/SSH through the portal without a public IP on the VM or a separate VPN."}, {"id": "q30", "cat": "networking", "type": "mc", "question": "A connectivity issue between two VMs needs diagnosing \u2014 specifically, whether an NSG rule is blocking the traffic path.", "options": ["A resource lock", "Network Watcher's IP flow verify", "Azure Policy", "Azure Advisor"], "correct": 1, "explanation": "Network Watcher's IP flow verify tool specifically checks whether an NSG rule allows or denies a given traffic flow."}, {"id": "q31", "cat": "networking", "type": "mc", "question": "How many IP addresses does Azure reserve in every subnet, regardless of its size?", "options": ["2", "0", "5", "10"], "correct": 2, "explanation": "Azure reserves 5 addresses in every subnet for internal use, regardless of the subnet's overall size."}, {"id": "q32", "cat": "networking", "type": "mc", "question": "A company wants load balancing purely between internal application tiers, with no exposure to the public internet at all.", "options": ["Application Gateway with a public IP", "Azure Front Door", "A public Load Balancer", "An internal (private) Load Balancer"], "correct": 3, "explanation": "An internal Load Balancer only distributes traffic within a VNet, never from the public internet."}, {"id": "q33", "cat": "monitoring", "type": "mc", "question": "An administrator wants to be notified by email and automatically trigger a runbook when a VM's CPU exceeds 90% for 10 minutes.", "options": ["Network Watcher", "An alert rule paired with an action group", "Azure Advisor alone", "A resource lock"], "correct": 1, "explanation": "The alert rule defines the trigger condition; the action group defines the response, like sending an email or running automation."}, {"id": "q34", "cat": "monitoring", "type": "mc", "question": "Which Azure Monitor data type would you query with KQL to investigate a detailed sequence of application errors over the last week?", "options": ["Logs, via Log Analytics", "Metrics", "Azure Service Health", "Azure Advisor recommendations"], "correct": 0, "explanation": "Logs hold detailed, queryable event data; metrics are lightweight numerical time-series data, not detailed event sequences."}, {"id": "q35", "cat": "monitoring", "type": "mc", "question": "A company wants to be able to fail over an entire application's VMs to a secondary region if the primary region goes down entirely.", "options": ["A resource lock", "Azure Advisor", "Azure Backup alone", "Azure Site Recovery"], "correct": 3, "explanation": "Site Recovery replicates and fails over whole workloads to a secondary region, unlike Backup, which restores point-in-time copies."}, {"id": "q36", "cat": "monitoring", "type": "mc", "question": "A VM's disk was corrupted by a bad update yesterday. Which service would restore it to a point before the update?", "options": ["Azure Advisor", "Network Watcher", "Azure Backup, via a Recovery Services vault", "Azure Site Recovery"], "correct": 2, "explanation": "Backup restores a resource to an earlier point-in-time state \u2014 Site Recovery is for regional failover, not point-in-time restores."}, {"id": "tf1", "cat": "identityGov", "type": "tf", "question": "RBAC role assignments are inherited from a higher scope down to lower scopes.", "answer": true, "explanation": "A role assigned at, say, a subscription applies to every resource group and resource beneath it, unless a more specific assignment changes things."}, {"id": "tf2", "cat": "identityGov", "type": "tf", "question": "A user can have RBAC permissions assigned directly at a single resource, even with no role assigned at the subscription level.", "answer": true, "explanation": "RBAC can be assigned at any scope independently \u2014 a resource-level assignment doesn't require a subscription-level one first."}, {"id": "tf3", "cat": "identityGov", "type": "tf", "question": "An Azure Policy initiative is just a single, standalone policy definition.", "answer": false, "explanation": "An initiative is a group of related policy definitions assigned together, not a single standalone policy."}, {"id": "tf4", "cat": "storage", "type": "tf", "question": "Read-access geo-redundant storage (RA-GRS) allows reading data from the secondary region even when the primary is fully available.", "answer": true, "explanation": "That's exactly what distinguishes RA-GRS from plain GRS, which only makes the secondary readable after a failover."}, {"id": "tf5", "cat": "storage", "type": "tf", "question": "Soft delete alone guarantees recovery of a blob's exact content after it has been overwritten by a new upload.", "answer": false, "explanation": "Soft delete protects against deletion. Recovering prior content after an overwrite specifically requires blob versioning."}, {"id": "tf6", "cat": "storage", "type": "tf", "question": "A Shared Access Signature (SAS) can grant access without ever sharing the storage account's access keys.", "answer": true, "explanation": "A SAS is a separate, scoped, time-limited credential that doesn't expose the underlying account key."}, {"id": "tf7", "cat": "compute", "type": "tf", "question": "An Azure VM Scale Set can only scale based on a fixed schedule, not real-time metrics like CPU.", "answer": false, "explanation": "Scale Sets can autoscale based on both real-time metrics, like CPU, and fixed schedules."}, {"id": "tf8", "cat": "compute", "type": "tf", "question": "Bicep files compile down to ARM JSON templates before deployment.", "answer": true, "explanation": "Bicep is a more concise authoring language that compiles to the same underlying ARM JSON format."}, {"id": "tf9", "cat": "compute", "type": "tf", "question": "Azure Container Instances provide built-in Kubernetes-style orchestration across multiple containers.", "answer": false, "explanation": "That's AKS. Container Instances run standalone containers with no orchestration layer."}, {"id": "tf10", "cat": "networking", "type": "tf", "question": "VNet peering allows transitive routing between all peered VNets automatically.", "answer": false, "explanation": "Peering is not transitive \u2014 each pair of VNets that needs to communicate must be peered directly."}, {"id": "tf11", "cat": "networking", "type": "tf", "question": "An internal (private) Load Balancer can distribute traffic originating from the public internet.", "answer": false, "explanation": "An internal Load Balancer only distributes traffic within a VNet, never from the public internet."}, {"id": "tf12", "cat": "networking", "type": "tf", "question": "Azure Bastion eliminates the need to expose a VM's public IP for RDP or SSH access.", "answer": true, "explanation": "Bastion provides secure access through the portal without the VM itself needing a public IP."}, {"id": "q37", "cat": "identityGov", "type": "mc", "question": "A Global Administrator in Microsoft Entra ID tries to edit a resource group in the Azure portal and gets an access-denied error, despite being a Global Administrator. What lets them manage Azure resources across every subscription in the tenant?", "options": ["Turning on the \"elevate access\" setting for Global Administrators in Microsoft Entra ID properties", "Assigning themselves the Reader role manually", "Waiting 24 hours for permissions to sync", "Creating a new subscription under their own name"], "correct": 0, "explanation": "Microsoft Entra roles like Global Administrator control the identity plane, not Azure resources, by default. The \"elevate access\" setting grants Global Administrators the Azure RBAC User Access Administrator role at the root management group scope, letting them manage resources tenant-wide."}, {"id": "q38", "cat": "identityGov", "type": "mc", "question": "A finance team's storage account keeps getting accidentally deleted by administrators who legitimately have Contributor access. Which safeguard specifically blocks deletion while still letting their authorized configuration changes continue?", "options": ["A CanNotDelete resource lock", "A ReadOnly resource lock", "Revoking Contributor from the whole team", "An audit-effect Azure Policy"], "correct": 0, "explanation": "A CanNotDelete lock blocks deletion but still allows reads and writes. A ReadOnly lock would also block the configuration changes the team needs; removing Contributor access would block those too, and an audit-only policy effect just flags noncompliance without preventing the delete."}, {"id": "q39", "cat": "storage", "type": "mc", "question": "An application's managed identity needs to read and write blobs in a container, without ever handling a SAS token or the storage account key.", "options": ["Assign the managed identity the Storage Blob Data Contributor role on the container or storage account", "Generate a long-lived SAS token for the managed identity", "Share the storage account access key with the application", "Add the application to a dynamic group"], "correct": 0, "explanation": "Data-plane RBAC roles like Storage Blob Data Contributor let an identity authenticate with Microsoft Entra ID and access blob data directly. The control-plane Contributor role manages the storage account itself but does not by itself grant blob data access once key-based access is restricted."}, {"id": "q40", "cat": "compute", "type": "mc", "question": "A batch rendering job can tolerate being interrupted and restarted, and the team wants to run it on Azure VMs at a steep discount versus pay-as-you-go pricing.", "options": ["Azure Spot Virtual Machines", "Reserved Instances", "A VM Scale Set with manual scaling", "Azure Dedicated Host"], "correct": 0, "explanation": "Spot VMs use Azure's unused capacity at a steep discount but can be evicted with little notice when that capacity is needed back \u2014 a good fit for interruptible workloads. Reserved Instances are a billing commitment for guaranteed capacity, not an eviction-prone discount."}, {"id": "q41", "cat": "networking", "type": "mc", "question": "An administrator wants one NSG rule that allows traffic to every VM tagged as 'WebTier,' regardless of each VM's individual IP address, which changes as instances are added or removed.", "options": ["Group the VMs\u2019 network interfaces into an Application Security Group and reference it in the rule", "Write a separate NSG rule for every VM's current IP address", "Use a public Load Balancer instead of an NSG", "Move all the VMs into one subnet with no other traffic"], "correct": 0, "explanation": "An Application Security Group (ASG) groups VM network interfaces logically, like 'WebTier,' so an NSG rule can reference the group as a source or destination instead of hardcoding IP addresses that change over time."}, {"id": "q42", "cat": "monitoring", "type": "mc", "question": "An administrator is deploying monitoring to a fleet of new VMs and wants Microsoft's current, supported agent for collecting metrics and logs into Azure Monitor.", "options": ["The Azure Monitor Agent (AMA)", "The legacy Log Analytics agent (MMA)", "The Diagnostics extension only", "No agent \u2014 Azure Monitor needs nothing installed on the VM"], "correct": 0, "explanation": "The Azure Monitor Agent (AMA), configured through data collection rules, is the current agent. The legacy Log Analytics agent (MMA) was retired in August 2024 and should not be used for new deployments."}, {"id": "q43", "cat": "monitoring", "type": "mc", "question": "A company needs a VM's resource logs both queryable right away in Log Analytics and archived cheaply for 7 years to satisfy a compliance requirement.", "options": ["One diagnostic setting sending logs to both a Log Analytics workspace and a storage account", "Two separate resources, since a diagnostic setting supports only one destination", "Azure Backup, configured to capture logs", "A resource lock with a 7-year expiration"], "correct": 0, "explanation": "A single diagnostic setting can send the same logs to multiple destinations at once, including a Log Analytics workspace for querying and a storage account for long-term archival \u2014 no need for separate configurations per destination."}, {"id": "q44", "cat": "monitoring", "type": "mc", "question": "An administrator needs to schedule recurring patch installation windows across dozens of Windows and Linux Azure VMs, and track patch compliance centrally.", "options": ["Azure Update Manager", "Azure Advisor", "Azure Policy alone", "Azure Site Recovery"], "correct": 0, "explanation": "Azure Update Manager is the current unified service for assessing and scheduling OS patch compliance and installation across VMs at scale, replacing the older Update Management solution."}, {"id": "tf13", "cat": "storage", "type": "tf", "question": "An immutable blob storage policy with a legal hold in effect can be bypassed by the storage account's Owner role to delete data early if needed.", "answer": false, "explanation": "Immutability policies, including legal holds, block deletion and modification for everyone, including the account owner, until the hold is removed or the retention period expires \u2014 that is what makes them valid for regulatory retention requirements."}, {"id": "tf14", "cat": "networking", "type": "tf", "question": "NSG flow logs, viewed through Traffic Analytics, can show which allowed and denied flows are hitting a network interface without manually correlating raw log files.", "answer": true, "explanation": "Network Watcher's NSG flow logs record allowed and denied traffic per rule, and Traffic Analytics processes those logs in a Log Analytics workspace into visual, queryable insights instead of raw JSON."}, {"id": "tf15", "cat": "monitoring", "type": "tf", "question": "Soft delete for Azure Backup keeps deleted backup data recoverable for a retention window, even if someone deletes the backup item or disables backup entirely.", "answer": true, "explanation": "This protection is distinct from blob soft delete and is designed to guard against accidental or malicious deletion of backup data itself, such as during a ransomware attack that disables backups."}, {"id": "msq1", "cat": "identityGov", "type": "ms", "question": "Which two built-in Azure roles let someone grant other users access to resources, not just manage the resources themselves? (Choose two.)", "options": ["Owner", "User Access Administrator", "Contributor", "Reader"], "correct": [0, 1], "explanation": "Owner can manage resources and assign roles to others. User Access Administrator can assign roles without managing the resources themselves. Contributor can manage resources but cannot grant access, and Reader can do neither."}, {"id": "msq2", "cat": "compute", "type": "ms", "question": "Which two Azure managed disk types let you configure IOPS and throughput independently of the disk's provisioned size? (Choose two.)", "options": ["Ultra Disk", "Premium SSD v2", "Standard SSD", "Premium SSD"], "correct": [0, 1], "explanation": "Ultra Disk and the newer Premium SSD v2 both allow tuning IOPS and throughput separately from capacity. Standard SSD and the original Premium SSD scale their performance according to the size tier provisioned."}, {"id": "msq3", "cat": "monitoring", "type": "ms", "question": "Which two of the following are valid actions an Azure Monitor action group can trigger when an alert fires? (Choose two.)", "options": ["A webhook", "An Automation runbook", "A resource lock", "A management group"], "correct": [0, 1], "explanation": "Action groups can call webhooks, Automation runbooks, Azure Functions, Logic Apps, and more, plus notify people by email, SMS, or voice. Resource locks and management groups are governance constructs, not things an alert can trigger."}], "lessons": [{"id": "identities-access", "title": "Identities & Access", "summary": "Users, groups, licensing, external users, and self-service password reset.", "diagram": null, "vocabIds": ["f1", "f2", "f3", "f4"], "quizIds": ["q1", "q2", "q3", "q4", "tf1", "tf2"], "reading": "As an administrator, you'll create and manage the users and groups that make up an organization's identity. Security groups hold manually-managed membership, while dynamic groups automatically add or remove members based on rules matching attributes like department or job title \u2014 useful for keeping large, frequently-changing teams in sync without manual upkeep.\n\nLicensing follows the same logic: rather than assigning a Microsoft 365 license to each person individually, group-based licensing lets you assign it once to a group, and every current and future member picks it up automatically.\n\nFor people outside your organization, like contractors or partners, external B2B users let them sign in with their own existing identity rather than you creating them a new internal account. And for your own users, self-service password reset removes the help desk from the equation entirely for the most common request there is.", "fundamentalsLabel": "New to identity administration? See the everyday analogy", "fundamentals": "A dynamic group is like an email distribution list that updates itself based on someone's job title, instead of someone manually adding and removing names every time staff changes. Group-based licensing is like a company handing out badges by department rather than issuing one individually to every new hire \u2014 join the department, get the badge automatically.", "keyTerms": ["Security groups", "dynamic groups", "group-based licensing", "B2B", "self-service password reset"], "commonTraps": ["A dynamic group updates its membership automatically \u2014 a security group requires manual changes.", "Group-based licensing still requires someone to be a group member; adding the license alone doesn't add them.", "External B2B users authenticate with their own identity \u2014 you don't create them a normal internal account."], "scenario": "A hospital's radiology department grows from 8 to 30 staff over a year. Rather than manually adding each new hire to a group and assigning a license individually, an administrator sets up a dynamic group based on department, with a license attached to that group \u2014 every new radiology hire is automatically added and licensed the moment their account is created, with zero manual steps."}, {"id": "governance-cost", "title": "Governance & Cost", "summary": "RBAC scope and roles, Azure Policy initiatives, and cost management.", "diagram": "rbacScope", "vocabIds": ["f5", "f6", "f7", "f8", "f9"], "quizIds": ["q5", "q6", "q7", "q8", "tf3"], "reading": "As an administrator, RBAC role assignments are additive across scopes \u2014 if someone has Reader at a subscription and Contributor at one resource group within it, they effectively have Contributor there and Reader everywhere else in that subscription. The built-in roles worth knowing well: Owner can manage resources and grant access to others; Contributor can manage resources but cannot grant access; Reader is view-only; and User Access Administrator can manage who has access without touching the resources themselves.\n\nAzure Policy enforces configuration rules, and when several related policies need to be assigned together, like a full tagging standard, they can be bundled into a single initiative rather than assigned one by one.\n\nDay to day, this ties back to cost: budgets with alert thresholds, and Cost Analysis, let you see where spending is actually going, broken down by resource, tag, or service.", "fundamentalsLabel": "New to RBAC in practice? See the everyday analogy", "fundamentals": "Think of RBAC assignments like keys handed out at different levels of a building. A master key at the building level, plus an extra key to one specific supply closet, means you effectively have full access to that closet even if your master key alone wouldn't normally reach it \u2014 the more specific, more permissive key wins in that one room.", "keyTerms": ["RBAC", "Owner", "Contributor", "Reader", "User Access Administrator", "Azure Policy", "initiative", "budgets"], "commonTraps": ["Contributor can manage all resources but CANNOT assign roles to others \u2014 only Owner and User Access Administrator can.", "RBAC is additive: the most permissive assignment across all applicable scopes wins, not the most restrictive.", "An initiative is a bundle of policies assigned together \u2014 it isn't a single rule by itself."], "portalMockup": "roleAssignment", "scenario": "A company wants a lead engineer to manage all resources in a specific resource group AND decide which teammates can access it, without giving them company-wide Owner rights. Assigning Owner at just that one resource group achieves this \u2014 Owner both manages resources and grants access, but scoped to that resource group alone, leaving the rest of the subscription untouched."}, {"id": "storage-management", "title": "Storage Management", "summary": "Access keys and SAS, firewalls, lifecycle policies, and protecting blob data.", "diagram": null, "vocabIds": ["f10", "f11", "f12", "f13", "f14", "f15", "f16", "f17", "f18"], "quizIds": ["q9", "q10", "q11", "q12", "q13", "tf4", "tf5", "tf6"], "reading": "Managing storage at the administrator level means configuring the account itself, not just knowing what it holds. General-purpose v2 is the standard account type, with Standard (HDD-backed) and Premium (SSD-backed) performance tiers depending on how demanding the workload is.\n\nFor access, a storage account access key grants full, unrestricted control over the whole account \u2014 risky to hand out. A Shared Access Signature (SAS) instead grants limited, time-boxed access to specific resources, without ever exposing that key. A storage firewall adds a network-level layer on top, restricting access to specific VNets or IP ranges regardless of what credentials someone has.\n\nOngoing management includes lifecycle policies, which automatically move aging blobs to cheaper tiers or delete them outright, and choosing the right protection for accidental changes: blob versioning keeps every prior version automatically, while soft delete recovers something that was deleted outright.", "fundamentalsLabel": "New to storage account administration? See the everyday analogy", "fundamentals": "An access key is like a master key to an entire building \u2014 powerful, and dangerous to hand out casually. A SAS is like a visitor badge that only opens one door, only works for a limited window of time, and can be revoked without changing the master key at all.", "keyTerms": ["General-purpose v2", "Standard", "Premium", "access key", "Shared Access Signature", "SAS", "storage firewall", "lifecycle", "versioning", "soft delete"], "commonTraps": ["An access key grants full account access \u2014 always prefer a scoped, time-limited SAS when sharing access externally.", "Soft delete protects against deletion; recovering a blob's content after an overwrite specifically needs versioning.", "A storage firewall is a network-level control \u2014 separate from, and in addition to, who has valid credentials."], "portalMockup": "storageAccount", "scenario": "A marketing agency needs to let an external contractor upload files to one specific container for 48 hours, then lose access automatically. Issuing a SAS scoped to that container, valid for 48 hours, does exactly this \u2014 no account key changes hands, and access expires on its own without anyone having to remember to revoke it."}, {"id": "vms-compute", "title": "Virtual Machines & Compute", "summary": "VM sizing, managed disks, availability options, extensions, and resizing.", "diagram": "diskTiers", "vocabIds": ["f19", "f20", "f21", "f22", "f27"], "quizIds": ["q16", "q17", "q22", "q23", "tf7"], "reading": "Choosing a VM means balancing size against workload: the size determines CPU, memory, and disk throughput, while the series, B, D, F, and others, is tuned for different needs \u2014 B-series is cheap and burstable, D-series is general purpose, F-series is compute-optimized. Underneath, managed disks come in four performance tiers, Standard HDD, Standard SSD, Premium SSD, and Ultra Disk, from cheapest to fastest.\n\nFor resilience, availability sets spread VMs across separate hardware within one datacenter, availability zones go further by using physically separate datacenters within a region, and VM Scale Sets automatically add or remove instances based on demand or a schedule.\n\nDay-to-day operations include extensions, small agents that run post-deployment tasks like the Custom Script Extension, and resizing, which may require deallocating a running VM first if the target size isn't available on its current hardware.", "fundamentalsLabel": "New to VM sizing and resilience? See the everyday analogy", "fundamentals": "Choosing a VM series is like choosing a vehicle for a job: a compact car (B-series) is cheap and fine for occasional errands, a pickup truck (D-series) handles general hauling, and a race car (F-series) is built for one specific kind of performance. Availability sets and zones are about not parking every vehicle in the same garage \u2014 spreading them out so one disaster doesn't take out the whole fleet at once.", "keyTerms": ["size", "series", "managed disks", "Standard HDD", "Standard SSD", "Premium SSD", "Ultra Disk", "availability sets", "availability zones", "VM Scale Sets", "extensions", "Custom Script Extension", "deallocating"], "commonTraps": ["A B-series VM is burstable and cheap, but throttles under sustained heavy CPU load \u2014 the wrong pick for a constantly busy server.", "Resizing a running VM may require deallocating it first if the new size isn't available on its current hardware.", "Ultra Disk lets you configure performance independently of size \u2014 the highest, most consistent tier available."], "portalMockup": "vmSize", "scenario": "A team runs a database VM that needs consistent, high IOPS around the clock, plus a batch of short-lived web front-ends that spike unpredictably during business hours. The database gets a larger D-series or F-series VM with a Premium SSD or Ultra Disk. The front-ends go into a VM Scale Set, which adds instances automatically during the spikes and scales back down overnight, rather than running a fixed, oversized fleet all day."}, {"id": "app-hosting-iac", "title": "App Hosting & Infrastructure as Code", "summary": "App Service plans, deployment slots, container options, and ARM/Bicep.", "diagram": "deploymentSlots", "vocabIds": ["f23", "f24", "f25", "f26"], "quizIds": ["q18", "q19", "q20", "q21", "tf8", "tf9"], "reading": "An App Service plan defines the compute tier and region for one or more web apps \u2014 scaling up changes the plan's size, scaling out adds more instances of it. Deployment slots give you a separate, swappable environment, like staging, to validate a new version before swapping it into production with minimal downtime.\n\nFor containers, the right choice depends on how much orchestration you need: Container Instances run a single container with none, Container Apps add serverless, HTTP-based autoscaling without managing a cluster, and AKS gives full Kubernetes control when you need it.\n\nFor repeatable deployments, ARM templates are Azure's native JSON Infrastructure as Code format, and Bicep is a newer, more concise language that compiles down to the same ARM JSON \u2014 functionally identical, just easier to write and read.", "fundamentalsLabel": "New to app hosting and IaC? See the everyday analogy", "fundamentals": "A deployment slot is like a dress rehearsal before opening night \u2014 you run the full show in a separate space first, then swap it into the real venue once it's ready, instead of testing changes directly in front of the audience. Infrastructure as Code is like a recipe instead of a memory of how you cooked something once: written down, repeatable, and shareable, rather than trusting yourself to click through the same steps identically every time.", "keyTerms": ["App Service plan", "Deployment slots", "Container Instances", "Container Apps", "AKS", "ARM templates", "Bicep"], "commonTraps": ["Scaling up changes the App Service plan's tier or size; scaling out adds more instances of the same tier.", "Container Instances run a single container with no orchestration \u2014 that's what AKS is for.", "Bicep is not a different deployment mechanism \u2014 it compiles down to the same ARM JSON underneath."], "scenario": "A team wants to test a major update to their web app without any risk to the live site, then cut over quickly once it checks out. They deploy the new version to a staging slot, run their validation there against production-like settings, and swap it into the production slot in seconds once satisfied \u2014 with the previous version now sitting in the staging slot in case a fast rollback is ever needed."}, {"id": "az104-networking", "title": "Networking", "summary": "NSG rule priority, VNet peering, load balancing, and secure access.", "diagram": "nsgPriority", "vocabIds": ["f28", "f29", "f30", "f31", "f32", "f33", "f34", "f35", "f36"], "quizIds": ["q24", "q25", "q26", "q29", "q27", "tf10", "tf11", "tf12"], "reading": "As an administrator, you size VNets and subnets with real CIDR math in mind \u2014 Azure reserves 5 addresses in every subnet regardless of its size. Network Security Groups filter traffic with rules that have a priority; the lowest priority number is evaluated first and wins if rules conflict.\n\nVNet peering connects two VNets directly, even across regions, but it isn't transitive \u2014 peering A to B and B to C doesn't let A and C talk without their own direct peering. For distributing traffic, Azure Load Balancer works at layer 4 by IP and port alone, while Application Gateway works at layer 7 and can route by URL path and terminate SSL.\n\nFor secure remote access, Azure Bastion provides RDP or SSH through the portal without exposing a VM's public IP, and Network Watcher's tools, like IP flow verify, help diagnose exactly where a connectivity problem is coming from.", "fundamentalsLabel": "New to network administration? See the everyday analogy", "fundamentals": "An NSG rule priority works like a bouncer checking a list in order \u2014 the first matching rule they hit decides the outcome, and they stop checking after that, even if a later rule on the list would have said something different. VNet peering not being transitive is like two people each having a direct phone line to a shared friend, but no line to each other \u2014 being friends with the same person doesn't connect you to each other automatically.", "keyTerms": ["CIDR", "Network Security Groups", "priority", "VNet peering", "Azure Load Balancer", "Application Gateway", "Azure Bastion", "Network Watcher"], "commonTraps": ["A lower NSG rule priority number wins \u2014 100 is evaluated before 200, regardless of allow or deny.", "VNet peering is not transitive: A-B and B-C peered does not mean A and C can talk.", "Application Gateway can route by URL path; Azure Load Balancer only sees IP and port, not HTTP content."], "scenario": "An administrator needs to block a specific IP range from reaching a subnet while still allowing normal traffic through. They add a Deny rule at a lower priority number than the general Allow rule, so it's evaluated first \u2014 since NSGs stop at the first matching rule, that blocked range never reaches the broader allow rule beneath it."}, {"id": "monitoring-recovery", "title": "Monitoring & Recovery", "summary": "Metrics vs. logs, alerts and action groups, backup, and Site Recovery.", "diagram": "backupRecovery", "vocabIds": ["f37", "f38", "f39", "f40", "f41", "f42"], "quizIds": ["q33", "q34", "q35", "q36"], "reading": "Azure Monitor is the umbrella for keeping an eye on your own resources: metrics are lightweight numerical time-series data, like CPU percentage, while logs are detailed, queryable records stored in a Log Analytics workspace and searched with KQL. An alert rule defines the trigger condition, and a separate action group defines what happens next, like an email or an automated runbook.\n\nFor disaster protection, the distinction that matters most is scope: Azure Backup, through a Recovery Services vault, restores a VM or file to an earlier point in time, protecting against data loss or corruption. Azure Site Recovery goes further, replicating an entire workload to a secondary region so it can fail over and keep running if the primary region goes down entirely.", "fundamentalsLabel": "New to monitoring and disaster recovery? See the everyday analogy", "fundamentals": "Backup is like keeping dated copies of an important document, so you can go back to yesterday's version if today's got corrupted. Site Recovery is more like having a fully-equipped second office ready to open immediately if your main building becomes unusable \u2014 not just a copy of your files, but a whole working replacement environment standing by.", "keyTerms": ["Azure Monitor", "metrics", "logs", "Log Analytics", "KQL", "alert rule", "action group", "Azure Backup", "Recovery Services vault", "Azure Site Recovery"], "commonTraps": ["Metrics are lightweight numerical data; use Logs and KQL for detailed, queryable event investigation.", "An alert rule is the trigger condition \u2014 the action group is the separate response it sets off.", "Backup restores a point-in-time copy; Site Recovery fails over a whole workload to another region."], "scenario": "A company's production database VM gets corrupted by a bad script at 2pm. They restore it from that morning's backup in the Recovery Services vault, losing a few hours of data but recovering quickly. Separately, that same company has Site Recovery configured for their whole application tier, so if their primary region ever goes down entirely, the application can fail over and keep serving customers from a secondary region within minutes."}]}, "az305": {"categories": [{"key": "identityGovernance", "label": "Identity, Governance & Monitoring", "marks": 26}, {"key": "dataStorage", "label": "Data Storage Solutions", "marks": 24}, {"key": "businessContinuity", "label": "Business Continuity", "marks": 17}, {"key": "infrastructure", "label": "Infrastructure Solutions", "marks": 33}], "flashcards": [{"id": "f1", "cat": "identityGovernance", "front": "Password hash sync vs. pass-through authentication vs. federation", "back": "Password hash sync replicates a hash of the on-premises password hash to Entra ID, so sign-in works even if on-premises infrastructure is briefly unavailable. Pass-through authentication validates each sign-in directly against on-premises AD in real time via a lightweight agent, with no password data stored in the cloud. Federation (AD FS) delegates authentication entirely to an on-premises identity provider.", "detail": "Pass-through authentication needs at least one authentication agent online to work at all, which is a resilience trade-off compared to password hash sync."}, {"id": "f2", "cat": "identityGovernance", "front": "Conditional Access vs. multifactor authentication (MFA)", "back": "Conditional Access is a policy engine that evaluates signals (user, device, location, risk) at sign-in time and applies controls in response. MFA is one of the controls Conditional Access can enforce, not a separate policy system of its own.", "detail": "A Conditional Access policy could require MFA only for risky sign-ins or unmanaged devices, rather than requiring it for every sign-in unconditionally."}, {"id": "f3", "cat": "identityGovernance", "front": "Privileged Identity Management (PIM)", "back": "Grants just-in-time, time-bound elevation to privileged roles, optionally requiring approval and justification, instead of leaving administrators with standing (always-on) privileged access.", "detail": "PIM and Conditional Access solve different problems and are commonly layered together, such as requiring MFA (a Conditional Access control) as a condition of activating a PIM-eligible role."}, {"id": "f4", "cat": "identityGovernance", "front": "Access reviews vs. entitlement management", "back": "Access reviews periodically recertify access that already exists, so an administrator (or the resource owner) confirms it should continue or revokes it. Entitlement management bundles resources into requestable access packages with approval workflows and built-in, automatic expiration for new access.", "detail": "A scenario about access to time-boxed contractor or project work usually points to entitlement management; a scenario about periodically re-certifying existing standing access points to access reviews."}, {"id": "f5", "cat": "identityGovernance", "front": "Management groups, subscriptions, and resource groups", "back": "Management groups group subscriptions so policy and RBAC can be assigned once and inherited down across an organization. Subscriptions are billing and scale boundaries. Resource groups are deployment and lifecycle containers within a subscription.", "detail": "Management groups don't replace resource groups \u2014 they sit above subscriptions in the hierarchy, while resource groups remain the deployment boundary inside each subscription."}, {"id": "f6", "cat": "identityGovernance", "front": "Azure Policy effects: Deny, Audit, and DeployIfNotExists", "back": "Deny blocks the creation or update of a noncompliant resource outright. Audit flags noncompliant resources for visibility without blocking anything. DeployIfNotExists automatically remediates by deploying a related resource (like a diagnostic setting) when a required one is missing.", "detail": "Only DeployIfNotExists actively fixes existing noncompliant resources; Audit only reports on them, and Deny only stops new noncompliant ones from being created."}, {"id": "f7", "cat": "identityGovernance", "front": "Azure landing zones", "back": "A landing zone is a pre-provisioned environment \u2014 management group hierarchy, policy, identity, and hub networking \u2014 built on the Cloud Adoption Framework, so every new subscription starts from a consistent, governed baseline instead of each team configuring governance independently.", "detail": "Landing zones are the recommended starting point for any new enterprise Azure environment on the exam, not just a nice-to-have."}, {"id": "f8", "cat": "identityGovernance", "front": "Log Analytics workspace design: centralized vs. decentralized", "back": "A centralized workspace simplifies cross-resource queries and gives a single place to see cost and usage, but has coarser access boundaries. Decentralized (per-team or per-subscription) workspaces give finer access control, retention, and data-sovereignty boundaries, at the cost of harder cross-workspace querying.", "detail": "A regulated subsidiary that needs its own retention and access boundary is a strong signal for a dedicated workspace, even inside an otherwise centralized design."}, {"id": "f9", "cat": "identityGovernance", "front": "Azure Monitor Metrics vs. Logs", "back": "Metrics are lightweight numerical time-series data, well suited to fast, near-real-time alerting on things like CPU or memory thresholds. Logs are structured or free-form records stored in a Log Analytics workspace, queried with KQL, and suited to deep, multi-table investigation.", "detail": "Reaching for Logs for a simple, fast threshold alert adds unnecessary query latency; reaching for Metrics for a complex correlation query doesn't have the structure to support it."}, {"id": "f10", "cat": "dataStorage", "front": "Azure SQL Database vs. Managed Instance vs. SQL Server on a VM", "back": "Azure SQL Database (single database) is fully managed PaaS with the least administrative overhead but limited instance-level features. SQL Managed Instance offers near-complete SQL Server engine compatibility (SQL Agent, cross-database queries, linked servers) while staying PaaS. SQL Server on a VM gives full OS and engine control (IaaS) for maximum compatibility, at the cost of managing patching yourself.", "detail": "A migration that depends on SQL Agent jobs or cross-database queries but still wants to avoid managing the OS points squarely at Managed Instance, not SQL Database."}, {"id": "f11", "cat": "dataStorage", "front": "Cosmos DB consistency levels", "back": "Five levels, from strongest to weakest: Strong, Bounded Staleness, Session, Consistent Prefix, and Eventual. Strong gives no staleness but the highest latency and lowest availability; Eventual gives the lowest latency and highest availability but no ordering guarantee.", "detail": "Session is the default and fits most single-user scenarios that need to see their own writes immediately; Eventual fits read-heavy workloads (like a shared catalog) that can tolerate a few seconds of staleness in exchange for speed."}, {"id": "f12", "cat": "dataStorage", "front": "Cosmos DB partition key design", "back": "A good partition key has high cardinality and spreads requests and storage evenly. A low-cardinality key concentrates traffic on a small number of physical partitions, creating a \"hot partition\" that throttles throughput no matter how much RU/s is provisioned.", "detail": "The fix for a hot partition is redesigning the partition key itself, not raising the consistency level or adding more provisioned throughput."}, {"id": "f13", "cat": "dataStorage", "front": "Storage redundancy: LRS, ZRS, GRS, and GZRS", "back": "LRS keeps three synchronous copies within one datacenter. ZRS spreads synchronous copies across availability zones in the same region. GRS asynchronously replicates to a paired secondary region (without zone redundancy locally). GZRS combines zone redundancy in the primary region with geo-replication to a secondary region."
