const STORAGE_KEY = "cert-study-progress";
const TRACKS = [{"key": "itil", "label": "ITIL", "subtitle": "Foundation, Version 5", "hidden": true}, {"key": "az900", "label": "AZ-900", "subtitle": "Azure Fundamentals"}, {"key": "az104", "label": "AZ-104", "subtitle": "Azure Administrator", "hidden": true}];
const EXAM_CONFIG = {"itil": {"length": 40, "minutes": 60, "passPct": 65, "passLabel": "Real pass mark: 26/40 (65%)"}, "az900": {"length": 50, "minutes": 45, "passPct": 75, "passLabel": "Microsoft scores this 0-1000 with 700 to pass, not a flat percentage. Treat 75%+ here as a safe buffer, not an exact predictor."}, "az104": {"length": 50, "minutes": 100, "passPct": 75, "passLabel": "Microsoft scores this 0-1000 with 700 to pass, not a flat percentage. Treat 75%+ here as a safe buffer, not an exact predictor."}};
const DATA = {"itil": {"categories": [{"key": "terms", "label": "Key Terms", "marks": 12}, {"key": "valueSystem", "label": "Value System", "marks": 16}, {"key": "dimensions", "label": "Four Dimensions", "marks": 4}, {"key": "lifecycle", "label": "Lifecycle", "marks": 4}, {"key": "streams", "label": "Value Streams", "marks": 2}, {"key": "ai", "label": "AI", "marks": 1}, {"key": "frameworks", "label": "Other Frameworks", "marks": 1}], "flashcards": [{"id": "f1", "cat": "terms", "front": "Product vs. service", "back": "A product is a configuration of an organization's resources. A service enables value co-creation by facilitating outcomes customers want, without the customer having to manage specific costs and risks themselves.", "detail": "Example: Entra ID is a product. The identity management service you provide by configuring and supporting it is the service \u2014 value comes from the outcome, not the software itself."}, {"id": "f2", "cat": "terms", "front": "Digital product vs. digital service", "back": "A digital product exists primarily in digital form, like software or data. A digital service is the value co-created through that product, i.e. the product is the app, the service is what using it accomplishes.", "detail": "Exam trap: a SaaS platform itself is the digital product, while onboarding and supporting users on it is the digital service."}, {"id": "f3", "cat": "terms", "front": "Output vs. outcome", "back": "An output is a tangible or intangible deliverable of an activity. An outcome is the result that output enables for a stakeholder. Outputs are what you produce, outcomes are what the stakeholder actually needed.", "detail": "A resolved ticket is an output. The user being able to work uninterrupted again is the outcome ITIL actually cares about."}, {"id": "f4", "cat": "terms", "front": "Utility vs. warranty", "back": "Utility is what the service does: functionality that supports performance or removes constraints (\"fit for purpose\"). Warranty is how well it does it: availability, capacity, security, continuity (\"fit for use\").", "detail": "A firewall that blocks the right traffic has utility. One that stays up 99.9% of the time with proper failover has warranty. A service needs both to create value."}, {"id": "f5", "cat": "terms", "front": "Customer vs. user vs. sponsor", "back": "Customer defines requirements and is accountable for outcomes. User actually uses the service day to day. Sponsor authorizes the budget. One person can hold more than one of these roles.", "detail": "At an MSP, the client contact who signs the contract is often the sponsor, while their employees calling the help desk are users."}, {"id": "f6", "cat": "terms", "front": "Provider vs. consumer vs. digital product vendor", "back": "Provider delivers the service. Consumer receives it, as customer, user, and/or sponsor. A digital product vendor supplies a product a provider or consumer uses, without itself being in a service relationship with them.", "detail": "An MSP is the provider, the client is the consumer, and a software company selling licenses with no direct relationship management is closer to a digital product vendor."}, {"id": "f7", "cat": "terms", "front": "Cost vs. risk", "back": "Cost is the money spent on a specific activity or resource. Risk is a possible event that could cause harm, loss, or make achieving objectives harder, including a missed opportunity, not only a downside.", "detail": "Choosing a cheaper backup solution lowers cost but can raise risk. The exam likes scenarios where you have to weigh the two against each other."}, {"id": "f8", "cat": "terms", "front": "Service quality vs. service level vs. SLA", "back": "Service quality is how well the service meets expectations overall. A service level is a measured target for one aspect of performance. An SLA is the documented agreement recording those targets.", "detail": "\"99.9% uptime\" is a service level. The signed document guaranteeing it, with consequences for missing it, is the SLA."}, {"id": "f9", "cat": "terms", "front": "Core value stream vs. enabling value stream", "back": "A core value stream directly creates value for an external customer. An enabling value stream supports other value streams internally, like supplier management, without touching the external customer directly.", "detail": "Handling a client's support ticket is core. An internal process for renewing supplier licenses is enabling."}, {"id": "f10", "cat": "terms", "front": "Service relationship", "back": "A cooperation between a service provider and consumer that includes service provision, service consumption, and service relationship management activities.", "detail": "It covers the whole relationship, not just delivering the service, but how both sides manage and communicate around it."}, {"id": "f11", "cat": "terms", "front": "Service offering", "back": "A description of one or more services designed to address the needs of a target consumer group, made up of goods, access to resources, and service actions.", "detail": "Think of a support plan: the tiers, response times, and included tools together make up the offering, not just the raw technical capability."}, {"id": "f12", "cat": "valueSystem", "front": "The 5 components of the ITIL Value System", "back": "Guiding principles, governance, the service value chain, management practices, and continual improvement.", "detail": "A way to remember it: two are people-facing (principles, governance), one is the engine (value chain), one is the toolbox (practices), and one runs through everything (continual improvement)."}, {"id": "f13", "cat": "valueSystem", "front": "Guiding principles, purpose", "back": "Recommendations that guide an organization in all circumstances, regardless of changes in goals, strategies, or structure.", "detail": "They're deliberately generic so they apply whether you're troubleshooting a ticket or restructuring a whole team."}, {"id": "f14", "cat": "valueSystem", "front": "Governance, purpose", "back": "The means by which an organization is directed and controlled: evaluating, directing, and monitoring performance and compliance.", "detail": "Governance sits above day-to-day operations. It's leadership-level direction, not a specific practice like incident management."}, {"id": "f15", "cat": "valueSystem", "front": "Value chain, purpose", "back": "An operating model outlining the key activities an organization undertakes to create value, converting inputs like demand and opportunity into outputs of value.", "detail": "Exam tip: the value chain has six activities (plan, improve, engage, design & transition, obtain/build, deliver & support). Foundation only expects their purpose, not mastery of each one."}, {"id": "f16", "cat": "valueSystem", "front": "Management practices, purpose", "back": "Sets of organizational resources for performing work or accomplishing an objective. These are the \"how\" behind value chain activities.", "detail": "There are 34 practices in Version 5, but Foundation only expects you to recognize a handful by name and purpose, like incident management or change enablement."}, {"id": "f17", "cat": "valueSystem", "front": "Continual improvement, purpose", "back": "A recurring activity performed across every part of the organization to make sure performance keeps meeting stakeholder expectations.", "detail": "It's not a one-time project. It's meant to be built into how every part of the organization already works."}, {"id": "f18", "cat": "valueSystem", "front": "Name the 7 guiding principles", "back": "Focus on value; start where you are; progress iteratively with feedback; collaborate and promote visibility; think and work holistically; keep it simple and practical; optimize and automate.", "detail": "A common exam trap: 'think and work holistically' means seeing the whole picture, while 'collaborate and promote visibility' means sharing information openly. Both are about openness but target different problems."}, {"id": "f19", "cat": "valueSystem", "front": "\"Focus on value\"", "back": "Everything the organization does should map, directly or indirectly, to value for stakeholders. Always ask how a task benefits the customer or the business.", "detail": "If a task doesn't map back to some stakeholder's outcome, this principle says question whether it's worth doing."}, {"id": "f20", "cat": "valueSystem", "front": "\"Start where you are\"", "back": "Don't build from scratch. Assess what already exists and can be reused before creating something new.", "detail": "This doesn't mean never changing anything. It means measuring the current state honestly before deciding what to keep."}, {"id": "f21", "cat": "valueSystem", "front": "\"Keep it simple and practical\"", "back": "Use the minimum number of steps to accomplish an objective, and eliminate anything that doesn't contribute to value.", "detail": "Watch for exam scenarios describing unnecessary approval steps or duplicate processes. That usually points to this principle."}, {"id": "f22", "cat": "dimensions", "front": "Name the Four Dimensions", "back": "Organizations and people; information and technology; partners and suppliers; value streams and processes.", "detail": "Exam scenarios often describe a change in one dimension causing a problem in another. That interaction is the whole point of calling them dimensions."}, {"id": "f23", "cat": "dimensions", "front": "Organizations and people, dimension", "back": "Roles, responsibilities, structure, culture, and staffing needed to support the service.", "detail": "Covers things like whether a support team has the right skills and headcount for a new application rollout."}, {"id": "f24", "cat": "dimensions", "front": "Information and technology, dimension", "back": "The information and knowledge needed to manage services, plus the technologies that support them, including AI, cloud, and automation.", "detail": "This is where AI, automation, and the actual toolset in use live in the model."}, {"id": "f25", "cat": "dimensions", "front": "Partners and suppliers, dimension", "back": "Relationships with other organizations involved in designing, developing, deploying, or supporting services.", "detail": "Ranges from a formal outsourcing arrangement to a simple software license. The exam expects you to recognize both count."}, {"id": "f26", "cat": "dimensions", "front": "What does PESTLE stand for?", "back": "External factors affecting all four dimensions: Political, Economic, Social, Technological, Legal, Environmental.", "detail": "You won't need to define each factor in depth, just recognize when a scenario describes an external pressure versus an internal one."}, {"id": "f27", "cat": "lifecycle", "front": "The 8 Product and Service Lifecycle activities, in order", "back": "Discover, Design, Acquire, Build, Transition, Operate, Deliver, Support. Used iteratively, not strictly one-way.", "detail": "Unlike the older six-activity value chain, this model is explicitly iterative. Work can loop back to an earlier activity at any point."}, {"id": "f28", "cat": "lifecycle", "front": "Discover", "back": "Identifying opportunities, understanding demand, and exploring what a product or service could look like.", "detail": "This is where 'is there a real problem worth solving here?' gets answered, before any design work starts."}, {"id": "f29", "cat": "lifecycle", "front": "Design", "back": "Defining requirements and specifications for the product or service before it is acquired or built.", "detail": "Requirements get defined here, but nothing is built yet. That boundary is a common thing the exam tests."}, {"id": "f30", "cat": "lifecycle", "front": "Acquire and Build", "back": "Acquire: obtaining components from suppliers. Build: assembling or developing components in house. Both feed into a deployable product.", "detail": "Buying a monitoring tool off the shelf is Acquire. Writing a custom automation script in-house is Build."}, {"id": "f31", "cat": "lifecycle", "front": "Transition", "back": "Moving a new or changed product or service into live use, including testing and release.", "detail": "This is where testing and release happen \u2014 think change management and deployment, not ongoing operation."}, {"id": "f32", "cat": "lifecycle", "front": "Operate, Deliver, Support", "back": "Operate: running the service day to day. Deliver: providing the agreed outcomes to consumers. Support: resolving issues and requests that arise during use.", "detail": "These three often get grouped on flashcards, but the exam can test them separately. Support specifically means responding to issues, not running the service day to day."}, {"id": "f33", "cat": "streams", "front": "Value stream", "back": "A series of steps an organization undertakes to create and deliver products and services to consumers.", "detail": "A value stream is made of value chain activities and practices strung together for a specific scenario, like 'resolve a user's incident.'"}, {"id": "f34", "cat": "streams", "front": "Value stream mapping", "back": "Visualizing the end-to-end steps of a value stream to identify waste, delay, or handoffs that don't add value.", "detail": "In practice this looks like a flowchart with timestamps, showing where a request sits waiting versus where real work happens."}, {"id": "f35", "cat": "ai", "front": "AI vs. generative AI vs. agentic AI", "back": "AI: systems performing tasks that normally need human intelligence. Generative AI: creates new content. Agentic AI: can plan and act autonomously toward a goal with limited human intervention.", "detail": "A chatbot that drafts a reply for a human to approve is generative. One that files the ticket, checks the knowledge base, and closes it itself is agentic."}, {"id": "f36", "cat": "ai", "front": "Why does AI governance matter in ITIL?", "back": "AI must be directed and controlled like any other capability, covering accountability, transparency, ethics, and risk, not just technical deployment.", "detail": "Expect exam questions testing whether you'd let AI act without any oversight. The correct answer is almost always no."}, {"id": "f37", "cat": "frameworks", "front": "ITIL and DevOps", "back": "ITIL provides the broader service value system and governance. DevOps contributes specific practices for fast, collaborative delivery. They complement rather than compete.", "detail": "DevOps practices like CI/CD can sit inside the ITIL value chain's 'obtain/build' and 'deliver & support' activities."}, {"id": "f38", "cat": "frameworks", "front": "ITIL and PRINCE2", "back": "ITIL manages ongoing services. PRINCE2 manages the temporary, bounded work of projects. Projects often deliver changes that ITIL then operates.", "detail": "A new system rollout might run as a PRINCE2 project, with ITIL practices taking over once it goes live and becomes an ongoing service."}], "questions": [{"id": "q1", "cat": "terms", "type": "mc", "question": "A team measures how many tickets were closed this week. Is that an output or an outcome?", "options": ["Output", "Outcome", "Utility", "Warranty"], "correct": 0, "explanation": "Ticket count is a deliverable of the activity, so it's an output. Whether the customer's problem actually stayed solved is the outcome."}, {"id": "q2", "cat": "terms", "type": "mc", "question": "Which pair correctly matches 'fit for purpose' and 'fit for use'?", "options": ["Utility = fit for purpose, warranty = fit for use", "Warranty = fit for purpose, utility = fit for use", "Output = fit for purpose, outcome = fit for use", "Cost = fit for purpose, risk = fit for use"], "correct": 0, "explanation": "Utility is what the service does. Warranty is how well and reliably it does it."}, {"id": "q3", "cat": "terms", "type": "mc", "question": "A client asks which sysadmin actually logs into the ticketing system every day. Which role is that?", "options": ["Customer", "User", "Sponsor", "Provider"], "correct": 1, "explanation": "The user is whoever actually uses the service day to day, distinct from whoever defines requirements or pays for it."}, {"id": "q4", "cat": "terms", "type": "mc", "question": "A finance director approves the annual budget for a helpdesk contract but never opens a ticket. What's their role?", "options": ["Sponsor", "User", "Provider", "Digital product vendor"], "correct": 0, "explanation": "The sponsor authorizes the budget. They may or may not also be a customer or user."}, {"id": "q5", "cat": "terms", "type": "mc", "question": "Which value stream type touches the external customer directly?", "options": ["Core value stream", "Enabling value stream", "Support value stream", "Management practice"], "correct": 0, "explanation": "Core value streams create value for the external customer directly. Enabling value streams support internal work instead."}, {"id": "q6", "cat": "terms", "type": "mc", "question": "A vendor sells licenses for a monitoring tool but has no ongoing service relationship with the buyer. What is the vendor?", "options": ["Service provider", "Service consumer", "Digital product vendor", "Sponsor"], "correct": 2, "explanation": "A digital product vendor supplies a product without being in a service relationship with the buyer."}, {"id": "q7", "cat": "terms", "type": "mc", "question": "What's the key difference between a service level and an SLA?", "options": ["A service level is a measured target, an SLA is the documented agreement recording those targets", "They mean exactly the same thing", "An SLA only applies to internal teams", "A service level always outranks an SLA"], "correct": 0, "explanation": "The service level is the target itself; the SLA is the formal document that records it."}, {"id": "q27", "cat": "terms", "type": "mc", "question": "Which of these is an example of warranty rather than utility?", "options": ["A guaranteed 99.9% uptime commitment", "The ability to reset a password online", "A report showing ticket volume", "A firewall rule blocking a specific port"], "correct": 0, "explanation": "Uptime guarantees are about reliability and availability \u2014 that's warranty. Password reset and firewall rules are functional capabilities \u2014 that's utility."}, {"id": "q35", "cat": "terms", "type": "mc", "question": "A provider fixes a client's network issue for free after an SLA breach. Is the fix itself the value?", "options": ["No, value is realized in the outcome the fix enables, not the fix itself", "Yes, the fix is the value", "Value only comes from cost savings", "Value is defined solely by the SLA document"], "correct": 0, "explanation": "Value is realized when the outcome actually helps the stakeholder \u2014 the fix itself is just the mechanism, not the value."}, {"id": "q41", "cat": "terms", "type": "mc", "question": "A provider markets a service as having '99.99% availability,' but the client also needs guaranteed 4-hour incident response times to actually be satisfied. What does this illustrate?", "options": ["Warranty covers multiple dimensions, like availability and continuity, not just an uptime number alone", "Uptime is the only warranty dimension that matters", "Utility already covers response times", "Cost is what determines whether expectations are met"], "correct": 0, "explanation": "Warranty spans availability, capacity, security, and continuity \u2014 a single uptime figure doesn't capture the whole picture the customer actually needs."}, {"id": "q8", "cat": "valueSystem", "type": "mc", "question": "Which of the following is NOT one of the five components of the ITIL Value System?", "options": ["Governance", "Value chain", "Service desk", "Continual improvement"], "correct": 2, "explanation": "Service desk is a management practice, not one of the five Value System components."}, {"id": "q9", "cat": "valueSystem", "type": "mc", "question": "A team is tempted to build a brand-new ticketing workflow instead of checking what's already in place. Which principle applies?", "options": ["Start where you are", "Focus on value", "Keep it simple and practical", "Optimize and automate"], "correct": 0, "explanation": "Start where you are means assessing and reusing what already exists before building something new."}, {"id": "q10", "cat": "valueSystem", "type": "mc", "question": "Always asking how a task benefits the customer or business describes which principle?", "options": ["Focus on value", "Collaborate and promote visibility", "Think and work holistically", "Progress iteratively with feedback"], "correct": 0, "explanation": "Focus on value ties every activity back to stakeholder benefit."}, {"id": "q11", "cat": "valueSystem", "type": "mc", "question": "How many guiding principles does ITIL define?", "options": ["5", "6", "7", "9"], "correct": 2, "explanation": "There are seven guiding principles."}, {"id": "q12", "cat": "valueSystem", "type": "mc", "question": "What does governance provide within the Value System?", "options": ["The means to direct and control the organization", "A list of management practices", "The value chain's inputs", "A single guiding principle"], "correct": 0, "explanation": "Governance is about evaluating, directing, and monitoring the organization."}, {"id": "q13", "cat": "valueSystem", "type": "mc", "question": "A team removes three approval steps that added no value to a change request. Which principle are they applying?", "options": ["Keep it simple and practical", "Collaborate and promote visibility", "Start where you are", "Focus on value"], "correct": 0, "explanation": "Keep it simple and practical means using the minimum steps needed and cutting anything that doesn't add value."}, {"id": "q14", "cat": "valueSystem", "type": "mc", "question": "What connects the guiding principles, governance, and practices to every part of the organization on a recurring basis?", "options": ["Continual improvement", "The value chain", "Value streams", "PESTLE"], "correct": 0, "explanation": "Continual improvement recurs across every part of the Value System."}, {"id": "q28", "cat": "valueSystem", "type": "mc", "question": "A service desk team gradually rolls out a new ticketing system to one department before expanding company-wide. Which principle are they following?", "options": ["Progress iteratively with feedback", "Optimize and automate", "Think and work holistically", "Keep it simple and practical"], "correct": 0, "explanation": "Rolling out gradually and adjusting based on feedback is exactly what progress iteratively with feedback describes."}, {"id": "q29", "cat": "valueSystem", "type": "mc", "question": "Sharing dashboards openly so every team can see current incident status demonstrates which principle?", "options": ["Collaborate and promote visibility", "Focus on value", "Start where you are", "Optimize and automate"], "correct": 0, "explanation": "Openly sharing information so others can see what's happening is the core idea behind collaborate and promote visibility."}, {"id": "q36", "cat": "valueSystem", "type": "mc", "question": "Which statement about management practices is correct?", "options": ["They provide organizational resources for performing work toward an objective", "They replace the guiding principles", "There are exactly 7 of them", "They only apply to IT operations"], "correct": 0, "explanation": "Management practices are the organizational resources, including processes, people, and tools, used to carry out value chain activities."}, {"id": "q40", "cat": "valueSystem", "type": "mc", "question": "A manager insists on adding a new approval step 'because that's how we've always handled security,' even though it duplicates a check already performed elsewhere. Which principle is most directly being violated?", "options": ["Keep it simple and practical", "Focus on value", "Collaborate and promote visibility", "Start where you are"], "correct": 0, "explanation": "A redundant step that duplicates an existing check works against using the minimum number of steps needed \u2014 the core idea of keep it simple and practical."}, {"id": "q42", "cat": "valueSystem", "type": "mc", "question": "A manual approval step is slow, error-prone, and also redundant with an earlier check. In what order should the guiding principles be applied here?", "options": ["Keep it simple and practical first, removing the redundant step, then optimize and automate what remains", "Optimize and automate first, then simplify afterward", "Apply both simultaneously with no particular order", "Neither principle applies to automation decisions"], "correct": 0, "explanation": "Automating a broken process just makes it fail faster \u2014 simplify first, then automate what's left."}, {"id": "q15", "cat": "dimensions", "type": "mc", "question": "A new remote-work policy requires retraining support staff and redefining roles. Which dimension does this affect most directly?", "options": ["Organizations and people", "Information and technology", "Partners and suppliers", "Value streams and processes"], "correct": 0, "explanation": "Roles, structure, and staffing sit under organizations and people."}, {"id": "q16", "cat": "dimensions", "type": "mc", "question": "Which dimension covers external factors like a new data privacy law?", "options": ["None directly, PESTLE factors affect all four dimensions", "Only information and technology", "Only partners and suppliers", "Only organizations and people"], "correct": 0, "explanation": "PESTLE factors are external influences that can affect any or all of the four dimensions."}, {"id": "q17", "cat": "dimensions", "type": "mc", "question": "A healthcare IT team relies on a third party to host its EHR platform. Which dimension is most relevant?", "options": ["Partners and suppliers", "Organizations and people", "Information and technology", "Value streams and processes"], "correct": 0, "explanation": "Relationships with outside organizations sit under partners and suppliers."}, {"id": "q18", "cat": "dimensions", "type": "mc", "question": "PESTLE stands for Political, Economic, Social, Technological, Legal, and ___?", "options": ["Environmental", "Ethical", "Educational", "Experiential"], "correct": 0, "explanation": "The final factor is Environmental."}, {"id": "q30", "cat": "dimensions", "type": "mc", "question": "A company automates password resets to cut down on support tickets. Which two dimensions does this touch most directly?", "options": ["Information and technology, and organizations and people", "Partners and suppliers, and value streams and processes only", "Only information and technology", "Only organizations and people"], "correct": 0, "explanation": "Automating a process touches the technology used to do it and the people whose roles and workload change as a result."}, {"id": "q43", "cat": "dimensions", "type": "mc", "question": "A company outsources network monitoring to a third party, who then requires in-house staff to be trained to interpret their alerts correctly. Which two dimensions are directly involved?", "options": ["Partners and suppliers, and organizations and people", "Only partners and suppliers", "Only information and technology", "Value streams and processes, and partners and suppliers only"], "correct": 0, "explanation": "The outsourcing relationship sits under partners and suppliers, while the staff training need sits under organizations and people."}, {"id": "q19", "cat": "lifecycle", "type": "mc", "question": "Put these in the correct lifecycle order: Transition, Discover, Build, Design.", "options": ["Discover, Design, Build, Transition", "Design, Discover, Transition, Build", "Discover, Build, Design, Transition", "Build, Design, Discover, Transition"], "correct": 0, "explanation": "The lifecycle runs Discover, Design, Acquire, Build, Transition, Operate, Deliver, Support."}, {"id": "q20", "cat": "lifecycle", "type": "mc", "question": "A team is exploring whether there's real demand for a self-service password reset tool. Which activity are they in?", "options": ["Discover", "Design", "Acquire", "Operate"], "correct": 0, "explanation": "Exploring demand and opportunity is the Discover activity."}, {"id": "q21", "cat": "lifecycle", "type": "mc", "question": "Which activity involves testing and releasing a new service into live use?", "options": ["Transition", "Build", "Deliver", "Support"], "correct": 0, "explanation": "Transition covers moving a product or service into live use, including testing and release."}, {"id": "q22", "cat": "lifecycle", "type": "mc", "question": "Resolving a user's incident ticket after a service has gone live falls under which activity?", "options": ["Support", "Design", "Acquire", "Discover"], "correct": 0, "explanation": "Support covers resolving issues and requests that arise once a service is in use."}, {"id": "q31", "cat": "lifecycle", "type": "mc", "question": "Which lifecycle activities directly involve creating or obtaining the components of a product?", "options": ["Acquire and Build", "Discover and Design", "Transition and Operate", "Deliver and Support"], "correct": 0, "explanation": "Acquire, obtaining from suppliers, and Build, developing in-house, are the two activities that produce components."}, {"id": "q44", "cat": "lifecycle", "type": "mc", "question": "A team already has an approved design and is now assembling a solution using one in-house component and one purchased component. Which two activities are they most likely in?", "options": ["Build and Acquire", "Discover and Design", "Transition and Operate", "Deliver and Support"], "correct": 0, "explanation": "Acquire covers the purchased component, Build covers the in-house one \u2014 both come after Design."}, {"id": "q23", "cat": "streams", "type": "mc", "question": "What is the purpose of value stream mapping?", "options": ["To visualize the end-to-end steps and spot waste or delay", "To assign a monetary cost to each employee", "To replace the guiding principles", "To define SLAs"], "correct": 0, "explanation": "Value stream mapping visualizes steps to find waste, delay, and unnecessary handoffs."}, {"id": "q32", "cat": "streams", "type": "mc", "question": "Which best describes the relationship between value streams and the value chain?", "options": ["A value stream combines value chain activities and practices for a specific scenario", "They are unrelated concepts", "The value chain is a type of value stream", "Value streams only exist in the Support activity"], "correct": 0, "explanation": "A value stream strings together value chain activities and practices for a specific end-to-end scenario."}, {"id": "q37", "cat": "streams", "type": "mc", "question": "A team wants to see whether a request typically waits longest at the approval step or the fulfillment step. Which practice would they use?", "options": ["Value stream mapping", "Continual improvement alone", "Governance", "The guiding principles alone"], "correct": 0, "explanation": "Value stream mapping visualizes each step of a value stream, including exactly where delay or waiting happens."}, {"id": "q24", "cat": "ai", "type": "mc", "question": "An AI system that can independently plan and carry out a multi-step task with minimal human input is best described as:", "options": ["Agentic AI", "Generative AI", "Rule-based automation", "Warranty"], "correct": 0, "explanation": "Agentic AI plans and acts autonomously toward a goal."}, {"id": "q25", "cat": "ai", "type": "mc", "question": "Why does ITIL emphasize AI governance rather than just AI adoption?", "options": ["Because AI still needs accountability, transparency, and risk management like any other capability", "Because ITIL forbids using AI", "Because governance replaces the need for guiding principles", "Because AI is outside the four dimensions"], "correct": 0, "explanation": "AI is treated as a capability that still needs direction and control, not an exception to governance."}, {"id": "q33", "cat": "ai", "type": "mc", "question": "Which best distinguishes generative AI from agentic AI?", "options": ["Generative AI creates content; agentic AI plans and acts toward a goal", "Generative AI is always more accurate", "Agentic AI cannot use generative capabilities", "There is no meaningful difference"], "correct": 0, "explanation": "Generative AI produces new content; agentic AI takes that further by planning and acting toward a goal with less human input."}, {"id": "q38", "cat": "ai", "type": "mc", "question": "A support team lets an AI agent auto-resolve simple password resets, but requires human sign-off before any AI action affecting a production server. What does this reflect?", "options": ["AI governance applied proportionally to risk", "A rejection of agentic AI entirely", "A guiding principle being ignored", "A failure of the value chain"], "correct": 0, "explanation": "This is AI governance in practice \u2014 oversight applied in proportion to risk, allowing autonomy for low-risk actions while requiring approval for higher-risk ones."}, {"id": "q45", "cat": "ai", "type": "mc", "question": "An AI-assisted change process automatically approves low-risk standard changes but routes anything touching a regulated system to a human review board. What does this best describe?", "options": ["AI governance calibrated to risk", "A rejection of the guiding principles", "An example of utility without warranty", "A violation of the four dimensions"], "correct": 0, "explanation": "Applying stronger human oversight in proportion to risk is exactly what proportionate AI governance looks like in practice."}, {"id": "q26", "cat": "frameworks", "type": "mc", "question": "Which statement best describes how ITIL relates to PRINCE2?", "options": ["PRINCE2 manages temporary project work that often delivers changes ITIL then operates", "They are competing, incompatible frameworks", "PRINCE2 replaces the ITIL Value System", "ITIL only applies to projects, not services"], "correct": 0, "explanation": "PRINCE2 handles bounded project work; ITIL handles the ongoing service that project delivers into."}, {"id": "q34", "cat": "frameworks", "type": "mc", "question": "Which best describes why ITIL and Agile are often used together?", "options": ["Agile focuses on how work gets done iteratively; ITIL provides the wider service value context it happens within", "They solve the exact same problem", "Agile replaces the guiding principles", "ITIL forbids agile methods"], "correct": 0, "explanation": "Agile and ITIL address different layers \u2014 Agile is about how work gets done iteratively, ITIL is about the wider value system that work happens within."}, {"id": "q39", "cat": "frameworks", "type": "mc", "question": "A team already uses Scrum for iterative delivery and wants to adopt ITIL as well. What's the most accurate way to describe how these fit together?", "options": ["ITIL provides the wider service value context; Scrum governs how the iterative delivery work itself gets done", "ITIL and Scrum solve the exact same problem and can't be used together", "Scrum replaces the need for a service value chain", "ITIL forbids using Agile methods"], "correct": 0, "explanation": "ITIL and Agile approaches like Scrum operate at different layers, and are meant to complement rather than replace each other."}, {"id": "tf1", "cat": "terms", "type": "tf", "question": "A user and a customer are always the same person.", "answer": false, "explanation": "They can be the same person, but they're distinct roles \u2014 a user consumes the service, a customer defines requirements and is accountable for outcomes."}, {"id": "tf2", "cat": "terms", "type": "tf", "question": "Utility refers to how available and secure a service is.", "answer": false, "explanation": "That's warranty. Utility is about what the service does \u2014 its functionality, or fit for purpose."}, {"id": "tf3", "cat": "terms", "type": "tf", "question": "An SLA and a service level mean exactly the same thing.", "answer": false, "explanation": "A service level is the measured target. An SLA is the documented agreement that records it."}, {"id": "tf4", "cat": "terms", "type": "tf", "question": "A core value stream always involves direct interaction with the external customer.", "answer": true, "explanation": "That direct connection to the external customer is what defines a core value stream, as opposed to an enabling one."}, {"id": "tf5", "cat": "valueSystem", "type": "tf", "question": "The ITIL Value System has five components.", "answer": true, "explanation": "Guiding principles, governance, the value chain, management practices, and continual improvement."}, {"id": "tf6", "cat": "valueSystem", "type": "tf", "question": "Governance is considered one of the seven guiding principles.", "answer": false, "explanation": "Governance is a separate Value System component, not one of the guiding principles."}, {"id": "tf7", "cat": "valueSystem", "type": "tf", "question": "Optimize and automate means you should automate every process regardless of its current efficiency.", "answer": false, "explanation": "You optimize first, then automate \u2014 automating an inefficient process just makes it fail faster."}, {"id": "tf8", "cat": "valueSystem", "type": "tf", "question": "Continual improvement is a one-time initiative completed after a major project.", "answer": false, "explanation": "It's an ongoing, recurring activity across the whole organization."}, {"id": "tf9", "cat": "valueSystem", "type": "tf", "question": "The guiding principles apply only to formal service management projects, not day-to-day operations.", "answer": false, "explanation": "They apply in all circumstances, regardless of the type of work."}, {"id": "tf10", "cat": "valueSystem", "type": "tf", "question": "Start where you are means you should never change existing processes.", "answer": false, "explanation": "It means assess and reuse what exists before deciding what to change, not avoid change altogether."}, {"id": "tf11", "cat": "dimensions", "type": "tf", "question": "PESTLE factors are internal to the four dimensions.", "answer": false, "explanation": "They're external factors that influence the four dimensions from outside the organization."}, {"id": "tf12", "cat": "dimensions", "type": "tf", "question": "The four dimensions can affect each other.", "answer": true, "explanation": "A change in one dimension, like technology, often affects another, like people and roles."}, {"id": "tf13", "cat": "dimensions", "type": "tf", "question": "Partners and suppliers only refers to formal outsourcing contracts.", "answer": false, "explanation": "It also covers simpler relationships, like a single software license from a vendor."}, {"id": "tf14", "cat": "lifecycle", "type": "tf", "question": "The eight lifecycle activities must always happen in strict, one-directional order.", "answer": false, "explanation": "They're used iteratively \u2014 work can loop back to an earlier activity at any point."}, {"id": "tf15", "cat": "lifecycle", "type": "tf", "question": "Support in the lifecycle model refers to running a service day to day.", "answer": false, "explanation": "That's Operate. Support means resolving issues and requests that come up while the service is in use."}, {"id": "tf16", "cat": "lifecycle", "type": "tf", "question": "Acquire and Build both feed into producing a deployable product or service component.", "answer": true, "explanation": "Acquire obtains components from suppliers; Build develops them in house. Both lead toward a deployable result."}, {"id": "tf17", "cat": "streams", "type": "tf", "question": "Value stream mapping is used to identify waste and delay in a process.", "answer": true, "explanation": "That's exactly its purpose \u2014 visualizing steps to spot where value gets held up."}, {"id": "tf18", "cat": "ai", "type": "tf", "question": "Agentic AI can plan and carry out multi-step tasks with limited human intervention.", "answer": true, "explanation": "That autonomous planning and action is what distinguishes agentic AI from purely generative AI."}, {"id": "tf19", "cat": "ai", "type": "tf", "question": "ITIL treats AI adoption as exempt from governance requirements.", "answer": false, "explanation": "AI still needs accountability, transparency, and risk management, just like any other capability."}, {"id": "tf20", "cat": "frameworks", "type": "tf", "question": "PRINCE2 and ITIL manage the exact same type of work.", "answer": false, "explanation": "PRINCE2 manages temporary, bounded project work. ITIL manages ongoing services."}, {"id": "sa1", "cat": "terms", "type": "sa", "question": "In your own words, what's the difference between utility and warranty?", "modelAnswer": "Utility is what the service does \u2014 its functionality, or fit for purpose. Warranty is how well and reliably it does it \u2014 availability, capacity, security, continuity, or fit for use."}, {"id": "sa2", "cat": "terms", "type": "sa", "question": "Name the three consumer roles ITIL defines, and briefly describe each.", "modelAnswer": "Customer: defines requirements and is accountable for outcomes. User: uses the service day to day. Sponsor: authorizes the budget. One person can hold more than one role."}, {"id": "sa3", "cat": "terms", "type": "sa", "question": "What's the difference between an output and an outcome? Give a short example.", "modelAnswer": "An output is a deliverable of an activity, like a closed ticket. An outcome is the result that deliverable enables for the stakeholder, like the user being able to work again."}, {"id": "sa4", "cat": "terms", "type": "sa", "question": "Explain the difference between a core value stream and an enabling value stream.", "modelAnswer": "A core value stream creates value directly for an external customer. An enabling value stream supports other value streams internally, like supplier or workforce management, without touching the external customer directly."}, {"id": "sa5", "cat": "valueSystem", "type": "sa", "question": "List the five components of the ITIL Value System.", "modelAnswer": "Guiding principles, governance, the service value chain, management practices, and continual improvement."}, {"id": "sa6", "cat": "valueSystem", "type": "sa", "question": "List all seven ITIL guiding principles.", "modelAnswer": "Focus on value; start where you are; progress iteratively with feedback; collaborate and promote visibility; think and work holistically; keep it simple and practical; optimize and automate."}, {"id": "sa7", "cat": "valueSystem", "type": "sa", "question": "Explain what governance means in the ITIL Value System, in your own words.", "modelAnswer": "Governance is the means by which an organization is directed and controlled \u2014 evaluating, directing, and monitoring performance and compliance, usually from a leadership level."}, {"id": "sa8", "cat": "valueSystem", "type": "sa", "question": "What does the keep it simple and practical principle actually ask you to do?", "modelAnswer": "Use the minimum number of steps needed to accomplish an objective, and eliminate anything that doesn't contribute to value."}, {"id": "sa9", "cat": "valueSystem", "type": "sa", "question": "Why is continual improvement described as running through every other component, rather than being a standalone step?", "modelAnswer": "Because it's a recurring activity meant to be built into every part of the organization's ongoing work, not a one-time project."}, {"id": "sa10", "cat": "dimensions", "type": "sa", "question": "List the four dimensions of service management.", "modelAnswer": "Organizations and people; information and technology; partners and suppliers; value streams and processes."}, {"id": "sa11", "cat": "dimensions", "type": "sa", "question": "What does PESTLE stand for, and what role do PESTLE factors play?", "modelAnswer": "Political, Economic, Social, Technological, Legal, Environmental \u2014 external factors that can affect any or all of the four dimensions."}, {"id": "sa12", "cat": "lifecycle", "type": "sa", "question": "List the eight Product and Service Lifecycle activities, in order.", "modelAnswer": "Discover, Design, Acquire, Build, Transition, Operate, Deliver, Support \u2014 used iteratively rather than strictly in sequence."}, {"id": "sa13", "cat": "lifecycle", "type": "sa", "question": "What's the difference between the Operate and Support lifecycle activities?", "modelAnswer": "Operate means running the service day to day. Support means resolving issues and requests that come up while the service is in use."}, {"id": "sa14", "cat": "streams", "type": "sa", "question": "In your own words, what does value stream mapping help you see?", "modelAnswer": "It visualizes the end-to-end steps of a value stream so you can spot waste, delay, or handoffs that don't add value."}, {"id": "sa15", "cat": "ai", "type": "sa", "question": "Explain the difference between generative AI and agentic AI.", "modelAnswer": "Generative AI creates new content, like text, code, or images. Agentic AI can plan and carry out multi-step tasks with limited human intervention."}]}, "az900": {"categories": [{"key": "cloudConcepts", "label": "Cloud Concepts", "marks": 28}, {"key": "architecture", "label": "Architecture & Services", "marks": 38}, {"key": "management", "label": "Management & Governance", "marks": 34}], "flashcards": [{"id": "f1", "cat": "cloudConcepts", "front": "Cloud computing", "back": "The delivery of computing services \u2014 servers, storage, databases, networking, software \u2014 over the internet, with pay-as-you-go pricing instead of buying and maintaining physical infrastructure.", "detail": "This is the baseline definition the whole exam builds on. If a question describes 'renting' IT resources instead of owning them, it's pointing at this."}, {"id": "f2", "cat": "cloudConcepts", "front": "Shared responsibility model", "back": "A framework describing which security and management tasks the cloud provider handles versus the customer. The split shifts depending on IaaS, PaaS, or SaaS \u2014 the customer always keeps responsibility for their data and identities.", "detail": "Exam trap: no matter how much Microsoft manages, the customer is never off the hook for securing their own data and accounts."}, {"id": "f3", "cat": "cloudConcepts", "front": "Public vs. private vs. hybrid cloud", "back": "Public: resources owned and shared by a third-party provider. Private: dedicated to one organization, on-premises or hosted. Hybrid: combines both, often for compliance or a gradual migration.", "detail": "A healthcare org keeping patient records on-prem while running its website in Azure is a classic hybrid scenario."}, {"id": "f4", "cat": "cloudConcepts", "front": "Consumption-based model", "back": "Pricing where you pay only for the resources you actually use, instead of a large upfront purchase.", "detail": "This is the mechanism behind the CapEx-to-OpEx shift the exam likes to test."}, {"id": "f5", "cat": "cloudConcepts", "front": "CapEx vs. OpEx", "back": "CapEx is large upfront capital spending on infrastructure you own. OpEx is ongoing operating expense \u2014 paying for what you use as you use it. Cloud computing shifts spending from CapEx toward OpEx.", "detail": "If a scenario mentions avoiding a big hardware purchase, that's the CapEx-to-OpEx shift, not just 'saving money' in the abstract."}, {"id": "f6", "cat": "cloudConcepts", "front": "Serverless computing", "back": "A model where the provider manages the infrastructure automatically, and you're billed based on execution rather than provisioned capacity \u2014 you write code without managing servers.", "detail": "Azure Functions is the canonical serverless example on this exam."}, {"id": "f7", "cat": "cloudConcepts", "front": "Scalability vs. elasticity", "back": "Scalability is the general ability to handle more load by adding resources, manually or automatically. Elasticity specifically means resources scale up and down automatically in response to real-time demand.", "detail": "Elasticity is a specific kind of scalability \u2014 the automatic, dynamic kind. Not every scalable system is elastic."}, {"id": "f8", "cat": "cloudConcepts", "front": "Reliability & predictability", "back": "Reliability means a system recovers from failures and keeps functioning. Predictability means consistent performance and cost, so you can plan capacity and budget confidently.", "detail": "An unpredictable, spiky bill is a sign predictability isn't being managed well, even if the system is technically reliable."}, {"id": "f9", "cat": "cloudConcepts", "front": "IaaS vs. PaaS vs. SaaS", "back": "IaaS: rent infrastructure (VMs, storage, networking), you manage the OS and up. PaaS: rent a platform, you manage just your app and data. SaaS: rent a finished application, you just use it.", "detail": "Microsoft 365 is the textbook SaaS example. Azure App Service is the textbook PaaS example."}, {"id": "f10", "cat": "cloudConcepts", "front": "Choosing a cloud service type", "back": "Moving from IaaS to PaaS to SaaS gives you more that's managed for you, but less direct control. Match the scenario's control needs to the right type.", "detail": "If a question stresses 'wants full control of the OS,' that's IaaS. If it stresses 'just wants the app to work,' that's SaaS."}, {"id": "f11", "cat": "cloudConcepts", "front": "Spot pricing", "back": "A discounted pricing option for unused Azure capacity, in exchange for accepting that the VM can be evicted with little notice if Azure needs that capacity back.", "detail": "The trade-off \u2014 big discount for interruption risk \u2014 makes Spot the right answer for low-priority, interruption-tolerant workloads, never for anything mission-critical."}, {"id": "f12", "cat": "architecture", "front": "Azure regions & region pairs", "back": "A region is a set of datacenters in a geographic area. Region pairs are two regions in the same geography, at least 300 miles apart, used for disaster recovery \u2014 updates roll out to only one region in a pair at a time.", "detail": "The 300-mile / same-geography detail is a specific fact the exam likes to test directly."}, {"id": "f13", "cat": "architecture", "front": "Sovereign regions", "back": "Physically and logically isolated Azure regions for specific compliance needs, like Azure Government, operated separately from global Azure.", "detail": "These exist specifically so certain government or regulatory data never touches the general commercial cloud."}, {"id": "f14", "cat": "architecture", "front": "Availability zones", "back": "Physically separate datacenters within an Azure region, each with independent power, cooling, and networking, used to protect against a single datacenter failing.", "detail": "Region = geography. Availability zone = specific datacenter within that geography. An availability zone does NOT protect against a whole region going down."}, {"id": "f15", "cat": "architecture", "front": "Resources & resource groups", "back": "A resource is any deployable item in Azure, like a VM or database. A resource group is a logical container holding related resources, managed and billed together \u2014 and can contain resources from more than one region.", "detail": "Deleting a resource group deletes everything inside it \u2014 a common 'what happens if' exam scenario."}, {"id": "f16", "cat": "architecture", "front": "Subscriptions", "back": "A logical container that groups resource groups together, tied to billing and access management. An organization can have multiple subscriptions for different departments or environments.", "detail": "Subscriptions sit above resource groups and below management groups in the hierarchy."}, {"id": "f17", "cat": "architecture", "front": "Management groups", "back": "Containers that group multiple subscriptions together, letting you apply governance policies, like Azure Policy or RBAC, across many subscriptions at once.", "detail": "Useful for a large org that wants one security policy applied to every subscription without configuring each one separately. Deleting a management group does not delete the subscriptions inside it."}, {"id": "f18", "cat": "architecture", "front": "Resource hierarchy", "back": "From broadest to narrowest: management groups, then subscriptions, then resource groups, then individual resources. Settings applied higher up flow down and compound going down.", "detail": "A policy added at a lower scope can make things more restrictive than the parent required, but never less."}, {"id": "f19", "cat": "architecture", "front": "Compute types: VMs, containers, functions", "back": "VMs: full control, you manage the OS. Containers: lightweight, package an app with its dependencies, more portable than a VM. Functions: run small pieces of code on demand, fully serverless.", "detail": "As you move VM \u2192 container \u2192 function, management overhead drops and portability/scalability generally goes up."}, {"id": "f20", "cat": "architecture", "front": "VM options", "back": "Scale Sets automatically add or remove identical VMs based on demand or schedule. Availability sets group VMs so they don't all update or fail at once, within one datacenter. Azure Virtual Desktop delivers virtual desktops or apps to users.", "detail": "Scale Sets are about scaling out. Availability sets are about not losing everything at once during maintenance or a single-datacenter failure \u2014 not a whole-region failure."}, {"id": "f21", "cat": "architecture", "front": "Application hosting options", "back": "Web apps (App Service, PaaS, easiest), containers (more portable, more control), and virtual machines (most control, most management overhead) \u2014 pick based on how much you want to manage.", "detail": "App Service is the go-to answer when a scenario just needs 'a website, minimal management.'"}, {"id": "f22", "cat": "architecture", "front": "Virtual networking basics", "back": "A virtual network (VNet) is a private network in Azure. Subnets divide it into smaller segments. Peering connects VNets. Azure DNS resolves names. VPN Gateway and ExpressRoute connect on-premises networks to Azure.", "detail": "VPN Gateway travels over the public internet, encrypted. ExpressRoute is a private, dedicated connection \u2014 and is NOT encrypted by default, since it relies on the private connection itself."}, {"id": "f23", "cat": "architecture", "front": "Public vs. private endpoints", "back": "A public endpoint is reachable over the internet. A private endpoint gives a resource a private IP inside your VNet, so traffic never leaves the Microsoft network.", "detail": "Private endpoints are the answer whenever a scenario wants to reduce internet exposure for a resource like a database."}, {"id": "f24", "cat": "architecture", "front": "Azure Storage services", "back": "Blob (unstructured data), Files (managed file shares), Queue (messaging), and Table (NoSQL key-value) storage are the core Azure Storage services, all held within a storage account.", "detail": "The storage account is the top-level container; blobs, files, queues, and tables live inside it."}, {"id": "f25", "cat": "architecture", "front": "Storage tiers", "back": "Hot, Cool, Cold, and Archive tiers balance storage cost against access speed and retrieval cost \u2014 Hot is most expensive to store but cheapest/fastest to access, Archive is the opposite.", "detail": "Archive tier data can take hours to retrieve \u2014 a scenario needing frequent, fast access should never point to Archive, but one needing cheap, rarely-touched long-term storage does."}, {"id": "f26", "cat": "architecture", "front": "Redundancy options", "back": "LRS keeps copies in one datacenter. ZRS spreads copies across availability zones in one region. GRS/GZRS copies to a secondary paired region for disaster recovery.", "detail": "If a scenario needs protection against a whole region going down, LRS and ZRS are not enough \u2014 you need a geo-redundant option."}, {"id": "f27", "cat": "architecture", "front": "AzCopy vs. Storage Explorer vs. Azure File Sync", "back": "AzCopy is a command-line tool for scripted, one-time or bulk file transfers into Azure Storage. Storage Explorer is a GUI tool for browsing and managing storage data. Azure File Sync keeps an on-premises file server continuously synchronized with an Azure file share.", "detail": "File Sync is the odd one out \u2014 it's ongoing synchronization, not a one-time transfer tool like the other two."}, {"id": "f28", "cat": "architecture", "front": "Azure Migrate vs. Azure Data Box", "back": "Azure Migrate assesses and migrates on-premises servers and workloads into Azure, typically over the network. Azure Data Box is a physical device shipped to you for transferring very large datasets when network transfer would be too slow.", "detail": "If a scenario mentions terabytes of data and a slow internet connection, that's pointing at Data Box, not Migrate."}, {"id": "f29", "cat": "architecture", "front": "Microsoft Entra ID", "back": "Microsoft's cloud-based identity and access management service, formerly Azure Active Directory. Manages users, groups, and access to apps and resources.", "detail": "Renamed from Azure AD \u2014 expect both names to appear in materials, but Entra ID is the current name."}, {"id": "f30", "cat": "architecture", "front": "SSO, MFA, passwordless", "back": "Single sign-on: one login for multiple apps. Multifactor authentication: a second verification step beyond a password. Passwordless: authentication without a password at all, like a security key or authenticator app.", "detail": "These three get tested as distinct concepts \u2014 don't conflate MFA with passwordless, they're different approaches."}, {"id": "f31", "cat": "architecture", "front": "External identities", "back": "Lets people outside your organization, like partners or customers, sign in using their own identities rather than you creating them a new account in your directory.", "detail": "This is the answer when a scenario mentions collaborating with an outside company without issuing them internal accounts."}, {"id": "f32", "cat": "architecture", "front": "Conditional Access", "back": "Policies that grant or block access based on conditions like user location, device compliance state, or risk level \u2014 for example, requiring MFA only when signing in from an unfamiliar location.", "detail": "Conditional Access is about the conditions under which access is allowed \u2014 not just location, but device state, app, and risk level too \u2014 distinct from RBAC which is about what access is granted."}, {"id": "f33", "cat": "architecture", "front": "Azure RBAC", "back": "Role-based access control assigns permissions to users, groups, or applications at a specific scope \u2014 management group, subscription, resource group, or resource \u2014 following least-privilege principles.", "detail": "RBAC answers 'what can this identity do,' Conditional Access answers 'under what conditions can they do it.'"}, {"id": "f34", "cat": "architecture", "front": "Zero Trust", "back": "A security model that assumes no user or device is trusted by default, even inside the network perimeter \u2014 every request is verified based on identity, device, and context.", "detail": "\"Never trust, always verify\" is the one-line summary. This is the answer when a scenario shows a perimeter breach that still fails to grant access."}, {"id": "f35", "cat": "architecture", "front": "Defense-in-depth", "back": "A layered security strategy \u2014 physical, identity, perimeter, network, compute, application, and data layers \u2014 so that if one layer is breached, others still protect the resource.", "detail": "Think of it as concentric rings of security around your data, not a single wall \u2014 related to, but distinct from, Zero Trust."}, {"id": "f36", "cat": "architecture", "front": "Microsoft Defender for Cloud", "back": "A tool that assesses your security posture across Azure resources and gives recommendations to improve it, plus threat protection for workloads.", "detail": "Defender for Cloud is narrower and security-specific. Azure Advisor is broader, covering cost, reliability, and performance too."}, {"id": "f49", "cat": "architecture", "front": "Managed identity", "back": "An automatically-managed Entra ID identity for an Azure resource, like a VM or Function, letting it authenticate to other Azure services without embedding credentials in code.", "detail": "This is the answer whenever a scenario wants passwordless, credential-free authentication between Azure services."}, {"id": "f37", "cat": "management", "front": "Factors affecting Azure costs", "back": "Resource type, usage/consumption, region, and licensing all affect what you pay in Azure.", "detail": "Region matters because pricing varies by datacenter location \u2014 a detail that's easy to overlook."}, {"id": "f38", "cat": "management", "front": "Pricing calculator vs. TCO calculator", "back": "The Pricing calculator estimates the cost of Azure resources you plan to use. The Total Cost of Ownership calculator compares your current on-premises infrastructure cost against running it in Azure over time.", "detail": "If a scenario asks 'should we move to the cloud at all,' that's the TCO calculator. If it asks 'what will this specific setup cost,' that's the Pricing calculator."}, {"id": "f39", "cat": "management", "front": "Tags", "back": "Name/value pairs attached to resources for organizing and tracking, like by department or environment \u2014 useful for cost reporting and filtering in Cost Management.", "detail": "Tags don't affect how a resource functions, only how it's organized and reported on."}, {"id": "f40", "cat": "management", "front": "Microsoft Purview", "back": "A unified data governance service that helps you discover, classify, and protect sensitive data across your organization, including hybrid, non-Azure sources.", "detail": "Purview is about knowing what data you have and how sensitive it is, not about access control itself."}, {"id": "f41", "cat": "management", "front": "Azure Policy", "back": "Enforces organizational rules on resources, for example requiring a specific region or blocking a VM size, and evaluates and reports on compliance \u2014 it can even deny non-compliant deployments outright.", "detail": "Policy governs how resources must be configured. RBAC governs who can act on them \u2014 a distinction the exam tests directly."}, {"id": "f42", "cat": "management", "front": "Resource locks", "back": "A Delete lock blocks deletion only. A Read-only lock blocks both deletion and modification. Both override a user's normal permissions, regardless of what RBAC otherwise allows.", "detail": "Exam trap: a Delete lock will NOT stop someone from modifying a resource's settings \u2014 only a Read-only lock does that."}, {"id": "f43", "cat": "management", "front": "Portal, Cloud Shell, CLI, PowerShell", "back": "The Azure portal is the web GUI. Cloud Shell is a browser-based command line, no local install needed. Azure CLI and Azure PowerShell are command-line tools installed locally for scripting \u2014 four ways to manage the same resources.", "detail": "Cloud Shell running in the browser is what distinguishes it from CLI/PowerShell installed on your own machine."}, {"id": "f44", "cat": "management", "front": "Infrastructure as Code & ARM templates", "back": "IaC means defining infrastructure in code or config files instead of manual clicks, so deployments are repeatable and version-controllable. ARM templates are Azure's native JSON format for declaring what resources to deploy.", "detail": "Repeatability and version control are the key benefits IaC brings that clicking through the portal doesn't."}, {"id": "f45", "cat": "management", "front": "Azure Advisor", "back": "A free tool that analyzes your resource configuration and usage, then gives personalized recommendations across cost, security, reliability, and performance.", "detail": "Advisor is broad (cost, security, reliability, performance). Defender for Cloud is specifically security-focused."}, {"id": "f46", "cat": "management", "front": "Azure Monitor", "back": "Collects and analyzes telemetry from your Azure resources \u2014 Log Analytics stores and queries logs, Azure Monitor alerts notify you of conditions, and Application Insights monitors live applications.", "detail": "Log Analytics is the query/storage layer inside Azure Monitor, not a separate standalone product."}, {"id": "f47", "cat": "management", "front": "Azure Arc", "back": "Extends Azure management tools, like Azure Policy and RBAC, to resources outside Azure \u2014 on-premises servers, other clouds, or edge devices \u2014 managed with the same tools as native Azure resources.", "detail": "Arc is the answer whenever a scenario wants 'one pane of glass' for Azure plus non-Azure infrastructure."}, {"id": "f48", "cat": "management", "front": "Azure Service Health", "back": "Reports on the health of the Azure platform itself \u2014 like an ongoing outage in a region \u2014 separate from the health of your own specific resources.", "detail": "Service Health = is Azure itself having a problem. Azure Monitor = is my stuff having a problem. Different questions, different tools."}], "questions": [{"id": "q1", "cat": "cloudConcepts", "type": "mc", "question": "A startup wants to launch quickly with minimal infrastructure management, but wants to preserve the ability to move to another provider later if pricing changes. Which service model best balances speed with portability?", "options": ["IaaS", "PaaS", "SaaS", "On-premises hosting"], "correct": 0, "explanation": "IaaS resources like VMs are generally the most portable between providers. PaaS often relies on provider-specific platform features that make migrating away harder."}, {"id": "q2", "cat": "cloudConcepts", "type": "mc", "question": "A finance team complains their monthly Azure bill is unpredictable and spikes randomly. Which cloud benefit is NOT being effectively realized here?", "options": ["Predictability", "Scalability", "High availability", "Elasticity"], "correct": 0, "explanation": "Predictability is about consistent, forecastable cost and performance \u2014 an erratic bill signals this benefit isn't being managed well."}, {"id": "q3", "cat": "cloudConcepts", "type": "mc", "question": "Which statement correctly distinguishes scalability from elasticity?", "options": ["Scalability is the general ability to handle more load by adding resources; elasticity is that scaling happening automatically in response to demand", "Scalability and elasticity both refer specifically to manually adding more virtual machines to a deployment", "Elasticity only applies to storage, not compute", "Scalability only applies to PaaS services"], "correct": 0, "explanation": "Elasticity is the automatic, dynamic form of the broader concept of scalability."}, {"id": "q4", "cat": "cloudConcepts", "type": "mc", "question": "A company currently spends heavily on capital equipment refreshes every three years for its datacenter. Moving fully to Azure IaaS would primarily shift this spending pattern to:", "options": ["OpEx", "A smaller but still recurring CapEx", "No change in spending pattern", "Zero cost"], "correct": 0, "explanation": "Cloud computing shifts organizations away from large upfront capital purchases toward ongoing operating expense."}, {"id": "q5", "cat": "cloudConcepts", "type": "mc", "question": "Which of these best illustrates the shared responsibility model shifting MORE responsibility to Microsoft, compared with a self-managed deployment?", "options": ["Moving a database to Azure SQL Database (PaaS) instead of a self-managed SQL Server on a VM", "Moving a file server to an Azure VM running the same OS as before", "Running a custom-configured directory service on a self-managed VM", "None of these change the responsibility split"], "correct": 0, "explanation": "PaaS services like Azure SQL Database hand patching and infrastructure management to Microsoft, shifting more of the split toward the provider than a lift-and-shift VM does."}, {"id": "q6", "cat": "cloudConcepts", "type": "mc", "question": "A team wants to run a low-priority batch job at the lowest possible cost, and can tolerate the job being interrupted and restarted if Azure needs the capacity back. Which pricing approach fits?", "options": ["Spot pricing", "Reserved instances", "Standard pay-as-you-go pricing", "A dedicated private cloud"], "correct": 0, "explanation": "Spot pricing offers deep discounts in exchange for the possibility of eviction with little notice \u2014 ideal for interruption-tolerant, low-priority work."}, {"id": "q7", "cat": "cloudConcepts", "type": "mc", "question": "Which combination correctly pairs a cloud service type with a typical real-world example?", "options": ["SaaS \u2013 Microsoft 365; PaaS \u2013 Azure App Service; IaaS \u2013 Azure Virtual Machines", "SaaS \u2013 Azure Virtual Machines; PaaS \u2013 Microsoft 365; IaaS \u2013 Azure App Service", "IaaS \u2013 Microsoft 365; SaaS \u2013 Azure App Service; PaaS \u2013 Azure Virtual Machines", "All three of these are examples of PaaS"], "correct": 0, "explanation": "Microsoft 365 is a finished app (SaaS), App Service is a managed platform (PaaS), and VMs are raw infrastructure (IaaS)."}, {"id": "q8", "cat": "cloudConcepts", "type": "mc", "question": "A retailer's site traffic multiplies 10x during a single holiday weekend, then returns to normal a few days later. Which cloud characteristic most directly and cost-effectively addresses this?", "options": ["Elasticity", "Sovereign regions", "Resource locks", "Zero Trust"], "correct": 0, "explanation": "Elasticity lets resources scale up automatically for the surge and back down afterward, avoiding paying for peak capacity year-round."}, {"id": "q9", "cat": "cloudConcepts", "type": "mc", "question": "Why might an organization choose a hybrid cloud model even though it's more complex to manage than pure public cloud?", "options": ["Regulatory or data residency requirements may require some data to stay on-premises", "Hybrid cloud is always cheaper than public cloud", "Hybrid cloud removes the need for any identity management", "Public cloud cannot scale as well as hybrid cloud"], "correct": 0, "explanation": "Compliance and data residency needs are a common, legitimate reason to keep some workloads on-premises while using public cloud elsewhere."}, {"id": "q10", "cat": "cloudConcepts", "type": "mc", "question": "A finance department wants to compare five years of projected on-premises costs against five years of projected Azure costs before deciding whether to migrate at all. Which tool fits?", "options": ["The Total Cost of Ownership (TCO) calculator", "The Azure Pricing calculator", "Azure Cost Management", "Azure Advisor"], "correct": 0, "explanation": "The TCO calculator is built specifically to compare on-premises cost against Azure cost, unlike the Pricing calculator, which estimates cost of specific planned resources."}, {"id": "q11", "cat": "cloudConcepts", "type": "mc", "question": "Which of the following is NOT typically considered a benefit of cloud computing?", "options": ["Guaranteed zero cost regardless of usage", "Scalability", "High availability", "Reliability"], "correct": 0, "explanation": "Cloud computing is consumption-based, not free \u2014 the other three are genuine cloud benefits."}, {"id": "q41", "cat": "cloudConcepts", "type": "mc", "question": "A company wants to avoid vendor lock-in as much as possible while still gaining cloud cost savings. Which general guidance is most accurate?", "options": ["IaaS workloads are generally easier to move between providers than deeply-integrated PaaS/SaaS workloads, though some lock-in risk always exists", "Cloud computing eliminates vendor lock-in entirely", "PaaS is always more portable than IaaS", "Vendor lock-in only applies to on-premises systems"], "correct": 0, "explanation": "IaaS resources are closer to raw infrastructure and generally port more easily than workloads built around a provider's specific PaaS or SaaS features."}, {"id": "q12", "cat": "architecture", "type": "mc", "question": "A company has Dev, Test, and Prod subscriptions and wants one policy requiring 'US regions only' applied consistently across all three, without configuring it three separate times. Where should it be assigned?", "options": ["At a management group containing all three subscriptions", "At each resource group individually", "Only through RBAC role assignments", "Policy cannot be applied across multiple subscriptions at once"], "correct": 0, "explanation": "Management groups let you assign governance once and have it flow down to every subscription beneath them."}, {"id": "q13", "cat": "architecture", "type": "mc", "question": "A team needs compute for a task that runs unpredictably, roughly twice a month, triggered by an uploaded file, and finishes in under 10 minutes each time. Which is the most cost-effective choice?", "options": ["Azure Functions (serverless)", "A permanently running virtual machine", "A VM Scale Set with a fixed minimum of 5 instances", "Azure Virtual Desktop"], "correct": 0, "explanation": "Serverless Functions only bill for actual execution time, making them far more cost-effective than infrastructure that runs constantly for rare, short tasks."}, {"id": "q14", "cat": "architecture", "type": "mc", "question": "A company needs its on-premises network connected to Azure with predictable, low latency, avoiding the public internet entirely, for a latency-sensitive workload. Which service fits best?", "options": ["ExpressRoute", "VPN Gateway", "Azure Peering Service for websites", "Azure Front Door"], "correct": 0, "explanation": "ExpressRoute provides a private, dedicated connection that doesn't traverse the public internet, unlike VPN Gateway."}, {"id": "q15", "cat": "architecture", "type": "mc", "question": "Which statement about VM Scale Sets versus availability sets is correct?", "options": ["Scale Sets automatically adjust the number of VM instances based on demand or a schedule; availability sets are a fixed group of VMs distributed to reduce simultaneous failure", "Both automatically scale the number of VM instances up and down based on real-time demand", "Availability sets automatically add and remove VMs based on load", "Scale Sets guarantee zero downtime during Azure platform maintenance"], "correct": 0, "explanation": "Scale Sets handle automatic scaling; availability sets are about distributing existing VMs to avoid simultaneous failure or maintenance impact."}, {"id": "q16", "cat": "architecture", "type": "mc", "question": "A company stores compliance archives that are rarely accessed but must be retrievable within a few hours if ever needed, at the lowest possible storage cost. Which storage tier fits best?", "options": ["Archive", "Hot", "Cool", "Premium"], "correct": 0, "explanation": "Archive tier minimizes storage cost; a several-hour retrieval window is consistent with Archive's rehydration time."}, {"id": "q17", "cat": "architecture", "type": "mc", "question": "Which correctly distinguishes zone-redundant storage (ZRS) from geo-redundant storage (GRS)?", "options": ["ZRS replicates across availability zones within one region; GRS also replicates to a second, paired region", "ZRS and GRS both only replicate within a single datacenter", "GRS is cheaper than ZRS because it uses fewer datacenters", "ZRS protects against a full regional outage; GRS does not"], "correct": 0, "explanation": "ZRS covers zone-level failures within a region. GRS goes further, adding a secondary paired region for protection against a full regional outage."}, {"id": "q18", "cat": "architecture", "type": "mc", "question": "A company wants every engineer to get their own isolated Azure environment for testing, with the company's security policies applied automatically without extra configuration per environment. Which combination enables this?", "options": ["Separate subscriptions per engineer, grouped under a management group with policy assigned at that level", "One resource group shared by all engineers with individual RBAC roles", "A single VM with multiple local user accounts", "Region pairs configured per engineer"], "correct": 0, "explanation": "Subscriptions give isolation, and a management group above them lets policy apply automatically to every subscription beneath it."}, {"id": "q19", "cat": "architecture", "type": "mc", "question": "Which identity feature lets a partner organization's employees sign into your app using their own company credentials, without you creating accounts for them in your directory?", "options": ["External identities", "Conditional Access", "Azure RBAC", "Zero Trust"], "correct": 0, "explanation": "External identities let outside users authenticate with their own existing identity rather than a new account in your directory."}, {"id": "q20", "cat": "architecture", "type": "mc", "question": "A company wants to require MFA only when an employee signs in from a country they've never signed in from before. Which feature enables this specific, condition-based rule?", "options": ["Conditional Access", "Multifactor authentication alone", "Azure RBAC", "External identities"], "correct": 0, "explanation": "Conditional Access applies rules based on conditions like sign-in location \u2014 MFA alone is just the second factor, not the condition logic."}, {"id": "q21", "cat": "architecture", "type": "mc", "question": "Which best describes the difference between Azure RBAC and Conditional Access?", "options": ["RBAC controls what actions an identity can perform on resources; Conditional Access controls the conditions under which sign-in is allowed", "Both control sign-in conditions like location and device state, with no distinction in what they enforce", "Conditional Access only works for external identities", "RBAC applies only to storage accounts"], "correct": 0, "explanation": "RBA
