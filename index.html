"Unlike Entra ID Identity Protection, which focuses on cloud sign-ins, Defender for Identity is specifically about detecting attacks against the on-premises identity plane itself."}, {"id": "f37", "cat": "monitoring", "front": "Performance Monitor and Data Collector Sets", "back": "Performance Monitor displays real-time or logged performance counters (like CPU, memory, disk queue length). A Data Collector Set groups counters, trace data, and configuration into a single, reusable, schedulable collection job, so the same set of metrics can be captured consistently over time rather than configured freshly each time.", "detail": "A Data Collector Set can be configured to trigger an alert, or run a task, when a counter crosses a defined threshold, which is what turns raw performance data into a proactive monitoring signal instead of a report someone has to read manually."}, {"id": "f38", "cat": "monitoring", "front": "Azure Monitor Agent (AMA) and Data Collection Rules (DCR)", "back": "AMA is the unified agent installed on Azure VMs, Arc-enabled servers, or other machines to collect logs and performance data. A Data Collection Rule defines exactly what that agent collects, any transformation applied, and which Log Analytics workspace (or other destination) it is sent to.", "detail": "AMA replaces the older Log Analytics (MMA/OMS) agent, and one DCR can be associated with many machines, which is what lets a single collection configuration apply consistently across a whole hybrid fleet."}, {"id": "f39", "cat": "monitoring", "front": "Log Analytics workspace and Kusto Query Language (KQL)", "back": "A Log Analytics workspace is the container where Azure Monitor stores collected log data, queried using KQL, a read-only query language built around piping data through a chain of operators (like where, summarize, and project) to filter and shape results.", "detail": "Workspace-based queries also power log alert rules, so a KQL query that flags a problem interactively can usually be turned directly into an automated alert with very little extra work."}, {"id": "f40", "cat": "monitoring", "front": "Azure Monitor alert rules and action groups", "back": "A metric alert evaluates a numeric signal (like CPU percentage) against a threshold on a schedule. A log alert runs a KQL query on a schedule and fires based on its results. An action group defines what happens when either fires \u2014 for example, an email, an SMS, a webhook, or an Azure Automation runbook.", "detail": "Separating the alert rule (the condition) from the action group (the response) means the same action group, say, paging the on-call team, can be reused across many different, unrelated alert rules."}, {"id": "f41", "cat": "monitoring", "front": "Windows Admin Center monitoring and alerts", "back": "Windows Admin Center shows real-time and historical performance data for a managed server directly in the browser, and its Azure Monitor extension can forward that data to Log Analytics and configure alert rules from the same interface, without switching to the Azure portal.", "detail": "This lets an admin manage a purely on-premises server's health with the same tool used for day-to-day administration, while still optionally layering on Azure-based alerting for it."}, {"id": "f42", "cat": "monitoring", "front": "Azure Update Manager", "back": "Centrally assesses update compliance and schedules update installation across Azure VMs and Azure Arc-enabled on-premises (or other-cloud) servers from one place in the Azure portal, replacing the need to manage separate on-premises patching tools for those machines.", "detail": "A server must be Arc-enabled, or be a native Azure VM, before Update Manager can see or patch it at all \u2014 a plain on-premises server with no Arc agent and no Azure connection is invisible to it."}, {"id": "f43", "cat": "monitoring", "front": "Reliability Monitor and Event Viewer for troubleshooting", "back": "Reliability Monitor plots a rolling stability index over time and correlates it with specific events (installs, crashes, updates), making it easy to spot when a problem started. Event Viewer provides the full, detailed event logs (System, Application, Security, and role-specific logs) needed to diagnose exactly what happened at that point.", "detail": "Reliability Monitor is a good first stop for figuring out when something started going wrong, after which Event Viewer's more detailed, filterable logs are what actually confirm the root cause."}], "questions": [{"id": "q1", "cat": "adDs", "type": "mc", "question": "The domain controller holding the PDC Emulator role for contoso.local suffers unrecoverable hardware failure with no viable backup. No other role-transfer window is available before this affects users. What should the administrator do to restore that role's function?", "options": ["Wait for the role to automatically fail over to another DC", "Rebuild the failed DC with the same name and it will reclaim the role automatically", "Seize the PDC Emulator role onto a surviving, healthy domain controller", "Promote a new DC and manually copy the SYSVOL folder from a backup"], "correct": 2, "explanation": "FSMO roles never fail over automatically \u2014 when the role holder is permanently gone, an administrator must seize the role onto a surviving DC (typically with PowerShell's Move-ADDirectoryServerOperationMasterRole -Force, or ntdsutil). Simply rebuilding a DC with the same name doesn't restore a role that was never transferred off cleanly."}, {"id": "q2", "cat": "adDs", "type": "mc", "question": "An organization has two Active Directory sites connected by a slow WAN link. Administrators notice changes made at one site take up to 15 minutes to appear at the other, while changes within the same site appear almost immediately. What explains this difference?", "options": ["Inter-site replication runs on a configurable schedule and is compressed to conserve WAN bandwidth, while intra-site replication is near-immediate and uncompressed", "The two sites are in different forests, so replication uses SMTP instead of RPC", "Global Catalog servers replicate slower than non-GC domain controllers by design", "FSMO role holders always replicate last, regardless of site topology"], "correct": 0, "explanation": "This is exactly how intra-site vs. inter-site replication is designed to behave: intra-site uses change notification for near-real-time convergence, while inter-site replication is scheduled and compressed specifically to be considerate of limited WAN links. It has nothing to do with GC status, forest boundaries, or FSMO roles."}, {"id": "q3", "cat": "adDs", "type": "mc", "question": "Two companies with separate Active Directory forests merge and need users in either forest to authenticate to resources in the other, with the relationship extending automatically to every domain in both forests. Which trust should be configured?", "options": ["A one-way external trust between the two root domains", "A shortcut trust between the two forest roots", "A realm trust to a non-Windows Kerberos environment", "A two-way forest trust between the two forest root domains"], "correct": 3, "explanation": "A forest trust is transitive across every domain within both forests, which is exactly what's needed here, and making it two-way lets authentication flow in either direction. An external trust is explicitly non-transitive and would need to be repeated between every domain pair, and a shortcut trust only optimizes referral paths within a single existing forest."}, {"id": "q4", "cat": "adDs", "type": "mc", "question": "A GPO linked at the domain level sets a screen lock timeout of 15 minutes. A GPO linked to a specific OU sets it to 5 minutes for higher-security accounts, and neither GPO is marked Enforced. Users in that OU report a 5-minute lockout. Why?", "options": ["Domain-linked GPOs are always ignored when any OU-level GPO exists", "GPOs are processed in Local, Site, Domain, OU order, so the OU-linked GPO applies last and wins the conflict", "The OU GPO must have Block Inheritance enabled to take precedence", "Group Policy conflicts are resolved alphabetically by GPO name"], "correct": 1, "explanation": "With neither GPO enforced, normal processing order (Local, Site, Domain, OU) applies, and the setting from whichever GPO is processed last \u2014 the one closest to the object, here the OU-linked GPO \u2014 wins. Block Inheritance affects whether higher-level GPOs apply at all, not which of two applying GPOs wins a setting conflict."}, {"id": "q5", "cat": "adDs", "type": "mc", "question": "A company wants Microsoft Entra ID sign-in to keep working for users even during a brief on-premises Active Directory outage, without standing up and maintaining AD FS servers. Which Microsoft Entra Connect authentication method should they choose?", "options": ["Password Hash Synchronization", "Federation with AD FS", "Pass-through Authentication", "Seamless SSO used on its own with no other method"], "correct": 0, "explanation": "Password Hash Synchronization stores a hash of the password hash in Microsoft Entra ID, so authentication can complete in the cloud even if on-premises AD is temporarily unreachable. Pass-through Authentication and Federation both validate the password against on-premises infrastructure at sign-in time, which fails if that infrastructure is down."}, {"id": "q6", "cat": "adDs", "type": "mc", "question": "A branch office with minimal physical security needs a local domain controller for fast logon, but the security team is worried about credential exposure if the hardware is stolen. Which deployment addresses this concern while still providing local authentication?", "options": ["A Read-Only Domain Controller with a restrictive Password Replication Policy", "A writable DC with BitLocker enabled and no other changes", "A Global Catalog server with the Infrastructure Master role", "A domain controller placed in its own dedicated forest"], "correct": 0, "explanation": "An RODC caches credentials only for accounts explicitly permitted by its Password Replication Policy, and holds a filtered attribute set, so theft of the hardware exposes far fewer credentials than a writable DC would. BitLocker helps with data-at-rest but doesn't limit which credentials the DC caches in the first place."}, {"id": "q7", "cat": "adDs", "type": "mc", "question": "A company runs an application pool identity across four load-balanced IIS servers and wants a single service identity used for Kerberos authentication, with AD automatically rotating its password across all four servers with zero manual synchronization. What should they configure?", "options": ["A single standalone Managed Service Account shared across all four servers", "A group Managed Service Account (gMSA) authorized for use on all four servers", "A shared domain user account with a manually scripted password rotation task", "Four separate standalone MSAs, one per server, joined into a single security group"], "correct": 1, "explanation": "A gMSA is specifically designed to be used across multiple hosts, with AD managing and replicating its password automatically to every server authorized to use it. A standalone MSA is explicitly tied to a single computer and cannot be shared this way \u2014 attempting it doesn't work regardless of grouping."}, {"id": "q8", "cat": "hybridWorkloads", "type": "mc", "question": "A company wants to apply Azure Policy and centralized Azure Monitor alerting to a set of on-premises Windows Servers, without migrating any workloads into Azure. Which approach achieves this?", "options": ["Enable Azure Arc-enabled servers with the Connected Machine agent on each server", "Move each server into an Azure availability set", "Install Windows Admin Center and connect it to the Azure portal", "Configure ExpressRoute between the on-premises network and Azure"], "correct": 0, "explanation": "Azure Arc-enabled servers projects an on-premises server into Azure Resource Manager via the Connected Machine agent, making Azure Policy, Monitor, and other Azure management services available to it without moving the workload at all. ExpressRoute only provides network connectivity, and Windows Admin Center is a separate on-premises management tool, not an Azure resource-projection mechanism."}, {"id": "q9", "cat": "hybridWorkloads", "type": "mc", "question": "An organization manages a mix of Server Core and Desktop Experience servers across two sites and wants a single, modern, browser-based tool that can manage both without RDP, including servers with no local GUI at all. What should they deploy?", "options": ["Remote Desktop Services with a full desktop session to each server", "Windows Admin Center", "Server Manager installed locally on every Server Core machine", "A dedicated jump box running the full Desktop Experience for every managed server"], "correct": 1, "explanation": "Windows Admin Center is exactly this: a browser-based management surface that works equally well against Server Core (which lacks a local GUI shell) and Desktop Experience servers, all from one gateway. Server Manager's full GUI can't run locally on Server Core at all, and RDP-based approaches add overhead this scenario doesn't need."}, {"id": "q10", "cat": "hybridWorkloads", "type": "mc", "question": "An administrator wants to patch every node in a six-node Hyper-V failover cluster with the latest cumulative update, one node at a time, automatically draining each node's VMs to other nodes before it reboots. Which feature accomplishes this without manual live migration of each workload?", "options": ["Cluster-Aware Updating (CAU)", "Storage Replica", "Network ATC", "Scale-Out File Server"], "correct": 0, "explanation": "CAU is built exactly for this: it orchestrates draining, patching, and rebooting each cluster node in turn with no manual live migration required. The other three options address storage replication, network configuration, and file-serving roles respectively, none of which handle patch orchestration."}, {"id": "q11", "cat": "hybridWorkloads", "type": "mc", "question": "A company runs two standalone Hyper-V hosts, one at its primary site and one at a secondary site, with no Failover Clustering configured between them and no shared storage. They want a specific VM's changes replicated to the secondary host roughly every 30 seconds, with the ability to fail over manually if the primary host fails. Which feature fits without requiring a cluster?", "options": ["Hyper-V Replica", "Storage Spaces Direct", "Cluster-Aware Updating", "Scale-Out File Server"], "correct": 0, "explanation": "Hyper-V Replica works between two standalone Hyper-V hosts with no clustering or shared storage required, replicating a VM asynchronously as often as every 30 seconds. The other three options all depend on Failover Clustering, which this scenario explicitly does not have."}, {"id": "q12", "cat": "hybridWorkloads", "type": "mc", "question": "An organization is decommissioning an aging file server and wants to move its shares to a new server while preserving the old server's name and IP address, so client UNC paths keep working with no reconfiguration. Which tool is purpose-built for this?", "options": ["Windows Server Migration Tools (WSMT)", "Active Directory Migration Tool (ADMT)", "Storage Migration Service", "Printer Migration Wizard"], "correct": 2, "explanation": "Storage Migration Service migrates files, shares, and their settings, and can then transfer the source server's name and IP address to the destination so clients see no change at all. WSMT and ADMT handle general role settings and AD objects respectively, not this identity-transfer step, and the Printer Migration Wizard is specific to print servers."}, {"id": "q13", "cat": "vmContainers", "type": "mc", "question": "A Hyper-V host has one physical NIC. Several VMs on that host need to reach resources on the physical LAN, and the host itself should also retain LAN connectivity through that same NIC. Which virtual switch type should be created?", "options": ["Private virtual switch", "Internal virtual switch bound to a new virtual NIC only", "External virtual switch with 'Allow management operating system to share this network adapter' enabled", "No virtual switch is needed if the VMs use NAT"], "correct": 2, "explanation": "An external switch bound to the physical NIC gives VMs access to the physical network, and explicitly allowing the management OS to share that adapter keeps the host itself connected through the same NIC. A private switch isolates VMs from everything outside the host, and an internal switch alone doesn't reach the physical LAN at all."}, {"id": "q14", "cat": "vmContainers", "type": "mc", "question": "A new VM must support Secure Boot and UEFI firmware for compliance reasons. What must be true about how the VM is created?", "options": ["It must be created as a Generation 1 VM with Secure Boot manually enabled afterward", "Generation doesn't matter, as long as Secure Boot is enabled in the VM settings", "It must be created as a Generation 2 VM, since only Generation 2 supports UEFI firmware and Secure Boot", "It must run inside a Hyper-V isolated container instead of as a VM"], "correct": 2, "explanation": "Secure Boot and UEFI firmware are only available on Generation 2 VMs \u2014 Generation 1 emulates legacy BIOS and has no UEFI support at all, and this can't be changed after the fact since a VM's generation is fixed at creation."}, {"id": "q15", "cat": "vmContainers", "type": "mc", "question": "An administrator wants to move a running, business-critical VM from one Hyper-V host to another with zero perceptible downtime for connected users, ahead of planned host maintenance. Which feature accomplishes this?", "options": ["Hyper-V Replica, failing over to the replica VM", "Exporting and re-importing the VM on the new host", "A production checkpoint applied on the new host", "Live Migration, given shared/SMB storage and compatible processors between hosts"], "correct": 3, "explanation": "Live Migration is designed specifically to move a running VM between hosts with no perceptible downtime, provided the hosts share (or can access) the same storage and have compatible processors or Processor Compatibility Mode enabled. Hyper-V Replica failover is a DR action against an already-replicated but offline copy, not a live, zero-downtime move."}, {"id": "q16", "cat": "vmContainers", "type": "mc", "question": "Two competing customers' workloads must run as containers on the same shared host, with a requirement that a kernel-level compromise in one customer's container cannot affect the other's. Which container isolation mode meets this requirement?", "options": ["Process isolation, since it is the default mode", "Hyper-V isolation, since each container runs its own kernel inside a lightweight utility VM", "Either mode, since both provide equivalent kernel isolation", "Nested virtualization without containers at all"], "correct": 1, "explanation": "Hyper-V isolation gives each container its own kernel instance inside a lightweight utility VM, providing VM-grade separation appropriate for mutually distrusting tenants. Process isolation shares the host's single kernel across all containers, which does not meet a requirement for containing a kernel-level compromise."}, {"id": "q17", "cat": "networking", "type": "mc", "question": "A company wants DNS records for a zone to replicate automatically and securely to every domain controller, with support for secure dynamic updates restricted to authenticated computers. Which zone type should they choose?", "options": ["A standard secondary zone", "An Active Directory-integrated zone", "A stub zone", "A standard primary zone stored only in a text file"], "correct": 1, "explanation": "AD-integrated zones store zone data in Active Directory itself, giving automatic multi-master replication to every DC and enabling secure dynamic updates restricted to authenticated, authorized computers. A standard primary zone lacks that AD-based security and multi-master replication, and secondary/stub zones are read-only or partial by design."}, {"id": "q18", "cat": "networking", "type": "mc", "question": "A branch office needs its own local DHCP server for resilience if the WAN link fails, but under normal conditions the central datacenter's DHCP server should handle all lease requests so IP assignment stays centrally managed. Which DHCP failover mode fits?", "options": ["Load balance mode with a 50/50 split", "No failover \u2014 configure two entirely separate, non-overlapping scopes", "Hot standby mode, with the datacenter server as active and the branch server as standby", "Load balance mode with the branch office server weighted higher"], "correct": 2, "explanation": "Hot standby mode designates one server (the datacenter server, here) as active under normal conditions, with the other only stepping in if the active server becomes unreachable \u2014 exactly matching this requirement. Load balance mode has both servers actively answering requests all the time, which doesn't match wanting the datacenter server to normally handle everything."}, {"id": "q19", "cat": "networking", "type": "mc", "question": "A company needs the most predictable latency and highest available bandwidth for a latency-sensitive hybrid application connecting an on-premises datacenter to Azure, and cost is a secondary concern compared to reliability. Which connectivity option best fits?", "options": ["A single site-to-site VPN tunnel over the public internet", "Point-to-site VPN configured on each application server", "Public internet connectivity with no VPN, using only TLS for the application traffic", "ExpressRoute, using a private, dedicated circuit from a connectivity provider"], "correct": 3, "explanation": "ExpressRoute provides a private, dedicated circuit that avoids the public internet entirely, giving more predictable latency and higher available bandwidth than a VPN \u2014 matching a scenario where reliability outweighs cost. A site-to-site or point-to-site VPN both still ride over the variable public internet."}, {"id": "q20", "cat": "networking", "type": "mc", "question": "A company deploys 802.1X authentication for wired switch ports and wants a centralized RADIUS server that can also handle VPN authentication requests from the same policy engine. What role should be deployed?", "options": ["DFS Replication", "Active Directory Certificate Services with no NPS role", "Network Policy Server (NPS)", "DHCP failover"], "correct": 2, "explanation": "NPS is Microsoft's RADIUS server and proxy, capable of centralizing authentication and policy decisions for both 802.1X network access and VPN connections from one console. AD CS can issue the certificates 802.1X might use, but it isn't itself a RADIUS server, and DFS Replication/DHCP failover are unrelated to authentication."}, {"id": "q21", "cat": "storage", "type": "mc", "question": "Users across three file servers need to access their files through a single, unified path like \\\\contoso\\shares regardless of which physical server actually holds their folder. What should be deployed?", "options": ["Data Deduplication on all three servers", "Storage Replica between the three servers", "DFS Namespaces, presenting one logical path across the three servers' shares", "A single Storage Spaces Direct cluster replacing the three servers"], "correct": 2, "explanation": "DFS Namespaces is exactly for this: presenting one logical folder structure that transparently maps to shares that may physically live on different servers. Data Deduplication and Storage Replica address disk-space efficiency and replication respectively, not a unified namespace."}, {"id": "q22", "cat": "storage", "type": "mc", "question": "A company wants the actual contents of a critical shared folder kept synchronized in near real time across two file servers in different offices, so either server can serve current files if the other goes down. What should be configured?", "options": ["DFS Namespaces only, with no replication configured", "A stub zone linking the two servers", "DFS Replication between the two servers' shared folders", "Data Deduplication scheduled nightly on each server"], "correct": 2, "explanation": "DFS Replication is the feature that actually synchronizes folder contents between multiple servers, which is what's needed for either server to serve current data. DFS Namespaces alone only provides a unified path \u2014 without replication behind it, the two servers' content could diverge with nothing keeping them in sync."}, {"id": "q23", "cat": "storage", "type": "mc", "question": "A company is building a hyperconverged Hyper-V cluster using only local NVMe and SATA disks in each cluster node, with no separate SAN or shared storage array. Which technology pools that local storage into a single, cluster-wide software-defined storage pool?", "options": ["DFS Namespaces", "Data Deduplication", "Azure File Sync", "Storage Spaces Direct (S2D)"], "correct": 3, "explanation": "Storage Spaces Direct pools local, direct-attached disks across the nodes of a failover cluster into shared software-defined storage, which is the definition of a hyperconverged deployment with no separate SAN. DFS Namespaces and Azure File Sync solve file-sharing and cloud-sync problems, not local disk pooling."}, {"id": "q24", "cat": "storage", "type": "mc", "question": "A file server hosting mostly static reference documents and old project archives is running low on disk space. Nightly backups already run to a separate location. Which built-in feature would most directly reclaim space with minimal risk to a live, transactional workload?", "options": ["Converting the volume to ReFS and using it as the new boot volume", "Enabling Data Deduplication on the volume hosting those files", "Enabling Storage Replica in synchronous mode", "Moving the volume into a Storage Spaces Direct cluster"], "correct": 1, "explanation": "Data Deduplication is well suited to exactly this kind of data \u2014 largely static files with a lot of duplicate content \u2014 and reclaims space with low risk since these aren't heavily, randomly modified transactional files. ReFS as a boot volume isn't supported at all, and Storage Replica and S2D solve replication and pooling problems, not space reclamation on an existing volume."}, {"id": "q25", "cat": "storage", "type": "mc", "question": "A branch office file server is running out of local disk space, but users still expect to see and open their full folder structure, including files they rarely touch. The company wants those rarely used files' actual content to live in Azure while remaining transparently accessible. What should be deployed?", "options": ["A larger local RAID 0 array with no cloud component", "DFS Replication to an Azure VM running File Server", "Storage Spaces Direct stretched to an Azure region", "Azure File Sync with cloud tiering enabled"], "correct": 3, "explanation": "Azure File Sync with cloud tiering keeps the full namespace visible locally while evicting cold files' actual content to Azure, retrieving it transparently on access \u2014 exactly the described need. The other options either add no cloud capacity at all or aren't designed for this kind of transparent, on-demand file tiering."}, {"id": "q26", "cat": "security", "type": "mc", "question": "A security team wants to prevent unauthorized executables from running on a fleet of Windows Server 2022 file servers, with policy enforcement happening at the kernel level before any unapproved binary can even start, surviving even if a local administrator account is compromised. Which technology should they deploy?", "options": ["AppLocker", "Windows Defender Firewall with Advanced Security", "Windows Defender Application Control (WDAC)", "Just Enough Administration (JEA)"], "correct": 2, "explanation": "WDAC enforces code integrity at the kernel level system-wide, which is exactly what resists a compromised local administrator trying to run unapproved code. AppLocker enforces rules in user mode and is easier to bypass with sufficient local privilege, and JEA restricts what an admin can do in a PowerShell session but does not block arbitrary executables from running at all."}, {"id": "q27", "cat": "security", "type": "mc", "question": "An organization wants to stop an attacker who gains local administrator rights on a domain-joined server from extracting cached NTLM and Kerberos credentials from memory using a tool such as Mimikatz. Which feature specifically defends against this?", "options": ["Credential Guard", "BitLocker", "Cluster-Aware Updating", "Storage Replica"], "correct": 0, "explanation": "Credential Guard isolates LSASS secrets inside a virtualization-based security container that even a local administrator cannot read directly, which is precisely the scenario described. BitLocker protects data at rest on disk and has no effect on credentials held in memory, and the other two options are unrelated high-availability and DR features."}, {"id": "q28", "cat": "security", "type": "mc", "question": "A helpdesk technician needs to look up the current local administrator password for a specific Windows Server so they can log on and troubleshoot it, without ever setting or knowing that password themselves ahead of time. Which feature both rotates and stores that password for retrieval?", "options": ["Group Managed Service Accounts (gMSA)", "Windows LAPS", "Protected Users group", "Authentication policy silos"], "correct": 1, "explanation": "Windows LAPS automatically rotates each server's local administrator password and stores it, in AD DS or Microsoft Entra ID, for retrieval by delegated staff \u2014 exactly the lookup-on-demand workflow described. gMSA manages a service account's password rather than a local administrator account, and the other two options control authentication restrictions, not password storage."}, {"id": "q29", "cat": "security", "type": "mc", "question": "A regulated company wants Windows Server security event logs, along with signals from Microsoft Defender for Identity, correlated together with alerts from its cloud workloads in a single security operations view, with automated response playbooks available. Which service should ingest this data?", "options": ["Azure Update Manager", "Windows Admin Center", "Azure Site Recovery", "Microsoft Sentinel"], "correct": 3, "explanation": "Microsoft Sentinel is the cloud-native SIEM and SOAR platform built specifically to ingest and correlate signals like this across identity, servers, and cloud workloads, with automated playbooks for response. The other three tools serve entirely different purposes \u2014 patch management, server administration, and DR orchestration \u2014 with no SIEM or SOAR correlation capability."}, {"id": "q30", "cat": "monitoring", "type": "mc", "question": "An administrator wants to capture a consistent, repeatable set of CPU, memory, and disk counters on a schedule, so the same metrics can be reviewed over time rather than being configured manually every time an issue comes up. Which Performance Monitor feature should they configure?", "options": ["A metric alert rule", "A Data Collection Rule", "Reliability Monitor", "A Data Collector Set"], "correct": 3, "explanation": "A Data Collector Set groups counters, traces, and configuration into a single, reusable, schedulable job within Performance Monitor. A Data Collection Rule is the Azure Monitor Agent equivalent for cloud-side collection, Reliability Monitor tracks a stability index rather than arbitrary counters, and a metric alert only fires on a threshold rather than capturing ongoing data."}, {"id": "q31", "cat": "monitoring", "type": "mc", "question": "A hybrid fleet includes both native Azure VMs and on-premises servers. The team wants one unified agent, with one shared configuration object defining exactly which logs and performance counters to collect and where to send them, deployed consistently across the whole fleet.", "options": ["Windows Admin Center extensions only", "Azure Monitor Agent (AMA) with a Data Collection Rule (DCR)", "The legacy Log Analytics (MMA) agent", "Windows Server Backup with a custom policy"], "correct": 1, "explanation": "AMA is the unified, current agent for both Azure VMs and Arc-enabled on-premises servers, and a DCR is exactly the shared configuration object that defines what is collected and where it goes. The legacy MMA agent is what AMA replaces, and the other two options are unrelated to log and metric collection configuration."}, {"id": "q32", "cat": "monitoring", "type": "mc", "question": "An operations team wants to write a query against collected log data using a chain of operators like where, summarize, and project to filter and shape results, then turn that same query directly into an automated alert. Which technology are they using?", "options": ["PowerShell Desired State Configuration", "Windows Server Migration Tools", "Kusto Query Language (KQL) against a Log Analytics workspace", "Cluster-Aware Updating"], "correct": 2, "explanation": "KQL's operator-chaining query style against a Log Analytics workspace is exactly what is described, and workspace-based queries can be promoted directly into log alert rules with minimal extra work. The other three options are unrelated configuration, migration, and patching tools respectively, with no query language of this kind."}, {"id": "q33", "cat": "monitoring", "type": "mc", "question": "A hybrid organization wants to see patch compliance and schedule update installation for both its Azure VMs and its Arc-enabled on-premises servers from a single place in the Azure portal, rather than maintaining a separate on-premises patching tool for those on-premises machines.", "options": ["Windows Server Update Services (WSUS) alone", "Azure Update Manager", "Storage Migration Service", "A Data Collector Set"], "correct": 1, "explanation": "Azure Update Manager centrally assesses and schedules updates across both native Azure VMs and Arc-enabled on-premises servers from the Azure portal. WSUS alone has no visibility into Azure-native VM patch state, and the other two options are unrelated to patch management entirely."}, {"id": "q34", "cat": "monitoring", "type": "mc", "question": "After a server begins experiencing intermittent crashes, an administrator first wants a quick visual timeline correlating the crashes with recent installs or updates, before digging into the full, detailed event logs to confirm the exact cause. Which tool should they check first?", "options": ["Azure Update Manager compliance dashboard", "A Data Collection Rule audit log", "Reliability Monitor", "Storage Replica health report"], "correct": 2, "explanation": "Reliability Monitor plots a rolling stability index and correlates dips with specific events like installs or updates, making it a good first stop for spotting when a problem started before diving into Event Viewer's more detailed logs. The other three options address patch compliance, log collection configuration, and storage replication health, not this kind of stability timeline."}, {"id": "tf1", "cat": "adDs", "type": "tf", "question": "An RODC caches credentials only for the accounts explicitly permitted by its Password Replication Policy, rather than the whole domain's credentials.", "answer": true, "explanation": "That is the entire security purpose of the Password Replication Policy \u2014 it limits which accounts' credentials an RODC is allowed to cache, so a compromised RODC exposes only a limited subset of credentials."}, {"id": "tf2", "cat": "adDs", "type": "tf", "question": "A GPO marked as Enforced can still be overridden by enabling Block Inheritance on the target organizational unit.", "answer": false, "explanation": "Enforcement specifically overrides Block Inheritance \u2014 an Enforced GPO's settings still apply to a child OU even if that OU has Block Inheritance turned on. Enforcement is designed to win exactly this kind of conflict."}, {"id": "tf3", "cat": "adDs", "type": "tf", "question": "Microsoft Entra Connect's Password Hash Synchronization feature transmits users' recoverable plaintext passwords to Microsoft Entra ID.", "answer": false, "explanation": "PHS synchronizes a hash of the on-premises password hash, never a plaintext or otherwise reversible password, to Microsoft Entra ID. This is a frequently tested distinction, since the name alone can make it sound less secure than it actually is."}, {"id": "tf4", "cat": "hybridWorkloads", "type": "tf", "question": "A Server Core installation can still be managed remotely with Windows Admin Center or PowerShell, even though it has no local desktop shell to log into.", "answer": true, "explanation": "Server Core removes the local GUI shell and most graphical tools, but remote management via Windows Admin Center, PowerShell remoting, or RSAT from another machine works normally, which is exactly how Server Core is meant to be administered day to day."}, {"id": "tf5", "cat": "hybridWorkloads", "type": "tf", "question": "Azure Site Recovery for on-premises Hyper-V hosts uses the same Configuration Server and Process Server components that VMware-to-Azure replication relies on.", "answer": false, "explanation": "Hyper-V-to-Azure replication uses the Hyper-V Replica provider built into the Hyper-V host itself. The Configuration Server, Process Server, and Master Target Server roles are specifically part of the VMware and physical-server replication architecture, not the Hyper-V one."}, {"id": "tf6", "cat": "vmContainers", "type": "tf", "question": "Generation 2 Hyper-V virtual machines support UEFI firmware and Secure Boot, while Generation 1 machines emulate legacy BIOS.", "answer": true, "explanation": "This is the core distinction between the two generations, and it's fixed at VM creation time \u2014 a Generation 1 VM cannot gain UEFI/Secure Boot support later without being recreated as Generation 2."}, {"id": "tf7", "cat": "vmContainers", "type": "tf", "question": "Containers running under Hyper-V isolation each get their own lightweight utility VM and kernel instance, rather than sharing the host kernel the way process-isolated containers do.", "answer": true, "explanation": "That extra utility-VM layer is exactly what gives Hyper-V isolation its stronger, VM-grade separation compared to process isolation, which shares a single host kernel across all its containers."}, {"id": "tf8", "cat": "networking", "type": "tf", "question": "DHCP failover in hot standby mode designates one server as active and the other as a passive backup, rather than splitting client load evenly between the two.", "answer": true, "explanation": "That's the defining trait of hot standby mode, as opposed to load balance mode, where both servers actively answer requests according to a configured percentage split."}, {"id": "tf9", "cat": "networking", "type": "tf", "question": "A DNS stub zone stores a full, authoritative copy of every record in the delegated zone, the same way a secondary zone does.", "answer": false, "explanation": "A stub zone stores only NS, SOA, and glue A/AAAA records \u2014 enough to know which servers are authoritative \u2014 not the zone's full record set. A secondary zone, by contrast, does hold a full read-only copy via zone transfer."}, {"id": "tf10", "cat": "storage", "type": "tf", "question": "Storage Replica can perform synchronous, block-level replication between two servers with zero data loss, provided latency between them is low enough.", "answer": true, "explanation": "Synchronous replication in Storage Replica commits a write on both the source and destination before acknowledging it, guaranteeing zero data loss on failover \u2014 but it depends on latency being low enough that this round trip doesn't become a bottleneck, which is why it's typically used between nearby sites."}, {"id": "tf11", "cat": "storage", "type": "tf", "question": "ReFS (Resilient File System) is fully supported as a boot volume for the Windows Server operating system, just like NTFS.", "answer": false, "explanation": "ReFS is not supported for the boot/system volume \u2014 Windows Server still requires NTFS there. ReFS is intended for data volumes, particularly ones backed by Storage Spaces where its self-healing and integrity-checking features can be fully used."}, {"id": "tf12", "cat": "security", "type": "tf", "question": "Windows LAPS can store a managed local administrator password in Microsoft Entra ID for an Entra-joined device, not only in Active Directory Domain Services.", "answer": true, "explanation": "Windows LAPS supports backing up the managed password to either Active Directory or Microsoft Entra ID depending on how the device is joined, which is part of what makes it usable across hybrid and cloud-joined fleets, not just traditional on-premises domain members."}, {"id": "tf13", "cat": "security", "type": "tf", "question": "An account in the Protected Users group can still fall back to NTLM authentication if Kerberos is briefly unavailable.", "answer": false, "explanation": "Protected Users membership removes the NTLM fallback entirely \u2014 if Kerberos cannot be used, authentication simply fails rather than falling back to a weaker protocol, which is the deliberate point of the control."}, {"id": "tf14", "cat": "monitoring", "type": "tf", "question": "A server must be Azure Arc-enabled, or be a native Azure VM, before Azure Update Manager can assess or patch it.", "answer": true, "explanation": "Update Manager has no visibility into a plain on-premises server with no Arc agent and no Azure connection \u2014 Arc-enabling the server, or it being a native Azure VM, is the prerequisite that makes it visible to Update Manager at all."}, {"id": "tf15", "cat": "monitoring", "type": "tf", "question": "A single Data Collection Rule (DCR) in Azure Monitor can only be associated with one machine at a time, requiring a separate DCR to be authored for every server in a fleet.", "answer": false, "explanation": "One DCR can be associated with many machines at once, which is what allows a single collection configuration to apply consistently across an entire hybrid fleet instead of being authored per server."}, {"id": "msq1", "cat": "adDs", "type": "ms", "question": "Which two of the following FSMO roles exist once per domain rather than once per forest? (Choose two.)", "options": ["RID Master", "Schema Master", "PDC Emulator", "Domain Naming Master"], "correct": [0, 2], "explanation": "RID Master and PDC Emulator are domain-wide roles, existing once in every domain. Schema Master and Domain Naming Master are forest-wide roles, existing only once across the entire forest."}, {"id": "msq2", "cat": "adDs", "type": "ms", "question": "Which two of the following are genuine Microsoft Entra Connect hybrid authentication methods? (Choose two.)", "options": ["Kerberos Constrained Delegation", "LDAP Simple Bind over an unencrypted connection", "Password Hash Synchronization", "Pass-through Authentication"], "correct": [2, 3], "explanation": "Password Hash Synchronization and Pass-through Authentication are both genuine Microsoft Entra Connect authentication methods (alongside Federation with AD FS). Kerberos Constrained Delegation and unencrypted LDAP simple bind are unrelated on-premises authentication/authorization mechanisms, not hybrid sign-in methods."}, {"id": "msq3", "cat": "hybridWorkloads", "type": "ms", "question": "Which two of the following are true about Azure Arc-enabled servers? (Choose two.)", "options": ["It requires migrating the server's actual workload into an Azure VM", "It replaces the need for any on-premises Active Directory infrastructure", "It installs a Connected Machine agent that projects the server into Azure Resource Manager", "It lets you apply Azure Policy and Azure Monitor to an on-premises server without moving it"], "correct": [2, 3], "explanation": "Azure Arc's Connected Machine agent projects a server into Azure Resource Manager so Azure Policy, Monitor, and similar services can manage it, all without moving the workload itself. It has nothing to do with replacing on-premises AD, and it explicitly does not require migrating the workload into an Azure VM."}, {"id": "msq4", "cat": "hybridWorkloads", "type": "ms", "question": "Which two of the following correctly distinguish an in-place upgrade from a migration to a new server? (Choose two.)", "options": ["An in-place upgrade keeps the same hardware or VM and updates the OS directly on it", "A migration always requires reinstalling Active Directory Domain Services from scratch", "A migration moves roles and data to a separate, already-provisioned destination server", "An in-place upgrade is supported between any two Windows Server versions regardless of version gap"], "correct": [0, 2], "explanation": "An in-place upgrade updates the existing server directly, while a migration moves roles and data to a separate destination server, leaving the source untouched until cutover. Migrations do not require reinstalling AD DS from scratch, and in-place upgrades are explicitly not supported across every version gap \u2014 that is exactly when migration becomes necessary instead."}, {"id": "msq5", "cat": "vmContainers", "type": "ms", "question": "Which two of the following are true about Hyper-V Live Migration? (Choose two.)", "options": ["It always requires the VM to be shut down first", "It requires the destination host to have a compatible processor or Processor Compatibility Mode enabled", "It permanently deletes the VM's existing checkpoints before migrating", "It can move a running VM between hosts with no perceptible downtime when properly configured"], "correct": [1, 3], "explanation": "Live Migration moves a running VM with no perceptible downtime, but it does require processor compatibility (or Processor Compatibility Mode) between the source and destination hosts. It neither requires shutting the VM down nor deletes existing checkpoints as part of the process."}, {"id": "msq6", "cat": "networking", "type": "ms", "question": "Which two of the following are true about IP Address Management (IPAM)? (Choose two.)", "options": ["IPAM must itself be configured to act as the domain's primary DHCP server", "IPAM can centrally monitor and manage multiple DHCP and DNS servers from one console", "IPAM helps track IP address utilization and detect overlapping or duplicate DHCP scopes", "IPAM removes the need to ever configure a DHCP or DNS server role anywhere"], "correct": [1, 2], "explanation": "IPAM's job is centrally monitoring and managing existing DHCP and DNS servers, including tracking utilization and catching overlapping or duplicate scopes. It is not itself a DHCP server, and deploying it does not eliminate the need for separate DHCP/DNS server roles."}, {"id": "msq7", "cat": "storage", "type": "ms", "question": "Which two of the following correctly describe Storage Spaces resiliency types? (Choose two.)", "options": ["Parity resiliency generally offers better write performance than mirroring", "Simple resiliency spaces tolerate one disk failure without data loss", "A two-way mirror can tolerate the loss of one physical disk without data loss", "Parity resiliency is generally more storage-efficient than mirroring for the same fault tolerance"], "correct": [2, 3], "explanation": "A two-way mirror tolerates one disk failure, and parity is generally more storage-efficient than mirroring at similar fault tolerance \u2014 though at the cost of slower random writes, not better write performance. Simple resiliency has no redundancy at all and tolerates zero disk failures."}, {"id": "msq8", "cat": "storage", "type": "ms", "question": "Which two of the following are true about DFS Namespaces? (Choose two.)", "options": ["DFS Namespaces requires Data Deduplication to be enabled first", "A domain-based namespace can have multiple namespace servers for redundancy", "A standalone namespace's configuration is stored in Active Directory", "A domain-based namespace stores its configuration in Active Directory"], "correct": [1, 3], "explanation": "A domain-based DFS namespace stores its configuration in Active Directory and can be hosted on multiple namespace servers for redundancy. A standalone namespace, by contrast, keeps its configuration in the local registry of a single server rather than in AD, and DFS Namespaces has no dependency on Data Deduplication."}, {"id": "msq9", "cat": "security", "type": "ms", "question": "Which two of the following are true about Microsoft Defender for Identity? (Choose two.)", "options": ["It is installed as sensors directly on domain controllers", "It replaces the need for a certification authority", "It can detect on-premises attack techniques such as pass-the-hash and DCSync", "It only monitors cloud sign-in activity, not on-premises AD DS"], "correct": [0, 2], "explanation": "Defender for Identity runs via sensors on domain controllers and is built specifically to detect on-premises identity attacks like pass-the-hash and DCSync. It has nothing to do with certificate issuance, and it is the opposite of cloud-sign-in-only \u2014 its whole focus is the on-premises identity plane."}, {"id": "msq10", "cat": "monitoring", "type": "ms", "question": "Which two of the following are true about Azure Monitor alert rules? (Choose two.)", "options": ["A metric alert evaluates a numeric signal against a threshold on a schedule", "A log alert runs a KQL query on a schedule and fires based on its results", "An action group defines the alert condition itself, not the response", "Alert rules cannot be attached to Arc-enabled on-premises servers"], "correct": [0, 1], "explanation": "Metric alerts and log alerts are correctly described here \u2014 one evaluates a numeric threshold, the other runs a scheduled KQL query. An action group defines the response to a firing alert, not the condition, and Arc-enabled servers are exactly the kind of hybrid machine Azure Monitor alerting is designed to cover."}, {"id": "msq11", "cat": "monitoring", "type": "ms", "question": "Which two of the following are true about Reliability Monitor and Event Viewer? (Choose two.)", "options": ["Reliability Monitor plots a rolling stability index correlated with events like installs and crashes", "Event Viewer provides detailed, filterable logs across System, Application, Security, and role-specific channels", "Event Viewer and Reliability Monitor are two names for the exact same tool", "Reliability Monitor replaces the need to ever open Event Viewer"], "correct": [0, 1], "explanation": "Reliability Monitor's stability-index timeline and Event Viewer's detailed, filterable logs are both accurately described, and they serve complementary rather than identical purposes \u2014 Reliability Monitor is typically a first look, and Event Viewer is where the detailed confirmation happens afterward, not a tool it replaces."}]}, "sc500": {"categories": [{"key": "identityAccessGovernance", "label": "Identity, Access & Governance", "marks": 23}, {"key": "dataNetworkSecurity", "label": "Storage, Databases & Networking", "marks": 27}, {"key": "aiComputeSecurity", "label": "Compute & AI Workload Security", "marks": 25}, {"key": "securityPostureOps", "label": "Security Posture & Monitoring", "marks": 25}], "flashcards": [{"id": "f1", "cat": "identityAccessGovernance", "front": "Microsoft Entra ID vs. the old \"Azure Active Directory\" name", "back": "Microsoft Entra ID is the current name for Azure's cloud identity and access management service, formerly branded Azure Active Directory (Azure AD). The underlying service, tenant model, and APIs are the same \u2014 only the product name changed.", "detail": "Current documentation and the exam use \"Microsoft Entra ID\" exclusively; a distractor still calling it \"Azure AD\" is testing whether you know it is the same service under a new name, not a different product."}, {"id": "f2", "cat": "identityAccessGovernance", "front": "Conditional Access: conditions vs. grant controls vs. session controls", "back": "A Conditional Access policy evaluates conditions (user/group, IP location, device platform, client app, sign-in risk) to decide whether to apply grant controls (require MFA, require a compliant or hybrid-joined device, block access) and/or session controls (limit browser session, require app-enforced restrictions).", "detail": "Conditional Access is if-then, not a firewall: if the conditions match, the grant/session controls are enforced. A policy whose conditions do not match a given sign-in simply does not apply to it."}, {"id": "f3", "cat": "identityAccessGovernance", "front": "PIM eligible vs. active role assignments", "back": "In Privileged Identity Management, an eligible assignment lets a user activate a role only when needed, typically requiring MFA, justification, and/or approval, for a limited time window. An active assignment means the role is already in effect with no activation step.", "detail": "Exam trap: PIM manages both Azure RBAC roles at a resource/subscription scope and Microsoft Entra directory roles (like Global Administrator) \u2014 it is not limited to just one or the other."}, {"id": "f4", "cat": "identityAccessGovernance", "front": "Azure RBAC roles vs. Microsoft Entra ID roles", "back": "Azure RBAC roles (Owner, Contributor, Reader, etc.) control access to Azure resources at a management group, subscription, resource group, or resource scope. Microsoft Entra ID directory roles (Global Administrator, User Administrator, etc.) control directory-level tasks like resetting passwords or managing users.", "detail": "Being a Global Administrator does not automatically grant Owner on Azure subscriptions \u2014 an administrator must explicitly elevate access in Entra ID properties to gain that Azure RBAC access."}, {"id": "f5", "cat": "identityAccessGovernance", "front": "System-assigned vs. user-assigned managed identity", "back": "A system-assigned managed identity is created and tied to the lifecycle of a single Azure resource (deleted when the resource is deleted). A user-assigned managed identity is its own standalone Azure resource and can be attached to multiple resources at once, persisting independently.", "detail": "When several VMs or App Services need to share the same identity and role assignments, a user-assigned managed identity is the right choice \u2014 a system-assigned one cannot be shared or reused after its resource is gone."}, {"id": "f6", "cat": "identityAccessGovernance", "front": "Entitlement management: access packages and access reviews", "back": "Access packages bundle resources (groups, apps, SharePoint sites) that a user can request through a defined approval workflow, often with a time-limited assignment. Access reviews periodically ask a designated reviewer to confirm continued access is still needed, and can automatically remove access that is not confirmed.", "detail": "Access reviews are the direct answer whenever a scenario wants to systematically clean up stale group membership or guest access rather than relying on someone to remember to remove it manually."}, {"id": "f7", "cat": "identityAccessGovernance", "front": "Continuous Access Evaluation (CAE) vs. static token lifetimes", "back": "Continuous Access Evaluation lets Microsoft Entra ID and CAE-enabled services react to critical events in near real time (a user is disabled, a password is changed, a network location changes) by revoking or re-evaluating an access token immediately, instead of waiting for it to naturally expire.", "detail": "Without CAE, a disabled user's existing access token could keep working for its full lifetime (often up to an hour); CAE closes that window by pushing the revocation signal directly to the relying service."}, {"id": "f8", "cat": "identityAccessGovernance", "front": "Cross-tenant access settings vs. workload identity federation", "back": "Cross-tenant access settings control how a Microsoft Entra tenant trusts users signing in from another Entra tenant (inbound/outbound B2B collaboration), including which MFA and device claims are trusted. Workload identity federation lets an external identity provider's token (e.g., a GitHub Actions or Kubernetes service account token) be exchanged for an Entra ID token without storing a client secret or certificate at all.", "detail": "Workload identity federation is the credential-free alternative to a service principal client secret for external CI/CD pipelines \u2014 the trust relationship itself replaces the secret, rather than the secret merely being rotated more often."}, {"id": "f9", "cat": "identityAccessGovernance", "front": "Microsoft Entra ID Protection: user risk vs. sign-in risk", "back": "User risk reflects the likelihood a specific identity has been compromised, based on signals like leaked credentials found in the wild. Sign-in risk reflects the likelihood a specific authentication attempt itself is not genuine, based on signals like impossible travel or anonymous IP addresses. Conditional Access policies can require different remediation (like a password change or MFA) for each risk type independently.", "detail": "A leaked-credential detection raises user risk even if the next sign-in attempt looks completely normal, while an anonymous-IP sign-in raises sign-in risk for that one attempt even if the user's overall risk history is clean \u2014 the two signals are evaluated and remediated independently."}, {"id": "f10", "cat": "dataNetworkSecurity", "front": "Network security group (NSG) vs. application security group (ASG)", "back": "An NSG filters traffic to/from resources using rules based on source/destination IP, port, and protocol, applied to a subnet or NIC. An ASG lets you group VMs by application role (e.g., 'WebServers') and reference that group name in NSG rules instead of hard-coding IP addresses.", "detail": "ASGs make NSG rules easier to maintain as VMs are added or removed from a role, since the rule targets the group rather than a list of IPs that must be updated by hand."}, {"id": "f11", "cat": "dataNetworkSecurity", "front": "Azure Firewall Standard vs. Premium", "back": "Azure Firewall Standard provides L3-L7 filtering, FQDN filtering, and threat intelligence-based filtering. Premium adds TLS inspection, IDPS (intrusion detection and prevention), URL filtering, and web category filtering for deeper inspection of encrypted traffic.", "detail": "A scenario asking the firewall to inspect inside TLS-encrypted traffic or detect/block intrusion attempts is pointing specifically at the Premium tier \u2014 Standard cannot do TLS inspection or IDPS."}, {"id": "f12", "cat": "dataNetworkSecurity", "front": "Azure Bastion", "back": "A fully managed PaaS service that provides secure RDP/SSH connectivity to VMs directly through the Azure portal over TLS, without assigning the VM a public IP address or opening RDP/SSH ports to the internet.", "detail": "Bastion is deployed into its own dedicated subnet named AzureBastionSubnet, and it defeats port scanning specifically because the target VMs never need a public IP at all."}, {"id": "f13", "cat": "dataNetworkSecurity", "front": "Private endpoint vs. service endpoint", "back": "A private endpoint assigns a PaaS service (like a storage account or SQL database) a private IP address inside your VNet, so traffic never leaves the Microsoft backbone or the public internet. A service endpoint extends your VNet identity to the service over the Microsoft backbone, but the service still keeps a public endpoint.", "detail": "Private endpoints are the stronger control: because the service gets an actual private IP in your VNet, you can also block all public access to it entirely, which a service endpoint alone does not let you do as cleanly."}, {"id": "f14", "cat": "dataNetworkSecurity", "front": "Web Application Firewall (WAF): detection vs. prevention mode", "back": "A WAF (on Application Gateway or Front Door) inspects HTTP(S) requests for common exploits like SQL injection and cross-site scripting using OWASP-based rule sets. Detection mode logs matching requests without blocking them; prevention mode actively blocks matched requests and logs them.", "detail": "Detection mode is the recommended way to test a new WAF policy or ruleset in production first, since prevention mode blocking a legitimate request (a false positive) can break real user traffic immediately."}, {"id": "f15", "cat": "dataNetworkSecurity", "front": "DDoS Protection: Basic vs. Standard", "back": "DDoS Protection Basic is automatically enabled at no cost for every Azure resource, providing always-on monitoring and mitigation of common network-layer attacks. DDoS Protection Standard adds tuned, resource-specific mitigation policies, attack analytics/metrics, cost protection, and rapid response team support, applied at the virtual network level.", "detail": "A scenario asking for detailed attack telemetry, cost protection during an attack, or rapid-response support is asking for Standard \u2014 Basic provides no visibility beyond basic platform protection."}, {"id": "f16", "cat": "dataNetworkSecurity", "front": "Hub-and-spoke topology for centralized security", "back": "A hub VNet holds shared security services (Azure Firewall, VPN/ExpressRoute gateway, Bastion) that spoke VNets peer with and route their traffic through, so security controls and on-premises connectivity are managed in one place rather than duplicated per workload.", "detail": "User-defined routes (UDRs) forcing spoke traffic through the hub firewall are what actually make this pattern secure \u2014 VNet peering alone does not force traffic through the hub unless routing is explicitly configured to do so."}, {"id": "f17", "cat": "dataNetworkSecurity", "front": "ExpressRoute encryption", "back": "ExpressRoute provides a private connection to Azure over a connectivity provider, but the circuit is not encrypted by default because it does not traverse the public internet. To get encryption in transit, you add IPsec VPN over ExpressRoute (via Microsoft peering) or use MACsec on a direct connection.", "detail": "A common exam trap: assuming ExpressRoute is automatically encrypted because it is \"private.\" Private just means not going over the public internet \u2014 it does not by itself mean encrypted."}, {"id": "f18", "cat": "dataNetworkSecurity", "front": "Azure Key Vault access model: RBAC permission model vs. vault access policies", "back": "Key Vault access can use the newer Azure RBAC permission model (role assignments at the vault or object level, consistent with other Azure resources) or the legacy vault access policy model (permissions to keys, secrets, and certificates assigned directly on the vault). Microsoft recommends the RBAC model for new vaults.", "detail": "A vault uses one model at a time, not both simultaneously \u2014 switching an existing vault to the RBAC permission model replaces its access policies rather than layering on top of them."}, {"id": "f19", "cat": "dataNetworkSecurity", "front": "Storage account authorization: access keys vs. SAS vs. Microsoft Entra ID", "back": "Access keys grant full control of the entire storage account and should be tightly restricted. A shared access signature (SAS) grants time-limited, scoped access without exposing the account key. Microsoft Entra ID authorization lets you assign Azure RBAC roles (like Storage Blob Data Reader) to identities for fine-grained, auditable access without any keys at all.", "detail": "Current Microsoft guidance favors Entra ID authorization over SAS or keys wherever possible, since it centralizes and audits access per identity, rather than per shared token or unrotated key."}, {"id": "f20", "cat": "dataNetworkSecurity", "front": "Storage account network security: firewall rules and private endpoints", "back": "A storage account firewall can restrict access to specific virtual networks, IP ranges, or allow trusted Microsoft services to bypass it. Combined with a private endpoint, you can disable the storage account's public endpoint entirely so it is reachable only from approved private networks.", "detail": "Enabling \"Allow trusted Microsoft services\" is what lets services like Azure Backup or Azure Monitor reach a locked-down storage account without opening it to the wider internet."}, {"id": "f21", "cat": "dataNetworkSecurity", "front": "Azure SQL: TDE, Always Encrypted, and Dynamic Data Masking", "back": "Transparent Data Encryption (TDE) encrypts database files at rest and is on by default, transparent to applications. Always Encrypted keeps sensitive column data encrypted even in memory and query plans, decrypting only on a trusted client \u2014 the database engine never sees the plaintext. Dynamic Data Masking obscures sensitive column values in query results for non-privileged users, without changing the stored data.", "detail": "Dynamic Data Masking is not real protection against a determined attacker \u2014 it just masks displayed output for lower-privileged users, while the underlying data is unchanged and still readable by anyone with a masking-bypass permission."}, {"id": "f22", "cat": "dataNetworkSecurity", "front": "Microsoft Defender for SQL", "back": "A Defender for Cloud plan that adds vulnerability assessment (scanning for misconfigurations and outdated permissions) and advanced threat protection (alerting on anomalous activity like SQL injection or unusual access patterns) for Azure SQL Database, Managed Instance, and SQL Server on Azure VMs.", "detail": "Vulnerability assessment and threat detection are two distinct features bundled under the same Defender for SQL plan \u2014 scanning for weak configurations and detecting an active SQL injection attempt are both covered by this one plan."}, {"id": "f23", "cat": "aiComputeSecurity", "front": "Server-side encryption (SSE) vs. Azure Disk Encryption (ADE) vs. encryption at host", "back": "SSE encrypts managed disk data at rest by default using platform-managed keys, transparent to the VM OS. ADE encrypts OS/data disk volumes from inside the guest OS using BitLocker (Windows) or DM-Crypt (Linux). Encryption at host encrypts data on the host running the VM, covering temp disks and caches that ADE does not.", "detail": "SSE is already on by default, so ADE and encryption at host are about closing specific additional gaps (guest-level control, or temp disk/cache coverage), not 'turning encryption on' from nothing."}, {"id": "f24", "cat": "aiComputeSecurity", "front": "Securing AKS: network policies and Azure Policy for Kubernetes", "back": "Kubernetes network policies restrict pod-to-pod traffic within a cluster. Azure Policy's add-on for AKS enforces cluster-level guardrails, like disallowing privileged containers or requiring specific labels, evaluated against the built-in Azure Policy for Kubernetes initiative.", "detail": "Network policies control what pods can talk to each other; Azure Policy for AKS controls what kinds of resources/configurations are allowed to be deployed at all \u2014 they answer different questions and are commonly combined, not substitutes for each other."}, {"id": "f25", "cat": "aiComputeSecurity", "front": "App Service security: managed identity and mutual TLS", "back": "An App Service can use a managed identity to authenticate to other Azure services (like Key Vault) without storing credentials in app settings. TLS/SSL bindings enforce HTTPS for inbound traffic, and mutual TLS (client certificates) can be required so the app also verifies the identity of the calling client.", "detail": "\"HTTPS Only\" forces any plain HTTP request to redirect to HTTPS, but it does not by itself require or validate client certificates \u2014 that additional verification is what mutual TLS adds."}, {"id": "f26", "cat": "aiComputeSecurity", "front": "Microsoft Foundry agent identity and least-privilege permission scoping", "back": "Every agent built and deployed in Microsoft Foundry runs under its own identity rather than borrowing the developer's or a shared service's credentials, and should be granted only the specific data sources, tools, and downstream APIs it needs to complete its task, following the same least-privilege principle applied to any other workload identity.", "detail": "A Foundry agent granted broad, unscoped permissions 'just in case' becomes a high-value target: a single prompt injection or jailbreak against that agent can then reach everything the over-provisioned identity was allowed to touch."}, {"id": "f27", "cat": "aiComputeSecurity", "front": "Microsoft Entra Agent ID: identity for non-human, agentic workloads", "back": "Microsoft Entra Agent ID gives an AI agent its own individually identifiable, policy-controlled identity, distinct from a human user, a traditional app registration, or a generic shared service principal, so the agent's actions can be authenticated, authorized, governed, and audited on their own \u2014 including through its full lifecycle from creation to retirement.", "detail": "Agent identity blueprints act as templates: permissions and Conditional Access policies applied at the blueprint level automatically apply to every agent identity created from it, letting an organization govern a whole fleet of agents through one policy instead of configuring each agent individually."}, {"id": "f28", "cat": "aiComputeSecurity", "front": "Applying Conditional Access to Microsoft Entra Agent ID", "back": "Conditional Access policies can target agent identities the same way they target user identities \u2014 requiring conditions to be met (like a trusted network or an approved calling application) before an agent identity is allowed to authenticate and act, extending Zero Trust principles to non-human, agentic identities rather than exempting them from evaluation.", "detail": "Treating agent identities as automatically trusted simply because they are not human is exactly the gap Conditional Access for Agent ID is meant to close \u2014 an agent identity with excessive standing access is just as dangerous as an over-privileged user account, arguably more so given how quickly an agent can act."}, {"id": "f29", "cat": "aiComputeSecurity", "front": "Foundry AI Gateway (Azure API Management in front of Microsoft Foundry)", "back": "Deploying Azure API Management as an AI Gateway in front of Microsoft Foundry gives a central control point for agent and model traffic \u2014 enforcing authentication, rate limiting/token quotas, logging, and routing policies before a request ever reaches the underlying Foundry agent or model deployment.", "detail": "Centralizing traffic through the gateway is what makes consistent, org-wide policies (like blocking a specific model version or capping token spend per team) enforceable in one place, rather than relying on every agent or application to independently implement the same controls."}, {"id": "f30", "cat": "aiComputeSecurity", "front": "Blast radius analysis for a compromised Entra Agent ID (Defender XDR)", "back": "When Microsoft Defender XDR flags a suspicious or compromised agent identity, blast radius analysis maps out everything that agent identity could reach or had recently accessed \u2014 data sources, downstream APIs, other agents it can invoke \u2014 so responders can scope containment and cleanup to what the agent could actually touch, not just the agent itself.", "detail": "This is the agentic-identity equivalent of asking 'what could a compromised user account have accessed' \u2014 except an agent's permitted actions and integrations often need to be mapped explicitly, since an agent's effective reach is not always obvious just from reading its role assignment."}, {"id": "f31", "cat": "aiComputeSecurity", "front": "Microsoft Copilot data access scope and the oversharing risk", "back": "Microsoft 365 Copilot only surfaces content the requesting user already has permission to see, respecting existing SharePoint, OneDrive, and Microsoft 365 permissions \u2014 but if those underlying permissions are already too broad (e.g., a site shared with 'Everyone'), Copilot can now surface that overshared content far more easily and quickly than a human manually searching for it.", "detail": "Copilot does not introduce a new permission model of its own; it inherits whatever access already exists. The real fix for Copilot oversharing risk is remediating the underlying overpermissive SharePoint/OneDrive sharing, not restricting Copilot itself."}, {"id": "f32", "cat": "aiComputeSecurity", "front": "Microsoft Purview DLP for Microsoft 365 Copilot", "back": "Microsoft Purview Data Loss Prevention policies can be applied directly to Microsoft 365 Copilot and Copilot Chat prompts and responses, blocking Copilot from using or surfacing content that matches a sensitive information type or label, including preventing that sensitive content from being used in an external web-grounded response.", "detail": "This closes a gap that content permissions alone do not: even a user who is technically permitted to see a sensitive file might still be blocked from having Copilot summarize or quote from it directly, if a DLP policy specifically restricts that AI-generated exposure."}, {"id": "f33", "cat": "aiComputeSecurity", "front": "Microsoft Copilot Studio: real-time protection and admin controls", "back": "Administrators can enable real-time protection for custom agents built in Copilot Studio, which evaluates prompts and responses against configured security and compliance policies as the agent runs, alongside admin controls that govern which connectors, data sources, and publishing channels a maker is allowed to use.", "detail": "Without admin governance over Copilot Studio, individual makers could publish an agent that connects to an unapproved external data source or exposes it through an ungoverned channel \u2014 the admin controls exist specifically to keep maker-built agents inside organizational guardrails."}, {"id": "f34", "cat": "aiComputeSecurity", "front": "AI workload data protection: grounding, training, and prompt data", "back": "Data used to ground an AI agent's responses (retrieved documents, search indexes) and the prompts/responses exchanged with it need the same at-rest and in-transit encryption, access control, and retention treatment as any other sensitive data \u2014 plus consideration of whether that data could be retained, logged, or used to improve a model beyond the immediate request.", "detail": "A grounding data store (like a vector index built from confidential documents) is a full sensitive-data asset in its own right and needs its own access controls \u2014 access to the AI agent's chat interface is not, by itself, a substitute for securing the underlying data store the agent draws from."}, {"id": "f35", "cat": "aiComputeSecurity", "front": "Governance and compliance considerations for AI in Azure", "back": "Beyond technical controls, deploying AI agents and Copilot at scale raises governance questions Azure security teams must own: maintaining an inventory of deployed agents and their owners, auditing agent actions for compliance review, applying data residency and retention requirements to AI-processed data, and ensuring responsible-AI review before an agent is given broader autonomy or access.", "detail": "An agent inventory answers a question that is otherwise easy to lose track of as agent creation gets easier: exactly how many agents exist, what each one can access, and who is accountable for it \u2014 the same discipline already expected for human accounts and app registrations."}, {"id": "f36", "cat": "securityPostureOps", "front": "Microsoft Defender for Cloud Secure Score", "back": "A percentage score that aggregates how many recommended security controls an environment has actually implemented, weighted by each recommendation's potential impact. Improving secure score means resolving the underlying recommendations, not the score itself.", "detail": "Secure Score is a prioritization tool, not a compliance certification \u2014 a high score reflects following Microsoft's general best-practice recommendations, which is different from passing a specific named regulatory standard."}, {"id": "f37", "cat": "securityPostureOps", "front": "Microsoft Defender for Cloud plans", "back": "Defender for Cloud's free tier covers basic posture management (recommendations, secure score). Enabling specific paid Defender plans per resource type (Servers, Storage, SQL, Containers, Key Vault, App Service, DNS, Resource Manager) adds workload-specific threat detection and advanced capabilities for that resource type.", "detail": "Plans are enabled independently per resource type at the subscription level \u2014 enabling Defender for Storage does not also enable Defender for SQL, so a scenario needing threat detection on both requires enabling both plans explicitly."}, {"id": "f38", "cat": "securityPostureOps", "front": "Just-in-time (JIT) VM access", "back": "A Defender for Cloud feature that locks down a VM's management ports (like RDP/SSH) by default, only opening them for a specific requester, source IP, and time window when access is explicitly requested and approved.", "detail": "JIT reduces the attack surface of exposed management ports without requiring Bastion \u2014 but Bastion removes the need for a public IP entirely, while JIT still allows temporary direct access to a port that could carry a public IP if one exists."}, {"id": "f39", "cat": "securityPostureOps", "front": "Adaptive application controls", "back": "A Defender for Cloud feature that uses machine learning to build an allowlist of known-safe applications for a group of VMs, then alerts (or can enforce) when an application outside that allowlist attempts to run.", "detail": "This is application allowlisting delivered as a managed, ML-driven recommendation rather than something manually enumerated application-by-application, which is what distinguishes it from a hand-configured allowlist policy."}, {"id": "f40", "cat": "securityPostureOps", "front": "Regulatory compliance dashboard", "back": "A Defender for Cloud feature that maps your environment against specific regulatory or industry standards (like PCI DSS, ISO 27001, NIST), showing which controls pass, fail, or are not applicable, and lets you add custom standards.", "detail": "This is distinct from Secure Score: Secure Score reflects general best practice, while the compliance dashboard reflects standing against a specific named standard an organization may be contractually or legally required to meet."}, {"id": "f41", "cat": "securityPostureOps", "front": "Microsoft Sentinel data connectors", "back": "Data connectors ingest log and event data from sources \u2014 Azure services, Microsoft 365, on-premises systems, and third-party/multicloud platforms \u2014 into the Log Analytics workspace that backs a Sentinel instance, where it becomes queryable and can drive analytics rules.", "detail": "Sentinel has no data to analyze without connectors ingesting logs first \u2014 connecting a source is always the prerequisite step before writing an analytics rule or hunting query against that data."}, {"id": "f42", "cat": "securityPostureOps", "front": "Sentinel analytics rules: scheduled vs. near-real-time vs. Fusion", "back": "Scheduled analytics rules run a KQL query on a set interval and generate an incident on matches. Near-real-time (NRT) rules run continuously for faster detection on a narrower set of supported queries. Fusion uses machine learning to correlate multiple low-fidelity signals across different sources into a single, higher-confidence incident.", "detail": "Fusion's value is correlating otherwise-unremarkable individual alerts (e.g., an odd sign-in plus an unusual resourc
