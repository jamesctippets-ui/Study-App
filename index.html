, "detail": "Only the \"RA-\" (read-access) variants of GRS/GZRS let an application read from the secondary region before an actual failover occurs."}, {"id": "f14", "cat": "dataStorage", "front": "Access tiers: Hot, Cool, Cold, and Archive", "back": "Hot suits frequently accessed data at the highest storage cost and lowest access cost. Cool and Cold suit infrequently accessed data, with lower storage cost but higher access cost and longer minimum retention. Archive is the cheapest tier for rarely accessed data, but blobs must be rehydrated (a process that can take hours) before they can be read.", "detail": "A cost-first requirement with an acceptable multi-hour retrieval delay is the signal for Archive; needing the data readable at any moment rules Archive out even if it's rarely accessed."}, {"id": "f15", "cat": "dataStorage", "front": "Azure Data Lake Storage Gen2", "back": "Blob storage with a hierarchical namespace enabled, purpose-built for large-scale analytics (Synapse, Databricks, HDInsight) that need POSIX-like access control lists and efficient directory-level operations, not just flat object storage.", "detail": "The hierarchical namespace is what turns general-purpose Blob storage into a proper data lake for big-data analytics engines."}, {"id": "f16", "cat": "dataStorage", "front": "Data Migration Assistant (DMA) vs. Database Migration Service (DMS)", "back": "DMA assesses an on-premises database for compatibility issues and deprecated features before any migration happens. DMS performs the actual migration \u2014 online (minimal downtime) or offline \u2014 into the target Azure data service.", "detail": "DMA answers \"will this break after we move it?\"; DMS is the tool that actually moves the data once you're ready to go."}, {"id": "f17", "cat": "dataStorage", "front": "Private endpoint vs. service endpoint", "back": "A private endpoint gives a PaaS resource a private IP address inside your VNet, reachable privately even from on-premises or peered networks, and can remove its public endpoint entirely. A service endpoint keeps the resource's public IP but optimizes and restricts routing for traffic that already originates from a specific subnet.", "detail": "Only a private endpoint lets on-premises traffic, arriving over ExpressRoute or a VPN, reach a PaaS service privately \u2014 a service endpoint only helps traffic that already starts inside the VNet."}, {"id": "f18", "cat": "businessContinuity", "front": "Azure Backup vs. Azure Site Recovery", "back": "Azure Backup protects data, restoring files, VMs, or databases to a prior point in time. Azure Site Recovery protects availability, replicating an entire VM or workload to a secondary region or zone so it can fail over and keep running through an outage.", "detail": "A request to recover an accidentally deleted file points to Backup; a request to keep an application running after a regional outage points to Site Recovery."}, {"id": "f19", "cat": "businessContinuity", "front": "Availability zones vs. paired (secondary) regions", "back": "Availability zones give synchronous, low-latency redundancy across physically separate datacenters within one region, protecting against a single-datacenter loss. A secondary region provides asynchronous DR redundancy against a full regional disaster, at the cost of higher replication latency.", "detail": "Zones and a secondary region solve two different failure scopes, and a well-designed solution frequently uses both together rather than choosing one over the other."}, {"id": "f20", "cat": "businessContinuity", "front": "Azure SQL Database auto-failover groups", "back": "Group one or more databases on a logical server, replicate them to a secondary region, and expose stable read-write and read-only listener endpoints that automatically redirect after a failover, so application connection strings never need to change.", "detail": "The read-only listener can serve reads from the secondary region even before any failover occurs, not only afterward."}, {"id": "f21", "cat": "businessContinuity", "front": "RTO and RPO drive the architecture, not the other way around", "back": "Business requirements set the maximum tolerable downtime (RTO) and data loss (RPO) first. The backup frequency, replication approach, and failover automation are then designed to meet those numbers, rather than being chosen first and having the numbers backfilled to match.", "detail": "A design question that states specific RTO/RPO numbers is really asking you to pick the cheapest architecture that still satisfies both, not the most impressive-sounding one."}, {"id": "f22", "cat": "businessContinuity", "front": "Recovery Services vault", "back": "The container that stores Azure Backup data and Azure Site Recovery replication configuration and metadata. A single vault can hold both backup and Site Recovery items, and the vault's own redundancy setting (LRS, GRS, or ZRS) determines whether it survives a regional loss.", "detail": "It's easy to assume backups automatically survive a regional outage \u2014 that depends entirely on the vault's own storage redundancy setting, which is worth checking explicitly."}, {"id": "f23", "cat": "businessContinuity", "front": "Active-active vs. active-passive multi-region design", "back": "Active-active runs full production traffic in two or more regions simultaneously, giving the fastest possible RTO at the highest cost and complexity (including handling multi-region write conflicts). Active-passive keeps a warm or cold standby region that only takes traffic after a failover, which is cheaper but slower to recover.", "detail": "\"Zero perceptible downtime during a regional failure\" is the signal phrase for active-active; any standby that needs to be activated first, warm or cold, is active-passive."}, {"id": "f24", "cat": "infrastructure", "front": "Choosing compute: VM vs. App Service vs. AKS vs. Container Apps vs. Functions", "back": "VMs give full OS control for legacy or specialized workloads. App Service is managed PaaS web hosting with no orchestration to manage. AKS gives full Kubernetes control for complex microservices needing custom orchestration. Container Apps runs serverless containers with built-in autoscaling and microservices features, without managing a cluster. Functions is event-driven, per-execution billed compute for short-lived triggered code.", "detail": "\"Wants container-based autoscaling but doesn't want to manage a cluster\" is the classic signal for Container Apps over AKS."}, {"id": "f25", "cat": "infrastructure", "front": "Hub-and-spoke network topology", "back": "A central hub VNet hosts shared services \u2014 firewall, VPN or ExpressRoute gateway, DNS \u2014 while spoke VNets (one per workload or team) peer only to the hub, not to each other, centralizing connectivity, inspection, and cost.", "detail": "By default, peering to a shared hub does not let two spokes talk to each other directly \u2014 that isolation is often the whole point of the design."}, {"id": "f26", "cat": "infrastructure", "front": "VNet peering vs. VPN Gateway vs. ExpressRoute", "back": "VNet peering connects Azure VNets directly over Microsoft's backbone, with low latency and no gateway required. A Site-to-Site VPN Gateway connects on-premises networks to Azure over an encrypted tunnel across the public internet. ExpressRoute is a private, dedicated circuit to Azure through a connectivity provider, bypassing the public internet for higher, more predictable bandwidth.", "detail": "ExpressRoute is the answer whenever a scenario needs the most predictable bandwidth and latency and is willing to work with a connectivity provider for a dedicated circuit."}, {"id": "f27", "cat": "infrastructure", "front": "Azure Front Door vs. Application Gateway vs. Traffic Manager", "back": "Front Door is a global, layer-7 entry point with edge caching, a Web Application Firewall, and routing across regions. Application Gateway is a regional layer-7 load balancer that can also provide a Web Application Firewall, but only within one region. Traffic Manager is DNS-based global routing with no data-plane inspection \u2014 it only returns which endpoint's IP address to use.", "detail": "Because Traffic Manager works purely at the DNS layer, its failover is limited by client-side DNS caching (TTL), unlike Front Door's real data-plane failover."}, {"id": "f28", "cat": "infrastructure", "front": "Network security group (NSG) vs. Azure Firewall", "back": "An NSG is a per-subnet or per-NIC allow/deny filter on IP address, port, and protocol \u2014 simple and free. Azure Firewall is a managed, stateful, centralized firewall supporting FQDN-based filtering and unified logging across many VNets, suited to enforcing a perimeter from a hub.", "detail": "NSGs have no concept of a fully qualified domain name \u2014 FQDN-based outbound filtering across a whole hub-and-spoke estate calls for Azure Firewall, not a pile of per-subnet NSGs."}, {"id": "f29", "cat": "infrastructure", "front": "Azure Migrate", "back": "The hub service for discovering on-premises servers and workloads, assessing them (right-sizing, readiness, cost estimation), and coordinating the actual migration tools, all before any workload is moved.", "detail": "Azure Migrate is the answer for the discovery-and-assessment phase; the actual data move is often handed off to a more specialized tool like the Database Migration Service."}, {"id": "f30", "cat": "infrastructure", "front": "Service Bus vs. Event Grid vs. Event Hubs", "back": "Service Bus is a message broker for ordered, transactional, point-to-point or pub/sub messaging with guaranteed delivery. Event Grid is a lightweight, reactive eventing service for discrete event notifications with push-based routing. Event Hubs is built for high-throughput streaming and telemetry ingestion at massive scale.", "detail": "A requirement for reliable, ordered, exactly-processed order queues points to Service Bus; a requirement to react to \"a blob was created\" points to Event Grid; high-volume telemetry ingestion points to Event Hubs."}, {"id": "f31", "cat": "infrastructure", "front": "Azure API Management", "back": "A facade placed in front of backend APIs, regardless of where or how they're hosted, adding a consistent gateway for authentication, rate limiting, versioning, and a developer portal, decoupling API consumers from the underlying implementation.", "detail": "API Management is the answer whenever multiple differently-hosted backends need one consistent, versioned, authenticated surface for external or partner consumers."}, {"id": "f32", "cat": "infrastructure", "front": "Logic Apps vs. Azure Functions for integration", "back": "Logic Apps is a low-code, designer-driven workflow orchestrator with hundreds of prebuilt connectors, suited to integrating SaaS and enterprise systems. Azure Functions is code-first, event-triggered compute, better suited when custom logic or fine-grained execution control is the priority.", "detail": "A requirement that business analysts, not just developers, be able to understand and adjust the flow is a strong signal for Logic Apps over hand-written Functions code."}, {"id": "f33", "cat": "infrastructure", "front": "Azure Virtual WAN", "back": "A Microsoft-managed networking service that automates large-scale hub-and-spoke connectivity \u2014 branch, VPN, and ExpressRoute connections, hubs, and routing \u2014 across many regions, instead of building and peering each hub manually.", "detail": "Virtual WAN is the answer when a design needs to scale hub-and-spoke connectivity across many regions without hand-configuring peering and routing for every hub."}, {"id": "f34", "cat": "infrastructure", "front": "Scale up vs. scale out for App Service", "back": "Scaling up changes the App Service plan's pricing tier or size to a bigger instance. Scaling out adds more instances of the same tier, often automated through autoscale rules based on metrics or a schedule.", "detail": "Autoscale rules configure scaling out (more instances); changing to a larger tier is always a manual or scripted scale-up decision, not something autoscale rules do on their own."}], "questions": [{"id": "q1", "cat": "identityGovernance", "type": "mc", "question": "A company requires that user passwords never be stored, even in hashed form, outside of its on-premises Active Directory, but wants employees to sign in to Entra ID-integrated apps without deploying and maintaining an AD FS server farm. Which hybrid identity authentication method should be recommended?", "options": ["Password hash synchronization", "Active Directory Federation Services (AD FS)", "Cloud-only Entra ID accounts with no on-premises AD", "Pass-through authentication"], "correct": 3, "explanation": "Pass-through authentication validates each sign-in directly against on-premises AD via a lightweight agent, so no password or hash is ever stored in Entra ID, and it needs no federation server farm to operate. Password hash synchronization would store a hash of the password in the cloud, which the requirement rules out. AD FS meets the password requirement but requires deploying and maintaining federation servers, which the company wants to avoid. Cloud-only accounts would abandon the existing on-premises AD investment entirely."}, {"id": "q2", "cat": "identityGovernance", "type": "mc", "question": "An organization wants administrators to hold no standing access to the Global Administrator role, requiring them to request activation with justification and a fixed expiration each time elevated access is needed. Which Entra ID feature should be designed into the solution?", "options": ["Privileged Identity Management (PIM)", "A Conditional Access sign-in risk policy", "Access reviews", "A custom RBAC role assigned at the management group scope"], "correct": 0, "explanation": "PIM turns standing privileged access into eligible, time-bound activations that can require approval and justification, exactly matching the requirement. Access reviews periodically recertify access that already exists, but don't by themselves convert standing access into time-bound activation. A Conditional Access risk policy addresses risky sign-ins, not the elimination of standing privilege. A custom RBAC role changes what permissions are granted, not when or how long they're active."}, {"id": "q3", "cat": "identityGovernance", "type": "mc", "question": "A company with 40 subscriptions wants a single Azure Policy assignment that both flags noncompliant storage accounts missing a required diagnostic setting today, and automatically deploys that diagnostic setting to any account found missing one going forward, without an administrator building it by hand each time. Which policy effect satisfies the automatic-deployment half of that requirement?", "options": ["Audit", "Disabled", "DeployIfNotExists", "Append"], "correct": 2, "explanation": "DeployIfNotExists actively remediates by deploying a related resource \u2014 here, the missing diagnostic setting \u2014 whenever it's found to be absent. Audit only flags noncompliance without deploying anything, and doesn't retroactively fix existing resources. Disabled effectively turns the policy off. Append only modifies fields on the resource being created or updated; it doesn't deploy a separate related resource."}, {"id": "q4", "cat": "identityGovernance", "type": "mc", "question": "A conglomerate has three independently run subsidiaries, each needing its own Azure Policy and RBAC boundary, but the parent company also wants one place to apply a small set of shared security policies, such as mandatory resource tagging, across all three at once. What structure best satisfies both needs?", "options": ["One flat subscription per subsidiary directly under the tenant root, with policies assigned individually to each subscription", "A single subscription shared by all three subsidiaries, separated only by resource groups", "Separate Entra ID tenants for each subsidiary, unified later through B2B guest access", "A parent management group with one child management group per subsidiary, applying shared policies at the parent and subsidiary-specific policies at each child"], "correct": 3, "explanation": "A parent management group lets the shared tagging policy be assigned once and inherited by every subsidiary, while each subsidiary's own child management group keeps independent policy and RBAC underneath. Flat subscriptions at the root would require repeating the shared policy assignment on every subscription individually. A single shared subscription blurs the billing and scale boundaries the subsidiaries need to stay independent. Separate tenants would actually complicate a single shared policy, since Azure Policy assignments don't span tenant boundaries natively."}, {"id": "q5", "cat": "identityGovernance", "type": "mc", "question": "A regulated healthcare company must keep monitoring data from its clinical subsidiary in a workspace with its own retention and access boundary, separate from the rest of the organization, while still wanting one centralized workspace for general infrastructure monitoring across other business units. What design satisfies both needs?", "options": ["One centralized Log Analytics workspace for the whole organization, with RBAC used to restrict which teams can query which tables", "A dedicated Log Analytics workspace for the clinical subsidiary's regulated data, plus a separate centralized workspace for the rest of the organization", "No Log Analytics workspace at all, relying solely on Azure Monitor Metrics for compliance data", "A single Application Insights resource shared across the entire organization"], "correct": 1, "explanation": "A dedicated workspace for the regulated subsidiary keeps its retention and access boundary fully separate to meet compliance needs, while a shared centralized workspace still efficiently serves everyone else. Table-level RBAC in one shared workspace can restrict queries, but doesn't give the subsidiary its own retention policy or the hard boundary a dedicated workspace provides. Skipping Log Analytics would abandon log-based monitoring and most compliance auditing capability. A single Application Insights resource is scoped to application telemetry, not organization-wide infrastructure logs and compliance-driven retention."}, {"id": "q6", "cat": "identityGovernance", "type": "mc", "question": "New contractors regularly need bundled access to three specific applications and a SharePoint site for the duration of their contract, with that access automatically expiring and being removed when the contract ends, without an administrator manually revoking each permission. Which Entra ID Governance feature should be used?", "options": ["Conditional Access policies", "Standing role assignments reviewed quarterly", "Entitlement management access packages", "Azure Policy exemptions"], "correct": 2, "explanation": "Entitlement management access packages bundle multiple resources into one requestable, approvable unit with automatic expiration built in \u2014 exactly matching access that expires and removes itself without manual revocation. Conditional Access controls the conditions of sign-in, not what's granted. Standing assignments reviewed quarterly still require a manual revocation action, and unwanted access lingers between review cycles. Policy exemptions are about excluding resources from policy enforcement, unrelated to user access lifecycle."}, {"id": "q7", "cat": "identityGovernance", "type": "mc", "question": "A team needs to trigger an alert within seconds whenever a VM's CPU utilization exceeds 90%, and separately needs to run complex, multi-table correlation queries across a week of security events. Which combination of Azure Monitor data types fits each need respectively?", "options": ["Azure Monitor Metrics for the CPU alert; Log Analytics (Logs) for the security correlation", "Application Insights for the CPU alert; Azure Policy compliance data for the security correlation", "Log Analytics (Logs) for the CPU alert; Azure Monitor Metrics for the security correlation", "The Activity log for both, since it records both performance and security data"], "correct": 0, "explanation": "Metrics are lightweight, near-real-time numerical data ideal for a fast-triggering CPU alert, while Logs (queried in Log Analytics with KQL) support the complex, multi-table correlation queries needed for a longer security investigation. Swapping the two would mean paying the query latency of logs for something metrics do faster, and using a plain numeric time series for something too complex for it. The Activity log records control-plane operations \u2014 who did what to which resource \u2014 not VM performance metrics or detailed security event correlation."}, {"id": "q8", "cat": "identityGovernance", "type": "mc", "question": "An enterprise is establishing its first Azure environment and wants every new subscription to automatically inherit a consistent baseline of management groups, policies, RBAC, and hub network connectivity from day one, rather than each application team configuring governance and networking independently. Which approach directly addresses this?", "options": ["Deploying a single flat subscription for every team to share", "Adopting an Azure landing zone architecture based on the Cloud Adoption Framework", "Relying only on resource tags for governance", "Granting every team Owner at the tenant root management group"], "correct": 1, "explanation": "A landing zone is exactly this: a pre-provisioned, consistent starting environment \u2014 management groups, policy, identity, and networking \u2014 so every new subscription inherits governance and connectivity automatically. A single flat subscription doesn't scale governance or isolate workloads. Tags alone provide metadata for cost and reporting but enforce nothing on their own. Granting broad Owner access at the tenant root is the opposite of governed, least-privilege design."}, {"id": "q9", "cat": "dataStorage", "type": "mc", "question": "A financial services company is migrating an on-premises SQL Server instance that relies heavily on SQL Server Agent jobs, cross-database queries, and linked servers. The company wants to minimize patching and OS management, but cannot lose these instance-level features. Which Azure data platform service should be recommended?", "options": ["Azure SQL Database (single database)", "Azure SQL Managed Instance", "SQL Server on an Azure Virtual Machine", "Azure Cosmos DB with the API for NoSQL"], "correct": 1, "explanation": "Managed Instance offers near-complete SQL Server engine compatibility \u2014 including SQL Agent, cross-database queries, and linked servers \u2014 while remaining fully managed PaaS that removes OS-level patching. Azure SQL Database (single database) doesn't support cross-database queries or SQL Agent jobs. SQL Server on a VM would keep those features but pushes OS and SQL Server patching back onto the customer, which the requirement to minimize management rules out. Cosmos DB is a non-relational store and wouldn't run an existing T-SQL workload at all."}, {"id": "q10", "cat": "dataStorage", "type": "mc", "question": "A globally distributed e-commerce app writes to a Cosmos DB account with multi-region writes enabled, and product-catalog reads can tolerate being a few seconds stale in exchange for the lowest possible read latency and highest availability. Which consistency level best fits?", "options": ["Strong", "Session", "Bounded staleness", "Eventual"], "correct": 3, "explanation": "Eventual consistency gives the lowest latency and highest availability of the five levels, at the cost of no ordering guarantee across replicas \u2014 an acceptable trade-off for catalog reads that only need to be approximately current. Strong consistency requires synchronous replication, which increases latency and reduces availability, and isn't justified by this read pattern. Session consistency is the right default when a user needs to see their own writes immediately, which isn't the requirement here. Bounded staleness caps the exact lag in versions or time, adding more complexity than this scenario needs."}, {"id": "q11", "cat": "dataStorage", "type": "mc", "question": "A Cosmos DB container storing IoT telemetry uses a partition key of \"deviceType,\" but 95% of all devices share the same type, causing consistent write throttling despite ample provisioned RU/s. What is the most likely design fix?", "options": ["Switch to a higher consistency level", "Move the data into Azure Table Storage instead", "Enable geo-redundant storage on the account", "Choose a partition key with higher cardinality, such as deviceId"], "correct": 3, "explanation": "This is a classic hot partition: a low-cardinality key concentrates nearly all traffic onto one logical (and therefore physical) partition, throttling regardless of total provisioned throughput. A higher-cardinality key like deviceId spreads writes evenly across partitions instead. Consistency level affects replication guarantees, not partition distribution. Switching stores or enabling geo-redundancy doesn't address a partitioning design problem at all."}, {"id": "q12", "cat": "dataStorage", "type": "mc", "question": "An application requires its storage account data to survive the loss of an entire datacenter within the primary region, and also wants the option to read that data from a secondary region without waiting for a full failover. Which redundancy option should be selected?", "options": ["LRS", "ZRS", "GZRS with read access enabled (RA-GZRS)", "GRS without read access"], "correct": 2, "explanation": "RA-GZRS combines zone-redundant storage in the primary region (surviving a datacenter loss) with asynchronous replication to a secondary region that can be read from directly, without waiting for a failover. LRS and ZRS alone provide no secondary-region copy at all. Plain GRS without read access replicates to a second region, but that copy isn't readable until an actual failover occurs."}, {"id": "q13", "cat": "dataStorage", "type": "mc", "question": "A compliance team must retain seven years of audit logs that are essentially never read after the first 90 days, and cost minimization is the top priority, with a delay of several hours being acceptable if a log ever needs to be retrieved. Which access tier fits best after that initial 90-day window?", "options": ["Hot", "Cool", "Archive", "Premium block blob"], "correct": 2, "explanation": "Archive tier offers the lowest storage cost of any tier, matching data that's essentially never accessed, and its multi-hour rehydration delay before a blob becomes readable is explicitly acceptable per the requirement. Hot and Cool are meant for data accessed far more frequently than \"essentially never,\" and both have a higher storage cost than Archive. Premium block blob storage is optimized for high-transaction, low-latency scenarios \u2014 the opposite of this cost-first, rarely-read requirement."}, {"id": "q14", "cat": "dataStorage", "type": "mc", "question": "A data engineering team needs to run large-scale Spark analytics jobs against petabytes of semi-structured files, requiring POSIX-style access control lists at the directory and file level and efficient rename or move operations on folders. Which storage solution should be recommended?", "options": ["Azure Data Lake Storage Gen2 (hierarchical namespace enabled)", "Azure Files (SMB share)", "Table storage", "A flat Blob storage container with no hierarchical namespace"], "correct": 0, "explanation": "ADLS Gen2 adds a hierarchical namespace on top of Blob storage specifically to support POSIX-like ACLs and efficient directory operations at big-data scale, which is what large analytics engines like Spark expect. Azure Files is built for SMB or NFS file-share mounting, not massive-scale analytics. Table storage is a NoSQL key-value store, not a fit for large semi-structured files. A flat blob container without a hierarchical namespace lacks the efficient directory-level operations the workload needs."}, {"id": "q15", "cat": "dataStorage", "type": "mc", "question": "Before migrating an on-premises SQL Server database to Azure, a team wants to first identify compatibility issues and deprecated features that could break after the move, without yet performing the actual data migration. Which tool addresses this step?", "options": ["Azure Database Migration Service (DMS)", "Azure Migrate: Server Migration", "Data Migration Assistant (DMA)", "AzCopy"], "correct": 2, "explanation": "DMA specifically assesses a source database for compatibility issues, deprecated features, and migration blockers before any data moves. DMS is the tool that performs the actual migration, online or offline, once you're ready. Azure Migrate: Server Migration handles VM and server migration, not database-level compatibility assessment. AzCopy is a general-purpose data-copy tool for storage accounts, not a database assessment tool."}, {"id": "q16", "cat": "businessContinuity", "type": "mc", "question": "A company wants to keep its three-tier application running with minimal disruption if an entire Azure region becomes unavailable, replicating full VMs (not just data) to a secondary region and enabling an orchestrated failover of the whole application. Which service is purpose-built for this?", "options": ["Azure Backup", "Storage account soft delete", "Azure Site Recovery", "Azure Monitor action groups"], "correct": 2, "explanation": "Site Recovery replicates entire VMs, not just data, to a secondary region and orchestrates a full application failover, including startup order \u2014 exactly what's needed to keep the whole three-tier app running after a regional loss. Azure Backup restores point-in-time data but provides no live replication or app-level failover orchestration. Soft delete only protects against accidental blob deletion. Action groups notify or trigger automation on alerts; they don't replicate or fail anything over on their own."}, {"id": "q17", "cat": "businessContinuity", "type": "mc", "question": "An application needs protection against the loss of a single datacenter with the lowest possible added latency between its tiers, and separately needs a documented disaster recovery plan for a full regional outage. Which combination of Azure constructs addresses both needs respectively?", "options": ["A single availability zone for both requirements", "Region pairs for the datacenter-loss protection; availability zones for the regional DR plan", "Traffic Manager alone, with no zone or region redundancy needed", "Availability zones for the datacenter-loss protection; a secondary paired region for the regional DR plan"], "correct": 3, "explanation": "Availability zones are physically separate datacenters within one region connected by low-latency links, ideal for protecting against a single-datacenter loss without much added latency. A secondary region is what a true regional DR plan relies on, accepting higher latency for that broader protection. Swapping the two assigns each construct to the wrong scope, and neither a single zone nor Traffic Manager alone provides real redundancy against either failure on its own."}, {"id": "q18", "cat": "businessContinuity", "type": "mc", "question": "An application connects to an Azure SQL Database using a fixed connection string and must keep working, unmodified, after the database fails over to its secondary region. Which feature makes that failover transparent to the application?", "options": ["Auto-failover groups with a listener endpoint", "Manual geo-restore from backup", "Read-only replicas configured with no listener", "Zone-redundant configuration alone, without a secondary region"], "correct": 0, "explanation": "Auto-failover groups expose a stable listener endpoint that automatically redirects to whichever database is currently primary, so an unchanged connection string keeps working through a failover. Geo-restore recovers from backup, but requires updating the connection string to point at the newly restored server, breaking the \"unmodified\" requirement. Read replicas without a listener still require the application to know which endpoint is primary. Zone redundancy alone protects against a datacenter loss within one region, not a full regional failover to a secondary region."}, {"id": "q19", "cat": "businessContinuity", "type": "mc", "question": "The business states that, for a specific application, up to 4 hours of data loss is acceptable but downtime must be under 15 minutes. Which of these design choices is least consistent with those objectives?", "options": ["Synchronous replication to a warm standby with automated failover", "A backup job that runs once every 24 hours with a manual, multi-hour recovery process", "Geo-redundant storage with an application layer that can redirect traffic automatically", "Continuous replication with a health-check-triggered automatic failover"], "correct": 1, "explanation": "A 24-hour backup interval alone allows up to a full day of data loss \u2014 far beyond the stated 4-hour RPO \u2014 and a manual, multi-hour recovery process blows well past the 15-minute RTO too. The other three options all involve frequent or continuous replication with automated failover, consistent with an RTO and RPO this tight."}, {"id": "q20", "cat": "businessContinuity", "type": "mc", "question": "A globally used application must serve users from the nearest region at all times, with zero perceptible downtime even during a regional failure, and the business accepts the added cost and complexity of handling concurrent writes across regions. Which topology fits?", "options": ["Active-passive with a cold standby region", "A single-region deployment with availability zones only", "Active-passive with a warm standby that takes 30 minutes to activate", "Active-active multi-region deployment"], "correct": 3, "explanation": "Active-active runs full production traffic in multiple regions simultaneously, enabling both \"nearest region always\" routing and true zero-downtime failover, at the cost of handling multi-region write conflicts, which the business has explicitly accepted. Both active-passive options introduce a failover delay, cold or warm, which violates \"zero perceptible downtime.\" A single region with only availability zones doesn't protect against a full regional failure at all."}, {"id": "q21", "cat": "infrastructure", "type": "mc", "question": "A team wants to deploy a set of microservices as containers, needs built-in autoscaling based on HTTP traffic and event sources like queue length, and explicitly does not want to manage Kubernetes cluster upgrades or node pools. Which compute service fits best?", "options": ["Azure Kubernetes Service (AKS)", "Azure Virtual Machines running Docker", "Azure Container Instances only, with a custom scaling script", "Azure Container Apps"], "correct": 3, "explanation": "Container Apps provides serverless containers with built-in, event- and HTTP-driven autoscaling, and no cluster or node management at all. AKS would meet the autoscaling need but requires managing the underlying Kubernetes cluster and node pools, exactly what the team wants to avoid. VMs running Docker manually require far more infrastructure management than either option. Container Instances alone has no built-in autoscaling orchestration; that would have to be hand-built."}, {"id": "q22", "cat": "infrastructure", "type": "mc", "question": "A workload only needs to run a short piece of code in response to a message arriving on a queue, a few times per day, and the company wants to pay only for actual execution time rather than for continuously running infrastructure. Which compute option fits best?", "options": ["Azure Functions on a Consumption plan", "A dedicated App Service Plan running around the clock", "A permanently running virtual machine", "Azure Kubernetes Service with a fixed node pool"], "correct": 0, "explanation": "Functions on a Consumption plan bills per execution and per resource-second actually used, matching an infrequent, short-lived, event-triggered workload with no cost during idle time. An always-on App Service plan, a permanently running VM, or a fixed AKS node pool all incur cost continuously, regardless of how rarely the code actually runs."}, {"id": "q23", "cat": "infrastructure", "type": "mc", "question": "An enterprise has a central team managing a shared VPN gateway, Azure Firewall, and DNS resolver, while a dozen application teams each need their own isolated VNet that can reach those shared services but should not be able to communicate directly with each other's VNets. Which topology matches this requirement?", "options": ["Hub-and-spoke, with each application VNet peered only to the hub", "A single flat VNet shared by all application teams", "Full mesh peering between every application VNet", "ExpressRoute connections directly between each pair of application VNets"], "correct": 0, "explanation": "Hub-and-spoke centralizes the shared gateway, firewall, and DNS in the hub, with each spoke peered only to the hub, giving every team access to shared services while, by default, keeping spokes from reaching each other directly. A single flat VNet or full mesh peering would both allow direct spoke-to-spoke communication, which the requirement rules out. ExpressRoute is for on-premises-to-Azure private connectivity, not for connecting Azure VNets to each other."}, {"id": "q24", "cat": "infrastructure", "type": "mc", "question": "A company needs the highest possible bandwidth and most predictable latency between its on-premises datacenter and Azure for a latency-sensitive trading application, and is willing to work with a connectivity provider and pay for a dedicated private circuit to get it. Which connection type should be recommended?", "options": ["Site-to-Site VPN Gateway over the public internet", "ExpressRoute", "VNet peering", "Point-to-Site VPN for each trader's workstation"], "correct": 1, "explanation": "ExpressRoute provides a private, dedicated circuit through a connectivity provider that bypasses the public internet, giving the highest and most predictable bandwidth and lowest latency \u2014 exactly what a latency-sensitive trading workload needs, and matching the willingness to work with a provider for a dedicated circuit. A Site-to-Site VPN travels over the public internet, with less predictable latency. VNet peering only connects Azure VNets to each other, not on-premises to Azure. Point-to-Site VPN connects individual workstations, not a whole datacenter, and doesn't offer ExpressRoute's dedicated bandwidth."}, {"id": "q25", "cat": "infrastructure", "type": "mc", "question": "A global retail site needs a single entry point that can route users to the nearest of several regional backend deployments, cache static content at the edge, and provide a web application firewall, all at the HTTP layer. Which service is the best fit?", "options": ["Azure Traffic Manager", "Azure Application Gateway (regional)", "Azure Front Door", "A Layer 4 network load balancer"], "correct": 2, "explanation": "Front Door is a global, layer-7 entry point that combines edge caching, a Web Application Firewall, and latency-based routing across regional backends, matching every requirement stated. Traffic Manager works at the DNS layer and can route globally, but has no data-plane caching or WAF capability. Application Gateway offers a WAF but operates at regional scope, not globally across backends. A Layer 4 load balancer has no awareness of HTTP content, caching, or WAF rules at all."}, {"id": "q26", "cat": "infrastructure", "type": "mc", "question": "A hub-and-spoke network needs centralized, FQDN-based outbound filtering, such as allowing traffic only to specific approved domains, and unified logging across every spoke VNet, managed from one place rather than configured per subnet. Which should be deployed in the hub?", "options": ["A network security group (NSG) on every spoke subnet", "Application security groups only", "A Traffic Manager profile in the hub", "Azure Firewall in the hub VNet"], "correct": 3, "explanation": "Azure Firewall supports FQDN-based filtering rules and centralized, unified logging, and is designed to sit in a hub and protect every peered spoke from one place. NSGs filter by IP address, port, and protocol per subnet or NIC; they have no concept of an FQDN and would need to be replicated and maintained across every spoke individually. Application security groups just group VMs for use in NSG rules; they add no filtering capability of their own. Traffic Manager is a DNS routing service, unrelated to firewalling."}, {"id": "q27", "cat": "infrastructure", "type": "mc", "question": "Before moving several hundred on-premises VMs to Azure, a team wants to first discover what's running, right-size the target VMs based on actual utilization, and estimate monthly cost, all before any workload is actually moved. Which service should anchor this phase?", "options": ["Azure Site Recovery", "Azure Migrate", "Azure Database Migration Service", "Azure Advisor alone"], "correct": 1, "explanation": "Azure Migrate is purpose-built for the discovery, assessment (right-sizing and cost estimation), and planning phase before any workload actually moves, and it then coordinates the migration tools themselves. Site Recovery is for ongoing DR replication, not a one-time discovery and assessment exercise. Database Migration Service only handles database workloads, not general server discovery across hundreds of VMs. Azure Advisor gives general optimization recommendations for existing Azure resources, not a pre-migration on-premises assessment."}, {"id": "q28", "cat": "infrastructure", "type": "mc", "question": "A retail platform needs to reliably process each order exactly once, in order, with guaranteed delivery even if the processing service is briefly unavailable, using a point-to-point queue. Which messaging service fits best?", "options": ["Azure Service Bus", "Azure Event Grid", "Azure Event Hubs", "Azure Storage queues with no dead-letter handling"], "correct": 0, "explanation": "Service Bus is designed for enterprise messaging patterns needing ordering, guaranteed delivery, and reliable point-to-point queues, matching an order-processing scenario exactly. Event Grid is built for lightweight, reactive event notifications, not guaranteed ordered queue processing. Event Hubs is built for high-throughput streaming and telemetry ingestion rather than transactional order processing. Plain storage queues with no dead-letter handling lack the reliability guarantees this scenario needs."}, {"id": "q29", "cat": "infrastructure", "type": "mc", "question": "A company has several backend APIs built on different technologies, some on VMs, some on App Service, some on AKS, and wants external partners to consume them through one consistent, versioned, authenticated gateway, without needing to know which backend implementation serves each API. Which service addresses this?", "options": ["Azure Application Gateway", "Azure Front Door", "Azure API Management", "Azure Logic Apps"], "correct": 2, "explanation": "API Management sits in front of any backend, regardless of where or how it's hosted, providing one consistent gateway with authentication, versioning, and a developer portal, exactly the abstraction described. Application Gateway and Front Door route and load-balance HTTP traffic, but don't provide API-specific concerns like versioning, policies, or a developer portal. Logic Apps is a workflow orchestration tool, not an API gateway."}, {"id": "q30", "cat": "infrastructure", "type": "mc", "question": "An integration needs to connect a SaaS CRM, an on-premises ERP system, and a SharePoint site using mostly prebuilt connectors and a visual workflow designer, with minimal custom code, and business analysts, not just developers, need to be able to understand and adjust the flow. Which service fits best?", "options": ["Azure Functions", "Azure Kubernetes Service", "Azure Batch", "Azure Logic Apps"], "correct": 3, "explanation": "Logic Apps is the low-code, designer-driven workflow service with hundreds of prebuilt connectors for exactly this kind of SaaS, on-premises, and enterprise system integration, and its visual designer is approachable to non-developers. Azure Functions is code-first, better suited when custom logic is the priority over prebuilt connectors. AKS and Batch are compute platforms for running custom workloads or jobs, not integration-workflow tools with prebuilt connectors."}, {"id": "tf1", "cat": "identityGovernance", "type": "tf", "question": "Pass-through authentication requires at least one on-premises authentication agent to be online for users to sign in successfully.", "answer": true, "explanation": "Pass-through authentication validates credentials against on-premises AD in real time via lightweight agents, so if every agent is offline, sign-in fails unless password hash sync is also enabled as a backup method. This differs from password hash sync, which can validate independently of on-premises availability."}, {"id": "tf2", "cat": "identityGovernance", "type": "tf", "question": "Privileged Identity Management (PIM) is intended to replace Conditional Access policies entirely.", "answer": false, "explanation": "PIM's just-in-time privileged access and Conditional Access's real-time sign-in policy enforcement address different problems, and are typically used together rather than as substitutes for one another. PIM can even require a Conditional Access-enforced control, such as MFA, as part of activating a role."}, {"id": "tf3", "cat": "identityGovernance", "type": "tf", "question": "In Azure RBAC, a Reader role assigned at the subscription scope combined with a Contributor role assigned at one resource group within it results in Contributor access at that resource group and Reader access everywhere else in the subscription.", "answer": true, "explanation": "RBAC assignments are additive and inherit downward; the more permissive assignment at the narrower scope applies there, while the broader-scope assignment still governs everything else in the subscription."}, {"id": "tf4", "cat": "dataStorage", "type": "tf", "question": "The read-only listener endpoint of an Azure SQL auto-failover group can serve read queries even before any failover has occurred.", "answer": true, "explanation": "The read-only listener routes to a readable secondary database at all times, not only after a failover, which is part of its normal-operation value, separate from the read-write listener that always points at the current primary."}, {"id": "tf5", "cat": "dataStorage", "type": "tf", "question": "Cosmos DB's Strong consistency level provides the lowest possible read latency among the five consistency levels.", "answer": false, "explanation": "Strong consistency requires synchronous replication before a write is acknowledged, which increases latency and reduces availability compared to weaker levels. Eventual consistency, not Strong, offers the lowest latency and highest availability of the five levels."}, {"id": "tf6", "cat": "dataStorage", "type": "tf", "question": "Archive-tier blobs can be read immediately, with no rehydration delay, the same way Cool-tier blobs can.", "answer": false, "explanation": "Archive-tier blobs are effectively offline and must be rehydrated to Hot or Cool before they can be read, a process that can take hours. Cool-tier blobs, by contrast, remain immediately readable at all times, just at a higher per-access cost than Hot."}, {"id": "tf7", "cat": "businessContinuity", "type": "tf", "question": "Azure Site Recovery is primarily designed to protect against accidental deletion of individual files, the same way Azure Backup is.", "answer": false, "explanation": "Site Recovery replicates entire VMs or workloads for failover during an outage. Recovering an individual accidentally deleted file is what Azure Backup's file-level or item-level recovery is for."}, {"id": "tf8", "cat": "businessContinuity", "type": "tf", "question": "An application's RPO should be determined by whichever backup interval the current infrastructure happens to already support.", "answer": false, "explanation": "RPO is a business requirement for acceptable data loss that should be set first, based on the business's actual tolerance. The backup or replication architecture is then designed to meet that RPO, rather than the business simply accepting whatever the existing infrastructure already does."}, {"id": "tf9", "cat": "infrastructure", "type": "tf", "question": "Traffic Manager makes routing decisions at the DNS layer and does not inspect or proxy the actual HTTP traffic between the client and the selected endpoint.", "answer": true, "explanation": "Traffic Manager only returns which endpoint's IP address a client should use, via DNS; the client then connects directly to that endpoint, unlike Front Door or Application Gateway, which sit in the data path and can inspect content."}, {"id": "tf10", "cat": "infrastructure", "type": "tf", "question": "Azure Virtual WAN can automate hub-and-spoke connectivity across many regions, including branch and VPN or ExpressRoute connections, without requiring each hub to be manually peered and configured individually.", "answer": true, "explanation": "Virtual WAN is Microsoft's managed service specifically for automating large-scale hub-and-spoke networking across regions, reducing the manual peering and configuration otherwise required to build the same topology by hand."}, {"id": "msq1", "cat": "identityGovernance", "type": "ms", "question": "Which two of the following are true about Microsoft Entra Privileged Identity Management (PIM)? (Choose two.)", "options": ["It grants time-bound, just-in-time activation of eligible roles instead of standing access", "It can require approval and justification before a role activates", "It replaces the need for Conditional Access policies on privileged accounts", "It permanently assigns a role once activated, with no expiration"], "correct": [0, 1], "explanation": "PIM's core value is turning standing privileged access into eligible, time-bound activations that can require approval and justification. It doesn't replace Conditional Access, which is commonly layered alongside it, and activated roles expire automatically after the configured duration rather than becoming permanent."}, {"id": "msq2", "cat": "identityGovernance", "type": "ms", "question": "Which two of the following correctly describe Azure Policy effects? (Choose two.)", "options": ["Audit effect automatically remediates noncompliant resources by deploying missing configuration", "Deny blocks the creation or update of a noncompliant resource", "DeployIfNotExists can automatically deploy a related resource when a required one is missing", "Policy effects only apply to resources created after the assignment, never evaluated retroactively"], "correct": [1, 2], "explanation": "Deny stops noncompliant resources at creation or update time, and DeployIfNotExists actively remediates by deploying a missing related resource. Audit only flags noncompliance without deploying anything on its own, and policy assignments do evaluate existing resources retroactively through compliance scans, not just new ones going forward."}, {"id": "msq3", "cat": "identityGovernance", "type": "ms", "question": "Which two of the following are appropriate uses of management groups in an Azure governance design? (Choose two.)", "options": ["Replacing the need for resource groups entirely", "Storing billing invoices for each subscription", "Applying a shared Azure Policy assignment across multiple subscriptions at once", "Assigning RBAC roles that are inherited by every subscription beneath a given management group"], "correct": [2, 3], "explanation": "Management groups exist specifically to apply policy and RBAC once at a level above subscriptions, inherited downward. They don't replace resource groups, which remain the deployment and lifecycle boundary within a subscription, and they have nothing to do with storing billing invoices."}, {"id": "msq4", "cat": "dataStorage", "type": "ms", "question": "Which two of the following correctly describe Azure Storage redundancy options? (Choose two.)", "options": ["ZRS replicates synchronously across availability zones within a single region", "LRS protects against the loss of an entire region", "RA-GRS data in the secondary region can be read only after a failover has been triggered", "GRS replicates asynchronously to a secondary, paired region"], "correct": [0, 3], "explanation": "ZRS spreads synchronous copies across zones in one region, and GRS asynchronously replicates to a separate region. LRS only protects against hardware failure within a single datacenter, not a regional loss, and RA-GRS specifically allows reading the secondary region before any failover, which is its whole purpose over plain GRS."}, {"id": "msq5", "cat": "dataStorage", "type": "ms", "question": "Which two of the following are true about Cosmos DB partition key design? (Choose two.)", "options": ["A low-cardinality partition key can cause a small number of partitions to be overloaded (\"hot partitions\")", "Partition key choice has no effect on throughput distribution", "A high-cardinality, evenly-accessed partition key generally distributes request volume more evenly", "Changing the consistency level is the recommended fix for a hot-partition problem"], "correct": [0, 2], "explanation": "A low-cardinality key concentrates data and requests onto few partitions, creating hot partitions, while a high-cardinality, evenly distributed key spreads load more evenly. Partition key choice absolutely affects throughput distribution, and the fix for a hot-partition problem is redesigning the key, not adjusting the consistency level, which is unrelated."}, {"id": "msq6", "cat": "businessContinuity", "type": "ms", "question": "Which two of the following distinguish Azure Site Recovery from Azure Backup? (Choose two.)", "options": ["Backup and Site Recovery are two names for the exact same underlying service", "Site Recovery replicates entire VMs for failover to a secondary location; Backup restores data to a prior point in time", "Backup is used exclusively for on-premises workloads and cannot protect Azure VMs", "Site Recovery can orchestrate an ordered, multi-tier application failover; Backup does not orchestrate failovers"], "correct": [1, 3], "explanation": "Site Recovery replicates whole VMs and can orchestrate an ordered failover across an application's tiers; Backup restores point-in-time data but has no failover-orchestration role. They are distinct services commonly used together, and Backup fully supports protecting Azure VMs, not just on-premises workloads."}, {"id": "msq7", "cat": "businessContinuity", "type": "ms", "question": "Which two of the following are true about RTO and RPO? (Choose two.)", "options": ["RPO measures acceptable data loss, expressed as a duration of time", "A shorter RPO always means a more relaxed (higher) RTO requirement", "RTO and RPO are set independently of business requirements, based only on available technology", "RTO measures how long recovery is allowed to take after an outage"], "correct": [0, 3], "explanation": "RPO is about how much data loss, in time, is tolerable, and RTO is about how long restoring service is allowed to take. The two aren't linked by a fixed inverse relationship \u2014 a business can require both a short RPO and a short RTO simultaneously \u2014 and both should be set by business requirements first, with the technical architecture designed to meet them, not the other way around."}, {"id": "msq8", "cat": "infrastructure", "type": "ms", "question": "Which two of the following correctly distinguish Azure Front Door from Azure Application Gateway? (Choose two.)", "options": ["Application Gateway provides global edge caching, while Front Door does not", "Front Door operates globally across regions; Application Gateway operates within a single region", "Both Front Door and Application Gateway can provide Web Application Firewall (WAF) capabilities", "Application Gateway routes traffic using DNS responses only, with no data-plane involvement"], "correct": [1, 2], "explanation": "Front Door is global, entering traffic at edge locations across regions, while Application Gateway is scoped to a single region. Both services do offer WAF capability. Edge caching is a Front Door feature, not something Application Gateway provides, and Application Gateway is a real layer-7 data-plane proxy, not a DNS-only mechanism like Traffic Manager."}, {"id": "msq9", "cat": "infrastructure", "type": "ms", "question": "Which two of the following are appropriate reasons to choose Azure Container Apps over Azure Kubernetes Service (AKS) for a given workload? (Choose two.)", "options": ["The team wants built-in autoscaling on HTTP or event triggers without managing cluster infrastructure", "The team needs full control over the Kubernetes API and custom operators", "The team wants to avoid managing node pools, upgrades, and cluster-level configuration", "The workload must run as raw virtual machines rather than containers"], "correct": [0, 2], "explanation": "Container Apps is the right fit when a team wants event- or HTTP-driven autoscaling and explicitly does not want to manage cluster infrastructure like node pools and upgrades. Needing direct control over the Kubernetes API and custom operators is a reason to choose AKS instead, and running raw VMs isn't a containers decision at all."}, {"id": "msq10", "cat": "infrastructure", "type": "ms", "question": "Which two of the following are true about Azure ExpressRoute? (Choose two.)", "options": ["It is established directly between two Azure virtual networks, with no on-premises component", "It provides a private connection to Azure that does not traverse the public internet", "It generally offers higher and more predictable bandwidth than a Site-to-Site VPN", "It requires no connectivity provider and can be self-configured entirely within the Azure portal"], "correct": [1, 2], "explanation": "ExpressRoute's defining traits are a private circuit that bypasses the public internet and typically higher, more predictable bandwidth than an internet-based VPN. It specifically connects on-premises networks to Azure, not VNet-to-VNet, which is what peering does, and it requires working with a connectivity provider to establish the physical circuit \u2014 it isn't purely self-service in the portal."}]}, "az802": {"categories": [{"key": "adDs", "label": "Deploy and Manage AD DS", "marks": 21}, {"key": "hybridWorkloads", "label": "Manage Windows Server Hybrid Workloads", "marks": 12}, {"key": "vmContainers", "label": "Manage Virtual Machines & Containers", "marks": 12}, {"key": "networking", "label": "Implement On-Premises & Hybrid Networking", "marks": 12}, {"key": "storage", "label": "Manage Storage & File Services", "marks": 16}, {"key": "security", "label": "Secure Windows Server Hybrid Infrastructure", "marks": 11}, {"key": "monitoring", "label": "Monitor & Troubleshoot Windows Server", "marks": 16}], "flashcards": [{"id": "f1", "cat": "adDs", "front": "The five FSMO roles", "back": "Forest-wide (one per forest): Schema Master, Domain Naming Master. Domain-wide (one per domain): RID Master, PDC Emulator, Infrastructure Master.", "detail": "PDC Emulator handles time sync and password-change urgency; Infrastructure Master fixes cross-domain group-membership references and should NOT sit on a Global Catalog server unless every DC in the domain is also a GC."}, {"id": "f2", "cat": "adDs", "front": "AD Sites and Services replication", "back": "Intra-site replication is frequent (change-notification triggered) and uncompressed, using a ring topology built automatically by the Knowledge Consistency Checker (KCC). Inter-site replication runs on a schedule over site links, compressed to save WAN bandwidth.", "detail": "A site link's cost and replication interval control how the KCC builds the inter-site spanning tree \u2014 lower cost is preferred, and bridgehead servers are the DCs that actually replicate across the link."}, {"id": "f3", "cat": "adDs", "front": "Trust types and transitivity", "back": "A forest trust is transitive between two entire forests. An external trust is non-transitive, linking two specific domains (often across forests). A shortcut trust shortens the referral path between two domains deep in the same forest. A realm trust connects a domain to a non-Windows Kerberos realm.", "detail": "Transitive doesn't mean unlimited \u2014 a forest trust does not automatically extend to a third forest that one of the two trusted forests trusts."}, {"id": "f4", "cat": "adDs", "front": "Group Policy processing order and precedence", "back": "GPOs apply in the order Local, Site, Domain, OU (LSDOU), with the last one applied \u2014 the OU closest to the object \u2014 normally winning a conflict. 'Enforced' on a GPO overrides that and always wins, even against Block Inheritance on a child OU.", "detail": "Block Inheritance stops higher-level GPOs from applying to an OU, but it cannot stop a GPO explicitly marked Enforced \u2014 enforcement beats blocking."}, {"id": "f5", "cat": "adDs", "front": "Microsoft Entra Connect authentication methods", "back": "Password Hash Synchronization (PHS) syncs a hash of the password hash to Microsoft Entra ID so sign-in works even if on-premises AD is down. Pass-through Authentication (PTA) validates the password against on-premises AD in real time via an agent, keeping the actual validation on-premises. Federation (AD FS) delegates authentication entirely to an on-premises federation service.", "detail": "PHS never transmits a recoverable, plaintext password to the cloud \u2014 only a hash of the hash \u2014 which is a common exam misconception to watch for."}, {"id": "f6", "cat": "adDs", "front": "Read-Only Domain Controller (RODC)", "back": "An RODC holds a read-only copy of the AD database, ideal for branch offices with weaker physical security. It caches credentials only for accounts allowed by its Password Replication Policy (PRP), and it holds a filtered attribute set that excludes sensitive data.", "detail": "If an RODC is compromised, only the passwords it was permitted to cache are at risk \u2014 not the whole domain's credentials \u2014 which is the entire point of the PRP."}, {"id": "f7", "cat": "adDs", "front": "AD Recycle Bin vs. tombstone reanimation", "back": "The AD Recycle Bin (available once forest functional level is Windows Server 2008 R2 or higher and the feature is enabled) restores a deleted object with essentially all of its original attributes, including group memberships. Tombstone reanimation, the older method, recovers a bare object that has lost most of its link-valued attributes.", "detail": "Enabling the AD Recycle Bin is a one-way, irreversible action for the forest \u2014 a detail the exam likes to test."}, {"id": "f8", "cat": "adDs", "front": "Group Managed Service Accounts (gMSA)", "back": "A gMSA provides one identity that multiple servers (like a load-balanced web farm) can use for a service, with automatic password rotation managed by AD \u2014 no manual password management or synchronization needed across servers.", "detail": "A standalone (single-server) MSA cannot be shared across multiple hosts \u2014 only a gMSA can, because only a gMSA replicates its managed password data through AD to every authorized host."}, {"id": "f9", "cat": "adDs", "front": "Global Catalog (GC)", "back": "A GC server holds a full, writable copy of its own domain plus a partial, read-only copy of every other domain in the forest, enabling forest-wide searches and universal group membership resolution during logon.", "detail": "Without a reachable GC, a user in a multi-domain forest logging on with a UPN, or one belonging to a universal group, can be blocked from completing logon \u2014 universal group membership can only be resolved via the GC."}, {"id": "f10", "cat": "hybridWorkloads", "front": "Azure Arc-enabled servers", "back": "Azure Arc projects an on-premises (or other-cloud) server into Azure Resource Manager as an Arc-enabled resource via the Connected Machine agent, without migrating the actual workload. Once projected, you can apply Azure Policy, Azure Monitor, Microsoft Defender for Cloud, and Update Manager to it just like a native Azure VM.", "detail": "Arc gives you Azure's management plane over a server that never leaves your datacenter \u2014 the compute itself stays exactly where it is."}, {"id": "f11", "cat": "hybridWorkloads", "front": "Windows Admin Center (WAC)", "back": "A free, browser-based management tool for Windows Server (and Windows client), installed as a gateway on a management PC/server or as a service, giving a modern portal-style UI for managing local or remote servers including Server Core.", "detail": "WAC extends with feature extensions (like Azure Arc integration) but runs entirely from a browser \u2014 no separate console application to install on every admin's workstation."}, {"id": "f12", "cat": "hybridWorkloads", "front": "Cluster-Aware Updating (CAU)", "back": "Automates installing Windows updates across every node in a failover cluster one at a time, draining (moving) that node's workloads to other nodes before patching and rebooting it, then bringing it back before moving to the next node.", "detail": "CAU can run against a remote CAU-enabled cluster on a schedule, with no dedicated CAU role required on the cluster itself, or in a self-updating mode where the cluster updates itself."}, {"id": "f13", "cat": "hybridWorkloads", "front": "Hyper-V Replica", "back": "Asynchronously replicates a running VM's changes from a primary Hyper-V host to a replica host (on-premises or another site), on a configurable interval as low as 30 seconds, keeping extra recovery points and supporting a manual, planned, or unplanned failover.", "detail": "Hyper-V Replica does not require Failover Clustering or shared storage at all \u2014 it works between two standalone Hyper-V hosts, which is a common exam distinction from clustered, S2D-based high availability."}, {"id": "f14", "cat": "hybridWorkloads", "front": "Storage Migration Service", "back": "Migrates files, shares, and their security and configuration from an old file server (or cluster) to a new one, and can optionally transfer the old server's identity (name and IP address) to the new server afterward, so clients keep using the same UNC path with no reconfiguration.", "detail": "It uses three roles \u2014 an orchestrator, a source server, and a destination server \u2014 and can inventory and migrate from Windows Server as far back as Windows Server 2003, and even from some NAS devices, not only recent Windows Server versions."}, {"id": "f15", "cat": "vmContainers", "front": "Hyper-V virtual switch types", "back": "External: binds to a physical NIC, giving VMs access to the physical network (and the host, if allowed). Internal: lets VMs and the host communicate with each other, but not the physical network. Private: lets VMs on the same host communicate with each other only, isolated even from the host.", "detail": "A private switch is the right call for an isolated test/lab network where VMs must talk to each other but must never reach the production network or even the host OS."}, {"id": "f16", "cat": "vmContainers", "front": "Generation 1 vs. Generation 2 virtual machines", "back": "Generation 1 VMs emulate legacy BIOS hardware and boot from IDE/legacy devices, for maximum OS compatibility. Generation 2 VMs use UEFI firmware, support Secure Boot, and boot directly from SCSI, offering better performance and security features but requiring a 64-bit, UEFI-aware guest OS.", "detail": "Once created, a VM's generation cannot be changed \u2014 choosing wrong means recreating the VM rather than converting it in place."}, {"id": "f17", "cat": "vmContainers", "front": "Standard vs. production checkpoints", "back": "A standard checkpoint captures the VM's memory and device state, like a saved game \u2014 fast, but not application-aware. A production checkpoint uses Volume Shadow Copy Service (VSS) inside the guest to create an application-consistent point-in-time copy, safe to use against things like SQL Server or Active Directory.", "detail": "Only production checkpoints are safe as a routine 'backup-like' snapshot of a database or domain controller VM \u2014 a standard checkpoint's crash-consistent state can cause serious problems if restored into a running DC."}, {"id": "f18", "cat": "vmContainers", "front": "Live Migration vs. Storage Migration vs. Hyper-V Replica", "back": "Live Migration moves a running VM between Hyper-V hosts with no downtime, needing shared/replicated storage (or SMB 3.0) and compatible processors (or Processor Compatibility Mode). Storage Migration moves a VM's virtual disks to different storage with no downtime, without changing hosts. Hyper-V Replica asynchronously replicates a VM to a secondary host/site for disaster recovery, not for routine load balancing.", "detail": "Hyper-V Replica is a DR tool, not a live-migration substitute \u2014 its replica VM sits offline until you actually fail over to it."}, {"id": "f19", "cat": "vmContainers", "front": "Windows container isolation: process vs. Hyper-V", "back": "Process-isolated containers share the host's kernel directly, giving the lowest overhead but weaker isolation between containers. Hyper-V isolated containers each run inside their own lightweight utility VM with its own kernel instance, trading some overhead for stronger, VM-grade isolation.", "detail": "Hyper-V isolation is the choice for running containers from mutually distrusting tenants on the same host, or when the container's base image doesn't exactly match the host's kernel version."}, {"id": "f20", "cat": "networking", "front": "DNS zone types", "back": "A primary zone holds the writable, authoritative copy of a zone. A secondary zone holds a read-only copy transferred (via zone transfer) from a primary. A stub zone holds only NS, SOA, and glue A/AAAA records \u2014 enough to find the authoritative servers, not the full record set. An AD-integrated zone stores its data in Active Directory for automatic multi-master replication and secure dynamic updates.", "detail": "A stub zone is much lighter than a secondary zone precisely because it only tracks who is authoritative for a namespace, not the records themselves \u2014 it's a referral shortcut, not a resolvable copy."}, {"id": "f21", "cat": "networking", "front": "DHCP failover: load balance vs. hot standby", "back": "Load balance mode has both DHCP servers actively answering client requests, splitting the load by a configured percentage. Hot standby mode has one server active and one passive backup that only starts answering if the active server becomes unavailable.", "detail": "Hot standby is the natural fit for a branch office scenario, where a central DHCP server normally handles everything and a local server only takes over if the WAN link to the central site drops."}, {"id": "f22", "cat": "networking", "front": "IP Address Management (IPAM)", "back": "IPAM is a Windows Server role that discovers, monitors, and centrally manages DHCP and DNS servers and their IP address space from one console, including tracking utilization and flagging overlapping or duplicate scopes across the environment.", "detail": "IPAM manages existing DHCP/DNS server roles \u2014 it isn't itself a DHCP or DNS server, and installing it doesn't remove the need to also deploy those roles somewhere."}, {"id": "f23", "cat": "networking", "front": "Site-to-Site VPN vs. ExpressRoute", "back": "A site-to-site VPN connects on-premises networks to Azure over the public internet using encrypted tunnels \u2014 cheaper and quicker to stand up, but subject to internet variability. ExpressRoute uses a private, dedicated circuit provisioned through a connectivity provider, bypassing the public internet for more predictable latency, higher available bandwidth, and higher cost.", "detail": "ExpressRoute traffic doesn't traverse the public internet at all, which is also why it's commonly paired with a VPN as an encrypted backup path in case the ExpressRoute circuit itself fails."}, {"id": "f24", "cat": "networking", "front": "Network Policy Server (NPS)", "back": "NPS is Microsoft's RADIUS server and proxy implementation, centralizing authentication, authorization, and accounting for things like VPN connections, 802.1X wired/wireless access, and other RADIUS-aware network devices.", "detail": "NPS itself doesn't terminate the VPN connection \u2014 RRAS (or a third-party VPN device) does that and forwards the authentication request to NPS as the RADIUS server."}, {"id": "f25", "cat": "storage", "front": "DFS Namespaces vs. DFS Replication", "back": "DFS Namespaces (DFS-N) presents a single logical folder path (like \\\\contoso\\shares) that transparently points to shared folders on one or more servers. DFS Replication (DFS-R) keeps the actual folder contents synchronized between multiple servers so any of them can serve current data.", "detail": "They're commonly used together \u2014 DFS-R keeps the copies in sync, while DFS-N gives users one path that resolves to whichever in-sync copy is closest or available \u2014 but each can be deployed independently of the other."}, {"id": "f26", "cat": "storage", "front": "Storage Spaces resiliency types", "back": "Simple striping spreads data with no redundancy (fastest, no fault tolerance). A two-way (or three-way) mirror duplicates data across disks, tolerating one (or two) disk failures with strong write performance. Parity spreads data plus parity information, more storage-efficient than mirroring for the same fault tolerance, but with slower random writes.", "detail": "Parity's storage efficiency comes at a real performance cost on writes \u2014 it's a better fit for larger, less write-intensive data like backups or archives than for a busy transactional workload."}, {"id": "f27", "cat": "storage", "front": "Storage Spaces Direct (S2D)", "back": "S2D pools local, direct-attached storage (typically SATA/NVMe/SAS disks) across the nodes of a failover cluster into a single software-defined storage pool, enabling hyperconverged infrastructure without a separate SAN.", "detail": "S2D requires a functioning failover cluster underneath it \u2014 it's a storage feature built on top of clustering, not a replacement for it."}, {"id": "f28", "cat": "storage", "front": "Data Deduplication", "back": "A post-process, file-system-level feature (on volumes, not the OS volume by default) that finds and eliminates duplicate chunks of data on disk, replacing repeats with references to a single stored copy. It fits general file shares, VDI libraries, and backup targets well.", "detail": "Deduplication is a poor fit for heavily and randomly modified files like live database (.mdf) files or files already compressed/encrypted, where duplicate chunks are rare or the savings aren't worth the processing overhead."}, {"id": "f29", "cat": "storage", "front": "Azure File Sync", "back": "Azure File Sync keeps an on-premises Windows Server file share in sync with an Azure file share, and can enable cloud tiering \u2014 infrequently used files are replaced locally with a pointer while their full content stays safely in Azure, streamed back on access.", "detail": "Cloud tiering means the local server's disk shows the full namespace even though cold files' actual bytes have been evicted locally \u2014 from a user's perspective the file is still just 'there,' just retrieved on demand."}, {"id": "f30", "cat": "storage", "front": "ReFS vs. NTFS", "back": "ReFS (Resilient File System) prioritizes resiliency and scalability for large data volumes, using checksums and automatic corruption repair (with mirrored/parity Storage Spaces) and integrating tightly with features like block cloning. NTFS remains the general-purpose default and is required for the Windows Server boot/system volume.", "detail": "ReFS is not supported as a boot volume for Windows Server \u2014 it's meant for data volumes, particularly ones backed by Storage Spaces where its self-healing features can actually repair detected corruption."}, {"id": "f31", "cat": "storage", "front": "Storage Replica", "back": "Storage Replica provides block-level, volume-to-volume replication between servers or clusters, independent of the file system on top. Synchronous replication guarantees zero data loss but requires low latency between sites; asynchronous replication tolerates higher latency at the cost of a small, non-zero possible data loss window.", "detail": "Because it replicates at the block level below the file system, Storage Replica works for any workload on the volume \u2014 it doesn't care whether the data is SQL files, general shares, or anything else."}, {"id": "f32", "cat": "security", "front": "Windows Defender Application Control (WDAC) vs. AppLocker", "back": "WDAC enforces a code-integrity policy that determines what is allowed to run before it starts, evaluated by the kernel itself and applied system-wide. AppLocker is a rule-based allowlisting feature that runs at the user-mode level and can apply different rules per user or group, but is easier to bypass than WDAC.", "detail": "WDAC policies can run in enforced or audit mode, and unlike AppLocker, a WDAC policy applies before a user even logs on, since it is enforced by the kernel rather than a user-mode service."}, {"id": "f33", "cat": "security", "front": "Credential Guard", "back": "Uses virtualization-based security (VBS) to isolate the LSASS process and NTLM/Kerberos secrets inside a protected, hypervisor-enforced container, so that even an administrator on the host, or malware with kernel-level access, cannot extract them with tools like Mimikatz.", "detail": "Credential Guard requires hardware virtualization support (Hyper-V, SLAT, a compatible processor) and blocks storing reversibly-encrypted passwords and unconstrained Kerberos delegation, which is a common reason it breaks specific legacy authentication scenarios."}, {"id": "f34", "cat": "security", "front": "Windows LAPS (Local Administrator Password Solution)", "back": "Automatically rotates and stores the password for a local administrator account on each domain-joined (or Microsoft Entra-joined) computer, either in Active Directory or Microsoft Entra ID, with access controlled by delegated permissions.", "detail": "Windows LAPS is built into modern Windows Server and Windows client and can back up a managed account's passphrase history, replacing the older, separately-installed LAPS tool."}, {"id": "f35", "cat": "security", "front": "Protected Users security group", "back": "Adding an account to the Protected Users group blocks it from authenticating with NTLM, DES, or RC4 encryption, prevents credential caching, and disables delegation of its credentials, forcing Kerberos with stronger encryption only.", "detail": "It is a strong control for high-privilege accounts, but it is unforgiving: an application or device that only supports NTLM will simply fail to authenticate that account, with no fallback available."}, {"id": "f36", "cat": "security", "front": "Microsoft Defender for Identity", "back": "A cloud service that monitors on-premises AD DS, via sensors installed on domain controllers, for signs of compromise such as reconnaissance, pass-the-hash, DCSync attempts, or golden ticket usage, surfacing those alerts alongside other Microsoft Defender XDR signals.", "detail":
