const STORAGE_KEY = "cert-study-progress";
const TRACKS = [{"key": "itil", "label": "ITIL", "subtitle": "Foundation, Version 5"}, {"key": "az900", "label": "AZ-900", "subtitle": "Azure Fundamentals"}, {"key": "az104", "label": "AZ-104", "subtitle": "Azure Administrator"}, {"key": "az305", "label": "AZ-305", "subtitle": "Azure Solutions Architect Expert"}, {"key": "az802", "label": "AZ-802", "subtitle": "Windows Server Hybrid Administrator"}, {"key": "sc500", "label": "SC-500", "subtitle": "Cloud & AI Security Engineer"}, {"key": "cloudplus", "label": "Cloud+", "subtitle": "CompTIA Cloud+ (CV0-004)"}];
const EXAM_CONFIG = {"itil": {"length": 40, "minutes": 60, "passPct": 65, "passLabel": "Real pass mark: 26/40 (65%)"}, "az900": {"length": 50, "minutes": 45, "passPct": 75, "passLabel": "Microsoft scores this 0-1000 with 700 to pass, not a flat percentage. Treat 75%+ here as a safe buffer, not an exact predictor."}, "az104": {"length": 50, "minutes": 100, "passPct": 75, "passLabel": "Microsoft scores this 0-1000 with 700 to pass, not a flat percentage. Treat 75%+ here as a safe buffer, not an exact predictor."}, "az305": {"length": 50, "minutes": 120, "passPct": 75, "passLabel": "Microsoft scores this 0-1000 with 700 to pass, not a flat percentage. Treat 75%+ here as a safe buffer, not an exact predictor."}, "az802": {"length": 60, "minutes": 120, "passPct": 70, "passLabel": "Microsoft scores this 0-1000 with 700 to pass, not a flat percentage. Treat 70%+ here as a safe buffer, not an exact predictor."}, "sc500": {"length": 70, "minutes": 110, "passPct": 70, "passLabel": "Microsoft scores this 0-1000 with 700 to pass, not a flat percentage. Treat 70%+ here as a safe buffer, not an exact predictor."}, "cloudplus": {"length": 90, "minutes": 90, "passPct": 83, "passLabel": "CompTIA scores this 100-900 with 750 to pass, not a flat percentage. Treat 83%+ here as a safe buffer, not an exact predictor. The real exam allows up to 90 questions in 90 minutes \u2014 this mode uses every question in the bank once the pool is that large."}};
const DATA = {"itil": {"categories": [{"key": "terms", "label": "Key Terms", "marks": 12}, {"key": "valueSystem", "label": "Value System", "marks": 16}, {"key": "dimensions", "label": "Four Dimensions", "marks": 4}, {"key": "lifecycle", "label": "Lifecycle", "marks": 4}, {"key": "streams", "label": "Value Streams", "marks": 2}, {"key": "ai", "label": "AI", "marks": 1}, {"key": "frameworks", "label": "Other Frameworks", "marks": 1}], "flashcards": [{"id": "f1", "cat": "terms", "front": "Product vs. service", "back": "A product is a configuration of an organization's resources. A service enables value co-creation by facilitating outcomes customers want, without the customer having to manage specific costs and risks themselves.", "detail": "Example: Entra ID is a product. The identity management service you provide by configuring and supporting it is the service \u2014 value comes from the outcome, not the software itself."}, {"id": "f2", "cat": "terms", "front": "Digital product vs. digital service", "back": "A digital product exists primarily in digital form, like software or data. A digital service is the value co-created through that product, i.e. the product is the app, the service is what using it accomplishes.", "detail": "Exam trap: a SaaS platform itself is the digital product, while onboarding and supporting users on it is the digital service."}, {"id": "f3", "cat": "terms", "front": "Output vs. outcome", "back": "An output is a tangible or intangible deliverable of an activity. An outcome is the result that output enables for a stakeholder. Outputs are what you produce, outcomes are what the stakeholder actually needed.", "detail": "A resolved ticket is an output. The user being able to work uninterrupted again is the outcome ITIL actually cares about."}, {"id": "f4", "cat": "terms", "front": "Utility vs. warranty", "back": "Utility is what the service does: functionality that supports performance or removes constraints (\"fit for purpose\"). Warranty is how well it does it: availability, capacity, security, continuity (\"fit for use\").", "detail": "A firewall that blocks the right traffic has utility. One that stays up 99.9% of the time with proper failover has warranty. A service needs both to create value."}, {"id": "f5", "cat": "terms", "front": "Customer vs. user vs. sponsor", "back": "Customer defines requirements and is accountable for outcomes. User actually uses the service day to day. Sponsor authorizes the budget. One person can hold more than one of these roles.", "detail": "At an MSP, the client contact who signs the contract is often the sponsor, while their employees calling the help desk are users."}, {"id": "f6", "cat": "terms", "front": "Provider vs. consumer vs. digital product vendor", "back": "Provider delivers the service. Consumer receives it, as customer, user, and/or sponsor. A digital product vendor supplies a product a provider or consumer uses, without itself being in a service relationship with them.", "detail": "An MSP is the provider, the client is the consumer, and a software company selling licenses with no direct relationship management is closer to a digital product vendor."}, {"id": "f7", "cat": "terms", "front": "Cost vs. risk", "back": "Cost is the money spent on a specific activity or resource. Risk is a possible event that could cause harm, loss, or make achieving objectives harder, including a missed opportunity, not only a downside.", "detail": "Choosing a cheaper backup solution lowers cost but can raise risk. The exam likes scenarios where you have to weigh the two against each other."}, {"id": "f8", "cat": "terms", "front": "Service quality vs. service level vs. SLA", "back": "Service quality is how well the service meets expectations overall. A service level is a measured target for one aspect of performance. An SLA is the documented agreement recording those targets.", "detail": "\"99.9% uptime\" is a service level. The signed document guaranteeing it, with consequences for missing it, is the SLA."}, {"id": "f9", "cat": "terms", "front": "Core value stream vs. enabling value stream", "back": "A core value stream directly creates value for an external customer. An enabling value stream supports other value streams internally, like supplier management, without touching the external customer directly.", "detail": "Handling a client's support ticket is core. An internal process for renewing supplier licenses is enabling."}, {"id": "f10", "cat": "terms", "front": "Service relationship", "back": "A cooperation between a service provider and consumer that includes service provision, service consumption, and service relationship management activities.", "detail": "It covers the whole relationship, not just delivering the service, but how both sides manage and communicate around it."}, {"id": "f11", "cat": "terms", "front": "Service offering", "back": "A description of one or more services designed to address the needs of a target consumer group, made up of goods, access to resources, and service actions.", "detail": "Think of a support plan: the tiers, response times, and included tools together make up the offering, not just the raw technical capability."}, {"id": "f12", "cat": "valueSystem", "front": "The 5 components of the ITIL Value System", "back": "Guiding principles, governance, the service value chain, management practices, and continual improvement.", "detail": "A way to remember it: two are people-facing (principles, governance), one is the engine (value chain), one is the toolbox (practices), and one runs through everything (continual improvement)."}, {"id": "f13", "cat": "valueSystem", "front": "Guiding principles, purpose", "back": "Recommendations that guide an organization in all circumstances, regardless of changes in goals, strategies, or structure.", "detail": "They're deliberately generic so they apply whether you're troubleshooting a ticket or restructuring a whole team."}, {"id": "f14", "cat": "valueSystem", "front": "Governance, purpose", "back": "The means by which an organization is directed and controlled: evaluating, directing, and monitoring performance and compliance.", "detail": "Governance sits above day-to-day operations. It's leadership-level direction, not a specific practice like incident management."}, {"id": "f15", "cat": "valueSystem", "front": "Value chain, purpose", "back": "An operating model outlining the key activities an organization undertakes to create value, converting inputs like demand and opportunity into outputs of value.", "detail": "The value chain component of the Value System is expressed as the 8-stage Product and Service Lifecycle (Discover through Support) \u2014 see that flashcard for the full sequence."}, {"id": "f16", "cat": "valueSystem", "front": "Management practices, purpose", "back": "Sets of organizational resources for performing work or accomplishing an objective. These are the \"how\" behind value chain activities.", "detail": "There are 34 practices in Version 5, but Foundation only expects you to recognize a handful by name and purpose, like incident management or change enablement."}, {"id": "f17", "cat": "valueSystem", "front": "Continual improvement, purpose", "back": "A recurring activity performed across every part of the organization to make sure performance keeps meeting stakeholder expectations.", "detail": "It's not a one-time project. It's meant to be built into how every part of the organization already works."}, {"id": "f18", "cat": "valueSystem", "front": "Name the 7 guiding principles", "back": "Focus on value; start where you are; progress iteratively with feedback; collaborate and promote visibility; think and work holistically; keep it simple and practical; optimize and automate.", "detail": "A common exam trap: 'think and work holistically' means seeing the whole picture, while 'collaborate and promote visibility' means sharing information openly. Both are about openness but target different problems."}, {"id": "f19", "cat": "valueSystem", "front": "\"Focus on value\"", "back": "Everything the organization does should map, directly or indirectly, to value for stakeholders. Always ask how a task benefits the customer or the business.", "detail": "If a task doesn't map back to some stakeholder's outcome, this principle says question whether it's worth doing."}, {"id": "f20", "cat": "valueSystem", "front": "\"Start where you are\"", "back": "Don't build from scratch. Assess what already exists and can be reused before creating something new.", "detail": "This doesn't mean never changing anything. It means measuring the current state honestly before deciding what to keep."}, {"id": "f21", "cat": "valueSystem", "front": "\"Keep it simple and practical\"", "back": "Use the minimum number of steps to accomplish an objective, and eliminate anything that doesn't contribute to value.", "detail": "Watch for exam scenarios describing unnecessary approval steps or duplicate processes. That usually points to this principle."}, {"id": "f22", "cat": "dimensions", "front": "Name the Four Dimensions", "back": "Organizations and people; information and technology; partners and suppliers; value streams and processes.", "detail": "Exam scenarios often describe a change in one dimension causing a problem in another. That interaction is the whole point of calling them dimensions."}, {"id": "f23", "cat": "dimensions", "front": "Organizations and people, dimension", "back": "Roles, responsibilities, structure, culture, and staffing needed to support the service.", "detail": "Covers things like whether a support team has the right skills and headcount for a new application rollout."}, {"id": "f24", "cat": "dimensions", "front": "Information and technology, dimension", "back": "The information and knowledge needed to manage services, plus the technologies that support them, including AI, cloud, and automation.", "detail": "This is where AI, automation, and the actual toolset in use live in the model."}, {"id": "f25", "cat": "dimensions", "front": "Partners and suppliers, dimension", "back": "Relationships with other organizations involved in designing, developing, deploying, or supporting services.", "detail": "Ranges from a formal outsourcing arrangement to a simple software license. The exam expects you to recognize both count."}, {"id": "f26", "cat": "dimensions", "front": "What does PESTLE stand for?", "back": "External factors affecting all four dimensions: Political, Economic, Social, Technological, Legal, Environmental.", "detail": "You won't need to define each factor in depth, just recognize when a scenario describes an external pressure versus an internal one."}, {"id": "f27", "cat": "lifecycle", "front": "The 8 Product and Service Lifecycle activities, in order", "back": "Discover, Design, Acquire, Build, Transition, Operate, Deliver, Support. Used iteratively, not strictly one-way.", "detail": "Unlike the older six-activity value chain, this model is explicitly iterative. Work can loop back to an earlier activity at any point."}, {"id": "f28", "cat": "lifecycle", "front": "Discover", "back": "Identifying opportunities, understanding demand, and exploring what a product or service could look like.", "detail": "This is where 'is there a real problem worth solving here?' gets answered, before any design work starts."}, {"id": "f29", "cat": "lifecycle", "front": "Design", "back": "Defining requirements and specifications for the product or service before it is acquired or built.", "detail": "Requirements get defined here, but nothing is built yet. That boundary is a common thing the exam tests."}, {"id": "f30", "cat": "lifecycle", "front": "Acquire and Build", "back": "Acquire: obtaining components from suppliers. Build: assembling or developing components in house. Both feed into a deployable product.", "detail": "Buying a monitoring tool off the shelf is Acquire. Writing a custom automation script in-house is Build."}, {"id": "f31", "cat": "lifecycle", "front": "Transition", "back": "Moving a new or changed product or service into live use, including testing and release.", "detail": "This is where testing and release happen \u2014 think change management and deployment, not ongoing operation."}, {"id": "f32", "cat": "lifecycle", "front": "Operate, Deliver, Support", "back": "Operate: running the service day to day. Deliver: providing the agreed outcomes to consumers. Support: resolving issues and requests that arise during use.", "detail": "These three often get grouped on flashcards, but the exam can test them separately. Support specifically means responding to issues, not running the service day to day."}, {"id": "f33", "cat": "streams", "front": "Value stream", "back": "A series of steps an organization undertakes to create and deliver products and services to consumers.", "detail": "A value stream is made of value chain activities and practices strung together for a specific scenario, like 'resolve a user's incident.'"}, {"id": "f34", "cat": "streams", "front": "Value stream mapping", "back": "Visualizing the end-to-end steps of a value stream to identify waste, delay, or handoffs that don't add value.", "detail": "In practice this looks like a flowchart with timestamps, showing where a request sits waiting versus where real work happens."}, {"id": "f35", "cat": "ai", "front": "AI vs. generative AI vs. agentic AI", "back": "AI: systems performing tasks that normally need human intelligence. Generative AI: creates new content. Agentic AI: can plan and act autonomously toward a goal with limited human intervention.", "detail": "A chatbot that drafts a reply for a human to approve is generative. One that files the ticket, checks the knowledge base, and closes it itself is agentic."}, {"id": "f36", "cat": "ai", "front": "Why does AI governance matter in ITIL?", "back": "AI must be directed and controlled like any other capability, covering accountability, transparency, ethics, and risk, not just technical deployment.", "detail": "Expect exam questions testing whether you'd let AI act without any oversight. The correct answer is almost always no."}, {"id": "f37", "cat": "frameworks", "front": "ITIL and DevOps", "back": "ITIL provides the broader service value system and governance. DevOps contributes specific practices for fast, collaborative delivery. They complement rather than compete.", "detail": "DevOps practices like CI/CD can sit inside the 'Build' and 'Deliver & Support' stages of the Product and Service Lifecycle."}, {"id": "f38", "cat": "frameworks", "front": "ITIL and PRINCE2", "back": "ITIL manages ongoing services. PRINCE2 manages the temporary, bounded work of projects. Projects often deliver changes that ITIL then operates.", "detail": "A new system rollout might run as a PRINCE2 project, with ITIL practices taking over once it goes live and becomes an ongoing service."}, {"id": "f39", "cat": "valueSystem", "front": "The Continual Improvement Model, 7 steps", "back": "What is the vision? \u2192 Where are we now? \u2192 Where do we want to be? \u2192 How do we get there? \u2192 Take action \u2192 Did we get there? \u2192 How do we keep the momentum going?", "detail": "Each step depends on the one before it. You can't set a realistic target (step 3) without an honest baseline (step 2), which is why exam scenarios often describe a team that skipped a step."}, {"id": "f40", "cat": "valueSystem", "front": "Value chain vs. the Product and Service Lifecycle", "back": "The Value System's value chain component is expressed as the same 8-stage Product and Service Lifecycle (Discover through Support), not a separate 6-activity model.", "detail": "Exam trap: don't memorize two different activity lists for 'value chain' and 'lifecycle.' They describe the same set of activities from two angles."}, {"id": "f41", "cat": "ai", "front": "The AI Capability Model (the \"6Cs\")", "back": "Six ways AI contributes to service management: Creation (generating content), Curation (organizing/filtering info), Clarification (explaining/simplifying), Cognition (deciding/predicting), Communication (interacting with humans), Coordination (orchestrating workflows).", "detail": "Naming which \"C\" an AI system performs is the point: an AI that curates alerts needs different oversight than one that coordinates automated actions."}, {"id": "f42", "cat": "dimensions", "front": "AI and the Organizations and people dimension", "back": "This dimension now explicitly covers how AI changes roles, skills, and culture, not just headcount and structure, including new skills to work alongside AI and oversight responsibilities for it.", "detail": "Pairs with the AI Capability Model in Information and technology: one dimension covers what AI can do, the other covers who is accountable for it."}, {"id": "f43", "cat": "valueSystem", "front": "Practice groupings, current model", "back": "34 total management practices are grouped as 12 general management practices and 22 product and service management practices. There is no longer a separate small \"technical management\" group.", "detail": "Foundation doesn't require memorizing which of the 34 sits in which bucket, just recognizing that practices are the 'how' behind value chain activities."}, {"id": "f44", "cat": "terms", "front": "Service offering vs. service relationship", "back": "A service offering describes what is offered, goods, resource access, and service actions, for a target consumer group. A service relationship is the ongoing cooperation between provider and consumer once that offering is taken up.", "detail": "The offering is the menu; the relationship is what happens after the customer orders from it: provision, consumption, and relationship management activities."}], "questions": [{"id": "q1", "cat": "terms", "type": "mc", "question": "A team measures how many tickets were closed this week. Is that an output or an outcome?", "options": ["Output", "Outcome", "Utility", "Warranty"], "correct": 0, "explanation": "Ticket count is a deliverable of the activity, so it's an output. Whether the customer's problem actually stayed solved is the outcome."}, {"id": "q2", "cat": "terms", "type": "mc", "question": "Which pair correctly matches 'fit for purpose' and 'fit for use'?", "options": ["Output = fit for purpose, outcome = fit for use", "Utility = fit for purpose, warranty = fit for use", "Warranty = fit for purpose, utility = fit for use", "Cost = fit for purpose, risk = fit for use"], "correct": 1, "explanation": "Utility is what the service does. Warranty is how well and reliably it does it."}, {"id": "q3", "cat": "terms", "type": "mc", "question": "A client asks which sysadmin actually logs into the ticketing system every day. Which role is that?", "options": ["User", "Customer", "Sponsor", "Provider"], "correct": 0, "explanation": "The user is whoever actually uses the service day to day, distinct from whoever defines requirements or pays for it."}, {"id": "q4", "cat": "terms", "type": "mc", "question": "A finance director approves the annual budget for a helpdesk contract but never opens a ticket. What's their role?", "options": ["Provider", "Sponsor", "User", "Digital product vendor"], "correct": 1, "explanation": "The sponsor authorizes the budget. They may or may not also be a customer or user."}, {"id": "q5", "cat": "terms", "type": "mc", "question": "Which value stream type touches the external customer directly?", "options": ["Enabling value stream", "Management practice", "Improvement value stream", "Core value stream"], "correct": 3, "explanation": "Core value streams create value for the external customer directly. Enabling value streams support internal work instead."}, {"id": "q6", "cat": "terms", "type": "mc", "question": "A vendor sells licenses for a monitoring tool but has no ongoing service relationship with the buyer. What is the vendor?", "options": ["Sponsor", "Service consumer", "Service provider", "Digital product vendor"], "correct": 3, "explanation": "A digital product vendor supplies a product without being in a service relationship with the buyer."}, {"id": "q7", "cat": "terms", "type": "mc", "question": "What's the key difference between a service level and an SLA?", "options": ["An SLA applies to internal teams, and a service level applies to external customers", "They mean exactly the same thing", "A service level is a measured target, an SLA is the documented agreement recording those targets", "A service level is set by the customer, while an SLA is set unilaterally by the provider"], "correct": 2, "explanation": "The service level is the target itself; the SLA is the formal document that records it."}, {"id": "q27", "cat": "terms", "type": "mc", "question": "Which of these is an example of warranty rather than utility?", "options": ["A guaranteed 99.9% uptime commitment", "A report showing ticket volume", "The ability to reset a password online", "A firewall rule blocking a specific port"], "correct": 0, "explanation": "Uptime guarantees are about reliability and availability \u2014 that's warranty. Password reset and firewall rules are functional capabilities \u2014 that's utility."}, {"id": "q35", "cat": "terms", "type": "mc", "question": "A provider fixes a client's network issue for free after an SLA breach. Is the fix itself the value?", "options": ["Value comes from the cost savings of the free fix", "Value is defined by what the SLA document specifies", "Yes, the fix is the value", "No, value is realized in the outcome the fix enables, not the fix itself"], "correct": 3, "explanation": "Value is realized when the outcome actually helps the stakeholder \u2014 the fix itself is just the mechanism, not the value."}, {"id": "q41", "cat": "terms", "type": "mc", "question": "A provider markets a service as having '99.99% availability,' but the client also needs guaranteed 4-hour incident response times to actually be satisfied. What does this illustrate?", "options": ["Cost is what determines whether expectations are met", "Warranty covers multiple dimensions, like availability and continuity, not just an uptime number alone", "Utility already covers response times", "Incident response time is a utility concern, not a warranty one"], "correct": 1, "explanation": "Warranty spans availability, capacity, security, and continuity \u2014 a single uptime figure doesn't capture the whole picture the customer actually needs."}, {"id": "q8", "cat": "valueSystem", "type": "mc", "question": "Which of the following is NOT one of the five components of the ITIL Value System?", "options": ["Continual improvement", "Governance", "Value chain", "Service desk"], "correct": 3, "explanation": "Service desk is a management practice, not one of the five Value System components."}, {"id": "q9", "cat": "valueSystem", "type": "mc", "question": "A team is tempted to build a brand-new ticketing workflow instead of checking what's already in place. Which principle applies?", "options": ["Optimize and automate", "Focus on value", "Start where you are", "Keep it simple and practical"], "correct": 2, "explanation": "Start where you are means assessing and reusing what already exists before building something new."}, {"id": "q10", "cat": "valueSystem", "type": "mc", "question": "Always asking how a task benefits the customer or business describes which principle?", "options": ["Progress iteratively with feedback", "Focus on value", "Collaborate and promote visibility", "Think and work holistically"], "correct": 1, "explanation": "Focus on value ties every activity back to stakeholder benefit."}, {"id": "q11", "cat": "valueSystem", "type": "mc", "question": "How many guiding principles does ITIL define?", "options": ["5", "9", "6", "7"], "correct": 3, "explanation": "There are seven guiding principles."}, {"id": "q12", "cat": "valueSystem", "type": "mc", "question": "What does governance provide within the Value System?", "options": ["A list of management practices", "The value chain's inputs", "A single guiding principle", "The means to direct and control the organization"], "correct": 3, "explanation": "Governance is about evaluating, directing, and monitoring the organization."}, {"id": "q13", "cat": "valueSystem", "type": "mc", "question": "A team removes three approval steps that added no value to a change request. Which principle are they applying?", "options": ["Focus on value", "Start where you are", "Keep it simple and practical", "Collaborate and promote visibility"], "correct": 2, "explanation": "Keep it simple and practical means using the minimum steps needed and cutting anything that doesn't add value."}, {"id": "q14", "cat": "valueSystem", "type": "mc", "question": "What connects the guiding principles, governance, and practices to every part of the organization on a recurring basis?", "options": ["The value chain", "Value streams", "PESTLE", "Continual improvement"], "correct": 3, "explanation": "Continual improvement recurs across every part of the Value System."}, {"id": "q28", "cat": "valueSystem", "type": "mc", "question": "A service desk team gradually rolls out a new ticketing system to one department before expanding company-wide. Which principle are they following?", "options": ["Optimize and automate", "Keep it simple and practical", "Think and work holistically", "Progress iteratively with feedback"], "correct": 3, "explanation": "Rolling out gradually and adjusting based on feedback is exactly what progress iteratively with feedback describes."}, {"id": "q29", "cat": "valueSystem", "type": "mc", "question": "Sharing dashboards openly so every team can see current incident status demonstrates which principle?", "options": ["Optimize and automate", "Focus on value", "Start where you are", "Collaborate and promote visibility"], "correct": 3, "explanation": "Openly sharing information so others can see what's happening is the core idea behind collaborate and promote visibility."}, {"id": "q36", "cat": "valueSystem", "type": "mc", "question": "Which statement about management practices is correct?", "options": ["They only apply to IT operations", "There are exactly 7 of them", "They provide organizational resources for performing work toward an objective", "They replace the guiding principles"], "correct": 2, "explanation": "Management practices are the organizational resources, including processes, people, and tools, used to carry out value chain activities."}, {"id": "q40", "cat": "valueSystem", "type": "mc", "question": "A manager insists on adding a new approval step 'because that's how we've always handled security,' even though it duplicates a check already performed elsewhere. Which principle is most directly being violated?", "options": ["Focus on value", "Keep it simple and practical", "Collaborate and promote visibility", "Start where you are"], "correct": 1, "explanation": "A redundant step that duplicates an existing check works against using the minimum number of steps needed \u2014 the core idea of keep it simple and practical."}, {"id": "q42", "cat": "valueSystem", "type": "mc", "question": "A manual approval step is slow, error-prone, and also redundant with an earlier check. In what order should the guiding principles be applied here?", "options": ["Apply both simultaneously with no particular order", "Optimize and automate first, then simplify afterward", "Neither principle applies to automation decisions", "Keep it simple and practical first, removing the redundant step, then optimize and automate what remains"], "correct": 3, "explanation": "Automating a broken process just makes it fail faster \u2014 simplify first, then automate what's left."}, {"id": "q15", "cat": "dimensions", "type": "mc", "question": "A new remote-work policy requires retraining support staff and redefining roles. Which dimension does this affect most directly?", "options": ["Value streams and processes", "Information and technology", "Organizations and people", "Partners and suppliers"], "correct": 2, "explanation": "Roles, structure, and staffing sit under organizations and people."}, {"id": "q16", "cat": "dimensions", "type": "mc", "question": "Which dimension covers external factors like a new data privacy law?", "options": ["Only information and technology", "Only organizations and people", "Only partners and suppliers", "None directly, PESTLE factors affect all four dimensions"], "correct": 3, "explanation": "PESTLE factors are external influences that can affect any or all of the four dimensions."}, {"id": "q17", "cat": "dimensions", "type": "mc", "question": "A healthcare IT team relies on a third party to host its EHR platform. Which dimension is most relevant?", "options": ["Information and technology", "Partners and suppliers", "Value streams and processes", "Organizations and people"], "correct": 1, "explanation": "Relationships with outside organizations sit under partners and suppliers."}, {"id": "q18", "cat": "dimensions", "type": "mc", "question": "PESTLE stands for Political, Economic, Social, Technological, Legal, and ___?", "options": ["Environmental", "Ethical", "Educational", "Experiential"], "correct": 0, "explanation": "The final factor is Environmental."}, {"id": "q30", "cat": "dimensions", "type": "mc", "question": "A company automates password resets to cut down on support tickets. Which two dimensions does this touch most directly?", "options": ["Only organizations and people", "Information and technology, and organizations and people", "Only information and technology", "Partners and suppliers, and value streams and processes only"], "correct": 1, "explanation": "Automating a process touches the technology used to do it and the people whose roles and workload change as a result."}, {"id": "q43", "cat": "dimensions", "type": "mc", "question": "A company outsources network monitoring to a third party, who then requires in-house staff to be trained to interpret their alerts correctly. Which two dimensions are directly involved?", "options": ["Only information and technology", "Only partners and suppliers", "Value streams and processes, and partners and suppliers only", "Partners and suppliers, and organizations and people"], "correct": 3, "explanation": "The outsourcing relationship sits under partners and suppliers, while the staff training need sits under organizations and people."}, {"id": "q19", "cat": "lifecycle", "type": "mc", "question": "Put these in the correct lifecycle order: Transition, Discover, Build, Design.", "options": ["Design, Discover, Transition, Build", "Discover, Design, Build, Transition", "Discover, Build, Design, Transition", "Build, Design, Discover, Transition"], "correct": 1, "explanation": "The lifecycle runs Discover, Design, Acquire, Build, Transition, Operate, Deliver, Support."}, {"id": "q20", "cat": "lifecycle", "type": "mc", "question": "A team is exploring whether there's real demand for a self-service password reset tool. Which activity are they in?", "options": ["Discover", "Operate", "Design", "Acquire"], "correct": 0, "explanation": "Exploring demand and opportunity is the Discover activity."}, {"id": "q21", "cat": "lifecycle", "type": "mc", "question": "Which activity involves testing and releasing a new service into live use?", "options": ["Transition", "Deliver", "Build", "Support"], "correct": 0, "explanation": "Transition covers moving a product or service into live use, including testing and release."}, {"id": "q22", "cat": "lifecycle", "type": "mc", "question": "Resolving a user's incident ticket after a service has gone live falls under which activity?", "options": ["Discover", "Support", "Acquire", "Design"], "correct": 1, "explanation": "Support covers resolving issues and requests that arise once a service is in use."}, {"id": "q31", "cat": "lifecycle", "type": "mc", "question": "Which lifecycle activities directly involve creating or obtaining the components of a product?", "options": ["Discover and Design", "Deliver and Support", "Acquire and Build", "Transition and Operate"], "correct": 2, "explanation": "Acquire, obtaining from suppliers, and Build, developing in-house, are the two activities that produce components."}, {"id": "q44", "cat": "lifecycle", "type": "mc", "question": "A team already has an approved design and is now assembling a solution using one in-house component and one purchased component. Which two activities are they most likely in?", "options": ["Transition and Operate", "Deliver and Support", "Discover and Design", "Build and Acquire"], "correct": 3, "explanation": "Acquire covers the purchased component, Build covers the in-house one \u2014 both come after Design."}, {"id": "q23", "cat": "streams", "type": "mc", "question": "What is the purpose of value stream mapping?", "options": ["To formally document the guiding principles for a specific team", "To assign a monetary budget to each value chain activity", "To visualize the end-to-end steps and spot waste or delay", "To define and negotiate SLA targets with a customer"], "correct": 2, "explanation": "Value stream mapping visualizes steps to find waste, delay, and unnecessary handoffs \u2014 it's a diagnostic tool for the flow of work, not a budgeting exercise, a way of documenting principles, or how SLA targets get set."}, {"id": "q32", "cat": "streams", "type": "mc", "question": "Which best describes the relationship between value streams and the value chain?", "options": ["The value chain is a type of value stream", "Value streams only exist in the Support activity", "They are unrelated concepts", "A value stream combines value chain activities and practices for a specific scenario"], "correct": 3, "explanation": "A value stream strings together value chain activities and practices for a specific end-to-end scenario."}, {"id": "q37", "cat": "streams", "type": "mc", "question": "A team wants to see whether a request typically waits longest at the approval step or the fulfillment step. Which practice would they use?", "options": ["Continual improvement alone", "The guiding principles alone", "Value stream mapping", "Governance"], "correct": 2, "explanation": "Value stream mapping visualizes each step of a value stream, including exactly where delay or waiting happens."}, {"id": "q24", "cat": "ai", "type": "mc", "question": "An AI system that can independently plan and carry out a multi-step task with minimal human input is best described as:", "options": ["A guiding principle", "Generative AI", "Agentic AI", "Rule-based automation"], "correct": 2, "explanation": "Agentic AI plans and acts autonomously toward a goal. Generative AI only creates content on request without that independent planning, rule-based automation just follows fixed if-then logic with no planning of its own, and a guiding principle is an ITIL recommendation, not a type of AI at all."}, {"id": "q25", "cat": "ai", "type": "mc", "question": "Why does ITIL emphasize AI governance rather than just AI adoption?", "options": ["Because governance replaces the need for guiding principles", "Because AI still needs accountability, transparency, and risk management like any other capability", "Because AI is outside the four dimensions", "Because ITIL forbids using AI"], "correct": 1, "explanation": "AI is treated as a capability that still needs direction and control, not an exception to governance."}, {"id": "q33", "cat": "ai", "type": "mc", "question": "Which best distinguishes generative AI from agentic AI?", "options": ["There is no meaningful difference", "Generative AI creates content; agentic AI plans and acts toward a goal", "Generative AI is always more accurate", "Agentic AI cannot use generative capabilities"], "correct": 1, "explanation": "Generative AI produces new content; agentic AI takes that further by planning and acting toward a goal with less human input."}, {"id": "q38", "cat": "ai", "type": "mc", "question": "A support team lets an AI agent auto-resolve simple password resets, but requires human sign-off before any AI action affecting a production server. What does this reflect?", "options": ["A guiding principle being ignored", "AI governance applied proportionally to risk", "A rejection of agentic AI entirely", "A failure of the value chain"], "correct": 1, "explanation": "This is AI governance in practice \u2014 oversight applied in proportion to risk, allowing autonomy for low-risk actions while requiring approval for higher-risk ones."}, {"id": "q45", "cat": "ai", "type": "mc", "question": "An AI-assisted change process automatically approves low-risk standard changes but routes anything touching a regulated system to a human review board. What does this best describe?", "options": ["A violation of the four dimensions", "An example of utility without warranty", "A rejection of the guiding principles", "AI governance calibrated to risk"], "correct": 3, "explanation": "Applying stronger human oversight in proportion to risk is exactly what proportionate AI governance looks like in practice."}, {"id": "q26", "cat": "frameworks", "type": "mc", "question": "Which statement best describes how ITIL relates to PRINCE2?", "options": ["PRINCE2 replaces the ITIL Value System", "They are competing, incompatible frameworks", "ITIL only applies to projects, not services", "PRINCE2 manages temporary project work that often delivers changes ITIL then operates"], "correct": 3, "explanation": "PRINCE2 handles bounded project work; ITIL handles the ongoing service that project delivers into."}, {"id": "q34", "cat": "frameworks", "type": "mc", "question": "Which best describes why ITIL and Agile are often used together?", "options": ["Agile focuses on how work gets done iteratively; ITIL provides the wider service value context it happens within", "They solve the exact same problem", "ITIL forbids agile methods", "Agile replaces the guiding principles"], "correct": 0, "explanation": "Agile and ITIL address different layers \u2014 Agile is about how work gets done iteratively, ITIL is about the wider value system that work happens within."}, {"id": "q39", "cat": "frameworks", "type": "mc", "question": "A team automates its build, test, and deployment pipeline using DevOps practices, and separately wants ITIL to govern how those releases fit into the wider service value system. What's the most accurate way to describe how these fit together?", "options": ["DevOps and ITIL solve the exact same problem and cannot be used together", "ITIL provides the wider service value system and governance; DevOps contributes specific practices for fast, collaborative delivery", "DevOps replaces the need for a service value system entirely", "ITIL forbids automated deployment pipelines"], "correct": 1, "explanation": "ITIL and DevOps operate at different layers and are meant to complement each other: DevOps practices like CI/CD can sit inside the Build and Deliver & Support stages of the value system, governed by the wider ITIL context rather than replacing it."}, {"id": "tf1", "cat": "terms", "type": "tf", "question": "A user and a customer are mutually exclusive roles that can never be held by the same person.", "answer": false, "explanation": "They're distinct roles \u2014 a user consumes the service, a customer defines requirements and is accountable for outcomes \u2014 but nothing stops one person from holding both roles at once."}, {"id": "tf2", "cat": "terms", "type": "tf", "question": "Utility refers to how available and secure a service is.", "answer": false, "explanation": "That's warranty. Utility is about what the service does \u2014 its functionality, or fit for purpose."}, {"id": "tf3", "cat": "terms", "type": "tf", "question": "An SLA is simply another name for a single service level target.", "answer": false, "explanation": "A service level is one measured target. An SLA is the broader documented agreement that records one or more of those targets, along with the consequences of missing them."}, {"id": "tf4", "cat": "terms", "type": "tf", "question": "A core value stream always involves direct interaction with the external customer.", "answer": true, "explanation": "That direct connection to the external customer is what defines a core value stream, as opposed to an enabling one."}, {"id": "tf5", "cat": "valueSystem", "type": "tf", "question": "The ITIL Value System has five components.", "answer": true, "explanation": "Guiding principles, governance, the value chain, management practices, and continual improvement."}, {"id": "tf6", "cat": "valueSystem", "type": "tf", "question": "Governance is considered one of the seven guiding principles.", "answer": false, "explanation": "Governance is a separate Value System component, not one of the guiding principles."}, {"id": "tf7", "cat": "valueSystem", "type": "tf", "question": "Optimize and automate prioritizes automating a process as the first step, before making manual improvements to it.", "answer": false, "explanation": "It's the reverse order \u2014 optimize first, then automate what's left. Automating an inefficient process just makes it fail faster."}, {"id": "tf8", "cat": "valueSystem", "type": "tf", "question": "Continual improvement is a one-time initiative completed after a major project.", "answer": false, "explanation": "It's an ongoing, recurring activity across the whole organization."}, {"id": "tf9", "cat": "valueSystem", "type": "tf", "question": "The guiding principles are primarily intended for formal, large-scale service management initiatives rather than routine daily work.", "answer": false, "explanation": "They're meant to apply universally, in every circumstance regardless of the type or scale of work \u2014 routine daily decisions are exactly where they're meant to guide behavior too."}, {"id": "tf10", "cat": "valueSystem", "type": "tf", "question": "Start where you are is best applied by keeping current processes exactly as they are for as long as possible.", "answer": false, "explanation": "It means assess and reuse what exists to decide what's actually worth changing \u2014 it's a starting point for informed change, not a reason to avoid changing anything."}, {"id": "tf11", "cat": "dimensions", "type": "tf", "question": "PESTLE factors are internal to the four dimensions.", "answer": false, "explanation": "They're external factors that influence the four dimensions from outside the organization."}, {"id": "tf12", "cat": "dimensions", "type": "tf", "question": "The four dimensions can affect each other.", "answer": true, "explanation": "A change in one dimension, like technology, often affects another, like people and roles."}, {"id": "tf13", "cat": "dimensions", "type": "tf", "question": "Partners and suppliers primarily describes long-term, contractually formal outsourcing arrangements rather than smaller vendor relationships.", "answer": false, "explanation": "It covers the full range, from a single software license purchased from a vendor to a large formal outsourcing contract \u2014 scale and formality are not what define this dimension."}, {"id": "tf14", "cat": "lifecycle", "type": "tf", "question": "The eight lifecycle activities are generally performed in a single pass from Discover through Support, with looping back to an earlier activity treated as a sign the process broke down.", "answer": false, "explanation": "They're used iteratively by design \u2014 looping back to an earlier activity, like returning to Design after issues surface in Build, is expected and normal, not a sign of failure."}, {"id": "tf15", "cat": "lifecycle", "type": "tf", "question": "Support in the lifecycle model refers to running a service day to day.", "answer": false, "explanation": "That's Operate. Support means resolving issues and requests that come up while the service is in use."}, {"id": "tf16", "cat": "lifecycle", "type": "tf", "question": "Acquire and Build both feed into producing a deployable product or service component.", "answer": true, "explanation": "Acquire obtains components from suppliers; Build develops them in house. Both lead toward a deployable result."}, {"id": "tf17", "cat": "streams", "type": "tf", "question": "Value stream mapping is used to identify waste and delay in a process.", "answer": true, "explanation": "That's exactly its purpose \u2014 visualizing steps to spot where value gets held up."}, {"id": "tf18", "cat": "ai", "type": "tf", "question": "Agentic AI can plan and carry out multi-step tasks with limited human intervention.", "answer": true, "explanation": "That autonomous planning and action is what distinguishes agentic AI from purely generative AI."}, {"id": "tf19", "cat": "ai", "type": "tf", "question": "ITIL treats AI adoption primarily as a technology upgrade, where governance only becomes relevant once something goes wrong.", "answer": false, "explanation": "AI needs accountability, transparency, and risk management applied proactively, from the start, just like any other capability \u2014 not brought in reactively after a problem occurs."}, {"id": "tf20", "cat": "frameworks", "type": "tf", "question": "PRINCE2 and ITIL are competing frameworks, and an organization has to choose only one to adopt.", "answer": false, "explanation": "They operate at different layers and are meant to complement each other \u2014 PRINCE2 manages temporary, bounded project work, while ITIL manages the ongoing service that project delivers into."}, {"id": "q46", "cat": "valueSystem", "type": "mc", "question": "A team sets a measurable, time-bound target for cutting incident resolution time in half before building an action plan to get there. Which step of the Continual Improvement Model are they in?", "options": ["Where do we want to be?", "What is the vision?", "How do we get there?", "Did we get there?"], "correct": 0, "explanation": "Setting a measurable, time-bound target is exactly the 'where do we want to be' step. It comes after assessing the current state and before building the action plan in 'how do we get there.'"}, {"id": "q47", "cat": "valueSystem", "type": "mc", "question": "A team builds a detailed action plan to improve response times but never measured how long responses currently take. Which step of the Continual Improvement Model did they skip?", "options": ["Where are we now?", "What is the vision?", "Take action", "How do we keep the momentum going?"], "correct": 0, "explanation": "Without an honest baseline from 'where are we now,' any target or plan built afterward is just a guess. The steps depend on the ones before them."}, {"id": "q48", "cat": "valueSystem", "type": "mc", "question": "After migrating to a new ticketing system, a team discovers that reports another department relies on, pulled from the old system, are now broken. Which guiding principle would have surfaced this risk earlier?", "options": ["Think and work holistically", "Keep it simple and practical", "Focus on value", "Start where you are"], "correct": 0, "explanation": "Think and work holistically means recognizing how a change ripples across the wider organization rather than just the team making it. Missing a downstream dependency like this is exactly what the principle is meant to prevent."}, {"id": "q49", "cat": "valueSystem", "type": "mc", "question": "Which statement correctly describes the relationship between the value chain and the Product and Service Lifecycle?", "options": ["The value chain component of the Value System is expressed as the 8-stage lifecycle: Discover, Design, Acquire, Build, Transition, Operate, Deliver, Support", "They are two unrelated models, and a provider must choose one or the other", "The value chain always has exactly six fixed activities, separate from the lifecycle", "The lifecycle replaced governance as a Value System component"], "correct": 0, "explanation": "The value chain isn't a separate list of activities anymore. It's expressed as the same 8-stage lifecycle used to describe how a product or service moves from idea through ongoing support."}, {"id": "q50", "cat": "ai", "type": "mc", "question": "An AI tool automatically assigns an incoming incident to the right team and triggers the matching runbook. Which AI capability is this?", "options": ["Coordination", "Curation", "Cognition", "Clarification"], "correct": 0, "explanation": "Orchestrating a workflow, like assigning a ticket and kicking off a runbook, is Coordination. Curation organizes or filters information, Cognition makes a decision or prediction, and Clarification explains something in simpler terms."}, {"id": "q51", "cat": "ai", "type": "ms", "question": "Which two of the following are capabilities in the AI Capability Model? (Choose two.)", "options": ["Cognition", "Curation", "Compliance", "Consumption"], "correct": [0, 1], "explanation": "The six capabilities are Creation, Curation, Clarification, Cognition, Communication, and Coordination. Compliance and Consumption sound plausible but are not part of the model."}, {"id": "q52", "cat": "terms", "type": "ms", "question": "Which two of the following statements about utility and warranty are correct? (Choose two.)", "options": ["Utility describes what a service does", "Warranty describes how well and reliably a service performs", "A service needs only utility to create value", "Warranty is the functional capability the service provides"], "correct": [0, 1], "explanation": "Utility is the functional 'what,' warranty is the reliability 'how well,' and a service needs both to create value. Option 3's 'only' and option 4, which swaps warranty for utility's job, are both wrong."}, {"id": "q53", "cat": "terms", "type": "mc", "question": "A support plan bundles software licenses, help desk access, and defined response times for a specific client segment. What best describes this bundle itself?", "options": ["A service offering", "A service relationship", "A value stream", "A guiding principle"], "correct": 0, "explanation": "A service offering is the description of what's provided, goods, access to resources, and service actions, for a target consumer group. The ongoing cooperation once a client takes up that offering is the service relationship, not the bundle itself."}, {"id": "q54", "cat": "dimensions", "type": "mc", "question": "A company's rollout of an AI ticket-triage assistant requires staff to learn how to review and override its recommendations. Beyond information and technology, which dimension is most directly affected?", "options": ["Organizations and people", "Partners and suppliers", "Value streams and processes only", "None, this is purely a technology change"], "correct": 0, "explanation": "New skills, oversight responsibilities, and role changes for staff sit under organizations and people. AI adoption is explicitly recognized as touching this dimension, not just the technology itself."}, {"id": "tf21", "cat": "valueSystem", "type": "tf", "question": "The Continual Improvement Model's steps can be completed in any order, since improvement work isn't linear.", "answer": false, "explanation": "The steps build on each other in sequence, from vision through momentum. You can loop back to an earlier step as understanding improves, but you can't meaningfully skip ahead, like setting a target before knowing where you're starting from."}]}, "az900": {"categories": [{"key": "cloudConcepts", "label": "Cloud Concepts", "marks": 28}, {"key": "architecture", "label": "Architecture & Services", "marks": 38}, {"key": "management", "label": "Management & Governance", "marks": 34}], "flashcards": [{"id": "f1", "cat": "cloudConcepts", "front": "Cloud computing", "back": "The delivery of computing services \u2014 servers, storage, databases, networking, software \u2014 over the internet, with pay-as-you-go pricing instead of buying and maintaining physical infrastructure.", "detail": "This is the baseline definition the whole exam builds on. If a question describes 'renting' IT resources instead of owning them, it's pointing at this."}, {"id": "f2", "cat": "cloudConcepts", "front": "Shared responsibility model", "back": "A framework describing which security and management tasks the cloud provider handles versus the customer. The split shifts depending on IaaS, PaaS, or SaaS \u2014 the customer always keeps responsibility for their data and identities.", "detail": "Exam trap: no matter how much Microsoft manages, the customer is never off the hook for securing their own data and accounts."}, {"id": "f3", "cat": "cloudConcepts", "front": "Public vs. private vs. hybrid cloud", "back": "Public: resources owned and shared by a third-party provider. Private: dedicated to one organization, on-premises or hosted. Hybrid: combines both, often for compliance or a gradual migration.", "detail": "A healthcare org keeping patient records on-prem while running its website in Azure is a classic hybrid scenario."}, {"id": "f4", "cat": "cloudConcepts", "front": "Consumption-based model", "back": "Pricing where you pay only for the resources you actually use, instead of a large upfront purchase.", "detail": "This is the mechanism behind the CapEx-to-OpEx shift the exam likes to test."}, {"id": "f5", "cat": "cloudConcepts", "front": "CapEx vs. OpEx", "back": "CapEx is large upfront capital spending on infrastructure you own. OpEx is ongoing operating expense \u2014 paying for what you use as you use it. Cloud computing shifts spending from CapEx toward OpEx.", "detail": "If a scenario mentions avoiding a big hardware purchase, that's the CapEx-to-OpEx shift, not just 'saving money' in the abstract."}, {"id": "f6", "cat": "cloudConcepts", "front": "Serverless computing", "back": "A model where the provider manages the infrastructure automatically, and you're billed based on execution rather than provisioned capacity \u2014 you write code without managing servers.", "detail": "Azure Functions is the canonical serverless example on this exam."}, {"id": "f7", "cat": "cloudConcepts", "front": "Scalability vs. elasticity", "back": "Scalability is the general ability to handle more load by adding resources, manually or automatically. Elasticity specifically means resources scale up and down automatically in response to real-time demand.", "detail": "Elasticity is a specific kind of scalability \u2014 the automatic, dynamic kind. Not every scalable system is elastic."}, {"id": "f8", "cat": "cloudConcepts", "front": "Reliability & predictability", "back": "Reliability means a system recovers from failures and keeps functioning. Predictability means consistent performance and cost, so you can plan capacity and budget confidently.", "detail": "An unpredictable, spiky bill is a sign predictability isn't being managed well, even if the system is technically reliable."}, {"id": "f9", "cat": "cloudConcepts", "front": "IaaS vs. PaaS vs. SaaS", "back": "IaaS: rent infrastructure (VMs, storage, networking), you manage the OS and up. PaaS: rent a platform, you manage just your app and data. SaaS: rent a finished application, you just use it.", "detail": "Microsoft 365 is the textbook SaaS example. Azure App Service is the textbook PaaS example."}, {"id": "f10", "cat": "cloudConcepts", "front": "Choosing a cloud service type", "back": "Moving from IaaS to PaaS to SaaS gives you more that's managed for you, but less direct control. Match the scenario's control needs to the right type.", "detail": "If a question stresses 'wants full control of the OS,' that's IaaS. If it stresses 'just wants the app to work,' that's SaaS."}, {"id": "f11", "cat": "cloudConcepts", "front": "Spot pricing", "back": "A discounted pricing option for unused Azure capacity, in exchange for accepting that the VM can be evicted with little notice if Azure needs that capacity back.", "detail": "The trade-off \u2014 big discount for interruption risk \u2014 makes Spot the right answer for low-priority, interruption-tolerant workloads, never for anything mission-critical."}, {"id": "f12", "cat": "architecture", "front": "Azure regions & region pairs", "back": "A region is a set of datacenters in a geographic area. Region pairs are two regions in the same geography, at least 300 miles apart, used for disaster recovery \u2014 updates roll out to only one region in a pair at a time.", "detail": "The 300-mile / same-geography detail is a specific fact the exam likes to test directly."}, {"id": "f13", "cat": "architecture", "front": "Sovereign regions", "back": "Physically and logically isolated Azure regions for specific compliance needs, like Azure Government, operated separately from global Azure.", "detail": "These exist specifically so certain government or regulatory data never touches the general commercial cloud."}, {"id": "f14", "cat": "architecture", "front": "Availability zones", "back": "Physically separate datacenters within an Azure region, each with independent power, cooling, and networking, used to protect against a single datacenter failing.", "detail": "Region = geography. Availability zone = specific datacenter within that geography. An availability zone does NOT protect against a whole region going down."}, {"id": "f15", "cat": "architecture", "front": "Resources & resource groups", "back": "A resource is any deployable item in Azure, like a VM or database. A resource group is a logical container holding related resources, managed and billed together \u2014 and can contain resources from more than one region.", "detail": "Deleting a resource group deletes everything inside it \u2014 a common 'what happens if' exam scenario."}, {"id": "f16", "cat": "architecture", "front": "Subscriptions", "back": "A logical container that groups resource groups together, tied to billing and access management. An organization can have multiple subscriptions for different departments or environments.", "detail": "Subscriptions sit above resource groups and below management groups in the hierarchy."}, {"id": "f17", "cat": "architecture", "front": "Management groups", "back": "Containers that group multiple subscriptions together, letting you apply governance policies, like Azure Policy or RBAC, across many subscriptions at once.", "detail": "Useful for a large org that wants one security policy applied to every subscription without configuring each one separately. Deleting a management group does not delete the subscriptions inside it."}, {"id": "f18", "cat": "architecture", "front": "Resource hierarchy", "back": "From broadest to narrowest: management groups, then subscriptions, then resource groups, then individual resources. Settings applied higher up flow down and compound going down.", "detail": "A policy added at a lower scope can make things more restrictive than the parent required, but never less."}, {"id": "f19", "cat": "architecture", "front": "Compute types: VMs, containers, functions", "back": "VMs: full control, you manage the OS. Containers: lightweight, package an app with its dependencies, more portable than a VM. Functions: run small pieces of code on demand, fully serverless.", "detail": "As you move VM \u2192 container \u2192 function, management overhead drops and portability/scalability generally goes up."}, {"id": "f20", "cat": "architecture", "front": "VM options", "back": "Scale Sets automatically add or remove identical VMs based on demand or schedule. Availability sets group VMs so they don't all update or fail at once, within one datacenter. Azure Virtual Desktop delivers virtual desktops or apps to users.", "detail": "Scale Sets are about scaling out. Availability sets are about not losing everything at once during maintenance or a single-datacenter failure \u2014 not a whole-region failure."}, {"id": "f21", "cat": "architecture", "front": "Application hosting options", "back": "Web apps (App Service, PaaS, easiest), containers (more portable, more control), and virtual machines (most control, most management overhead) \u2014 pick based on how much you want to manage.", "detail": "App Service is the go-to answer when a scenario just needs 'a website, minimal management.'"}, {"id": "f22", "cat": "architecture", "front": "Virtual networking basics", "back": "A virtual network (VNet) is a private network in Azure. Subnets divide it into smaller segments. Peering connects VNets. Azure DNS resolves names. VPN Gateway and ExpressRoute connect on-premises networks to Azure.", "detail": "VPN Gateway travels over the public internet, encrypted. ExpressRoute is a private, dedicated connection \u2014 and is NOT encrypted by default, since it relies on the private connection itself."}, {"id": "f23", "cat": "architecture", "front": "Public vs. private endpoints", "back": "A public endpoint is reachable over the internet. A private endpoint gives a resource a private IP inside your VNet, so traffic never leaves the Microsoft network.", "detail": "Private endpoints are the answer whenever a scenario wants to reduce internet exposure for a resource like a database."}, {"id": "f24", "cat": "architecture", "front": "Azure Storage services", "back": "Blob (unstructured data), Files (managed file shares), Queue (messaging), and Table (NoSQL key-value) storage are the core Azure Storage services, all held within a storage account.", "detail": "The storage account is the top-level container; blobs, files, queues, and tables live inside it."}, {"id": "f25", "cat": "architecture", "front": "Storage tiers", "back": "Hot, Cool, Cold, and Archive tiers balance storage cost against access speed and retrieval cost \u2014 Hot is most expensive to store but cheapest/fastest to access, Archive is the opposite.", "detail": "Archive tier data can take hours to retrieve \u2014 a scenario needing frequent, fast access should never point to Archive, but one needing cheap, rarely-touched long-term storage does."}, {"id": "f26", "cat": "architecture", "front": "Redundancy options", "back": "LRS keeps copies in one datacenter. ZRS spreads copies across availability zones in one region. GRS/GZRS copies to a secondary paired region for disaster recovery. RA-GRS (or RA-GZRS) adds read access to that secondary region even before a failover happens.", "detail": "Plain GRS isn't readable from the secondary region until failover \u2014 the read-access ('RA-') variants are the ones you can read from directly, at any time."}, {"id": "f27", "cat": "architecture", "front": "AzCopy vs. Storage Explorer vs. Azure File Sync", "back": "AzCopy is a command-line tool for scripted, one-time or bulk file transfers into Azure Storage. Storage Explorer is a GUI tool for browsing and managing storage data. Azure File Sync keeps an on-premises file server continuously synchronized with an Azure file share.", "detail": "File Sync is the odd one out \u2014 it's ongoing synchronization, not a one-time transfer tool like the other two."}, {"id": "f28", "cat": "architecture", "front": "Azure Migrate vs. Azure Data Box", "back": "Azure Migrate assesses and migrates on-premises servers and workloads into Azure, typically over the network. Azure Data Box is a physical device shipped to you for transferring very large datasets when network transfer would be too slow.", "detail": "If a scenario mentions terabytes of data and a slow internet connection, that's pointing at Data Box, not Migrate."}, {"id": "f29", "cat": "architecture", "front": "Microsoft Entra ID", "back": "Microsoft's cloud-based identity and access management service, formerly Azure Active Directory. Manages users, groups, and access to apps and resources.", "detail": "Renamed from Azure AD \u2014 expect both names to appear in materials, but Entra ID is the current name."}, {"id": "f30", "cat": "architecture", "front": "SSO, MFA, passwordless", "back": "Single sign-on: one login for multiple apps. Multifactor authentication: a second verification step beyond a password. Passwordless: authentication without a password at all, like a security key or authenticator app.", "detail": "These three get tested as distinct concepts \u2014 don't conflate MFA with passwordless, they're different approaches."}, {"id": "f31", "cat": "architecture", "front": "External identities", "back": "Lets people outside your organization, like partners or customers, sign in using their own identities rather than you creating them a new account in your directory.", "detail": "This is the answer when a scenario mentions collaborating with an outside company without issuing them internal accounts."}, {"id": "f32", "cat": "architecture", "front": "Conditional Access", "back": "Policies that grant or block access based on conditions like user location, device compliance state, or risk level \u2014 for example, requiring MFA only when signing in from an unfamiliar location.", "detail": "Conditional Access is about the conditions under which access is allowed \u2014 not just location, but device state, app, and risk level too \u2014 distinct from RBAC which is about what access is granted."}, {"id": "f33", "cat": "architecture", "front": "Azure RBAC", "back": "Role-based access control assigns permissions to users, groups, or applications at a specific scope \u2014 management group, subscription, resource group, or resource \u2014 following least-privilege principles.", "detail": "RBAC answers 'what can this identity do,' Conditional Access answers 'under what conditions can they do it.'"}, {"id": "f34", "cat": "architecture", "front": "Zero Trust", "back": "A security model that assumes no user or device is trusted by default, even inside the network perimeter \u2014 every request is verified based on identity, device, and context.", "detail": "\"Never trust, always verify\" is the one-line summary. This is the answer when a scenario shows a perimeter breach that still fails to grant access."}, {"id": "f35", "cat": "architecture", "front": "Defense-in-depth", "back": "A layered security strategy \u2014 physical, identity, perimeter, network, compute, application, and data layers \u2014 so that if one layer is breached, others still protect the resource.", "detail": "Think of it as concentric rings of security around your data, not a single wall \u2014 related to, but distinct from, Zero Trust."}, {"id": "f36", "cat": "architecture", "front": "Microsoft Defender for Cloud", "back": "A tool that assesses your security posture across Azure resources and gives recommendations to improve it, plus threat protection for workloads.", "detail": "Defender for Cloud is narrower and security-specific. Azure Advisor is broader, covering cost, reliability, and performance too."}, {"id": "f49", "cat": "architecture", "front": "Managed identity", "back": "An automatically-managed Entra ID identity for an Azure resource, like a VM or Function, letting it authenticate to other Azure services without embedding credentials in code.", "detail": "This is the answer whenever a scenario wants passwordless, credential-free authentication between Azure services."}, {"id": "f37", "cat": "management", "front": "Factors affecting Azure costs", "back": "Resource type, usage/consumption, region, and licensing all affect what you pay in Azure.", "detail": "Region matters because pricing varies by datacenter location \u2014 a detail that's easy to overlook."}, {"id": "f38", "cat": "management", "front": "Pricing calculator vs. TCO calculator", "back": "The Pricing calculator estimates the cost of Azure resources you plan to use. The Total Cost of Ownership calculator compares your current on-premises infrastructure cost against running it in Azure over time.", "detail": "If a scenario asks 'should we move to the cloud at all,' that's the TCO calculator. If it asks 'what will this specific setup cost,' that's the Pricing calculator."}, {"id": "f39", "cat": "management", "front": "Tags", "back": "Name/value pairs attached to resources for organizing and tracking, like by department or environment \u2014 useful for cost reporting and filtering in Cost Management.", "detail": "Tags don't affect how a resource functions, only how it's organized and reported on."}, {"id": "f40", "cat": "management", "front": "Microsoft Purview", "back": "A unified data governance service that helps you discover, classify, and protect sensitive data across your organization, including hybrid, non-Azure sources.", "detail": "Purview is about knowing what data you have and how sensitive it is, not about access control itself."}, {"id": "f41", "cat": "management", "front": "Azure Policy", "back": "Enforces organizational rules on resources, for example requiring a specific region or blocking a VM size, and evaluates and reports on compliance \u2014 it can even deny non-compliant deployments outright.", "detail": "Policy governs how resources must be configured. RBAC governs who can act on them \u2014 a distinction the exam tests directly."}, {"id": "f42", "cat": "management", "front": "Resource locks", "back": "A Delete lock blocks deletion only. A Read-only lock blocks both deletion and modification. Both override a user's normal permissions, regardless of what RBAC otherwise allows.", "detail": "Exam trap: a Delete lock will NOT stop someone from modifying a resource's settings \u2014 only a Read-only lock does that."}, {"id": "f43", "cat": "management", "front": "Portal, Cloud Shell, CLI, PowerShell", "back": "The Azure portal is the web GUI. Cloud Shell is a browser-based command line, no local install needed. Azure CLI and Azure PowerShell are command-line tools installed locally for scripting \u2014 four ways to manage the same resources.", "detail": "Cloud Shell running in the browser is what distinguishes it from CLI/PowerShell installed on your own machine."}, {"id": "f44", "cat": "management", "front": "Infrastructure as Code & ARM templates", "back": "IaC means defining infrastructure in code or config files instead of manual clicks, so deployments are repeatable and version-controllable. ARM templates are Azure's native JSON format for declaring what resources to deploy.", "detail": "Repeatability and version control are the key benefits IaC brings that clicking through the portal doesn't."}, {"id": "f45", "cat": "management", "front": "Azure Advisor", "back": "A free tool that analyzes your resource configuration and usage, then gives personalized recommendations across cost, security, reliability, and performance.", "detail": "Advisor is broad (cost, security, reliability, performance). Defender for Cloud is specifically security-focused."}, {"id": "f46", "cat": "management", "front": "Azure Monitor", "back": "Collects and analyzes telemetry from your Azure resources \u2014 Log Analytics stores and queries logs, Azure Monitor alerts notify you of conditions, and Application Insights monitors live applications.", "detail": "Log Analytics is the query/storage layer inside Azure Monitor, not a separate standalone product."}, {"id": "f47", "cat": "management", "front": "Azure Arc", "back": "Extends Azure management tools, like Azure Policy and RBAC, to resources outside Azure \u2014 on-premises servers, other clouds, or edge devices \u2014 managed with the same tools as native Azure resources.", "detail": "Arc is the answer whenever a scenario wants 'one pane of glass' for Azure plus non-Azure infrastructure."}, {"id": "f48", "cat": "management", "front": "Azure Service Health", "back": "Reports on the health of the Azure platform itself \u2014 like an ongoing outage in a region \u2014 separate from the health of your own specific resources.", "detail": "Service Health = is Azure itself having a problem. Azure Monitor = is my stuff having a problem. Different questions, different tools."}, {"id": "f50", "cat": "management", "front": "Service Level Agreement (SLA)", "back": "Microsoft's formal, measurable commitment to an uptime or performance target for a service, such as 99.9% monthly uptime, backed by service credits if the target is missed.", "detail": "An SLA is a commitment with a financial remedy, not a guarantee of zero downtime \u2014 a distinction the exam tests directly."}, {"id": "f51", "cat": "management", "front": "Composite SLA", "back": "The effective SLA of a solution built from multiple dependent services. Chaining services in sequence multiplies their individual uptime percentages, producing a LOWER composite SLA than any single component. Adding redundant, independent components in parallel can raise the composite SLA above any one component's own figure.", "detail": "Exam trap: depending on more services in sequence generally lowers your overall SLA, even though each individual piece still meets its own target."}, {"id": "f52", "cat": "management", "front": "Azure support plans", "back": "Basic support is free and included with every subscription, covering billing and subscription questions. Paid tiers \u2014 Developer, Standard, and Professional Direct/Premier \u2014 add technical support with progressively faster guaranteed response times for production issues.", "detail": "Basic support alone has no response-time commitment for a production-down technical issue \u2014 that requires a paid tier."}, {"id": "f53", "cat": "management", "front": "Azure Hybrid Benefit", "back": "A licensing benefit that lets you apply existing on-premises Windows Server or SQL Server licenses (with active Software Assurance or an eligible subscription) toward the cost of running those workloads in Azure, instead of paying for a new license.", "detail": "A separate cost lever from Reservations or Spot pricing \u2014 it reduces the licensing portion of the bill, not the underlying compute rate."}, {"id": "f54", "cat": "architecture", "front": "Network security group (NSG)", "back": "A set of allow/deny security rules that filter inbound and outbound network traffic to Azure resources, based on source/destination IP, port, and protocol \u2014 applied at a subnet or an individual network interface.", "detail": "NSGs are the baseline traffic-filtering tool on this exam; Azure Firewall is a more advanced managed alternative, but NSGs are the AZ-900-level answer."}, {"id": "f55", "cat": "architecture", "front": "Load Balancer vs. Application Gateway", "back": "Azure Load Balancer works at Layer 4 (TCP/UDP), distributing traffic by IP and port with no awareness of content. Application Gateway works at Layer 7 (HTTP/HTTPS), routing by URL path or host header, and can add a Web Application Firewall.", "detail": "If a scenario mentions routing by URL path or needing a WAF, that's Application Gateway, not Load Balancer."}, {"id": "f56", "cat": "architecture", "front": "Azure Kubernetes Service (AKS)", "back": "A managed Kubernetes service for orchestrating, scaling, and self-healing groups of containers across a cluster of nodes \u2014 Azure manages the control plane, you manage your workloads.", "detail": "AKS is the answer for orchestrating many containers at scale; Azure Container Instances is the answer for running one or a few standalone containers quickly, with no orchestration layer."}, {"id": "f57", "cat": "architecture", "front": "Bicep", "back": "A concise, domain-specific language for defining Azure infrastructure as code, which compiles down to standard ARM template JSON and deploys through the same Azure Resource Manager.", "detail": "Bicep is Microsoft's current recommended way to author IaC on Azure \u2014 easier to read and write than raw ARM JSON, but functionally equivalent underneath."}, {"id": "f58", "cat": "cloudConcepts", "front": "Multi-cloud", "back": "A deployment strategy that deliberately uses more than one public cloud provider, for example Azure alongside another provider, to avoid depending on a single vendor or to use each provider's strongest services.", "detail": "Distinct from hybrid cloud: hybrid mixes on-premises/private infrastructure with public cloud; multi-cloud mixes two or more public cloud providers."}, {"id": "f59", "cat": "architecture", "front": "Azure CDN vs. Azure Front Door", "back": "Azure CDN caches static content at edge points-of-presence close to users to cut latency. Azure Front Door adds global HTTP(S) lo
