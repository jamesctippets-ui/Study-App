C governs permissions on resources. Conditional Access governs the conditions required to sign in at all."}, {"id": "q22", "cat": "architecture", "type": "mc", "question": "A scenario describes an attacker compromising the network perimeter, but still being unable to access application data without passing separate identity and device checks. Which principle does this describe?", "options": ["Zero Trust", "Defense-in-depth", "Role-based access control", "Conditional Access alone"], "correct": 0, "explanation": "Zero Trust means never assuming trust based on network location \u2014 every request is verified independently, so a perimeter breach alone isn't enough to gain access."}, {"id": "q23", "cat": "architecture", "type": "mc", "question": "Which Azure tool gives recommendations across cost, security, reliability, AND performance in one place, in contrast with Microsoft Defender for Cloud, which focuses specifically on security posture?", "options": ["Azure Advisor", "Azure Policy", "Azure Monitor", "Microsoft Purview"], "correct": 0, "explanation": "Advisor is broad across four pillars; Defender for Cloud is narrower and security-specific."}, {"id": "q24", "cat": "architecture", "type": "mc", "question": "A company needs to move 200 TB of on-premises data into Azure Blob Storage, but their internet connection would take months to transfer it. Which service is designed for this scenario?", "options": ["Azure Data Box", "Azure Migrate", "AzCopy", "Azure File Sync"], "correct": 0, "explanation": "Data Box is a physical device for transferring very large datasets offline when network transfer isn't practical."}, {"id": "q25", "cat": "architecture", "type": "mc", "question": "Which tool would an administrator use to script bulk file copies between an on-premises server and Azure Blob Storage from the command line?", "options": ["AzCopy", "Azure Storage Explorer", "Azure File Sync", "Azure Migrate"], "correct": 0, "explanation": "AzCopy is the command-line tool for scripted transfers. Storage Explorer is a GUI tool; File Sync is for ongoing synchronization, not scripting."}, {"id": "q26", "cat": "architecture", "type": "mc", "question": "A company wants to manage on-premises servers and VMs in another cloud using the same Azure tools, like Azure Policy and RBAC, that they already use for native Azure resources. Which service enables this?", "options": ["Azure Arc", "Azure Migrate", "Azure Monitor", "Microsoft Entra ID"], "correct": 0, "explanation": "Azure Arc extends Azure management tooling to resources outside Azure."}, {"id": "q42", "cat": "architecture", "type": "mc", "question": "A company deploys VMs across two availability zones in the same region for resilience. Which failure scenario would this NOT protect against?", "options": ["The entire Azure region becoming unavailable", "A single datacenter losing power", "A single rack failing within one zone", "A cooling failure in one zone's datacenter"], "correct": 0, "explanation": "Availability zones protect against datacenter-level failures within a region, not a failure of the region itself, which needs geo-redundancy or a multi-region design."}, {"id": "q43", "cat": "architecture", "type": "mc", "question": "An application needs to authenticate a service, not a person, to access Azure resources without embedding a password in code. Which Entra ID feature fits?", "options": ["A managed identity", "Self-service password reset", "A guest user account", "A security group"], "correct": 0, "explanation": "A managed identity lets an Azure resource authenticate to other services automatically, without any credentials embedded in code."}, {"id": "q27", "cat": "management", "type": "mc", "question": "A company wants to prevent a storage account holding compliance data from ever being deleted, even by an administrator who has full Owner permissions on the subscription. Which feature should they apply?", "options": ["A Delete resource lock", "Azure RBAC alone", "Azure Policy alone", "Azure Advisor"], "correct": 0, "explanation": "A resource lock overrides normal RBAC permissions to prevent deletion (or modification, with a Read-only lock), regardless of what a user is otherwise allowed to do."}, {"id": "q28", "cat": "management", "type": "mc", "question": "A company wants to both enforce a rule, like 'no VMs outside East US,' and separately get recommendations for improving cost efficiency of existing resources. Which combination is correct?", "options": ["Azure Policy for enforcement, Azure Advisor for recommendations", "Azure Policy alone handles both", "Azure Advisor alone handles both", "Resource locks handle both"], "correct": 0, "explanation": "Policy enforces rules going forward; Advisor analyzes existing resources and recommends improvements \u2014 different tools for different jobs."}, {"id": "q29", "cat": "management", "type": "mc", "question": "A company needs to discover and classify sensitive data, like customer SSNs, scattered across multiple data stores in a hybrid environment. Which service is purpose-built for this?", "options": ["Microsoft Purview", "Azure Policy", "Azure Advisor", "Azure Monitor"], "correct": 0, "explanation": "Purview is specifically for discovering, classifying, and protecting sensitive data, including across hybrid sources."}, {"id": "q30", "cat": "management", "type": "mc", "question": "An administrator wants to run Azure management commands from a browser, with no local software installation required. Which tool fits?", "options": ["Azure Cloud Shell", "Azure CLI installed locally", "Azure PowerShell installed locally", "An ARM template alone"], "correct": 0, "explanation": "Cloud Shell runs entirely in the browser, unlike CLI or PowerShell, which are typically installed locally."}, {"id": "q31", "cat": "management", "type": "mc", "question": "An administrator wants infrastructure deployments to be version-controlled and repeatable, avoiding manual portal configuration each time. Which approach fits?", "options": ["Infrastructure as Code using ARM templates", "Manually repeating the same portal steps each time", "Azure Advisor recommendations", "A single shared resource lock"], "correct": 0, "explanation": "IaC, via ARM templates or similar, makes deployments repeatable and trackable in source control, unlike manual portal clicks."}, {"id": "q32", "cat": "management", "type": "mc", "question": "Which Azure tool would specifically flag that a company is paying for several unattached, unused disks?", "options": ["Azure Advisor", "Azure Policy", "Microsoft Purview", "Resource locks"], "correct": 0, "explanation": "Azure Advisor analyzes usage and cost, and will flag unused resources like orphaned disks as a cost-saving opportunity."}, {"id": "q33", "cat": "management", "type": "mc", "question": "A company wants to know immediately if there's an ongoing Azure platform outage affecting a region they use, separate from the health of their own individual resources. Which service fits?", "options": ["Azure Service Health", "Azure Monitor", "Azure Advisor", "Microsoft Purview"], "correct": 0, "explanation": "Service Health reports on the health of the Azure platform itself, distinct from Azure Monitor, which reports on your own resources."}, {"id": "q34", "cat": "management", "type": "mc", "question": "Which best distinguishes Azure Service Health from Azure Monitor?", "options": ["Service Health reports on the health of the Azure platform itself; Azure Monitor collects telemetry about the customer's own resources", "Both are focused specifically on monitoring the health of your own virtual machines and databases", "Azure Monitor only works for virtual machines", "Service Health requires a paid add-on"], "correct": 0, "explanation": "Service Health = is Azure itself having a problem. Azure Monitor = is my own workload having a problem."}, {"id": "q35", "cat": "management", "type": "mc", "question": "A finance team wants monthly spending broken down by department, using labels applied to each resource when it was created. Which feature enables this, combined with Cost Management?", "options": ["Tags", "Resource locks", "Azure Policy", "Availability zones"], "correct": 0, "explanation": "Tags are name/value pairs used to organize and filter resources for reporting, like cost breakdowns by department."}, {"id": "q36", "cat": "management", "type": "mc", "question": "Which of these would Azure Policy be best suited to enforce?", "options": ["Every new storage account must use only approved SKUs", "Give a specific user permission to restart VMs", "Alert the security team when a login occurs from a new country", "Automatically scale a VM Scale Set based on CPU usage"], "correct": 0, "explanation": "The other three describe RBAC, Conditional Access/alerting, and autoscaling respectively \u2014 only the first is a configuration rule that Azure Policy enforces."}, {"id": "q37", "cat": "management", "type": "mc", "question": "Which of these is TRUE about resource locks?", "options": ["A Read-only lock can prevent an otherwise-authorized user from modifying a resource's configuration", "Resource locks are configured through Azure RBAC role assignments", "Resource locks only apply to virtual machines", "Resource locks automatically expire after 30 days"], "correct": 0, "explanation": "A Read-only lock blocks both deletion and modification, overriding what RBAC would otherwise allow \u2014 locks don't expire automatically and apply to any resource type."}, {"id": "q38", "cat": "management", "type": "mc", "question": "An architect wants one place to see health, performance, and log data across VMs, App Services, and databases, with the ability to configure alerts. Which service fits?", "options": ["Azure Monitor", "Azure Service Health", "Azure Advisor", "Azure Policy"], "correct": 0, "explanation": "Azure Monitor is the unified telemetry, logging, and alerting service across your own resources."}, {"id": "q39", "cat": "management", "type": "mc", "question": "Which Azure Monitor component would you use to write a custom query against collected log data to find failed login attempts in the last 24 hours?", "options": ["Log Analytics", "Application Insights", "Azure Advisor", "Azure Service Health"], "correct": 0, "explanation": "Log Analytics is the querying and storage layer within Azure Monitor for exactly this kind of custom log query."}, {"id": "q40", "cat": "management", "type": "mc", "question": "A company is deploying identical infrastructure to Dev, Test, and Prod and wants a guarantee that all three are configured identically, with the deployment definition stored in source control. Which approach fits best?", "options": ["Infrastructure as Code using ARM templates", "Azure Advisor recommendations", "Manually reproducing the same steps in each environment", "A single shared resource lock across all three"], "correct": 0, "explanation": "IaC stored in source control is exactly what guarantees identical, repeatable, trackable deployments across environments."}, {"id": "q44", "cat": "management", "type": "mc", "question": "An Azure Policy blocks creation of any VM without a 'CostCenter' tag, and a developer's deployment fails as a result. What does this indicate about the policy's effect setting?", "options": ["It's using a Deny effect", "It's using an Audit-only effect", "It's using a Disabled effect", "Policy cannot block deployments, only report on them"], "correct": 0, "explanation": "A Deny effect actively blocks non-compliant deployments, unlike Audit, which only reports on non-compliance without stopping it."}, {"id": "q45", "cat": "management", "type": "mc", "question": "Which best distinguishes Azure Advisor's cost recommendations from Azure Cost Management?", "options": ["Advisor recommends specific actions to reduce cost, like resizing; Cost Management focuses on tracking, analyzing, and budgeting actual spend", "Both are focused specifically on enforcing spending budgets rather than giving recommendations", "Cost Management only works with Reserved Instances", "Advisor replaces the need for budgets"], "correct": 0, "explanation": "Advisor gives actionable recommendations; Cost Management is the analysis and budgeting tool for tracking spend over time."}, {"id": "tf1", "cat": "cloudConcepts", "type": "tf", "question": "In the shared responsibility model, the cloud provider is always responsible for securing customer data.", "answer": false, "explanation": "The customer always retains responsibility for securing their own data and identities, regardless of service model."}, {"id": "tf2", "cat": "cloudConcepts", "type": "tf", "question": "A consumption-based pricing model charges a fixed amount regardless of usage.", "answer": false, "explanation": "Consumption-based pricing charges based on actual usage, not a flat fixed amount."}, {"id": "tf3", "cat": "cloudConcepts", "type": "tf", "question": "SaaS gives the customer the most control over the underlying infrastructure.", "answer": false, "explanation": "IaaS gives the most control; SaaS gives the least, since the provider manages everything but the customer's own use of the app."}, {"id": "tf4", "cat": "cloudConcepts", "type": "tf", "question": "Serverless computing still requires the customer to patch the underlying operating system.", "answer": false, "explanation": "In serverless computing, the provider manages the underlying infrastructure and OS entirely."}, {"id": "tf5", "cat": "cloudConcepts", "type": "tf", "question": "Elasticity and scalability are interchangeable terms with no meaningful difference.", "answer": false, "explanation": "Elasticity is specifically the automatic, dynamic form of the broader concept of scalability."}, {"id": "tf6", "cat": "cloudConcepts", "type": "tf", "question": "A pay-as-you-go pricing model can still result in a larger total bill than a well-planned on-premises deployment, depending on usage patterns.", "answer": true, "explanation": "Cloud isn't automatically cheaper in every case \u2014 poorly managed consumption can exceed the cost of owned infrastructure."}, {"id": "tf7", "cat": "cloudConcepts", "type": "tf", "question": "Spot pricing guarantees the VM will never be evicted as long as you keep paying.", "answer": false, "explanation": "Spot VMs can be evicted with little notice whenever Azure needs the capacity back, regardless of willingness to pay standard rates."}, {"id": "tf8", "cat": "architecture", "type": "tf", "question": "A resource group can contain resources from more than one Azure region.", "answer": true, "explanation": "A resource group is a management/billing boundary, not a regional one \u2014 it can hold resources deployed to different regions."}, {"id": "tf9", "cat": "architecture", "type": "tf", "question": "Deleting a management group automatically deletes all subscriptions beneath it.", "answer": false, "explanation": "A management group is just an organizational container \u2014 deleting it does not delete the subscriptions inside it."}, {"id": "tf10", "cat": "architecture", "type": "tf", "question": "A VM in an availability set is automatically protected from a failure affecting an entire Azure region.", "answer": false, "explanation": "Availability sets protect against failures within a single datacenter, not a full regional outage \u2014 that requires geo-redundancy or a multi-region design."}, {"id": "tf11", "cat": "architecture", "type": "tf", "question": "ExpressRoute traffic is encrypted by default because it doesn't use the public internet.", "answer": false, "explanation": "ExpressRoute is private but not encrypted by default \u2014 a commonly missed detail, unlike VPN Gateway which is encrypted."}, {"id": "tf12", "cat": "architecture", "type": "tf", "question": "Zone-redundant storage (ZRS) protects data against the loss of an entire Azure region.", "answer": false, "explanation": "ZRS protects against zone-level failure within one region \u2014 GRS is needed for protection against a full regional loss."}, {"id": "tf13", "cat": "architecture", "type": "tf", "question": "Azure Policy can prevent a resource from being created if it doesn't comply with an assigned rule.", "answer": true, "explanation": "Azure Policy supports a Deny effect that can block non-compliant deployments outright."}, {"id": "tf14", "cat": "architecture", "type": "tf", "question": "A private endpoint assigns a resource a public IP address reachable from the internet.", "answer": false, "explanation": "A private endpoint gives a resource a private IP inside your VNet, keeping traffic off the public internet."}, {"id": "tf15", "cat": "architecture", "type": "tf", "question": "Conditional Access policies can only be based on user location, not device compliance state.", "answer": false, "explanation": "Conditional Access can consider device compliance, app, sign-in risk, and more \u2014 not just location."}, {"id": "tf16", "cat": "management", "type": "tf", "question": "Azure Policy assignments made at a resource group level can be more restrictive than a policy already assigned at the subscription level above it.", "answer": true, "explanation": "Additional policies can be layered at a lower scope to add restrictions, but a lower scope can never override a higher scope to become less restrictive."}, {"id": "tf17", "cat": "management", "type": "tf", "question": "A Delete lock also prevents a resource's configuration from being modified, not just deleted.", "answer": false, "explanation": "A Delete lock only blocks deletion. A Read-only lock is what blocks modification as well."}, {"id": "tf18", "cat": "management", "type": "tf", "question": "Azure Advisor is a paid service requiring a separate subscription add-on.", "answer": false, "explanation": "Azure Advisor is included free for all Azure customers."}, {"id": "tf19", "cat": "management", "type": "tf", "question": "Microsoft Purview can classify sensitive data across on-premises sources as well as Azure resources.", "answer": true, "explanation": "Purview is designed to scan and classify data across a hybrid data estate, not only Azure-native sources."}, {"id": "tf20", "cat": "management", "type": "tf", "question": "Infrastructure as Code deployments using ARM templates are inherently non-repeatable, since each deployment can produce different results.", "answer": false, "explanation": "Repeatability \u2014 deploying the same, consistent result every time \u2014 is the whole point of Infrastructure as Code."}, {"id": "tf21", "cat": "management", "type": "tf", "question": "Tags can be used to filter cost reports in Azure Cost Management.", "answer": true, "explanation": "Tags are commonly used to break down and filter cost data by department, environment, or project."}, {"id": "sa1", "cat": "cloudConcepts", "type": "sa", "question": "A company is deciding between IaaS and PaaS for a new internal app. Describe one advantage and one disadvantage of each.", "modelAnswer": "IaaS gives full control over the OS and environment, useful for custom requirements, but the team must patch and manage the OS themselves. PaaS removes that management burden and speeds up development, but limits control and can create vendor lock-in around the platform's specific features."}, {"id": "sa2", "cat": "cloudConcepts", "type": "sa", "question": "Explain why an organization's total Azure bill could increase even after adopting a consumption-based pricing model.", "modelAnswer": "Consumption-based pricing charges for actual usage, so if usage grows \u2014 more VMs, more storage, more traffic \u2014 the bill grows too. It removes a large fixed upfront cost but doesn't cap spending, so poor resource management or unexpected demand can still drive costs up."}, {"id": "sa3", "cat": "cloudConcepts", "type": "sa", "question": "A company needs to keep certain regulated data on-premises but wants cloud flexibility for everything else. Which cloud model fits, and why?", "modelAnswer": "Hybrid cloud, because it combines on-premises infrastructure for the regulated data with public cloud resources for everything else, meeting compliance requirements while still gaining cloud flexibility elsewhere."}, {"id": "sa4", "cat": "architecture", "type": "sa", "question": "A company has Dev, Test, and Prod subscriptions and wants consistent tagging and region policies enforced across all of them without repeating configuration. Describe the resource that solves this and why.", "modelAnswer": "A management group containing all three subscriptions. Policies and RBAC assigned at the management group level flow down to every subscription beneath it, so the rule only needs to be configured once instead of three times."}, {"id": "sa5", "cat": "architecture", "type": "sa", "question": "Explain the difference between Azure Migrate and Azure Data Box, and when you'd use each.", "modelAnswer": "Azure Migrate helps assess and migrate on-premises servers and workloads into Azure, typically over the network. Azure Data Box is a physical device used to transfer very large amounts of data into Azure when the internet connection would be too slow or costly."}, {"id": "sa6", "cat": "architecture", "type": "sa", "question": "A scenario describes an attacker who breaches the network perimeter but still cannot access sensitive data without passing device and identity checks. Which security concept does this illustrate, and why?", "modelAnswer": "Zero Trust \u2014 because it never assumes trust just because a request originated inside the network perimeter; every access attempt is verified independently based on identity, device, and context, regardless of network location."}, {"id": "sa7", "cat": "architecture", "type": "sa", "question": "Describe the difference between Azure RBAC and Azure Policy, using an example of each.", "modelAnswer": "RBAC controls who can do what \u2014 for example, granting a user permission to create VMs in a resource group. Azure Policy controls how resources must be configured \u2014 for example, requiring every VM to be deployed only in a specific region, regardless of who creates it."}, {"id": "sa8", "cat": "architecture", "type": "sa", "question": "Explain why a company might choose ExpressRoute over a VPN Gateway, and one trade-off of that choice.", "modelAnswer": "ExpressRoute provides a private, dedicated connection with more predictable performance and lower latency than a VPN Gateway, which travels over the public internet. The trade-off is that ExpressRoute is more expensive and slower to provision, and its traffic isn't encrypted by default."}, {"id": "sa9", "cat": "management", "type": "sa", "question": "A company applied a Delete lock to a production database, but a developer still can't update its firewall rules. Explain why, and what's more likely blocking them.", "modelAnswer": "A Delete lock only blocks deletion, not modification \u2014 so it shouldn't be blocking a firewall rule update on its own. The more likely cause is a Read-only lock, which blocks both deletion and modification, or an RBAC permission issue."}, {"id": "sa10", "cat": "management", "type": "sa", "question": "Explain the difference between Azure Advisor and Microsoft Defender for Cloud.", "modelAnswer": "Azure Advisor gives broad recommendations across cost, security, reliability, and performance for the whole environment. Microsoft Defender for Cloud is focused specifically on security posture and threat protection \u2014 narrower but deeper on the security side."}, {"id": "sa11", "cat": "management", "type": "sa", "question": "Describe an Infrastructure as Code approach that guarantees a team's Dev, Test, and Prod environments stay identical, with a record of exactly what was deployed.", "modelAnswer": "Define the infrastructure in an ARM template, store it in source control, and deploy that same template to each environment. This guarantees consistency across environments and keeps a version history of exactly what was deployed and when."}, {"id": "sa12", "cat": "management", "type": "sa", "question": "Explain what Azure Service Health tells you that Azure Monitor does not.", "modelAnswer": "Azure Service Health reports on the health and any ongoing incidents of the Azure platform itself, like an outage affecting a whole region. Azure Monitor instead reports on the health and telemetry of your own specific resources."}, {"id": "msq1", "cat": "cloudConcepts", "type": "ms", "question": "Which two of the following are examples of PaaS services? (Choose two.)", "options": ["Azure App Service", "Azure SQL Database", "Azure Virtual Machines", "Microsoft 365"], "correct": [0, 1], "explanation": "App Service and Azure SQL Database are both platforms where Microsoft manages the runtime for you. Virtual Machines is IaaS, and Microsoft 365 is SaaS."}, {"id": "msq2", "cat": "cloudConcepts", "type": "ms", "question": "Which two statements correctly describe benefits of cloud computing? (Choose two.)", "options": ["Resources can scale to match demand", "All cloud spending is guaranteed to be lower than on-premises", "Redundant infrastructure can improve reliability", "Cloud computing eliminates the need for any security planning"], "correct": [0, 2], "explanation": "Scalability and improved reliability through redundancy are genuine, well-documented benefits. Cost isn't guaranteed to be lower, and security planning is still required under the shared responsibility model."}, {"id": "msq3", "cat": "cloudConcepts", "type": "ms", "question": "Which two of these are true about the consumption-based pricing model? (Choose two.)", "options": ["You pay only for what you use", "It removes the need for a large upfront capital investment", "It guarantees a fixed monthly bill", "It always costs less than owning the equivalent hardware"], "correct": [0, 1], "explanation": "Consumption-based pricing charges for actual usage and removes the big upfront purchase \u2014 but it doesn't guarantee a fixed bill or that it's always cheaper than owning hardware."}, {"id": "msq4", "cat": "architecture", "type": "ms", "question": "Which two resources are required to establish a site-to-site VPN connection between an on-premises network and Azure? (Choose two.)", "options": ["VPN Gateway", "Local Network Gateway", "ExpressRoute", "Azure Bastion"], "correct": [0, 1], "explanation": "A site-to-site VPN needs a VPN Gateway on the Azure side and a Local Network Gateway representing the on-premises side. ExpressRoute is a separate, non-VPN connection type, and Bastion is unrelated to site-to-site connectivity."}, {"id": "msq5", "cat": "architecture", "type": "ms", "question": "Which two of the following are valid Azure Storage redundancy options? (Choose two.)", "options": ["Locally-redundant storage (LRS)", "Geo-redundant storage (GRS)", "Nationally-redundant storage (NRS)", "Continent-redundant storage (CRS)"], "correct": [0, 1], "explanation": "LRS and GRS are real Azure redundancy options. 'Nationally-redundant' and 'continent-redundant' storage are not real Azure terms."}, {"id": "msq6", "cat": "architecture", "type": "ms", "question": "Which two statements about availability zones are correct? (Choose two.)", "options": ["They are physically separate datacenters within a region", "Each zone has independent power and cooling", "A single availability zone spans multiple regions", "Using availability zones is always free"], "correct": [0, 1], "explanation": "Availability zones are physically separate datacenters with independent power and cooling, all within one region \u2014 they don't span multiple regions, and using zonal resources isn't automatically free."}, {"id": "msq7", "cat": "architecture", "type": "ms", "question": "Which two of the following are examples of Azure compute services? (Choose two.)", "options": ["Azure Virtual Machines", "Azure Functions", "Azure Storage Explorer", "Azure Monitor"], "correct": [0, 1], "explanation": "Virtual Machines and Functions are both compute services. Storage Explorer is a data management tool, and Monitor is a monitoring service \u2014 neither runs your workloads."}, {"id": "msq8", "cat": "management", "type": "ms", "question": "Which two actions can Azure Policy take on a non-compliant resource? (Choose two.)", "options": ["Deny its creation outright", "Audit and report on it without blocking it", "Automatically increase its budget", "Automatically upgrade its SKU"], "correct": [0, 1], "explanation": "Policy effects include Deny, which blocks the deployment, and Audit, which reports non-compliance without blocking it. Policy doesn't manage budgets or automatically change resource SKUs."}, {"id": "msq9", "cat": "management", "type": "ms", "question": "Which two of these are true about resource locks? (Choose two.)", "options": ["A Delete lock prevents deletion", "A Read-only lock prevents both deletion and modification", "Locks can be bypassed by users with the Owner role", "Locks automatically expire after 90 days"], "correct": [0, 1], "explanation": "Delete locks block deletion; Read-only locks block deletion and modification. Locks override even Owner permissions and don't expire automatically."}, {"id": "msq10", "cat": "management", "type": "ms", "question": "Which two of these are free Azure tools, with no direct cost to use? (Choose two.)", "options": ["Azure Advisor", "Azure Service Health", "Microsoft Defender for Cloud's paid tier", "Azure Data Box"], "correct": [0, 1], "explanation": "Azure Advisor and Service Health are both free. Defender for Cloud's advanced paid tier and Data Box, a physical device you're billed for shipping and using, both involve cost."}, {"id": "msq11", "cat": "cloudConcepts", "type": "ms", "question": "Which two of the following are true about the shared responsibility model? (Choose two.)", "options": ["The customer always retains responsibility for their own data", "The split of responsibility shifts depending on IaaS, PaaS, or SaaS", "The provider is responsible for physical security in an on-premises datacenter", "Using SaaS removes the customer's responsibility for data entirely"], "correct": [0, 1], "explanation": "The customer never loses responsibility for their own data, and the split does shift by service model. On-premises datacenter security is the customer's own concern, not a cloud provider's."}, {"id": "msq12", "cat": "architecture", "type": "ms", "question": "Which two statements about the Azure resource hierarchy are correct? (Choose two.)", "options": ["Settings applied at a management group flow down to the subscriptions beneath it", "A subscription can belong to more than one management group at the same time", "Resource groups sit above subscriptions in the hierarchy", "Deleting a management group does not delete the subscriptions inside it"], "correct": [0, 3], "explanation": "Governance flows downward from management groups, and deleting one doesn't delete the subscriptions inside it. A subscription belongs to one management group at a time, and resource groups sit below subscriptions, not above them."}, {"id": "msq13", "cat": "architecture", "type": "ms", "question": "Which two of the following are valid Azure options for running containers? (Choose two.)", "options": ["Azure Container Instances", "Azure Container Apps", "Azure Table Storage", "Azure Service Health"], "correct": [0, 1], "explanation": "Container Instances and Container Apps both run containers. Table Storage is a data store, and Service Health is a platform status tool \u2014 neither runs workloads."}, {"id": "msq14", "cat": "architecture", "type": "ms", "question": "Which two of the following correctly describe ExpressRoute? (Choose two.)", "options": ["It is a private, dedicated connection to Azure", "It is not encrypted by default", "It always travels over the public internet", "It cannot be used alongside a VPN Gateway"], "correct": [0, 1], "explanation": "ExpressRoute is private and dedicated, and notably isn't encrypted by default. It specifically avoids the public internet, and it can coexist with a VPN Gateway as a backup path."}, {"id": "msq15", "cat": "architecture", "type": "ms", "question": "Which two of the following are true about Azure Storage redundancy? (Choose two.)", "options": ["LRS keeps copies within a single datacenter", "GRS replicates data to a secondary, paired region", "ZRS protects against a full regional outage", "All redundancy options cost the same"], "correct": [0, 1], "explanation": "LRS is single-datacenter, GRS adds a secondary region. ZRS protects against zone-level, not regional, failure, and redundancy options are priced differently based on the protection they provide."}, {"id": "msq16", "cat": "architecture", "type": "ms", "question": "Which two of the following are true about Conditional Access? (Choose two.)", "options": ["It can require MFA based on sign-in location", "It can evaluate device compliance state", "It replaces the need for Azure RBAC entirely", "It only applies to external guest users"], "correct": [0, 1], "explanation": "Conditional Access can factor in location and device compliance. It doesn't replace RBAC \u2014 they solve different problems \u2014 and it applies to any sign-in, not only guests."}, {"id": "msq17", "cat": "management", "type": "ms", "question": "Which two statements about Azure Service Health and Azure Monitor are correct? (Choose two.)", "options": ["Service Health reports on outages affecting the Azure platform itself", "Azure Monitor collects telemetry from your own resources", "They are the exact same service under different names", "Only Azure Monitor requires a paid subscription"], "correct": [0, 1], "explanation": "Service Health covers the platform's own status; Monitor covers your resources' telemetry. They're distinct services, and neither requires a paid subscription to use."}], "lessons": [{"id": "cloud-fundamentals", "title": "Cloud Fundamentals", "summary": "Service models, pricing, and the core benefits of cloud computing.", "diagram": "serviceModels", "vocabIds": ["f1", "f2", "f3", "f4", "f5", "f6", "f7", "f8", "f9", "f10", "f11"], "quizIds": ["q1", "q5", "sa2", "msq11"], "reading": "Cloud computing means renting computing power, storage, and services from a provider like Microsoft, instead of buying and running your own servers. You pay for what you use, which shifts spending from a big upfront purchase (CapEx) to an ongoing operating cost (OpEx) \u2014 similar to leasing equipment instead of buying it outright.\n\nThe three main service models \u2014 IaaS, PaaS, and SaaS \u2014 differ in how much you manage yourself versus how much Microsoft manages for you. IaaS is the closest to running your own servers: you get virtual machines and networking, but you're still responsible for the operating system and everything above it. PaaS removes that OS burden \u2014 you just deploy your code and Microsoft handles the runtime. SaaS is a finished product, like Microsoft 365, where you're just a user.\n\nThe shared responsibility model formalizes this: no matter which model you pick, you always keep responsibility for your own data and who has access to it.", "fundamentalsLabel": "New to cloud computing? See the everyday analogy", "fundamentals": "If you've ever compared leasing a car to buying one outright, you already understand the CapEx-to-OpEx shift cloud computing represents. Buying a car, or a server, means a big upfront cost, but you own it forever. Leasing means smaller, ongoing payments and more flexibility to upgrade, but you never build equity in the hardware itself.\n\nThe service models follow a similar idea: IaaS is like leasing an empty apartment \u2014 you get walls and plumbing, but you furnish and maintain everything inside yourself. PaaS is like a furnished apartment \u2014 the basics are handled, you just move in and live. SaaS is like staying in a hotel \u2014 everything is handled for you, you're just using the room.", "keyTerms": ["Cloud computing", "CapEx", "OpEx", "IaaS", "PaaS", "SaaS", "shared responsibility model"], "commonTraps": ["SaaS gives the LEAST control, not the most \u2014 IaaS gives the most control.", "The shift is CapEx to OpEx, not 'free' \u2014 consumption-based pricing still costs money.", "Elasticity is automatic scaling specifically; plain scalability can also be manual."], "scenario": "A small business currently owns three aging physical servers that need replacing every few years. Moving their line-of-business app to an Azure VM (IaaS) removes the hardware purchase entirely, shifting that cost to a monthly bill. If they later decide they don't want to manage patching either, moving that same app to App Service (PaaS) removes that burden too \u2014 at the cost of some control over the underlying environment."}, {"id": "governance-structure", "title": "Governance & Resource Structure", "summary": "Management groups, subscriptions, resource groups, and how policy flows through them.", "diagram": "hierarchy", "vocabIds": ["f12", "f13", "f14", "f15", "f16", "f17", "f18"], "quizIds": ["q12", "sa4", "q18", "msq12"], "reading": "Azure organizes everything you deploy into a hierarchy: management groups sit at the top, containing one or more subscriptions. Each subscription contains resource groups, and each resource group holds the actual resources \u2014 VMs, databases, storage accounts, and so on.\n\nThis hierarchy exists so you can manage things at scale instead of one resource at a time. A policy or access assignment applied at a management group automatically applies to every subscription, resource group, and resource beneath it. That's how a large company can enforce one security rule \u2014 like \"only deploy to US regions\" \u2014 across dozens of subscriptions without configuring it separately in each one.\n\nWithin this structure, Azure Policy enforces configuration rules, while resource locks protect individual resources from being accidentally deleted or changed, regardless of what a user's normal permissions would otherwise allow.", "fundamentalsLabel": "New to org-wide IT policy? See the everyday analogy", "fundamentals": "Think of this the way a company's org chart controls IT policy. If corporate IT sets a password policy at the company level, every department inherits it automatically \u2014 nobody has to configure it division by division. Azure's management group, subscription, resource group, resource hierarchy works the same way: rules set higher up flow down automatically, and you only have to set them once.", "keyTerms": ["management groups", "subscriptions", "resource groups", "Azure Policy", "resource locks"], "commonTraps": ["Deleting a management group does NOT delete the subscriptions inside it.", "A policy at a lower scope can add restrictions, but never loosen what a higher scope already requires.", "A resource group can hold resources from more than one Azure region."], "portalMockup": "resourceGroup", "scenario": "An organization has Dev, Test, and Prod subscriptions, each needing the same \"no deployments outside East US\" rule and the same required tags. Rather than configuring that policy three separate times, an administrator creates a management group containing all three subscriptions and assigns the policy once at that level \u2014 it then applies automatically to every resource group and resource beneath it."}, {"id": "compute-hosting", "title": "Compute & Hosting", "summary": "VMs, containers, Functions, and how Azure keeps them resilient.", "diagram": null, "vocabIds": ["f19", "f20", "f21"], "quizIds": ["q13", "q15", "tf10", "msq13"], "reading": "Azure gives you a spectrum of compute options, trading control for convenience. A virtual machine gives you a full OS you manage yourself \u2014 maximum control, maximum responsibility. Containers package an app with its dependencies, making it more portable and lighter-weight than a full VM. Azure Functions run small pieces of code on demand, with no server to manage at all \u2014 you're billed only for the time your code actually runs.\n\nFor resilience, Azure offers different tools depending on what you're protecting against: an availability set spreads VMs across separate hardware within one datacenter, so a single hardware failure or maintenance window doesn't take everything down at once. A VM Scale Set goes further, automatically adding or removing VM instances based on demand, so you're not paying for capacity you don't need.", "fundamentalsLabel": "New to compute trade-offs? See the everyday analogy", "fundamentals": "This is similar to choosing how much of a meal to cook yourself. A VM is like buying raw ingredients and cooking from scratch \u2014 total control over every detail, but you do all the work. A container is like a meal kit \u2014 the ingredients are pre-measured and prepped, you just do the final cooking. Azure Functions is like ordering delivery \u2014 you specify what you want, and it just appears, with none of the kitchen work on your end.", "keyTerms": ["virtual machine", "Containers", "Azure Functions", "availability set", "VM Scale Set"], "commonTraps": ["Availability sets protect against a single-datacenter failure, not a whole region.", "Scale Sets add and remove instances automatically; availability sets are a fixed, static group.", "Serverless means no server for you to manage \u2014 it's not just 'a smaller server.'"], "portalMockup": "vmSize", "scenario": "A nightly report-generation job runs for about 15 minutes once a day. Running it on a VM that stays on 24/7 would waste money on 23-plus idle hours daily. Running it as an Azure Function instead means paying only for those 15 minutes of actual execution \u2014 a direct payoff of matching the compute model to the workload's real usage pattern."}, {"id": "networking", "title": "Networking", "summary": "VNets, subnets, and connecting Azure back to your own network.", "diagram": "networking", "vocabIds": ["f22", "f23"], "quizIds": ["q14", "tf11", "tf14", "msq14"], "reading": "An Azure Virtual Network, or VNet, is a private network you define in Azure, similar to a network you'd set up in an office. Subnets divide that VNet into smaller segments, similar to how VLANs divide a physical network by department or function.\n\nTo connect that VNet back to an on-premises network, Azure offers two main options. A VPN Gateway creates an encrypted tunnel over the public internet: cheaper and faster to set up, but subject to internet variability. ExpressRoute is a private, dedicated connection that doesn't touch the public internet at all, giving more predictable performance, though notably it isn't encrypted by default the way a VPN connection is.\n\nVNets can also be peered together, letting resources in two separate VNets talk to each other directly \u2014 but that connection isn't transitive, so peering A to B and B to C doesn't automatically let A and C talk.", "fundamentalsLabel": "New to networking? See how this maps to a normal office network", "fundamentals": "If you've configured a small office network, this will feel familiar. A router directs traffic between different parts of your network \u2014 that's essentially what a VNet does automatically in Azure. VLANs that separate, say, guest Wi-Fi from the internal office network are conceptually the same idea as subnets separating parts of a VNet. And connecting two office locations with a site-to-site VPN is exactly the model VPN Gateway follows \u2014 just connecting to Azure instead of another physical office.", "keyTerms": ["Virtual Network", "VNets", "VNet", "Subnets", "VPN Gateway", "ExpressRoute", "peered"], "commonTraps": ["ExpressRoute is private, but NOT encrypted by default \u2014 VPN Gateway is the encrypted one.", "VNet peering isn't transitive: A peered to B and B peered to C doesn't mean A and C can talk.", "A private endpoint gets a private IP \u2014 it is not reachable from the internet."], "portalMockup": "virtualNetwork", "scenario": "A company's finance team sits in one subnet and its public-facing web servers in another, both inside the same VNet, with a rule blocking the finance subnet from being reached externally. When the company opens a second office, they connect it to Azure with a VPN Gateway rather than ExpressRoute, since the link doesn't need dedicated bandwidth \u2014 just a secure connection over their existing internet line."}, {"id": "storage", "title": "Storage", "summary": "Blob, Files, Queue, Table, access tiers, and redundancy.", "diagram": "storage", "vocabIds": ["f24", "f25", "f26", "f27", "f28"], "quizIds": ["q16", "q17", "tf12", "msq15"], "reading": "Azure Storage accounts hold four main types of data: Blob storage for unstructured files like images and backups, Azure Files for SMB or NFS file shares you can mount like a network drive, Queue storage for lightweight messaging between applications, and Table storage for simple key-value data.\n\nWithin Blob storage, access tiers let you balance cost against how quickly you need to retrieve data. Hot tier costs more to store but is fastest and cheapest to access \u2014 good for data you use constantly. Archive tier is the opposite: cheapest to store, but can take hours to retrieve \u2014 good for compliance data you rarely need to touch.\n\nRedundancy options protect that data against hardware and datacenter failure. Locally-redundant storage keeps copies within one datacenter. Zone-redundant storage spreads copies across datacenters within a region. Geo-redundant storage goes further, copying to a second region entirely \u2014 essential if you need to survive a full regional outage.", "fundamentalsLabel": "New to storage tiers? See the everyday analogy", "fundamentals": "Think of storage tiers like a filing system: papers you use every day sit on your desk, the Hot tier, quick to grab, but desk space is expensive. Papers you rarely need go in a storage unit across town, the Archive tier, cheap to keep, but it takes real time to go get them. Redundancy is like keeping copies of important documents: one copy in your desk drawer is fine for a coffee spill, but if your whole office could burn down, you'd want a copy at a friend's house across town too.", "keyTerms": ["Blob storage", "Azure Files", "Queue storage", "Table storage", "access tiers", "Hot tier", "Archive tier", "Locally-redundant storage", "Zone-redundant storage", "Geo-redundant storage"], "commonTraps": ["Archive tier is cheapest to store but can take hours to retrieve \u2014 don't pick it for data you access often.", "ZRS protects against a datacenter failure within a region, not a full region going down \u2014 that needs GRS.", "Plain GRS isn't readable from the secondary region until failover \u2014 RA-GRS is the one you can read from directly."], "portalMockup": "storageAccount", "scenario": "A healthcare provider must keep patient records for seven years for compliance, but almost never opens files older than a year. Storing everything in Hot tier would be needlessly expensive. Moving records older than 12 months to Archive tier with a lifecycle management policy keeps them retrievable within the required window while cutting storage cost dramatically."}, {"id": "identity-security", "title": "Identity & Security", "summary": "Entra ID, RBAC, Conditional Access, and the Zero Trust mindset.", "diagram": "identity", "vocabIds": ["f29", "f30", "f31", "f32", "f33", "f34", "f35", "f36", "f49"], "quizIds": ["q20", "q21", "sa6", "msq16"], "reading": "Microsoft Entra ID, formerly Azure Active Directory, is Azure's identity service \u2014 it manages users, groups, and what they're allowed to access. Two related but different tools control that access: Azure RBAC decides what an identity can do, like \"this user can restart VMs,\" assigned at a scope such as a subscription or resource group. Conditional Access decides under what conditions someone is allowed to sign in at all \u2014 for example, requiring MFA only when someone signs in from an unfamiliar location or an unmanaged device.\n\nZero Trust is the security philosophy underlying a lot of this: never assume trust just because a request came from inside the network. Every request gets verified independently, based on identity, device, and context, regardless of where it's coming from. Defense-in-depth complements this with layered protection \u2014 physical, identity, network, and data layers \u2014 so that a single breach doesn't expose everything.", "fundamentalsLabel": "New to identity and access concepts? See the everyday analogy", "fundamentals": "In a traditional office, security might mean a badge to get in the front door, plus a separate key for the server room, plus a password for the file server. Each layer is a separate checkpoint, and getting through one doesn't automatically get you through the next \u2014 that's defense-in-depth. Conditional Access is like a smart badge reader that also checks the time of day and whether it recognizes your device, not just whether you have a valid badge. RBAC is simpler: it's just the list of which doors your badge actually opens.", "keyTerms": ["Microsoft Entra ID", "Azure RBAC", "Conditional Access", "MFA", "Zero Trust", "Defense-in-depth"], "commonTraps": ["RBAC is what you can do. Conditional Access is under what conditions you can sign in at all \u2014 different jobs.", "Zero Trust means never trusting a request just because it's inside the network perimeter.", "MFA and passwordless aren't the same thing \u2014 passwordless doesn't use a password at all."], "portalMockup": "roleAssignment", "scenario": "An IT team grants a support technician Contributor access to a single resource group, so they can restart VMs there but nowhere else. Separately, they set up a Conditional Access policy requiring MFA whenever anyone signs in from outside the corporate network. Together, RBAC controls what the technician can touch, and Conditional Access controls the circumstances under which they're allowed in at all."}, {"id": "cost-policy-monitoring", "title": "Cost, Policy & Monitoring", "summary": "Keeping an environment compliant, affordable, and healthy day to day.", "diagram": null, "vocabIds": ["f37", "f38", "f39", "f40", "f41", "f42", "f43", "f44", "f45", "f46", "f47", "f48"], "quizIds": ["q27", "q28", "q33", "msq17"], "reading": "Managing an Azure environment day to day means keeping an eye on cost, compliance, and health. Azure Policy enforces configuration rules, like requiring a specific region, and can even block a deployment outright if it doesn't comply. Resource locks add a separate layer of protection on individual resources, preventing accidental deletion or changes regardless of a user's normal permissions.\n\nFor cost, the Pricing calculator estimates what planned resources will cost, while the Total Cost of Ownership calculator compares an entire on-premises setup against running it in Azure. Tags make it possible to break spending down by department or project in Cost Management. Azure Advisor rounds this out with free, personalized recommendations across cost, security, reliability, and performance.\n\nFor health, Azure Monitor tracks your own resources \u2014 metrics, logs, and alerts \u2014 while Azure Service Health specifically reports on the health of the Azure platform itself, like a regional outage that isn't your fault at all.", "fundamentalsLabel": "New to ongoing cloud operations? See the everyday analogy", "fundamentals": "This is the operational side of running any environment, cloud or not. Tags are like labeling supply closets by department so accounting knows who to bill. Azure Advisor is like a building inspector who walks through and flags things worth fixing, even though nothing's actively broken yet. And the Service Health versus Monitor distinction is the same as knowing whether the power went out because of your building's own wiring, or because the whole city grid went down \u2014 one you can fix yourself, the other you just have to wait out.", "keyTerms": ["Azure Policy", "Resource locks", "Pricing calculator", "Total Cost of Ownership calculator", "Tags", "Cost Management", "Azure Advisor", "Azure Monitor", "Azure Service Health"], "commonTraps": ["A Delete lock blocks deletion only \u2014 a Read-only lock is the one that also blocks modification.", "Azure Service Health means Azure itself is having a problem. Azure Monitor means your own resources are.", "Azure Advisor is free \u2014 it's not a paid add-on."], "scenario": "A finance team notices unexpected spend in one department's subscription. Because every resource there was tagged with a CostCenter value at creation, Cost Management can break the bill down by tag and pinpoint exactly which team is responsible \u2014 while Azure Advisor separately flags a handful of unused disks in that same subscription quietly adding to the bill."}]}, "az104": {"categories": [{"key": "identityGov", "label": "Identity & Governance", "marks": 24}, {"key": "storage", "label": "Storage", "marks": 19}, {"key": "compute", "label": "Compute", "marks": 24}, {"key": "networking", "label": "Networking", "marks": 19}, {"key": "monitoring", "label": "Monitor & Maintain", "marks": 14}], "flashcards": [{"id": "f1", "cat": "identityGov", "front": "Entra ID users and groups", "back": "Creating and managing users, security groups, and Microsoft 365 groups. Dynamic group membership rules automatically add or remove members based on user or device attributes.", "detail": "A dynamic group for every user whose department is \"Sales\" updates itself automatically as people move in and out."}, {"id": "f2", "cat": "identityGov", "front": "Group-based licensing", "back": "Assigning a license to a group instead of individual users, so every current and future member automatically receives (or loses) that license.", "detail": "This is why new employees added to an \"All Staff\" group can get licensed automatically without a manual step."}, {"id": "f3", "cat": "identityGov", "front": "External users (B2B)", "back": "Inviting people from outside your organization as guests, who authenticate with their own existing identity rather than a new account you create for them.", "detail": "External collaboration settings control who can invite guests and what guests can see once invited."}, {"id": "f4", "cat": "identityGov", "front": "Self-service password reset (SSPR)", "back": "Lets users reset their own forgotten password without contacting the help desk, after registering authentication methods like a phone number or authenticator app.", "detail": "This is the direct answer whenever a scenario is about reducing help desk password-reset tickets."}, {"id": "f5", "cat": "identityGov", "front": "RBAC scope and inheritance", "back": "A role is assigned to a security principal at a scope \u2014 management group, subscription, resource group, or resource. Assignments are additive, and the most permissive applicable assignment wins.", "detail": "If someone has Reader at the subscription and Contributor at one resource group, they have Contributor there and Reader everywhere else in that subscription."}, {"id": "f6", "cat": "identityGov", "front": "Owner vs. Contributor vs. Reader vs. User Access Administrator", "back": "Owner: full access, plus can assign roles to others. Contributor: full access to manage resources, but cannot assign roles. Reader: view-only. User Access Administrator: manage others' access without managing the resources themselves.", "detail": "The Owner-vs-Contributor distinction (can they grant access to others?) is one of the most commonly tested RBAC facts."}, {"id": "f7", "cat": "identityGov", "front": "Policy vs. initiative", "back": "A policy is a single rule, like requiring a specific region. An initiative groups multiple related policies together so they can be assigned as one bundle, useful for compliance standards.", "detail": "Think of an initiative as a policy 'playlist' \u2014 several individual rules assigned together."}, {"id": "f8", "cat": "identityGov", "front": "Governance recap at admin depth", "back": "As an administrator you directly create and move resources between resource groups, and troubleshoot conflicts between inherited policy and RBAC assignments from higher scopes.", "detail": "AZ-104 expects you to reason about real conflicts, not just define the terms the way AZ-900 does."}, {"id": "f9", "cat": "identityGov", "front": "Cost Management and budgets", "back": "Set spending budgets with alert thresholds, and use Cost Analysis to break down spend by resource, tag, or service over time.", "detail": "A budget alert doesn't stop spending by itself \u2014 it just notifies; stopping spend requires a separate automated action."}, {"id": "f10", "cat": "storage", "front": "Storage account types and performance tiers", "back": "General-purpose v2 is the standard account type for most scenarios. Performance tiers are Standard (HDD-backed, cost-effective) and Premium (SSD-backed, for high-throughput, low-latency needs like disks).", "detail": "Premium is the answer whenever a scenario stresses low latency or high transaction rates."}, {"id": "f11", "cat": "storage", "front": "Access keys vs. Shared Access Signature (SAS)", "back": "Access keys grant full, unrestricted access to the entire storage account. A SAS grants limited, time-boxed, scoped access to specific resources or operations, without exposing the account key.", "detail": "Whenever a scenario wants to share limited, temporary access with a third party, the answer is SAS, not an access key."}, {"id": "f12", "cat": "storage", "front": "Storage firewalls and network rules", "back": "Restrict a storage account to specific virtual networks or IP address ranges, or allow trusted Microsoft services to bypass the firewall.", "detail": "This is a network-level control, separate from identity-based access like RBAC or a SAS token."}, {"id": "f13", "cat": "storage", "front": "Blob lifecycle management", "back": "Rules that automatically transition blobs between access tiers, like Hot to Cool to Archive, or delete them after a set number of days, based on last-modified or last-accessed time.", "detail": "This is the automation answer whenever a scenario wants aging data to move to cheaper storage without manual intervention."}, {"id": "f14", "cat": "storage", "front": "Blob versioning vs. soft delete vs. snapshots", "back": "Versioning automatically keeps prior versions when a blob is overwritten. Soft delete lets you recover a deleted blob within a retention window. A snapshot is a manual, read-only copy taken at a specific point in time.", "detail": "Recovering an accidentally overwritten blob's prior content specifically calls for versioning, not soft delete."}, {"id": "f15", "cat": "storage", "front": "Azure Files vs. Blob storage", "back": "Azure Files provides SMB or NFS file shares that can be mounted like a network drive. Blob storage holds unstructured object data accessed through REST or an SDK, not mounted as a drive.", "detail": "If a scenario needs multiple VMs to mount and share the same drive, that's Azure Files, not Blob storage."}, {"id": "f16", "cat": "storage", "front": "Redundancy at admin depth: RA-GRS", "back": "GRS replicates to a secondary region, but that data isn't readable during normal operation. RA-GRS (and RA-GZRS) additionally allow read access to the secondary region even before a failover.", "detail": "If a scenario needs to actually read from the secondary region during normal operation, plain GRS isn't enough \u2014 it needs the read-access variant."}, {"id": "f17", "cat": "storage", "front": "Static website hosting", "back": "A storage account can serve static website content, like HTML/CSS/JS, directly from Blob storage using a special $web container, without a separate web server.", "detail": "This is the low-cost, serverless answer for hosting a purely static site."}, {"id": "f18", "cat": "storage", "front": "Migration and transfer tools recap", "back": "AzCopy, Azure Storage Explorer, and Azure Migrate/Data Box, first introduced at the AZ-900 level, remain the core tools an administrator configures and runs for moving data into storage accounts.", "detail": "AZ-104 expects you to actually configure and troubleshoot these tools, not just recognize their names."}, {"id": "f19", "cat": "compute", "front": "VM sizing and series", "back": "VM size determines CPU, memory, and disk throughput. Series (like B, D, F) are optimized for different workloads: B for burstable/low-cost, D for general purpose, F for compute-optimized.", "detail": "A burstable B-series VM is cheap but throttles sustained high CPU use \u2014 the wrong choice for a constantly busy server."}, {"id": "f20", "cat": "compute", "front": "Managed disks and disk types", "back": "Managed disks are Azure-managed storage for a VM's OS or data, offered as Standard HDD, Standard SSD, Premium SSD, and Ultra Disk, from lowest to highest performance.", "detail": "Ultra Disk allows configuring throughput and IOPS independently of disk size, for the most demanding workloads."}, {"id": "f21", "cat": "compute", "front": "Availability sets vs. zones vs. Scale Sets", "back": "Availability set: distributes VMs across fault and update domains within one datacenter. Availability zone: spreads VMs across physically separate datacenters in a region. Scale Set: automatically adds or removes VM instances based on demand.", "detail": "Only availability zones protect against a whole-datacenter failure \u2014 availability sets only spread risk within one."}, {"id": "f22", "cat": "compute", "front": "VM extensions and Custom Script Extension", "back": "Small agents installed on a VM to perform post-deployment configuration tasks, like the Custom Script Extension automatically running a script right after provisioning.", "detail": "This is the answer whenever a scenario wants configuration to happen automatically without manually logging into the VM."}, {"id": "f23", "cat": "compute", "front": "App Service plans and scaling", "back": "An App Service plan defines the compute tier and region for one or more web apps. Scaling up changes the plan's tier or size; scaling out adds more instances of the same tier.", "detail": "Scale up = bigger box. Scale out = more boxes. Both are configured on the App Service plan, not the individual app."}, {"id": "f24", "cat": "compute", "front": "Deployment slots", "back": "Separate, swappable environments, like staging, for an App Service app, letting you validate a new version before swapping it into production with minimal downtime.", "detail": "A swap exchanges the URLs/configuration between slots almost instantly, rather than redeploying code."}, {"id": "f25", "cat": "compute", "front": "Container Instances vs. Container Apps vs. AKS", "back": "Container Instances run a single container quickly with no orchestration. Container Apps add serverless scaling and microservices features without managing a cluster. AKS gives full Kubernetes control.", "detail": "As of the 2026 exam update, Container Apps sits alongside Container Instances as tested content, not just AKS."}, {"id": "f26", "cat": "compute", "front": "ARM templates vs. Bicep", "back": "ARM templates are Azure's native JSON Infrastructure as Code format. Bicep is a newer, more concise language that compiles down to ARM JSON \u2014 functionally equivalent, but easier to read and write.", "detail": "The 2026 exam update put more emphasis on Bicep over raw ARM JSON, reflecting real-world administrator practice."}, {"id": "f27", "cat": "compute", "front": "Resizing and moving VMs", "back": "Resizing a running VM to a size unavailable on its current hardware cluster typically requires deallocating (stopping) the VM first, then resizing.", "detail": "This trips people up because 'stopped' in the portal isn't the same as 'deallocated' \u2014 only deallocated VMs release their hardware allocation."}, {"id": "f28", "cat": "networking", "front": "VNets and subnets at admin depth", "back": "As an administrator you create and size VNets and subnets, considering IP address space (CIDR) and the fact that Azure reserves 5 addresses in every subnet regardless of its size.", "detail": "That reserved-address detail is a specific number the exam likes to test directly."}, {"id": "f29", "cat": "networking", "front": "Network Security Groups (NSGs)", "back": "Filter inbound and outbound traffic to subnets or network interfaces using security rules with a priority, source, destination, port, and protocol. Lower priority number wins and is evaluated first.", "detail": "A lower-numbered rule that allows traffic can still be overridden by an even-lower-numbered rule that denies it."}, {"id": "f30", "cat": "networking", "front": "VNet peering", "back": "Connects two VNets directly, even across regions, with traffic staying on the Microsoft backbone. Peering is not transitive \u2014 peered VNets don't automatically reach each other's other peers.", "detail": "If A is peered to B, and B is peered to C, A and C still cannot talk to each other without their own direct peering."}, {"id": "f31", "cat": "networking", "front": "Load Balancer vs. Application Gateway", "back": "Azure Load Balancer works at layer 4 (TCP/UDP), distributing traffic by IP and port only. Application Gateway works at layer 7 (HTTP/HTTPS), and can route by URL path and terminate SSL centrally.", "detail": "If a scenario needs to route by URL path, like /images vs /api, that's Application Gateway, not Load Balancer."}, {"id": "f32", "cat": "networking", "front": "Public vs. internal Load Balancer", "back": "A public Load Balancer distributes internet traffic to backend resources. An internal (private) Load Balancer only distributes traffic within a VNet, never from the public internet.", "detail": "An internal Load Balancer is the answer when a scenario needs load balancing purely between internal tiers, like web servers talking to app servers."}, {"id": "f33", "cat": "networking", "front": "Azure DNS and private DNS zones", "back": "Azure DNS hosts public DNS zones, resolvable from the internet. Private DNS zones provide name resolution within one or more VNets, without exposing those records publicly.", "detail": "Private DNS zones are the answer whenever internal name resolution shouldn't be visible outside the VNet."}, {"id": "f34", "cat": "networking", "front": "Network Watcher", "back": "A suite of tools for monitoring and diagnosing network issues in Azure, including packet capture, IP flow verify (is a rule blocking traffic?), and connection troubleshoot.", "detail": "IP flow verify specifically tells you whether an NSG rule is allowing or denying a particular flow of traffic."}, {"id": "f35", "cat": "networking", "front": "Azure Bastion", "back": "Provides secure RDP or SSH access to VMs directly through the Azure portal, without exposing the VM's public IP or needing a separate VPN connection.", "detail": "This is the answer whenever a scenario wants secure remote access to a VM without giving that VM a public IP."}, {"id": "f36", "cat": "networking", "front": "VPN Gateway vs. ExpressRoute, admin depth", "back": "VPN Gateway is encrypted and travels over the public internet. ExpressRoute is private but not encrypted by default. Administrators configure gateway SKUs and connection types, like site-to-site or point-to-site.", "detail": "Point-to-site connects an individual device to a VNet; site-to-site connects two whole networks together."}, {"id": "f37", "cat": "monitoring", "front": "Azure Monitor metrics vs. logs", "back": "Metrics are lightweight numerical time-series data, like CPU percentage. Logs are detailed, queryable event and record data stored in a Log Analytics workspace.", "detail": "Metrics answer 'how much' over time. Logs answer 'exactly what happened' with detail you can query."}, {"id": "f38", "cat": "monitoring", "front": "Alerts and action groups", "back": "An alert rule triggers when a metric or log condition is met. An action group defines what happens next, like sending an email, an SMS, or running an Azure Function.", "detail": "The alert rule is the trigger condition; the action group is the response \u2014 they're configured separately and linked together."}, {"id": "f39", "cat": "monitoring", "front": "Recovery Services vault and backup policies", "back": "A Recovery Services vault stores backup data and manages backup policies, which define how often backups run and how long they're retained.", "detail": "One vault can hold backup policies for multiple resource types, like VMs and file shares."}, {"id": "f40", "cat": "monitoring", "front": "Azure Site Recovery", "back": "Replicates VMs to a secondary region for disaster recovery, enabling a failover of an entire workload if the primary region becomes unavailable.", "detail": "Backup restores a point-in-time copy. Site Recovery fails over a running workload to keep it operating elsewhere."}, {"id": "f41", "cat": "monitoring", "front": "Log Analytics workspace and KQL", "back": "A Log Analytics workspace collects log data from multiple resources. Kusto Query Language (KQL) is used to query that data for troubleshooting and reporting.", "detail": "KQL is the specific query language name the exam expects you to recognize, even without writing complex queries yourself."}, {"id": "f42", "cat": "monitoring", "front": "Backup vs. Site Recovery, when to use each", "back": "Backup protects against data loss, restoring a VM or file to a point in time. Site Recovery protects against a broader outage, failing over a whole workload to a secondary region.", "detail": "A corrupted disk calls for Backup. A whole region going dark calls for Site Recovery."}], "questions": [{"id": "q1", "cat": "identityGov", "type": "mc", "question": "An administrator wants a group's membership to automatically include every user whose department attribute is 'Sales,' without manually adding people.", "options": ["A dynamic group with a membership rule based on the department attribute", "A security group with manual membership", "A Microsoft 365 group with no rules", "A resource group scoped to Sales"], "correct": 0, "explanation": "Dynamic groups automatically add or remove members based on rules matching attributes like department."}, {"id": "q2", "cat": "identityGov", "type": "mc", "question": "A company wants new employees to automatically receive a Microsoft 365 E3 license the moment they're added to the 'All Employees' group.", "options": ["Group-based licensing", "Self-service password reset", "A dynamic group with no license attached", "An RBAC role assignment"], "correct": 0, "explanation": "Group-based licensing assigns a license to a group so every member automatically receives it."}, {"id": "q3", "cat": "identityGov", "type": "mc", "question": "A contractor from a partner company needs temporary access to one SharePoint site, without your organization creating them a full internal account.", "options": ["Invite them as a B2B external/guest user", "Create them a standard internal user account", "Assign them the Owner role at the subscription", "Add them to a dynamic group"], "correct": 0, "explanation": "External/guest users authenticate with their own existing identity rather than needing a new internal account."}, {"id": "q4", "cat": "identityGov", "type": "mc", "question": "A user forgot their password at 2am and needs to get back into their account without contacting the help desk.", "options": ["Self-service password reset (SSPR)", "Conditional Access", "A dynamic group", "An RBAC role assignment"], "correct": 0, "explanation": "SSPR lets users reset their own password using pre-registered authentication methods, no help desk required."}, {"id": "q5", "cat": "identityGov", "type": "mc", "question": "A user is assigned Contributor at the subscription level and Owner at one specific resource group within it. What's their effective permission in that resource group?", "options": ["Owner", "Contributor", "Reader", "Access is denied due to a role conflict"], "correct": 0, "explanation": "RBAC assignments are additive across scopes, and the more permissive assignment applies \u2014 Owner at that resource group wins there."}, {"id": "q6", "cat": "identityGov", "type": "mc", "question": "Which built-in role lets someone manage who has access to resources, without letting them manage the resources themselves?", "options": ["User Access Administrator", "Contributor", "Reader", "Owner"], "correct": 0, "explanation": "User Access Administrator is specifically scoped to managing access, not the resources themselves."}, {"id": "q7", "cat": "identityGov", "type": "mc", "question": "A company wants to enforce a tagging standard requiring both a CostCenter tag and an Environment tag, assigned together as a single bundle.", "options": ["An Azure Policy initiative", "A single Azure Policy definition", "An RBAC custom role", "A management group with no policies"], "correct": 0, "explanation": "An initiative groups multiple related policy definitions so they can be assigned together as one bundle."}, {"id": "q8", "cat": "identityGov", "type": "mc", "question": "An administrator assigns Reader at a management group and Contributor at a specific subscription beneath it. What's the effective access in that subscription?", "options": ["Contributor", "Reader", "No access", "Owner"], "correct": 0, "explanation": "The more specific, more permissive assignment at the subscription level applies there, on top of the inherited Reader."}, {"id": "q9", "cat": "storage", "type": "mc", "question": "A company needs to grant a third-party app 24-hour, read-only access to a single blob container, without sharing the storage account key.", "options": ["A Shared Access Signature (SAS)", "The storage account access key", "A Read-only resource lock", "A Conditional Access policy"], "correct": 0, "explanation": "A SAS grants limited, time-boxed, scoped access without exposing the account's full access key."}, {"id": "q10", "cat": "storage", "type": "mc", "question": "A storage account should automatically move blobs to Cool tier after 30 days of no access, then delete them after 365 days.", "options": ["A lifecycle management policy", "A resource lock", "Blob versioning", "A SAS token"], "correct": 0, "explanation": "Lifecycle management policies automate tier transitions and deletion based on rules like age or last access."}, {"id": "q11", "cat": "storage", "type": "mc", "question": "A team accidentally overwrote a blob and needs to recover its previous content, without having taken a manual backup beforehand.", "options": ["Blob versioning, if it was enabled", "A storage account access key", "A resource lock", "Static website hosting"], "correct": 0, "explanation": "Versioning automatically retains prior versions of a blob on overwrite, letting you recover earlier content."}, {"id": "q12", "cat": "storage", "type": "mc", "question": "Which storage redundancy option allows an application to directly read from the secondary region during normal operation, not just after a failover?", "options": ["RA-GRS (Read-Access Geo-Redundant Storage)", "LRS", "ZRS", "Plain GRS"], "correct": 0, "explanation": "Plain GRS replicates to a secondary region but doesn't allow reads there until failover \u2014 RA-GRS specifically adds read access to the secondary."}, {"id": "q13", "cat": "storage", "type": "mc", "question": "A team wants to mount a shared drive from Azure that multiple VMs can read and write to simultaneously over SMB.", "options": ["Azure Files", "Blob storage", "Table storage", "Queue storage"], "correct": 0, "explanation": "Azure Files provides SMB/NFS file shares that can be mounted like a network drive across multiple machines."}, {"id": "q14", "cat": "storage", "type": "mc", "question": "A storage account should reject all traffic except from two specific corporate office IP ranges and one specific VNet.", "options": ["A storage account firewall / network rule configuration", "A resource lock", "Blob lifecycle management", "A SAS token alone"], "correct": 0, "explanation": "Storage account firewall and network rules restrict access to specific networks or IP ranges at the network level."}, {"id": "q15", "cat": "storage", "type": "mc", "question": "Which storage tier is required for a VM's OS disk if you need consistent, ultra-low-latency performance for a high-transaction database?", "options": ["Premium SSD or Ultra Disk", "Standard HDD", "Cool tier blob storage", "Archive tier blob storage"], "correct": 0, "explanation": "Premium SSD and Ultra Disk are the performance tiers designed for low-latency, high-throughput workloads."}, {"id": "q16", "cat": "compute", "type": "mc", "question": "A company wants a group of identical VMs that automatically add or remove instances based on CPU load.", "options": ["A VM Scale Set", "An availability set", "A single large VM", "Azure Virtual Desktop"], "correct": 0, "explanation": "VM Scale Sets automatically adjust instance count based on demand or a schedule."}, {"id": "q17", "cat": "compute", "type": "mc", "question": "An administrator needs to run a one-time configuration script on a VM immediately after it's provisioned, without manually logging in.", "options": ["The Custom Script Extension", "An availability set", "A managed disk", "An App Service plan"], "correct": 0, "explanation": "VM extensions like the Custom Script Extension run configuration tasks automatically right after deployment."}, {"id": "q18", "cat": "compute", "type": "mc", "question": "A team wants to test a new version of a web app in production-like conditions before it goes live, then switch traffic to it with minimal downtime.", "options": ["Deployment slots", "A VM Scale Set", "A new App Service plan for every version", "A resource lock"], "correct": 0, "explanation": "Deployment slots provide a separate environment to validate a new version before swapping it into production."}, {"id": "q19", "cat": "compute", "type": "mc", "question": "Which compute option requires the least management overhead for running a single container with no orchestration needs?", "options": ["Azure Container Instances", "Azure Kubernetes Service (AKS)", "A virtual machine running Docker manually", "A VM Scale Set"], "correct": 0, "explanation": "Container Instances run a single container quickly with no cluster or orchestration to manage."}, {"id": "q20", "cat": "compute", "type": "mc", "question": "A company wants microservices-style container scaling with built-in HTTP-based autoscaling, without managing a Kubernetes cluster directly.", "options": ["Azure Container Apps", "Azure Container Instances", "Azure Kubernetes Service (AKS)", "An App Service plan alone"], "correct": 0, "explanation": "Container Apps adds serverless scaling and microservices features on top of containers, without exposing the underlying cluster."}, {"id": "q21", "cat": "compute", "type": "mc", "question": "An administrator wants to redeploy the exact same infrastructure to three environments, using a more concise, readable syntax than raw ARM JSON.", "options": ["Bicep", "A PowerShell script with no template", "The Azure portal, repeated manually", "A resource lock"], "correct": 0, "explanation": "Bicep compiles down to ARM JSON but is written in a more concise, readable syntax."}, {"id": "q22", "cat": "compute", "type": "mc", "question": "An administrator tries to resize a running VM to a size unavailable on its current hardware cluster. What's the most likely required step?", "options": ["Deallocate (stop) the VM first, then resize", "Delete and recreate the VM from scratch", "Nothing, resizing always works while running", "Move the VM to a different subscription"], "correct": 0, "explanation": "A VM may need to be deallocated before resizing if the target size isn't available on its current hardware cluster."}, {"id": "q23", "cat": "compute", "type": "mc", "question": "Which disk tier offers the highest, most consistent IOPS a
