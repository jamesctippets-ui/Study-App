nd throughput, configurable independently of the disk's size?", "options": ["Ultra Disk", "Standard HDD", "Standard SSD", "Cool tier storage"], "correct": 0, "explanation": "Ultra Disk allows configuring performance (IOPS and throughput) independently of the disk size, for the most demanding workloads."}, {"id": "q24", "cat": "networking", "type": "mc", "question": "Two NSG rules apply to the same NIC: one at priority 100 allowing inbound port 443, another at priority 200 denying all inbound traffic. What happens to inbound HTTPS traffic?", "options": ["It's allowed, since the lower priority number is processed first", "It's denied, since deny rules always win", "It's allowed only half the time", "NSG rules cannot conflict like this"], "correct": 0, "explanation": "Lower priority numbers are evaluated first and win \u2014 priority 100 (allow) is processed before priority 200 (deny)."}, {"id": "q25", "cat": "networking", "type": "mc", "question": "Two VNets are peered, and one of those VNets is also peered to a third VNet. Can the first and third VNets communicate directly?", "options": ["No, VNet peering is not transitive", "Yes, peering always extends transitively", "Only if they're in the same region", "Only if a VPN Gateway is also configured"], "correct": 0, "explanation": "Peering is not transitive \u2014 the first and third VNets would need their own direct peering to communicate."}, {"id": "q26", "cat": "networking", "type": "mc", "question": "A company needs to distribute HTTPS traffic based on URL path (/images to one backend, /api to another) and terminate SSL centrally.", "options": ["Application Gateway", "Azure Load Balancer", "VNet peering", "Network Watcher"], "correct": 0, "explanation": "Application Gateway operates at layer 7 and can route by URL path while terminating SSL centrally \u2014 Load Balancer cannot."}, {"id": "q27", "cat": "networking", "type": "mc", "question": "A company needs to load-balance raw TCP traffic to backend VMs based on IP and port only, with no awareness of HTTP content.", "options": ["Azure Load Balancer", "Application Gateway", "Azure DNS", "Azure Bastion"], "correct": 0, "explanation": "Load Balancer works at layer 4, distributing TCP/UDP traffic by IP and port with no content awareness."}, {"id": "q28", "cat": "networking", "type": "mc", "question": "An application inside a VNet needs to resolve a custom domain name to an internal resource, without that name being resolvable from the public internet.", "options": ["An Azure private DNS zone", "Azure public DNS", "Azure Bastion", "A public Load Balancer"], "correct": 0, "explanation": "Private DNS zones provide name resolution within a VNet without exposing those records publicly."}, {"id": "q29", "cat": "networking", "type": "mc", "question": "An administrator needs to securely RDP into a VM from the portal without exposing a public IP on that VM or setting up a VPN.", "options": ["Azure Bastion", "VPN Gateway", "ExpressRoute", "A public Load Balancer"], "correct": 0, "explanation": "Azure Bastion provides secure RDP/SSH through the portal without a public IP on the VM or a separate VPN."}, {"id": "q30", "cat": "networking", "type": "mc", "question": "A connectivity issue between two VMs needs diagnosing \u2014 specifically, whether an NSG rule is blocking the traffic path.", "options": ["Network Watcher's IP flow verify", "Azure Advisor", "Azure Policy", "A resource lock"], "correct": 0, "explanation": "Network Watcher's IP flow verify tool specifically checks whether an NSG rule allows or denies a given traffic flow."}, {"id": "q31", "cat": "networking", "type": "mc", "question": "How many IP addresses does Azure reserve in every subnet, regardless of its size?", "options": ["5", "2", "10", "0"], "correct": 0, "explanation": "Azure reserves 5 addresses in every subnet for internal use, regardless of the subnet's overall size."}, {"id": "q32", "cat": "networking", "type": "mc", "question": "A company wants load balancing purely between internal application tiers, with no exposure to the public internet at all.", "options": ["An internal (private) Load Balancer", "A public Load Balancer", "Application Gateway with a public IP", "Azure Front Door"], "correct": 0, "explanation": "An internal Load Balancer only distributes traffic within a VNet, never from the public internet."}, {"id": "q33", "cat": "monitoring", "type": "mc", "question": "An administrator wants to be notified by email and automatically trigger a runbook when a VM's CPU exceeds 90% for 10 minutes.", "options": ["An alert rule paired with an action group", "Azure Advisor alone", "A resource lock", "Network Watcher"], "correct": 0, "explanation": "The alert rule defines the trigger condition; the action group defines the response, like sending an email or running automation."}, {"id": "q34", "cat": "monitoring", "type": "mc", "question": "Which Azure Monitor data type would you query with KQL to investigate a detailed sequence of application errors over the last week?", "options": ["Logs, via Log Analytics", "Metrics", "Azure Advisor recommendations", "Azure Service Health"], "correct": 0, "explanation": "Logs hold detailed, queryable event data; metrics are lightweight numerical time-series data, not detailed event sequences."}, {"id": "q35", "cat": "monitoring", "type": "mc", "question": "A company wants to be able to fail over an entire application's VMs to a secondary region if the primary region goes down entirely.", "options": ["Azure Site Recovery", "Azure Backup alone", "A resource lock", "Azure Advisor"], "correct": 0, "explanation": "Site Recovery replicates and fails over whole workloads to a secondary region, unlike Backup, which restores point-in-time copies."}, {"id": "q36", "cat": "monitoring", "type": "mc", "question": "A VM's disk was corrupted by a bad update yesterday. Which service would restore it to a point before the update?", "options": ["Azure Backup, via a Recovery Services vault", "Azure Site Recovery", "Network Watcher", "Azure Advisor"], "correct": 0, "explanation": "Backup restores a resource to an earlier point-in-time state \u2014 Site Recovery is for regional failover, not point-in-time restores."}, {"id": "tf1", "cat": "identityGov", "type": "tf", "question": "RBAC role assignments are inherited from a higher scope down to lower scopes.", "answer": true, "explanation": "A role assigned at, say, a subscription applies to every resource group and resource beneath it, unless a more specific assignment changes things."}, {"id": "tf2", "cat": "identityGov", "type": "tf", "question": "A user can have RBAC permissions assigned directly at a single resource, even with no role assigned at the subscription level.", "answer": true, "explanation": "RBAC can be assigned at any scope independently \u2014 a resource-level assignment doesn't require a subscription-level one first."}, {"id": "tf3", "cat": "identityGov", "type": "tf", "question": "An Azure Policy initiative is just a single, standalone policy definition.", "answer": false, "explanation": "An initiative is a group of related policy definitions assigned together, not a single standalone policy."}, {"id": "tf4", "cat": "storage", "type": "tf", "question": "Read-access geo-redundant storage (RA-GRS) allows reading data from the secondary region even when the primary is fully available.", "answer": true, "explanation": "That's exactly what distinguishes RA-GRS from plain GRS, which only makes the secondary readable after a failover."}, {"id": "tf5", "cat": "storage", "type": "tf", "question": "Soft delete alone guarantees recovery of a blob's exact content after it has been overwritten by a new upload.", "answer": false, "explanation": "Soft delete protects against deletion. Recovering prior content after an overwrite specifically requires blob versioning."}, {"id": "tf6", "cat": "storage", "type": "tf", "question": "A Shared Access Signature (SAS) can grant access without ever sharing the storage account's access keys.", "answer": true, "explanation": "A SAS is a separate, scoped, time-limited credential that doesn't expose the underlying account key."}, {"id": "tf7", "cat": "compute", "type": "tf", "question": "An Azure VM Scale Set can only scale based on a fixed schedule, not real-time metrics like CPU.", "answer": false, "explanation": "Scale Sets can autoscale based on both real-time metrics, like CPU, and fixed schedules."}, {"id": "tf8", "cat": "compute", "type": "tf", "question": "Bicep files compile down to ARM JSON templates before deployment.", "answer": true, "explanation": "Bicep is a more concise authoring language that compiles to the same underlying ARM JSON format."}, {"id": "tf9", "cat": "compute", "type": "tf", "question": "Azure Container Instances provide built-in Kubernetes-style orchestration across multiple containers.", "answer": false, "explanation": "That's AKS. Container Instances run standalone containers with no orchestration layer."}, {"id": "tf10", "cat": "networking", "type": "tf", "question": "VNet peering allows transitive routing between all peered VNets automatically.", "answer": false, "explanation": "Peering is not transitive \u2014 each pair of VNets that needs to communicate must be peered directly."}, {"id": "tf11", "cat": "networking", "type": "tf", "question": "An internal (private) Load Balancer can distribute traffic originating from the public internet.", "answer": false, "explanation": "An internal Load Balancer only distributes traffic within a VNet, never from the public internet."}, {"id": "tf12", "cat": "networking", "type": "tf", "question": "Azure Bastion eliminates the need to expose a VM's public IP for RDP or SSH access.", "answer": true, "explanation": "Bastion provides secure access through the portal without the VM itself needing a public IP."}, {"id": "sa1", "cat": "identityGov", "type": "sa", "question": "Explain the difference between the built-in Contributor role and the built-in Owner role.", "modelAnswer": "Both can fully manage resources, but only Owner can also assign roles to other users. Contributor cannot grant or change access permissions for others."}, {"id": "sa2", "cat": "identityGov", "type": "sa", "question": "What's the difference between a security group and a dynamic group in Entra ID?", "modelAnswer": "A security group has manually managed membership. A dynamic group automatically adds or removes members based on rules matching user or device attributes, like department or job title."}, {"id": "sa3", "cat": "storage", "type": "sa", "question": "Explain the difference between a storage account access key and a Shared Access Signature (SAS).", "modelAnswer": "An access key grants full, unrestricted access to the entire storage account. A SAS grants limited, time-boxed access to specific resources or operations, without exposing the account key itself."}, {"id": "sa4", "cat": "storage", "type": "sa", "question": "Describe what a lifecycle management policy does for a storage account.", "modelAnswer": "It automatically moves blobs between access tiers, like Hot to Cool to Archive, or deletes them after a set period, based on rules like age or last access time, without manual intervention."}, {"id": "sa5", "cat": "compute", "type": "sa", "question": "Explain the difference between an availability set and an availability zone.", "modelAnswer": "An availability set distributes VMs across fault and update domains within a single datacenter. An availability zone spreads VMs across physically separate datacenters within a region, offering stronger protection against a full datacenter failure."}, {"id": "sa6", "cat": "compute", "type": "sa", "question": "What are deployment slots used for in Azure App Service?", "modelAnswer": "They provide separate, swappable environments, like staging, where a new version of an app can be validated before being swapped into production, minimizing downtime and risk."}, {"id": "sa7", "cat": "networking", "type": "sa", "question": "Explain the difference between Azure Load Balancer and Application Gateway.", "modelAnswer": "Load Balancer operates at layer 4, distributing TCP/UDP traffic by IP and port with no awareness of content. Application Gateway operates at layer 7, and can route HTTP/HTTPS traffic based on URL path and terminate SSL."}, {"id": "sa8", "cat": "monitoring", "type": "sa", "question": "Explain the difference between Azure Backup and Azure Site Recovery.", "modelAnswer": "Backup protects against data loss, letting you restore a VM or file to an earlier point in time. Site Recovery protects against a broader outage, like a full region going down, by replicating and failing over an entire workload to a secondary region."}], "lessons": [{"id": "identities-access", "title": "Identities & Access", "summary": "Users, groups, licensing, external users, and self-service password reset.", "diagram": null, "vocabIds": ["f1", "f2", "f3", "f4"], "quizIds": ["q1", "q2", "q3", "q4"], "reading": "As an administrator, you'll create and manage the users and groups that make up an organization's identity. Security groups hold manually-managed membership, while dynamic groups automatically add or remove members based on rules matching attributes like department or job title \u2014 useful for keeping large, frequently-changing teams in sync without manual upkeep.\n\nLicensing follows the same logic: rather than assigning a Microsoft 365 license to each person individually, group-based licensing lets you assign it once to a group, and every current and future member picks it up automatically.\n\nFor people outside your organization, like contractors or partners, external B2B users let them sign in with their own existing identity rather than you creating them a new internal account. And for your own users, self-service password reset removes the help desk from the equation entirely for the most common request there is.", "fundamentalsLabel": "New to identity administration? See the everyday analogy", "fundamentals": "A dynamic group is like an email distribution list that updates itself based on someone's job title, instead of someone manually adding and removing names every time staff changes. Group-based licensing is like a company handing out badges by department rather than issuing one individually to every new hire \u2014 join the department, get the badge automatically.", "keyTerms": ["Security groups", "dynamic groups", "group-based licensing", "B2B", "self-service password reset"], "commonTraps": ["A dynamic group updates its membership automatically \u2014 a security group requires manual changes.", "Group-based licensing still requires someone to be a group member; adding the license alone doesn't add them.", "External B2B users authenticate with their own identity \u2014 you don't create them a normal internal account."], "scenario": "A hospital's radiology department grows from 8 to 30 staff over a year. Rather than manually adding each new hire to a group and assigning a license individually, an administrator sets up a dynamic group based on department, with a license attached to that group \u2014 every new radiology hire is automatically added and licensed the moment their account is created, with zero manual steps."}, {"id": "governance-cost", "title": "Governance & Cost", "summary": "RBAC scope and roles, Azure Policy initiatives, and cost management.", "diagram": "rbacScope", "vocabIds": ["f5", "f6", "f7", "f8", "f9"], "quizIds": ["q5", "q6", "q7", "q8"], "reading": "As an administrator, RBAC role assignments are additive across scopes \u2014 if someone has Reader at a subscription and Contributor at one resource group within it, they effectively have Contributor there and Reader everywhere else in that subscription. The built-in roles worth knowing well: Owner can manage resources and grant access to others; Contributor can manage resources but cannot grant access; Reader is view-only; and User Access Administrator can manage who has access without touching the resources themselves.\n\nAzure Policy enforces configuration rules, and when several related policies need to be assigned together, like a full tagging standard, they can be bundled into a single initiative rather than assigned one by one.\n\nDay to day, this ties back to cost: budgets with alert thresholds, and Cost Analysis, let you see where spending is actually going, broken down by resource, tag, or service.", "fundamentalsLabel": "New to RBAC in practice? See the everyday analogy", "fundamentals": "Think of RBAC assignments like keys handed out at different levels of a building. A master key at the building level, plus an extra key to one specific supply closet, means you effectively have full access to that closet even if your master key alone wouldn't normally reach it \u2014 the more specific, more permissive key wins in that one room.", "keyTerms": ["RBAC", "Owner", "Contributor", "Reader", "User Access Administrator", "Azure Policy", "initiative", "budgets"], "commonTraps": ["Contributor can manage all resources but CANNOT assign roles to others \u2014 only Owner and User Access Administrator can.", "RBAC is additive: the most permissive assignment across all applicable scopes wins, not the most restrictive.", "An initiative is a bundle of policies assigned together \u2014 it isn't a single rule by itself."], "portalMockup": "roleAssignment", "scenario": "A company wants a lead engineer to manage all resources in a specific resource group AND decide which teammates can access it, without giving them company-wide Owner rights. Assigning Owner at just that one resource group achieves this \u2014 Owner both manages resources and grants access, but scoped to that resource group alone, leaving the rest of the subscription untouched."}, {"id": "storage-management", "title": "Storage Management", "summary": "Access keys and SAS, firewalls, lifecycle policies, and protecting blob data.", "diagram": null, "vocabIds": ["f10", "f11", "f12", "f13", "f14", "f15", "f16", "f17", "f18"], "quizIds": ["q9", "q10", "q11", "q12"], "reading": "Managing storage at the administrator level means configuring the account itself, not just knowing what it holds. General-purpose v2 is the standard account type, with Standard (HDD-backed) and Premium (SSD-backed) performance tiers depending on how demanding the workload is.\n\nFor access, a storage account access key grants full, unrestricted control over the whole account \u2014 risky to hand out. A Shared Access Signature (SAS) instead grants limited, time-boxed access to specific resources, without ever exposing that key. A storage firewall adds a network-level layer on top, restricting access to specific VNets or IP ranges regardless of what credentials someone has.\n\nOngoing management includes lifecycle policies, which automatically move aging blobs to cheaper tiers or delete them outright, and choosing the right protection for accidental changes: blob versioning keeps every prior version automatically, while soft delete recovers something that was deleted outright.", "fundamentalsLabel": "New to storage account administration? See the everyday analogy", "fundamentals": "An access key is like a master key to an entire building \u2014 powerful, and dangerous to hand out casually. A SAS is like a visitor badge that only opens one door, only works for a limited window of time, and can be revoked without changing the master key at all.", "keyTerms": ["General-purpose v2", "Standard", "Premium", "access key", "Shared Access Signature", "SAS", "storage firewall", "lifecycle", "versioning", "soft delete"], "commonTraps": ["An access key grants full account access \u2014 always prefer a scoped, time-limited SAS when sharing access externally.", "Soft delete protects against deletion; recovering a blob's content after an overwrite specifically needs versioning.", "A storage firewall is a network-level control \u2014 separate from, and in addition to, who has valid credentials."], "portalMockup": "storageAccount", "scenario": "A marketing agency needs to let an external contractor upload files to one specific container for 48 hours, then lose access automatically. Issuing a SAS scoped to that container, valid for 48 hours, does exactly this \u2014 no account key changes hands, and access expires on its own without anyone having to remember to revoke it."}, {"id": "vms-compute", "title": "Virtual Machines & Compute", "summary": "VM sizing, managed disks, availability options, extensions, and resizing.", "diagram": "diskTiers", "vocabIds": ["f19", "f20", "f21", "f22", "f27"], "quizIds": ["q16", "q17", "q22", "q23"], "reading": "Choosing a VM means balancing size against workload: the size determines CPU, memory, and disk throughput, while the series, B, D, F, and others, is tuned for different needs \u2014 B-series is cheap and burstable, D-series is general purpose, F-series is compute-optimized. Underneath, managed disks come in four performance tiers, Standard HDD, Standard SSD, Premium SSD, and Ultra Disk, from cheapest to fastest.\n\nFor resilience, availability sets spread VMs across separate hardware within one datacenter, availability zones go further by using physically separate datacenters within a region, and VM Scale Sets automatically add or remove instances based on demand or a schedule.\n\nDay-to-day operations include extensions, small agents that run post-deployment tasks like the Custom Script Extension, and resizing, which may require deallocating a running VM first if the target size isn't available on its current hardware.", "fundamentalsLabel": "New to VM sizing and resilience? See the everyday analogy", "fundamentals": "Choosing a VM series is like choosing a vehicle for a job: a compact car (B-series) is cheap and fine for occasional errands, a pickup truck (D-series) handles general hauling, and a race car (F-series) is built for one specific kind of performance. Availability sets and zones are about not parking every vehicle in the same garage \u2014 spreading them out so one disaster doesn't take out the whole fleet at once.", "keyTerms": ["size", "series", "managed disks", "Standard HDD", "Standard SSD", "Premium SSD", "Ultra Disk", "availability sets", "availability zones", "VM Scale Sets", "extensions", "Custom Script Extension", "deallocating"], "commonTraps": ["A B-series VM is burstable and cheap, but throttles under sustained heavy CPU load \u2014 the wrong pick for a constantly busy server.", "Resizing a running VM may require deallocating it first if the new size isn't available on its current hardware.", "Ultra Disk lets you configure performance independently of size \u2014 the highest, most consistent tier available."], "portalMockup": "vmSize", "scenario": "A team runs a database VM that needs consistent, high IOPS around the clock, plus a batch of short-lived web front-ends that spike unpredictably during business hours. The database gets a larger D-series or F-series VM with a Premium SSD or Ultra Disk. The front-ends go into a VM Scale Set, which adds instances automatically during the spikes and scales back down overnight, rather than running a fixed, oversized fleet all day."}, {"id": "app-hosting-iac", "title": "App Hosting & Infrastructure as Code", "summary": "App Service plans, deployment slots, container options, and ARM/Bicep.", "diagram": "deploymentSlots", "vocabIds": ["f23", "f24", "f25", "f26"], "quizIds": ["q18", "q19", "q20", "q21"], "reading": "An App Service plan defines the compute tier and region for one or more web apps \u2014 scaling up changes the plan's size, scaling out adds more instances of it. Deployment slots give you a separate, swappable environment, like staging, to validate a new version before swapping it into production with minimal downtime.\n\nFor containers, the right choice depends on how much orchestration you need: Container Instances run a single container with none, Container Apps add serverless, HTTP-based autoscaling without managing a cluster, and AKS gives full Kubernetes control when you need it.\n\nFor repeatable deployments, ARM templates are Azure's native JSON Infrastructure as Code format, and Bicep is a newer, more concise language that compiles down to the same ARM JSON \u2014 functionally identical, just easier to write and read.", "fundamentalsLabel": "New to app hosting and IaC? See the everyday analogy", "fundamentals": "A deployment slot is like a dress rehearsal before opening night \u2014 you run the full show in a separate space first, then swap it into the real venue once it's ready, instead of testing changes directly in front of the audience. Infrastructure as Code is like a recipe instead of a memory of how you cooked something once: written down, repeatable, and shareable, rather than trusting yourself to click through the same steps identically every time.", "keyTerms": ["App Service plan", "Deployment slots", "Container Instances", "Container Apps", "AKS", "ARM templates", "Bicep"], "commonTraps": ["Scaling up changes the App Service plan's tier or size; scaling out adds more instances of the same tier.", "Container Instances run a single container with no orchestration \u2014 that's what AKS is for.", "Bicep is not a different deployment mechanism \u2014 it compiles down to the same ARM JSON underneath."], "scenario": "A team wants to test a major update to their web app without any risk to the live site, then cut over quickly once it checks out. They deploy the new version to a staging slot, run their validation there against production-like settings, and swap it into the production slot in seconds once satisfied \u2014 with the previous version now sitting in the staging slot in case a fast rollback is ever needed."}, {"id": "az104-networking", "title": "Networking", "summary": "NSG rule priority, VNet peering, load balancing, and secure access.", "diagram": "nsgPriority", "vocabIds": ["f28", "f29", "f30", "f31", "f32", "f33", "f34", "f35", "f36"], "quizIds": ["q24", "q25", "q26", "q29"], "reading": "As an administrator, you size VNets and subnets with real CIDR math in mind \u2014 Azure reserves 5 addresses in every subnet regardless of its size. Network Security Groups filter traffic with rules that have a priority; the lowest priority number is evaluated first and wins if rules conflict.\n\nVNet peering connects two VNets directly, even across regions, but it isn't transitive \u2014 peering A to B and B to C doesn't let A and C talk without their own direct peering. For distributing traffic, Azure Load Balancer works at layer 4 by IP and port alone, while Application Gateway works at layer 7 and can route by URL path and terminate SSL.\n\nFor secure remote access, Azure Bastion provides RDP or SSH through the portal without exposing a VM's public IP, and Network Watcher's tools, like IP flow verify, help diagnose exactly where a connectivity problem is coming from.", "fundamentalsLabel": "New to network administration? See the everyday analogy", "fundamentals": "An NSG rule priority works like a bouncer checking a list in order \u2014 the first matching rule they hit decides the outcome, and they stop checking after that, even if a later rule on the list would have said something different. VNet peering not being transitive is like two people each having a direct phone line to a shared friend, but no line to each other \u2014 being friends with the same person doesn't connect you to each other automatically.", "keyTerms": ["CIDR", "Network Security Groups", "priority", "VNet peering", "Azure Load Balancer", "Application Gateway", "Azure Bastion", "Network Watcher"], "commonTraps": ["A lower NSG rule priority number wins \u2014 100 is evaluated before 200, regardless of allow or deny.", "VNet peering is not transitive: A-B and B-C peered does not mean A and C can talk.", "Application Gateway can route by URL path; Azure Load Balancer only sees IP and port, not HTTP content."], "scenario": "An administrator needs to block a specific IP range from reaching a subnet while still allowing normal traffic through. They add a Deny rule at a lower priority number than the general Allow rule, so it's evaluated first \u2014 since NSGs stop at the first matching rule, that blocked range never reaches the broader allow rule beneath it."}, {"id": "monitoring-recovery", "title": "Monitoring & Recovery", "summary": "Metrics vs. logs, alerts and action groups, backup, and Site Recovery.", "diagram": "backupRecovery", "vocabIds": ["f37", "f38", "f39", "f40", "f41", "f42"], "quizIds": ["q33", "q34", "q35", "q36"], "reading": "Azure Monitor is the umbrella for keeping an eye on your own resources: metrics are lightweight numerical time-series data, like CPU percentage, while logs are detailed, queryable records stored in a Log Analytics workspace and searched with KQL. An alert rule defines the trigger condition, and a separate action group defines what happens next, like an email or an automated runbook.\n\nFor disaster protection, the distinction that matters most is scope: Azure Backup, through a Recovery Services vault, restores a VM or file to an earlier point in time, protecting against data loss or corruption. Azure Site Recovery goes further, replicating an entire workload to a secondary region so it can fail over and keep running if the primary region goes down entirely.", "fundamentalsLabel": "New to monitoring and disaster recovery? See the everyday analogy", "fundamentals": "Backup is like keeping dated copies of an important document, so you can go back to yesterday's version if today's got corrupted. Site Recovery is more like having a fully-equipped second office ready to open immediately if your main building becomes unusable \u2014 not just a copy of your files, but a whole working replacement environment standing by.", "keyTerms": ["Azure Monitor", "metrics", "logs", "Log Analytics", "KQL", "alert rule", "action group", "Azure Backup", "Recovery Services vault", "Azure Site Recovery"], "commonTraps": ["Metrics are lightweight numerical data; use Logs and KQL for detailed, queryable event investigation.", "An alert rule is the trigger condition \u2014 the action group is the separate response it sets off.", "Backup restores a point-in-time copy; Site Recovery fails over a whole workload to another region."], "scenario": "A company's production database VM gets corrupted by a bad script at 2pm. They restore it from that morning's backup in the Recovery Services vault, losing a few hours of data but recovering quickly. Separately, that same company has Site Recovery configured for their whole application tier, so if their primary region ever goes down entirely, the application can fail over and keep serving customers from a secondary region within minutes."}]}};

const COLOR = {
  bg: '#1B1D21',
  surface: '#24272D',
  surfaceRaised: '#2C3038',
  border: '#383D45',
  text: '#EDEAE3',
  muted: '#9199A3',

/* ---------------- diagrams ---------------- */

function DBox({ x, y, w, h, label, sub }) {
  return (
    <g>
      <rect x={x} y={y} width={w} height={h} rx="7" fill={COLOR.surfaceRaised} stroke={COLOR.border} strokeWidth="1.3" />
      <text x={x + w / 2} y={y + h / 2 + (sub ? -3 : 4)} textAnchor="middle" fill={COLOR.text} fontSize="10.5" fontWeight="600">{label}</text>
      {sub && <text x={x + w / 2} y={y + h / 2 + 11} textAnchor="middle" fill={COLOR.muted} fontSize="8.5">{sub}</text>}
    </g>
  );
}

function DLine({ x1, y1, x2, y2 }) {
  return <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={COLOR.border} strokeWidth="1.3" />;
}

function DCaption({ x, y, text }) {
  return <text x={x} y={y} textAnchor="middle" fill={COLOR.muted} fontSize="9">{text}</text>;
}

function DiagramServiceModels() {
  const cols = ['On-prem', 'IaaS', 'PaaS', 'SaaS'];
  const rows = ['Apps & data', 'Runtime & OS', 'Virtualization', 'Physical infra'];
  const grid = [[1, 1, 1, 0], [1, 1, 0, 0], [1, 0, 0, 0], [1, 0, 0, 0]];
  const colW = 62, rowH = 42, labelW = 84, top = 28;
  const width = labelW + cols.length * colW + 6;
  const height = top + rows.length * rowH + 34;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: 'auto' }}>
      {cols.map((c, ci) => (
        <text key={c} x={labelW + ci * colW + colW / 2} y={16} textAnchor="middle" fill={COLOR.text} fontSize="10.5" fontWeight="600">{c}</text>
      ))}
      {rows.map((r, ri) => (
        <React.Fragment key={r}>
          <text x={2} y={top + ri * rowH + rowH / 2 + 4} fill={COLOR.muted} fontSize="9">{r}</text>
          {cols.map((c, ci) => {
            const managed = grid[ri][ci];
            return (
              <rect
                key={c}
                x={labelW + ci * colW}
                y={top + ri * rowH}
                width={colW - 6}
                height={rowH - 6}
                rx="6"
                fill={managed ? 'rgba(63,167,150,0.16)' : 'rgba(227,178,60,0.13)'}
                stroke={managed ? COLOR.teal : COLOR.gold}
                strokeWidth="1.2"
              />
            );
          })}
        </React.Fragment>
      ))}
      <rect x={labelW} y={height - 20} width="10" height="10" fill="rgba(63,167,150,0.16)" stroke={COLOR.teal} strokeWidth="1" />
      <text x={labelW + 15} y={height - 11} fill={COLOR.muted} fontSize="8.5">You manage</text>
      <rect x={labelW + 90} y={height - 20} width="10" height="10" fill="rgba(227,178,60,0.13)" stroke={COLOR.gold} strokeWidth="1" />
      <text x={labelW + 105} y={height - 11} fill={COLOR.muted} fontSize="8.5">Microsoft manages</text>
    </svg>
  );
}

function highlightTerms(text, terms) {
  if (!terms || !terms.length) return text;
  const sorted = [...terms].sort((a, b) => b.length - a.length);
  const escaped = sorted.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = new RegExp('(' + escaped.join('|') + ')', 'g');
  const parts = text.split(re);
  return parts.map((part, i) => {
    const isTerm = sorted.some((t) => t === part);
    return isTerm ? (
      <span key={i} style={{ color: COLOR.gold, fontWeight: 700 }}>{part}</span>
    ) : (
      <React.Fragment key={i}>{part}</React.Fragment>
    );
  });
}


/* ---------------- helpers ---------------- */

function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestion(q) {
  if (q.type === 'mc') {
    const order = shuffleArray([0, 1, 2, 3]);
    return { ...q, options: order.map((i) => q.options[i]), correct: order.indexOf(q.correct) };
  }
  return q;
}

function pickRotated(pool, count, seenMap) {
  const withRecency = pool.map((q) => ({ q, last: (seenMap && seenMap[q.id]) || 0 }));
  const shuffled = shuffleArray(withRecency);
  shuffled.sort((a, b) => a.last - b.last);
  const picked = shuffled.slice(0, count).map((x) => x.q);
  return shuffleArray(picked);
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function saveLocal(payload) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    // ignore, best effort
  }
}

function normalizeResults(raw) {
  if (!raw) return { itil: {}, az900: {}, az104: {} };
  if (raw.itil || raw.az900 || raw.az104) return { itil: raw.itil || {}, az900: raw.az900 || {}, az104: raw.az104 || {} };
  // legacy flat shape from before multi-track support existed — treat it as ITIL progress
  return { itil: raw, az900: {}, az104: {} };
}

function normalizeSeenLog(raw) {
  if (!raw) return { itil: {}, az900: {}, az104: {} };
  return { itil: raw.itil || {}, az900: raw.az900 || {}, az104: raw.az104 || {} };
}

            <p style={{ fontSize: '13px', lineHeight: 1.6, color: COLOR.text }}>{lesson.scenario}</p>

        <div style={{ marginBottom: '16px' }}>
          <div style={{ fontSize: '13px', fontWeight: 600, color: COLOR.red, marginBottom: '8px' }}>Common exam traps</div>
          <div className="flex flex-col gap-2">
            {lesson.commonTraps.map((t, i) => (
              <div
                key={i}
                style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderLeft: `3px solid ${COLOR.red}`, borderRadius: '10px', padding: '10px 12px', fontSize: '12.5px', lineHeight: 1.5, color: COLOR.text }}
              >
                {t}
              </div>

      <button

      >
        {showFundamentals ? '▾ ' : '▸ '}{lesson.fundamentalsLabel}

      {showFundamentals && (
        <div style={{ background: COLOR.surfaceRaised, borderRadius: '0 0 12px 12px', padding: '14px', marginBottom: '16px', borderLeft: `1px solid ${COLOR.border}`, borderRight: `1px solid ${COLOR.border}`, borderBottom: `1px solid ${COLOR.border}` }}>
          {speechSupported && (
            <div className="flex justify-end" style={{ marginBottom: '8px' }}>
              <SpeakButton id={'fund-' + lesson.id} text={lesson.fundamentals.replace(/\n+/g, ' ')} speakingId={speakingId} onSpeak={onSpeak} />

          {lesson.fundamentals.split('\n\n').map((p, i) => (

        Take the {lesson.quizIds.length}-question quiz

}

function CourseView({ lessons, flashcardsData, onQuiz, speakingId, onSpeak, speechSupported, masteryFn }) {
  const [lessonId, setLessonId] = useState(null);
  const lesson = lessons.find((l) => l.id === lessonId);
  if (lesson) {
    return (
      <LessonDetail
        lesson={lesson}
        flashcardsData={flashcardsData}
        onBack={() => setLessonId(null)}
        onQuiz={onQuiz}
        speakingId={speakingId}
        onSpeak={onSpeak}
        speechSupported={speechSupported}
      />
    );
  }
  const masteredCount = lessons.filter((l) => masteryFn(l) >= 0.7).length;
  const avgMastery = lessons.length ? lessons.reduce((sum, l) => sum + masteryFn(l), 0) / lessons.length : 0;
  return (
    <div>
      <div style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: '14px', padding: '14px 16px', marginBottom: '14px' }}>
        <div className="flex justify-between items-center" style={{ marginBottom: '8px' }}>
          <div style={{ fontSize: '12px', color: COLOR.muted }}>Course progress</div>
          <div style={{ fontSize: '12px', fontWeight: 600, color: masteredCount === lessons.length ? COLOR.teal : COLOR.text }}>
            {masteredCount} of {lessons.length} lessons strong
          </div>
        </div>
        <div style={{ height: '6px', borderRadius: '3px', background: COLOR.surfaceRaised, overflow: 'hidden' }}>
          <div style={{ height: '100%', width: `${Math.round(avgMastery * 100)}%`, background: COLOR.teal, borderRadius: '3px' }} />
        </div>
      </div>
      {lessons.map((l) => (
        <LessonCard key={l.id} lesson={l} mastery={masteryFn(l)} onOpen={() => setLessonId(l.id)} />
      ))}
    </div>
  );
}

function QuizSetup({ length, setLength, types, toggleType, onReroll, poolSize, missedCount, onReviewMissed }) {
  const lengths = [5, 10, 15, 25];
  return (
    <div style={{ marginBottom: '14px' }}>
      {missedCount > 0 && (
        <button
          onClick={onReviewMissed}
          style={{ width: '100%', marginBottom: '10px', padding: '10px', borderRadius: '12px', border: `1px solid ${COLOR.red}`, background: 'rgba(193,85,74,0.1)', color: COLOR.red, fontSize: '13px', fontWeight: 600 }}
        >
          Review {missedCount} missed question{missedCount === 1 ? '' : 's'}
        </button>
      )}
      <div className="flex justify-between items-center mb-2">
        <div style={{ fontSize: '11px', color: COLOR.muted }}>{poolSize} questions match this filter</div>
        <button
          onClick={onReroll}
          style={{ fontSize: '11px', color: COLOR.teal, background: 'transparent', padding: '4px 8px', borderRadius: '8px', border: `1px solid ${COLOR.teal}` }}
        >
          New quiz
        </button>
      </div>
      <div className="flex gap-2 mb-2" style={{ overflowX: 'auto', paddingBottom: '2px' }}>
        {lengths.map((n) => (
          <button
            key={n}
            onClick={() => setLength(n)}
            style={{
              flexShrink: 0, padding: '6px 12px', borderRadius: '999px', fontSize: '12px', fontWeight: 500,
              border: `1px solid ${length === n ? COLOR.teal : COLOR.border}`,
              background: length === n ? 'rgba(63,167,150,0.14)' : COLOR.surface,
              color: length === n ? COLOR.teal : COLOR.muted,
            }}
          >
            {n} questions
          </button>
        ))}
      </div>
      <div className="flex gap-2" style={{ overflowX: 'auto', paddingBottom: '2px' }}>
        {[['mc', 'Multiple choice'], ['ms', 'Multi-select'], ['tf', 'True / False'], ['sa', 'Short answer']].map(([key, label]) => (
          <button
            key={key}
            onClick={() => toggleType(key)}
            style={{
              flexShrink: 0, padding: '6px 12px', borderRadius: '999px', fontSize: '12px', fontWeight: 500,
              border: `1px solid ${types[key] ? COLOR.gold : COLOR.border}`,
              background: types[key] ? 'rgba(227,178,60,0.14)' : COLOR.surface,
              color: types[key] ? COLOR.gold : COLOR.muted,
            }}
          >
            {label}
          </button>
        ))}
      </div>
    </div>
  );
}

function QuestionView({ q, selected, onChoose, saInput, setSaInput, saRevealed, onRevealSA, onRateSA, onNext, index, total, categoryLabel, missedBadge, msPending, onToggleMs, onSubmitMs }) {
  if (!q) return null;
  const isLast = index + 1 >= total;
  return (
    <div>
      <div className="flex justify-between items-center mb-2" style={{ fontSize: '11px', color: COLOR.muted }}>
        <span>{missedBadge ? 'Missed review · ' : ''}{categoryLabel}</span>
        <span>{index + 1} / {total}</span>
      </div>
      <div style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: '18px', padding: '20px' }}>
        <div style={{ fontSize: '16px', lineHeight: 1.4, fontWeight: 500, marginBottom: '16px' }}>{q.question}</div>

        {q.type === 'mc' && (
          <div className="flex flex-col gap-2">
            {q.options.map((opt, i) => {
              const isCorrect = i === q.correct;
              const isSelected = i === selected;
              let bg = COLOR.surfaceRaised, border = COLOR.border, color = COLOR.text;
              if (selected !== null) {
                if (isCorrect) { bg = 'rgba(63,167,150,0.15)'; border = COLOR.teal; color = COLOR.teal; }
                else if (isSelected) { bg = 'rgba(193,85,74,0.15)'; border = COLOR.red; color = COLOR.red; }
              }
              return (
                <button
                  key={i}
                  disabled={selected !== null}
                  onClick={() => onChoose(i)}
                  style={{
                    textAlign: 'left', padding: '12px 14px', borderRadius: '12px',
                    border: `1px solid ${border}`, background: bg, color, fontSize: '14px', lineHeight: 1.4,
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    cursor: selected !== null ? 'default' : 'pointer',
                  }}
                >
                  <span>{opt}</span>
                  {selected !== null && isCorrect && <span>✓</span>}
                  {selected !== null && isSelected && !isCorrect && <span>✕</span>}
                </button>
              );
            })}
          </div>
        )}

        {q.type === 'tf' && (
          <div className="flex gap-2">
            {['True', 'False'].map((label, i) => {
              const isRight = (i === 0) === q.answer;
              const isSelected = i === selected;
              let bg = COLOR.surfaceRaised, border = COLOR.border, color = COLOR.text;
              if (selected !== null) {
                if (isRight) { bg = 'rgba(63,167,150,0.15)'; border = COLOR.teal; color = COLOR.teal; }
                else if (isSelected) { bg = 'rgba(193,85,74,0.15)'; border = COLOR.red; color = COLOR.red; }
              }
              return (
                <button
                  key={i}
                  disabled={selected !== null}
                  onClick={() => onChoose(i)}
                  className="flex-1"
                  style={{ padding: '16px', borderRadius: '12px', border: `1px solid ${border}`, background: bg, color, fontSize: '15px', fontWeight: 600, cursor: selected !== null ? 'default' : 'pointer' }}
                >
                  {label}
                </button>
              );
            })}
          </div>
        )}

        {q.type === 'ms' && (
          <div>
            <div style={{ fontSize: '11px', color: COLOR.gold, marginBottom: '8px', fontWeight: 600 }}>Select all that apply</div>
            <div className="flex flex-col gap-2">
              {q.options.map((opt, i) => {
                const isCorrectOpt = q.correct.includes(i);
                const wasSelected = selected !== null ? selected.includes(i) : msPending.includes(i);
                let bg = COLOR.surfaceRaised, border = COLOR.border, color = COLOR.text;
                if (selected !== null) {
                  if (isCorrectOpt && wasSelected) { bg = 'rgba(63,167,150,0.15)'; border = COLOR.teal; color = COLOR.teal; }
                  else if (isCorrectOpt && !wasSelected) { border = COLOR.teal; color = COLOR.teal; }
                  else if (!isCorrectOpt && wasSelected) { bg = 'rgba(193,85,74,0.15)'; border = COLOR.red; color = COLOR.red; }
                } else if (wasSelected) {
                  bg = 'rgba(63,167,150,0.10)'; border = COLOR.teal; color = COLOR.teal;
                }
                return (
                  <button
                    key={i}
                    disabled={selected !== null}
                    onClick={() => onToggleMs(i)}
                    style={{
                      textAlign: 'left', padding: '12px 14px', borderRadius: '12px',
                      border: `1px solid ${border}`, background: bg, color, fontSize: '14px', lineHeight: 1.4,
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                      cursor: selected !== null ? 'default' : 'pointer',
                    }}
                  >
                    <span>{opt}</span>
                    {selected !== null && isCorrectOpt && wasSelected && <span>✓</span>}
                    {selected !== null && isCorrectOpt && !wasSelected && <span style={{ fontSize: '9px' }}>missed</span>}
                    {selected !== null && !isCorrectOpt && wasSelected && <span>✕</span>}
                    {selected === null && wasSelected && <span>●</span>}
                  </button>
                );
              })}
            </div>
            {selected === null && (
              <button
                onClick={onSubmitMs}
                disabled={msPending.length === 0}
                style={{ width: '100%', marginTop: '10px', padding: '11px', borderRadius: '12px', background: msPending.length ? COLOR.teal : COLOR.surfaceRaised, color: msPending.length ? '#0E1210' : COLOR.muted, fontSize: '14px', fontWeight: 600 }}
              >
                Submit answer
              </button>
            )}
          </div>
        )}

        {q.type === 'sa' && (
          <div>
            {!saRevealed ? (
              <React.Fragment>
                <textarea
                  value={saInput}
                  onChange={(e) => setSaInput(e.target.value)}
                  placeholder="Type your answer, or just think it through, then reveal"
                  rows={3}
                  style={{ width: '100%', background: COLOR.surfaceRaised, border: `1px solid ${COLOR.border}`, borderRadius: '10px', padding: '10px', fontSize: '14px', color: COLOR.text, resize: 'vertical' }}
                />
                <button
                  onClick={onRevealSA}
                  style={{ width: '100%', marginTop: '10px', padding: '11px', borderRadius: '12px', background: COLOR.teal, color: '#0E1210', fontSize: '14px', fontWeight: 600 }}
                >
                  Show model answer
                </button>
              </React.Fragment>
            ) : (
              <div>
                {saInput && (
                  <div style={{ fontSize: '12px', color: COLOR.muted, marginBottom: '10px' }}>
                    Your answer: <span style={{ color: COLOR.text }}>{saInput}</span>
                  </div>
                )}
                <div style={{ background: COLOR.surfaceRaised, borderRadius: '10px', padding: '12px', fontSize: '13px', lineHeight: 1.55, color: COLOR.text, marginBottom: '12px' }}>
                  {q.modelAnswer}
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => onRateSA('incorrect')}
                    className="flex-1"
                    style={{ padding: '12px', borderRadius: '12px', border: `1px solid ${COLOR.red}`, color: COLOR.red, fontSize: '14px', fontWeight: 600, background: 'transparent' }}
                  >
                    ✕ Still learning
                  </button>
                  <button
                    onClick={() => onRateSA('correct')}
                    className="flex-1"
                    style={{ padding: '12px', borderRadius: '12px', background: COLOR.teal, color: '#0E1210', fontSize: '14px', fontWeight: 600 }}
                  >
                    ✓ Got it
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {(q.type === 'mc' || q.type === 'tf' || q.type === 'ms') && selected !== null && q.explanation && (
          <div style={{ marginTop: '14px', padding: '12px', borderRadius: '10px', background: COLOR.surfaceRaised, fontSize: '13px', lineHeight: 1.5, color: COLOR.muted }}>
            {q.explanation}
          </div>
        )}
      </div>

      {(q.type === 'mc' || q.type === 'tf' || q.type === 'ms') && selected !== null && (
        <button
          onClick={onNext}
          style={{ width: '100%', marginTop: '12px', padding: '12px', borderRadius: '12px', background: COLOR.teal, color: '#0E1210', fontSize: '14px', fontWeight: 600 }}
        >
          {isLast ? 'See results' : 'Next question'}
        </button>
      )}
    </div>
  );
}

function QuizSummary({ score, answers, categories, onRestart }) {
  const missed = answers.filter((a) => !a.correct);
  return (
    <div>
      <div style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: '18px', padding: '24px', textAlign: 'center' }}>
        <div className="itil-display" style={{ fontSize: '28px', fontWeight: 600, color: COLOR.teal }}>{score.correct} / {score.total}</div>
        <div style={{ fontSize: '13px', color: COLOR.muted, marginTop: '4px' }}>correct this round</div>
      </div>
      {missed.length > 0 && (
        <div className="mt-4">
          <div style={{ fontSize: '12px', color: COLOR.muted, marginBottom: '8px' }}>Worth another look:</div>
          <div className="flex flex-col gap-2">
            {missed.map((m, i) => (
              <div key={i} style={{ background: COLOR.surfaceRaised, borderRadius: '10px', padding: '10px 12px', fontSize: '13px' }}>
                <div style={{ fontSize: '10px', color: COLOR.muted, marginBottom: '2px' }}>{categories.find((c) => c.key === m.cat)?.label}</div>
                <div>{m.prompt}</div>
              </div>
            ))}
          </div>
        </div>
      )}
      <button
        onClick={onRestart}
        style={{ width: '100%', marginTop: '16px', padding: '12px', borderRadius: '12px', background: COLOR.teal, color: '#0E1210', fontSize: '14px', fontWeight: 600 }}
      >
        New quiz
      </button>
    </div>
  );
}

function ExamQuestionView({ q, selectedIdx, onSelect }) {
  if (!q) return null;
  return (
    <div style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: '18px', padding: '20px' }}>
      <div style={{ fontSize: '16px', lineHeight: 1.4, fontWeight: 500, marginBottom: '16px' }}>{q.question}</div>
      {q.type === 'mc' && (
        <div className="flex flex-col gap-2">
          {q.options.map((opt, i) => {
            const isSelected = i === selectedIdx;
            return (
              <button
                key={i}
                onClick={() => onSelect(i)}
                style={{
                  textAlign: 'left', padding: '12px 14px', borderRadius: '12px',
                  border: `1px solid ${isSelected ? COLOR.teal : COLOR.border}`,
                  background: isSelected ? 'rgba(63,167,150,0.14)' : COLOR.surfaceRaised,
                  color: isSelected ? COLOR.teal : COLOR.text, fontSize: '14px', lineHeight: 1.4,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}
      {q.type === 'tf' && (
        <div className="flex gap-2">
          {['True', 'False'].map((label, i) => {
            const isSelected = i === selectedIdx;
            return (
              <button
                key={i}
                onClick={() => onSelect(i)}
                className="flex-1"
                style={{
                  padding: '16px', borderRadius: '12px',
                  border: `1px solid ${isSelected ? COLOR.teal : COLOR.border}`,
                  background: isSelected ? 'rgba(63,167,150,0.14)' : COLOR.surfaceRaised,
                  color: isSelected ? COLOR.teal : COLOR.text, fontSize: '15px', fontWeight: 600,
                }}
              >
                {label}
              </button>
            );
          })}
        </div>
      )}
      {q.type === 'ms' && (
        <div>
          <div style={{ fontSize: '11px', color: COLOR.gold, marginBottom: '8px', fontWeight: 600 }}>Select all that apply</div>
          <div className="flex flex-col gap-2">
            {q.options.map((opt, i) => {
              const picked = Array.isArray(selectedIdx) ? selectedIdx : [];
              const isSelected = picked.includes(i);
              return (
                <button
                  key={i}
                  onClick={() => onSelect(i)}
                  style={{
                    textAlign: 'left', padding: '12px 14px', borderRadius: '12px',
                    border: `1px solid ${isSelected ? COLOR.teal : COLOR.border}`,
                    background: isSelected ? 'rgba(63,167,150,0.14)' : COLOR.surfaceRaised,
                    color: isSelected ? COLOR.teal : COLOR.text, fontSize: '14px', lineHeight: 1.4,
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',

                  <span>{opt}</span>
                  {isSelected && <span>●</span>}
                </button>
              );
            })}
          </div>
        </div>
